<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1000"
     viewBox="0 0 1360 1000" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5568"/>
  </marker>
</defs>
<rect width="1360" height="1000" fill="#FFFFFF"/>
<text x="680" y="36" text-anchor="middle" font-size="23" font-weight="700"
      fill="#1A202C">一次生成请求的端到端流程（/v1/chat/completions）</text>

<rect x="40" y="76" width="240" height="700" rx="12" fill="#E8F1FB" fill-opacity="0.35" stroke="#2B6CB0" stroke-width="1.4"/><text x="160" y="96" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2B6CB0">客户端</text>
<rect x="300" y="76" width="340" height="700" rx="12" fill="#EAF7EE" fill-opacity="0.35" stroke="#2F855A" stroke-width="1.4"/><text x="470" y="96" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2F855A">API Server（协议 / 渲染 / 组包）</text>
<rect x="660" y="76" width="340" height="700" rx="12" fill="#FDECEC" fill-opacity="0.35" stroke="#C53030" stroke-width="1.4"/><text x="830" y="96" text-anchor="middle" font-size="14.5" font-weight="700" fill="#C53030">EngineCore（排队 / 调度）</text>
<rect x="1020" y="76" width="300" height="700" rx="12" fill="#F0EBFF" fill-opacity="0.35" stroke="#553C9A" stroke-width="1.4"/><text x="1170" y="96" text-anchor="middle" font-size="14.5" font-weight="700" fill="#553C9A">Worker（GPU 执行）</text>
<rect x="56" y="112" width="208" height="56" rx="8" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="1.6"/>
<text x="160" y="136" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2B6CB0">POST /v1/chat/completions</text>
<text x="160" y="151" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#3D4852">stream=true</text>
<rect x="316" y="112" width="308" height="56" rx="8" fill="#EAF7EE" stroke="#2F855A" stroke-width="1.6"/>
<text x="470" y="136" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2F855A">validate_json_request</text>
<text x="470" y="151" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#3D4852">OpenAIServingChat.create_chat_completion</text>
<rect x="316" y="176" width="308" height="56" rx="8" fill="#EAF7EE" stroke="#2F855A" stroke-width="1.6"/>
<text x="470" y="200" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2F855A">Renderer.render_chat_async</text>
<text x="470" y="215" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#3D4852">chat 模板 + 分词 + 多模态预处理</text>
<rect x="316" y="240" width="308" height="44" rx="8" fill="#EAF7EE" stroke="#2F855A" stroke-width="1.6"/>
<text x="470" y="266" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2F855A">get_max_tokens → to_sampling_params</text>
<rect x="316" y="304" width="308" height="44" rx="8" fill="#EAF7EE" stroke="#2F855A" stroke-width="1.6"/>
<text x="470" y="330" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2F855A">engine_client.generate（async generator）</text>
<rect x="316" y="368" width="308" height="56" rx="8" fill="#EAF7EE" stroke="#2F855A" stroke-width="1.6"/>
<text x="470" y="392" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2F855A">InputProcessor.process_inputs</text>
<text x="470" y="407" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#3D4852">→ EngineCoreRequest</text>
<rect x="676" y="368" width="308" height="56" rx="8" fill="#FDECEC" stroke="#C53030" stroke-width="1.6"/>
<text x="830" y="392" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#C53030">Scheduler.add_request</text>
<text x="830" y="407" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#3D4852">EngineCore 内排队 → WAITING</text>
<rect x="676" y="432" width="308" height="56" rx="8" fill="#FDECEC" stroke="#C53030" stroke-width="1.6"/>
<text x="830" y="456" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#C53030">schedule()：allocate_slots / 抢占 / 前缀缓存</text>
<text x="830" y="471" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#3D4852">→ SchedulerOutput</text>
<rect x="1036" y="432" width="268" height="56" rx="8" fill="#F0EBFF" stroke="#553C9A" stroke-width="1.6"/>
<text x="1170" y="456" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#553C9A">模型前向 + 采样</text>
<text x="1170" y="471" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#3D4852">→ ModelRunnerOutput</text>
<rect x="676" y="496" width="308" height="56" rx="8" fill="#FDECEC" stroke="#C53030" stroke-width="1.6"/>
<text x="830" y="520" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#C53030">update_from_output + check_stop</text>
<text x="830" y="535" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#3D4852">→ EngineCoreOutputs</text>
<rect x="316" y="496" width="308" height="56" rx="8" fill="#EAF7EE" stroke="#2F855A" stroke-width="1.6"/>
<text x="470" y="520" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2F855A">OutputProcessor.process_outputs</text>
<text x="470" y="535" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#3D4852">Detokenizer 增量反分词</text>
<rect x="316" y="560" width="308" height="44" rx="8" fill="#EAF7EE" stroke="#2F855A" stroke-width="1.6"/>
<text x="470" y="586" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2F855A">RequestOutput 入队 → generate() 取出</text>
<rect x="56" y="560" width="208" height="44" rx="8" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="1.6"/>
<text x="160" y="586" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2B6CB0">SSE: data: {...chunk}</text>
<rect x="316" y="624" width="308" height="44" rx="8" fill="#EAF7EE" stroke="#2F855A" stroke-width="1.6"/>
<text x="470" y="650" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2F855A">finish_reason 到达 → data: [DONE]</text>
<rect x="56" y="624" width="208" height="44" rx="8" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="1.6"/>
<text x="160" y="650" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2B6CB0">连接关闭</text>
