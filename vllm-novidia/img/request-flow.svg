<line x1="316" y1="610" x2="264" y2="610" stroke="#4A5568" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="316" y1="674" x2="264" y2="674" stroke="#4A5568" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1000" y="792" width="330" height="104" rx="8" fill="#FFF0F6" stroke="#B83280" stroke-width="1.6"/>
<text x="1165" y="823" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#B83280">断连 / abort 路径</text>
<text x="1165" y="840" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#3D4852">with_cancellation 取消 handler</text>
<text x="1165" y="857" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#3D4852">AsyncLLM.abort → OutputProcessor 清理</text>
<text x="1165" y="874" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#3D4852">Scheduler.finish_requests（释放 KV）</text>
<line x1="140" y1="786" x2="1000" y2="800" stroke="#B83280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="560" y="792" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.5" fill="#B83280">客户端断连 / POST /abort_requests</text>
<text x="40" y="948" font-size="12" fill="#718096">竖轴为时间顺序；横向箭头表示跨越进程/泳道的调用或数据流。</text>
