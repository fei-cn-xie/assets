<line x1="340" y1="128" x2="340" y2="760" stroke="#4A5568" stroke-width="1" stroke-dasharray="4 6" opacity="0.45"/>
<line x1="700" y1="128" x2="700" y2="760" stroke="#4A5568" stroke-width="1" stroke-dasharray="4 6" opacity="0.45"/>
