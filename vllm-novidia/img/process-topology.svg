<line x1="410" y1="150" x2="470" y2="150" stroke="#2B6CB0" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440" y="140" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.5" fill="#2B6CB0">ADD / ABORT / UTILITY</text>
<line x1="470" y1="262" x2="410" y2="262" stroke="#C53030" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440" y="252" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.5" fill="#C53030">EngineCoreOutputs</text>
<line x1="850" y1="150" x2="910" y2="150" stroke="#C53030" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="880" y="140" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.5" fill="#C53030">SchedulerOutput</text>
<line x1="910" y1="262" x2="850" y2="262" stroke="#553C9A" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="880" y="252" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.5" fill="#553C9A">ModelRunnerOutput</text>
<text x="40" y="712" font-size="12.5" fill="#4A5568">· 输入通道：ZMQ ROUTER(bind) → DEALER(identity=engine_id)，msgspec msgpack</text>
<text x="700" y="712" font-size="12.5" fill="#4A5568">· 输出通道：ZMQ PUSH(linger=4000) → PULL，按 client 分帧</text>
<text x="40" y="736" font-size="12.5" fill="#4A5568">· EngineCore 内部：两个 IO daemon 线程与主 busy loop 之间只经 queue.Queue</text>
<text x="700" y="736" font-size="12.5" fill="#4A5568">· EngineCore → Worker：multiprocessing.Process + MessageQueue 共享内存广播；单卡走同进程直调</text>
<text x="40" y="760" font-size="12.5" fill="#4A5568">· 张量跨进程：tensor IPC 零拷贝 + zmq.MessageTracker 保引用</text>
</svg>
