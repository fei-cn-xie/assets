<line x1="608" y1="131.0" x2="632" y2="131.0" stroke="#4A5568" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="904" y1="131.0" x2="928" y2="131.0" stroke="#4A5568" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="1064,170 1064,207 176,207 176,244" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="312" y1="283.0" x2="336" y2="283.0" stroke="#4A5568" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="608" y1="283.0" x2="632" y2="283.0" stroke="#4A5568" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="904" y1="283.0" x2="928" y2="283.0" stroke="#4A5568" stroke-width="1.8" marker-end="url(#arrow)"/>
