# MS Service Profiler 埋点配置（vLLM / vllm-ascend，feat/pd-sep-lwd-v0.30.0 之后的 LWD 实现）
#
# 用途：A/B 对照采集，定位"边云式 PD（sidecar）相对集中式 PD 的 TTFT 劣化"。
#   A：assets/c_home/profiling/launch/sidecar         （边云式：194 边端 + 195 两个云实例）
#   B：assets/c_home/profiling/launch/mooncake_pd_195 （集中式：195 P/D 各 TP=2）
#
# 约定（与上游 service_profiling_guide.md 一致）：
#   * symbol  必须存在于当前代码中；本文件所有条目都按当前分支静态校验过
#     （模块文件存在 + 类存在 + 方法存在）
#   * handler 省略时使用默认包装器，仅记录 span 起止（TTFT 分解只需要时间戳，
#     所以 LWD 专有埋点一律不带 handler，避免依赖特定 msserviceprofiler 版本）
#   * min_version / max_version 省略表示不设版本门限。这里刻意都不写：
#     仓里没有 tag，写死版本号会让埋点被静默跳过
#   * name/domain 只用于展示分组；domain 取值沿用手上的习惯标签
#
# 分组说明：
#   [1] 请求生命周期与调度     —— A/B 两套共有
#   [2] 模型执行 / 采样 / MTP  —— A/B 两套共有
#   [3] PD 的 KV 传输          —— A/B 两套共有（集中式也走 Mooncake）
#   [4] 边端（仅边云式）
#   [5] 云端（仅边云式）
#   [6] host 数据面（仅边云式，UCX）
#   [7] LWD 控制面 proxy（仅边云式）
#
# 已删除的旧埋点（v0.23 时代、当前代码已不存在，留着只会产生 patch 告警）：
#   vllm_ascend.core.scheduler:AscendScheduler.schedule
#   vllm_ascend.core.pd_separated_scheduler:PDSeparatedScheduler.*
#   vllm_ascend.worker.worker:NPUWorker._execute_model_{edge,cloud}[_draft]*
#   vllm_ascend.worker.model_runner_v1:NPUModelRunner._run_edge_cloud_draft_*_segment
#   vllm_ascend.worker.model_runner_v1:NPUModelRunner._stash_pending_edge_cloud_draft_context
#   vllm_ascend.patch.platform.patch_engine_core:_maybe_publish_pre_out / _drain_pd_channel_inbox
#   vllm_ascend.utils:ProfileExecuteDuration.capture_async
#   vllm.engine.async_llm_engine:AsyncLLMEngine.add_request（v0 引擎）
#
# 另外删除两条有副作用的旧条目：
#   * NPUModelRunner.execute_model 的 meta_handlers:init_data_parallel_worker —— 与
#     下面 [2] 的同一 symbol 重复 patch，后者会把前者覆盖
#   * vllm.model_executor.models.*:*.embed_multimodal —— 本次是纯文本负载，只会增加开销
#   * vllm.v1.utils:record_function_or_nullcontext —— 调用极频繁，开销大且对 TTFT 分解无帮助

# 注意：vllm 的 batch_handlers:schedule 与 model_handlers:execute_model 依赖
# classify_requests()，而它无条件 len(prompt_token_ids)；LWD fork 的 scheduled_new_reqs
# 不带该字段（None），因此这两类 handler 在本仓的边云式/集中式部署上都会每步抛
# TypeError（"Hook execution failed (1/N)"）。这两处已改为无 handler 的纯时间戳埋点。
# mtp_handlers:propose_draft_token_ids_npu 自己也调 classify_requests，但它包了
# try/except，可以保留。

# ===== [1] 请求生命周期与调度（A/B 共有）=====

- symbol: vllm.v1.engine.async_llm:AsyncLLM.add_request
  name: apiAddRequest
  domain: Request
  handler: ms_service_profiler.patcher.vllm.handlers.v1.request_handlers:add_request_async

- symbol: vllm.v1.engine.output_processor:OutputProcessor.process_outputs
  name: processOutputs
  domain: Request
  handler: ms_service_profiler.patcher.vllm.handlers.v1.request_handlers:process_outputs

- symbol: vllm.v1.core.sched.scheduler:Scheduler.add_request
  name: schedAddRequest
  domain: Schedule
  handler: ms_service_profiler.patcher.vllm.handlers.v1.batch_handlers:add_request

# handler 已移除：batch_handlers:schedule 会调用 classify_requests()，后者无条件执行
# len(new_req.prompt_token_ids)，而 LWD fork 里 scheduled_new_reqs 的 prompt_token_ids 是
# None（边/云端的请求由控制面信封构造），于是每步抛 TypeError 并打印 "Hook execution failed"。
#
# 但 handler 同时负责给这个 span 写 res_list/rid_list/token_id_list —— 解析端
# ProcessorReq.parse_batch 硬依赖它们（processor_req.py:120-124 对三列做 .apply(len)），
# 缺了就会在解析时抛 "object of type 'float' has no len()"，整条 pipeline:service 失败、
# 所有导出器（含 --span）都拿不到数据。切掉抓包一侧的 handler 反而转成了排障时的解析崩溃。
#
# 因此这里用默认埋点自己补一个 rid 属性：ProcessorRes.process_each_df 会由 rid 生成
# res_list/rid_list/token_id_list，列表非空即满足过滤条件。
# 用【静态列表字面量】而不是动态表达式，原因：_safe_eval_expr 在动态取值失败时会返回 None，
# 而 make_default_time_hook 只在值非 None 时才 prof.attr(...)（dynamic_hook.py:692-694），
# 一旦取不到就又退回 NaN 崩溃。静态字面量不可能失败。
# 代价：边云式数据的 batch_id 会退化成同一个值，批次粒度的时间线不可用 —— 逐请求的
# TTFT/ITL 分析请用 chrome_tracing.json / profiler.db 里的 span，不要用 batch.csv。
- symbol: vllm.v1.core.sched.scheduler:Scheduler.schedule
  name: batchFrameworkProcessing
  domain: Schedule
  attributes:
  - name: rid
    expr: "['lwd']"

- symbol: vllm.v1.core.sched.scheduler:Scheduler.update_from_output
  name: schedUpdateFromOutput
  domain: Schedule

- symbol: vllm.v1.engine.core:EngineCore.step
  name: engineStep
  domain: EngineCore

- symbol: vllm.v1.engine.core:DPEngineCoreProc.add_request
  name: dpEngineAddRequest
  domain: EngineCore
  handler: ms_service_profiler.patcher.vllm.handlers.v1.meta_handlers:init_data_parallel

- symbol: vllm.v1.core.kv_cache_manager:KVCacheManager.get_computed_blocks
  name: kvGetComputedBlocks
  domain: KVCache
  handler: ms_service_profiler.patcher.vllm.handlers.v1.kvcache_handlers:get_computed_blocks

- symbol: vllm.v1.core.kv_cache_manager:KVCacheManager.free
  name: kvFree
  domain: KVCache
  handler: ms_service_profiler.patcher.vllm.handlers.v1.kvcache_handlers:free

