# LWD edge/cloud PD topology with MULTI-DP clouds, on the 194/195 pair.
#
# Shape (5 cards total):
#   edge  194 NPU 4    TP=1, DP=1            -> API 8510
#   cloud 0 (prefill) 195 NPU 0,1  DP=2 TP=1 -> 2 DP ranks, 1 card each
#   cloud 1 (decode)  195 NPU 2,3  DP=2 TP=1 -> 2 DP ranks, 1 card each
#   proxy 195:8102 (CPU only) -- the edge hands every request to it
#
# Multi-DP in this stack = each cloud instance declares one `dp:` entry per
# data-parallel rank, each with its own ctrl_port / data_port / coord_port.
# The proxy picks a rank per request via pd_proxy.json's target_dp.
# Reference: vllm/examples/lwd/pd_host_2p4d.yaml (prefill 2 DP, decode 4 DP).
#
# Constraints checked against vllm/config/lwd/topology.py:
#   * PD enabled => instances need NOT share the same DP count
#     (the "same DP count" rule only applies when pd.enabled is false, :411-417)
#   * the edge never listens: no ctrl_port / data_port / coord_port
#   * every cloud DP needs ctrl_port and data_port (:401-407, :487-494)
#   * every cloud DP with coordination enabled needs coord_port (:415-418)
#   * dp_idx unique and contiguous from 0 per instance
#
# Both hosts must run this exact file: LwdTopology hashes it and every process
# logs "[LWD][config] ... digest=<16 hex>"; differing digests mean stale copies.
deployment:
  mode: 0
  scene: lwd_cluster
  edges_num: 1
  clouds_num: 2
  data_plane_comm: host
  data_plane_host:
    # Shared capacity, not a scheduling token limit. The host budget gate counts
    # one pool pair per edge -> cloud DP link: with 4 cloud DPs the edge holds
    # 4 links => 4 * 4 * (256 + 32) = 4608 MiB, under the 12288 MiB budget
    # (vllm_ascend/.../lwd_host_channels.py:201-216, 262-266).
    up_buffer_size: 256
    down_buffer_size: 32
    # sidecar = one transport daemon per host, spawned by the first engine
    # process (ctl socket /tmp/lwd-host-comm-<uid>.sock, memfd + SPSC rings).
    # Both peers must use the same value; in_process also works here.
    deployment: sidecar
  pd:
    enabled: true
    max_inflight_windows: 4
    request_ttl_s: 1800.0
feature_ctrl:
  enable_early_recv: true
edges:
  - id: 0
    dp:
      # The edge never listens: no ctrl_port, no data_port, no coord_port.
      # PD requires the edge to stay DP=1 (lwd_control_plane.py:102-106).
      - dp_idx: 0
        addr: 76.76.26.194
    coordination:
      enabled: true
      # The edge hands each request to the PD proxy on 76.76.26.195:8102.
      pd_proxy_url: http://76.76.26.195:8102/v1/chat/completions
      tenant_key_file: /vllm-workspace/lwd_tenant.key
      consumer_id: edge-0
clouds:
  - id: 0
    stage_role: prefill
    dp:
      # 2 DP ranks = 2 replicas of the prefill stage, one card each (NPU 0, NPU 1).
      # ctrl_port = control plane, data_port = UCX listener,
      # coord_port = PD registration HTTP endpoint the proxy posts to.
      - dp_idx: 0
        addr: 76.76.26.195
        ctrl_port: 6100
        data_port: 7200
        coord_port: 8100
      - dp_idx: 1
        addr: 76.76.26.195
        ctrl_port: 6101
        data_port: 7201
        coord_port: 8101
    coordination:
      enabled: true
  - id: 1
    stage_role: decode
    dp:
      # 2 DP ranks = 2 replicas of the decode stage, one card each (NPU 2, NPU 3).
      # Decode DP index lives *within* this instance, hence dp_idx restarts at 0.
      - dp_idx: 0
        addr: 76.76.26.195
        ctrl_port: 6110
        data_port: 7210
        coord_port: 8110
      - dp_idx: 1
        addr: 76.76.26.195
        ctrl_port: 6111
        data_port: 7211
        coord_port: 8111
    coordination:
      enabled: true
# lwd_cluster requires a full mesh: the single edge reaches both clouds.
instance_links:
  - {edge: 0, cloud: 0}
  - {edge: 0, cloud: 1}
