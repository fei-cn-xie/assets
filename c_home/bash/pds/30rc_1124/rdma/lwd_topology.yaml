# LWD 边云 PD 分离拓扑（feat/pd-sep-lwd-v0.30.0）— RDMA 变体
#
# 这份 YAML 是 v0.30.0 唯一的拓扑真相：以前写在 --additional-config 里的
# lwd_coordination / lwd_pd_config / edge_head_tail_layers / directory_path
# 全部搬到了这里，代码里没有环境变量可以覆盖它。
#
# 两台机器（边端 A、云端 B）必须使用**内容完全一致**的同一份文件：
# LwdTopology 会算一个 digest 并在日志里打印，两侧 digest 不一致就说明
# 文件不同步。本文件与 tcp 变体解析后的内容完全相同——RDMA 不是拓扑字段，
# 而是 UCX_TLS / UCX_NET_DEVICES 决定的（见本目录 env.sh）。
deployment:
  # mode 目前被严格限定为 0（Field(ge=0, le=0)）。
  mode: 0
  # 两个独立云（P、D）+ 一个边：lwd_cluster 是 PD 唯一可选场景，
  # single_instance 只允许 1 云，edge_share / cloud_share 都不适用。
  scene: lwd_cluster
  edges_num: 1
  clouds_num: 2
  # host 数据面：边端与云端是两个独立 torch world，无共享 HCCL 域、
  # 无 topology ranks、无跨侧集合通信。PD 强制要求 host。
  data_plane_comm: host
  data_plane_host:
    # UP（边->云）共享块，单位 MiB。PD 场景必须显式给值：
    # 两侧各自按本地调度预算推导会得到不兼容的容量，握手会直接失败。
    # 取值需覆盖"最大完整帧 + 辅助载荷（如 expert id）"。
    # 内存预算：pools * 4 * (up + down) <= 12 GiB / rank。
    up_buffer_size: 256
    # DOWN（云->边）共享块，单位 MiB，按配置值使用，两侧必须相同。
    down_buffer_size: 32
    # in_process = 传输跑在引擎进程内（v0.30.0 默认，也是本脚本的选择）；
    # sidecar = 每机一个 transport daemon。两侧必须一致。
    deployment: in_process
  pd:
    enabled: true
    max_inflight_windows: 4
    request_ttl_s: 1800.0
    # 租户标识；也可留空改用边端 coordination.consumer_id。
    tenant_id: edge-0
# feature_ctrl 块本身是必填（schema 无默认值），但 v0.30.0 上
# enable_early_recv / scramble 只被解析、没有运行期读取点：早收实际由
# "该引擎持有哪些连接"决定，不是这个开关。这里保留官方 2P4D 示例的取值，
# 写成 {} 也能通过校验。
feature_ctrl:
  enable_early_recv: true
edges:
  - id: 0
    dp:
      # 边端 DP 只写 dp_idx + addr：
      #   - 不能有 ranks（host 模式无全局 rank）
      #   - 不能有 ctrl_port / data_port（边端只连出不监听，coord_port 也是云侧字段）
      - dp_idx: 0
        addr: 76.76.26.194
    coordination:
      enabled: true
      # 边端把请求交给 PD proxy（v0.30.0 的入口），必须指到 proxy 的 8500。
      pd_proxy_url: http://76.76.26.189:8500/v1/chat/completions
      # PD 要求边端使用带鉴权的 coordination，placement_only 不被接受。
      tenant_key_file: /vllm-workspace/lwd_tenant.key
      consumer_id: edge-0
      listen_host: 0.0.0.0
clouds:
  - id: 0
    stage_role: prefill
    dp:
      # 云端 DP 三件端口（同机两个云必须互不冲突）：
      #   ctrl_port  - 控制面（边端注册/ZMQ），云侧必填
      #   data_port  - UCX listener，host 模式下所有云 DP 必填
      #   coord_port - PD 协调 HTTP 端点，proxy 的 target url 就是它
      - dp_idx: 0
        addr: 76.76.26.189
        ctrl_port: 19180
        data_port: 19600
        coord_port: 8660
    coordination:
      enabled: true
  - id: 1
    stage_role: decode
    dp:
      - dp_idx: 0
        addr: 76.76.26.189
        ctrl_port: 19182
        data_port: 19700
        coord_port: 8661
    coordination:
      enabled: true
# lwd_cluster 要求全互联网状：边端同时连 P 和 D。
instance_links:
  - {edge: 0, cloud: 0}
  - {edge: 0, cloud: 1}
# 数据面 RoCE QoS 走配置而不是环境变量（INJECT 到 UCX 的 UCT 配置里）：
# traffic_class -> IB_TRAFFIC_CLASS（同时 IP_TOS = tc<<2 打在 TCP 握手 socket 上），
# sl -> IB_SL。生效还需要交换机侧匹配的 PFC/ETS 策略，两侧必须同值。
# 默认保持注释：UCX 对 RoCEv2 会自动取 106 / sl 0。
# qos:
#   data_plane: {traffic_class: 106, sl: 5}
#   ctrl_plane: {dscp: 26}
