<p class="lead">为什么 decode 卡带宽、为什么要 batching、显存账、四种并行</p>
<p class="lead">本页 10 张图；点击编号跳转：<a href="#p0">1</a> <a href="#p1">2</a> <a href="#p2">3</a> <a href="#p3">4</a> <a href="#p4">5</a> <a href="#p5">6</a> <a href="#p6">7</a> <a href="#p7">8</a> <a href="#p8">9</a> <a href="#p9">10</a></p>
<figure id="p0">
<p class="ptitle">① 训练在做什么：权重是怎么「学」出来的</p>
<p class="psub">一句话：训练 = 前向算一个预测 → 用损失函数给它的错打分 → 反向传播算出「每个参数往哪边调」→ 优化器真的调一下，重复几百万次。推理只是把这条链的第一段单独拿出来用。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="704"1136" viewBox="0 0 1576 1136">
<rect width="1576" height="1136" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">① 训练在做什么：权重是怎么「学」出来的</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：训练 = 前向算一个预测 → 用损失函数给它的错打分 → 反向传播算出「每个参数往哪边调」→ 优化器真的调一下，重复几百万次。推理只是把这条链的第一段单独拿出来用。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：训练的四步循环（每步都对应代码里真实存在的东西）</text>
<rect x="36.0" y="152.0" width="340.0" height="118.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 前向 forward</text>
<text x="42.0" y="180.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">输入一批文本 → 逐层算 → 输出每个位置的 logits</text>
<text x="42.0" y="194.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">前向与推理时完全一样</text>
<rect x="397.0" y="152.0" width="340.0" height="118.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="403.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 损失 loss</text>
<text x="403.0" y="180.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">拿 logits 和「正确下一个词」比 → 一个标量（越小越准）</text>
<text x="403.0" y="194.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">交叉熵</text>
<rect x="758.0" y="152.0" width="340.0" height="118.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="764.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 反向 backward</text>
<text x="764.0" y="180.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">从 loss 往回求梯度：每个参数该往哪边调、调多少</text>
<text x="764.0" y="194.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">只有训练才有</text>
<rect x="1119.0" y="152.0" width="340.0" height="118.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1125.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">④ 更新 optimizer</text>
<text x="1125.0" y="180.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">按梯度把参数推开一小步（学习率决定步子大小）</text>
<text x="1125.0" y="194.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">AdamW 等</text>
<text x="36.0" y="318.0" font-size="11" fill="#333333">第二步：为什么「训练完」的权重，在推理时是只读的常量</text>
<rect x="36.0" y="338.0" width="700.0" height="176.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="352.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="360.0" font-size="11" fill="#333333">训练时：权重是「变量」</text>
<text x="46.0" y="386.0" font-size="11" fill="#333333">· 每个参数都有两份内存开销：值 + 梯度（还有优化器的动量等状态）；· 前向要保留中间激活，供反向链式求导用（显存大户）；· batch 越大越好：梯度更稳、算力利用率更高；· 精度常常混合：fp16/bf16 算、fp32 存主权重。</text>
<rect x="796.0" y="338.0" width="664.0" height="176.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="802.0" y="352.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="360.0" font-size="11" fill="#333333">推理时：权重是「常量」</text>
<text x="806.0" y="386.0" font-size="11" fill="#333333">· 只要值，不要梯度、不要优化器状态、不保留反向用的激活；· 权重加载进显存后只读（唯一的例外是图捕获时的格式重排）；· batch 不再是「越大越好」：它换的是吞吐，牺牲的是单请求延迟；· 显存主要被「权重 + KV cache」占掉，而不是激活。</text>
<rect x="36.0" y="554.0" width="700.0" height="148.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="568.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="576.0" font-size="11" fill="#333333">一句话把两者接起来</text>
<text x="46.0" y="602.0" font-size="11" fill="#333333">训练产出的是一份权重文件（如 safetensors）；推理系统的第一件事就是把这份文件读进显存；之后所有权重的计算都是「同一份常量张量」参与矩阵乘。</text>
<rect x="796.0" y="554.0" width="664.0" height="148.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="802.0" y="568.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="576.0" font-size="11" fill="#333333">所以 vLLM 里没有的东西（别去找）</text>
<text x="806.0" y="602.0" font-size="11" fill="#333333">没有 backward、没有 optimizer、没有 loss（它不做训练）；没有梯度的显存开销 → 同样一张卡，推理能放下比训练大得多的并发；但它多了训练时不存在的东西：KV cache（见 ⑦）。</text>
<rect x="36.0" y="742.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="756.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：训练那四步里，只有第 ① 步（前向）会出现在推理里；下一步（②）看这份权重从文件变成显存里的常量的完整路径。</text>
<rect x="36.0" y="818.0" width="1424.0" height="96.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="832.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="846.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">vLLM 的自我定位是推理服务：vllm/README.md:1（Easy, fast, and cheap LLM serving）</text>
<text x="42.0" y="859.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">推理侧「加载完就只读」的证据：加载写入 layer.weight 后由 forward 直接读 —— 参见 tools/proc/t16.py 与 vllm/model_executor/layers/utils.py:84-90</text>
<text x="42.0" y="873.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">权重与激活/梯度的取舍在推理侧只剩权重：vllm_ascend/worker/worker.py:601-634（profile 时只算权重 + 激活峰值，不含梯度/优化器）</text>
<rect x="36.0" y="946.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="960.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：训练 = 前向 + 损失 + 反向 + 更新，循环到收敛，产出权重文件；推理 = 只用前向，且权重是只读常量。这条差别决定了后面所有推理优化的方向。</text>
<text x="36.0" y="1052.0" font-size="11" fill="#333333">图例</text>

<text x="1142.0" y="286.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">连续批处理 / 调度器（⑨ ⑯ 页）</text>
<rect x="36.0" y="312.0" width="220.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="326.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">精度</text>
<rect x="256.0" y="312.0" width="460.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="262.0" y="326.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">混合精度 + fp32 主权重</text>
<rect x="716.0" y="312.0" width="420.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="722.0" y="326.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">常常整份 bf16/fp16（甚至量化）</text>
<rect x="1136.0" y="312.0" width="320.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1142.0" y="326.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">量化、GGUF（Transformer ⑳）</text>
<rect x="36.0" y="352.0" width="220.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="366.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">显存构成</text>
<rect x="256.0" y="352.0" width="460.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="262.0" y="366.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">权重 + 梯度 + 优化器 + 激活</text>
<rect x="716.0" y="352.0" width="420.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="722.0" y="366.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">权重 + KV cache + 激活峰值 + 图池</text>
<rect x="1136.0" y="352.0" width="320.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1142.0" y="366.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">显存账（⑦）与 KV 管理（生命周期 ⑤）</text>
<text x="36.0" y="412.0" font-size="11" fill="#333333">第二步：五条后果，逐条说清「所以在推理里能做什么」</text>
<rect x="36.0" y="432.0" width="700.0" height="132.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="446.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="454.0" font-size="11" fill="#333333">① 没有反向 → 显存全给「并存」</text>
<text x="46.0" y="480.0" font-size="11" fill="#333333">训练时 batch 大到放不下就 OOM；推理时省下的那份显存直接变成「能同时服务多少请求」。所以推理系统的核心指标之一是并发，而不是 batch 大小。</text>
<rect x="796.0" y="432.0" width="664.0" height="132.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="802.0" y="446.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="454.0" font-size="11" fill="#333333">② 权重只读 → 可以做「静态优化」</text>
<text x="806.0" y="480.0" font-size="11" fill="#333333">既然是常量，就能提前把布局换好（如昇腾的 ND→NZ）、把前向录成图（图捕获那套）。训练时权重每步都变，这些优化全都不成立。</text>
<rect x="36.0" y="604.0" width="700.0" height="132.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="618.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="626.0" font-size="11" fill="#333333">③ batch 变成权衡 → 需要调度器</text>
<text x="46.0" y="652.0" font-size="11" fill="#333333">把多个请求「拼成一批」能提高吞吐，但会让某些请求等更久。于是必须有人决定「这一步算谁、算几个 token」——这就是 Scheduler。</text>
<rect x="796.0" y="604.0" width="664.0" height="132.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="802.0" y="618.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="626.0" font-size="11" fill="#333333">④ 精度可以降 → 省钱但可能掉点</text>
<text x="806.0" y="652.0" font-size="11" fill="#333333">bf16/fp16 是常态；fp8/int8 量化能把权重和 KV 都压小，代价是精度损失与额外的反量化开销——要不要用是个工程权衡。</text>
<rect x="36.0" y="776.0" width="1424.0" height="116.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="790.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="798.0" font-size="11" fill="#333333">⑤ 显存构成变了 → KV cache 成为主角</text>
<text x="46.0" y="824.0" font-size="11" fill="#333333">训练时激活是显存大户；推理时激活只需「一步的峰值」，而 KV cache 会随「并发数 × 上下文长度」线性增长，成为主要变量。所以推理系统的显存管理几乎都在管 KV：分块、复用前缀、跨机搬运、超时释放（分别对应生命周期 ⑤、Mooncake、PD 分离）。</text>
<rect x="36.0" y="932.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="946.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：这张表解释了「为什么要有一套推理系统」。下一步（③）先把权重从文件搬进显存——这是 vLLM 启动时做的第一件大事。</text>
<rect x="36.0" y="1008.0" width="1424.0" height="96.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1022.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="1036.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">KV 块默认 16 token 一块：vllm/config/cache.py:71（DEFAULT_BLOCK_SIZE）</text>
<text x="42.0" y="1049.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">显存利用率上限（推理专用旋钮）：vllm/config/cache.py:103（gpu_memory_utilization 默认 0.92）</text>
<text x="42.0" y="1063.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">「只有权重+激活峰值，没有梯度」的代码证据：vllm/v1/worker/gpu_worker.py:528-642（determine_available_memory 只扣权重与激活）</text>
<text x="42.0" y="1078.6999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">调度器存在的原因：vllm/v1/core/sched/scheduler.py:568（每步挑一批）</text>
<rect x="36.0" y="1136.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1150.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：训练的取舍围着「准」转，推理的取舍围着「快和便宜」转；五个差别（梯度 / 权重角色 / batch 意义 / 精度 / 显存构成）分别逼出了调度、KV 管理、量化、图捕获这些机制。</text>

<p class="ptitle">③ 权重从文件到显存：三个坑与前置页的接口</p>
<p class="psub">一句话：磁盘上的 safetensors → 读成 CPU 张量 → 按 TP 切片 → 拷进 NPU 上已分配的参数。细节在另外两套图里；本页只标出「在哪一步最容易错」，并说明为什么要先看那两套。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="662"1068" viewBox="0 0 1576 1068">
<rect width="1576" height="1068" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">③ 权重从文件到显存：三个坑与前置页的接口</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：磁盘上的 safetensors → 读成 CPU 张量 → 按 TP 切片 → 拷进 NPU 上已分配的参数。细节在另外两套图里；本页只标出「在哪一步最容易错」，并说明为什么要先看那两套。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：五步（每步都指向已有图页，不在这里重复展开）</text>
<rect x="36.0" y="152.0" width="274.0" height="116.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 看目录与 config.json</text>
<text x="42.0" y="180.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">知道模型有几个参数、多深、多宽</text>
<text x="42.0" y="194.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">详见：Transformer ⑮</text>
<rect x="324.0" y="152.0" width="274.0" height="116.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="330.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 读分片与 index.json</text>
<text x="330.0" y="180.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">只读该读的文件；名字→文件靠索引</text>
<text x="330.0" y="194.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">详见：Transformer ⑰</text>
<rect x="612.0" y="152.0" width="274.0" height="116.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="618.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 名字映射 + 选 weight_loader</text>
<text x="618.0" y="180.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">q_proj/k_proj/v_proj 合成 qkv_proj</text>
<text x="618.0" y="194.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">详见：Transformer ⑱</text>
<rect x="900.0" y="152.0" width="274.0" height="116.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="906.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">④ 按 TP 切片 + copy_ 进 NPU</text>
<text x="906.0" y="180.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">narrow 出本 rank 那段，写入参数</text>
<text x="906.0" y="194.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">详见：进程/线程 ⑮</text>
<rect x="1188.0" y="152.0" width="274.0" height="116.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1194.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑤ 格式后处理 + profile + 切 KV</text>
<text x="1194.0" y="180.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">NZ 重排；然后才轮到 KV 块池</text>
<text x="1194.0" y="194.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">详见：进程/线程 ⑮⑯</text>
<text x="36.0" y="288.0" font-size="11" fill="#333333">第二步：三个坑（都能用一句话解释为什么）</text>
<rect x="36.0" y="308.0" width="700.0" height="150.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="322.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="330.0" font-size="11" fill="#333333">坑一：把「分片」当成「张量并行」</text>
<text x="46.0" y="356.0" font-size="11" fill="#333333">分片（shard）＝训练/发布时把权重切成几个文件；张量并行（TP）＝运行时把一层矩阵横着/竖着切到几张卡上。两者毫无关系：TP=4 也可以只有一个权重文件（读进来再切）。</text>
<rect x="796.0" y="308.0" width="664.0" height="150.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="802.0" y="322.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="330.0" font-size="11" fill="#333333">坑二：忘了「[out, in] 的转置」</text>
<text x="806.0" y="356.0" font-size="11" fill="#333333">权重文件里的 Linear 通常是 [out_features, in_features]，而很多公式写成 y = xW 时 W 是 [in, out]。报错形态就是形状不匹配（Attempted to load weight (…) into parameter (…)）。</text>
<rect x="36.0" y="498.0" width="1424.0" height="128.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="512.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="520.0" font-size="11" fill="#333333">坑三：先权重、后 KV —— 顺序不能反</text>
<text x="46.0" y="546.0" font-size="11" fill="#333333">加载权重 → 跑一次 profile 量出激活峰值 → 剩余显存才切成 KV 块。如果反过来（先切 KV）会导致 KV 预算算错、甚至启动 OOM；这也是为什么日志里 Available KV cache memory 出现在加载权重之后。副作用（很重要）：权重变大 = KV 块变少 = 能同时服务的请求变少。这就是 ⑦ 那张显存账的起点。</text>
<rect x="36.0" y="666.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="680.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：权重就位后，模型就能「算」了。但推理不是「算一次」，而是先算一大段、再一个字一个字算——下一步（④）讲这两个阶段。</text>
<rect x="36.0" y="742.0" width="1424.0" height="104.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="756.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="770.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">读盘与切片的实现：vllm/model_executor/model_loader/weight_utils.py:1002（safe_open）、:1253-1271（default_weight_loader）</text>
<text x="42.0" y="783.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">TP 切片落地：vllm/model_executor/layers/linear.py:572-589（列并行）、:1730-1746（行并行）</text>
<text x="42.0" y="797.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">先权重后 KV 的顺序：vllm/v1/worker/gpu_worker.py:528-642（profile→KV 预算）、vllm/v1/engine/core.py:354（切块池）</text>
<text x="42.0" y="812.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">默认块大小与显存上限：vllm/config/cache.py:71（block_size=16）、:103（gpu_memory_utilization=0.92）</text>
<rect x="36.0" y="878.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="892.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：加载只有五步，坑只有三个——分片≠TP、转置、以及「先权重再 profile 再 KV」这个不可换的顺序；顺序决定了后面所有显存档。</text>

<rect x="148.0" y="967.0" width="120.0" height="26.0" rx="4" fill="#eceff1" stroke="#607d8b"/>
<text x="154.0" y="981.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">客户端</text>
<rect x="276.0" y="967.0" width="120.0" height="26.0" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="282.0" y="981.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">边端 edge</text>
<rect x="404.0" y="967.0" width="120.0" height="26.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="410.0" y="981.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">云 P (prefill)</text>
<rect x="532.0" y="967.0" width="120.0" height="26.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="538.0" y="981.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">云 D (decode)</text>
<rect x="660.0" y="967.0" width="120.0" height="26.0" rx="4" fill="#b0e3e6" stroke="#0e8088"/>

<text x="46.0" y="428.0" font-size="11" fill="#333333">prefill：宽矩阵，算力是瓶颈</text>
<text x="46.0" y="454.0" font-size="11" fill="#333333">· 一次处理的 token 数 = prompt 长度（几十到几万）；· 每算一个 token，都要做 O(n) 次乘加（n = 长度）→ 总计算量 O(n²)；· 计算量 / 访存量 比例高 → compute-bound（算力吃满）；· 只发生一次，所以「把 prompt 算完」的延迟叫 TTFT。</text>
<rect x="796.0" y="406.0" width="664.0" height="176.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="802.0" y="420.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="428.0" font-size="11" fill="#333333">decode：窄矩阵，显存带宽是瓶颈</text>
<text x="806.0" y="454.0" font-size="11" fill="#333333">· 一次只算 1 个 token（spec decode 时 1+N）；· 但每步都要把全部权重从显存读一遍，还要读历史 KV；· 计算量 / 访存量 比例极低 → memory-bound（带宽吃满、算力闲着）；· 每生成一个 token 都要一轮，所以它的速度叫 TPOT。</text>
<rect x="36.0" y="622.0" width="1424.0" height="116.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="636.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="644.0" font-size="11" fill="#333333">为什么这两个名字值得单独记：它们的所有优化手段都不一样</text>
<text x="46.0" y="670.0" font-size="11" fill="#333333">· prefill 想的是「怎么把宽矩阵喂满」→ 分块（chunked prefill）、大 batch 的 prefill、甚至和 decode 拼一批；· decode 想的是「怎么少读一点、少等一点」→ KV 复用（前缀缓存）、量化、把多个请求捆一起（batching）、把下发次数压掉（图捕获）、甚至把 KV 搬到别的机器（PD 分离）。</text>
<rect x="36.0" y="778.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="792.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：「算力 vs 带宽」这句话需要一点更硬的解释，否则容易变成口号。下一步（⑤）用「算术强度」把它讲成可以自己算的数。</text>

<figure id="p4">
<p class="ptitle">⑤ 算术强度：一个数就能判断「这一步卡在算力还是带宽」</p>
<p class="psub">一句话：算术强度 = 计算量 ÷ 访存量（每读一个字节，做了多少次运算）。硬件有两个上限：算力峰值与带宽峰值；谁的「上限线」先被撞到，谁就是瓶颈。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="891"1438" viewBox="0 0 1576 1438">
<rect width="1576" height="1438" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑤ 算术强度：一个数就能判断「这一步卡在算力还是带宽」</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：算术强度 = 计算量 ÷ 访存量（每读一个字节，做了多少次运算）。硬件有两个上限：算力峰值与带宽峰值；谁的「上限线」先被撞到，谁就是瓶颈。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：先立一个能算的数</text>
<rect x="36.0" y="152.0" width="1424.0" height="96.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">算术强度（arithmetic intensity）= 浮点运算次数 FLOPs ÷ 搬运字节数 Bytes　　单位：FLOP / Byte</text>
<text x="42.0" y="180.85" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="195.7" font-size="10" fill="#333333" font-family="Microsoft YaHei">直觉：每从显存搬 1 个字节出来，能顺手做多少次乘加。搬得越「值」，就越可能被算力卡住；搬得越「不值」，就越容易被带宽卡住。</text>
<text x="36.0" y="262.0" font-size="11" fill="#333333">第二步：硬件有两条「上限线」，谁先撞上谁是瓶颈</text>
<rect x="36.0" y="282.0" width="700.0" height="168.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="296.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="304.0" font-size="11" fill="#333333">算力上限线</text>
<text x="46.0" y="330.0" font-size="11" fill="#333333">算力峰值是固定的（比如每秒 X 次浮点运算）。要把算力用满，就得让「每字节带来的运算次数」足够高。算术强度高的负载 → 卡在算力（compute-bound）。典型：大矩阵乘（prefill 的宽矩阵）。</text>
<rect x="796.0" y="282.0" width="664.0" height="168.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="802.0" y="296.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="304.0" font-size="11" fill="#333333">带宽上限线</text>
<text x="806.0" y="330.0" font-size="11" fill="#333333">带宽峰值也是固定的（每秒能搬 Y 字节）。如果每字节只做很少的运算，算力根本用不上，先撞带宽。算术强度低的负载 → 卡在带宽（memory-bound）。典型：decode —— 每步都要把全部权重读一遍，却只算 1 个 token。</text>
<text x="36.0" y="470.0" font-size="11" fill="#333333">第三步：拿 decode 真算一遍（用相对量级，不做绝对性能承诺）</text>
<rect x="36.0" y="490.0" width="300.0" height="36.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="42.0" y="504.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">项</text>
<rect x="336.0" y="490.0" width="620.0" height="36.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="342.0" y="504.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">怎么算</text>
<rect x="956.0" y="490.0" width="480.0" height="36.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="962.0" y="504.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">本例</text>
<rect x="36.0" y="526.0" width="300.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="540.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一次矩阵乘的运算量</text>
<rect x="336.0" y="526.0" width="620.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="342.0" y="540.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">2 × 参数量（每个参数一次乘一次加）</text>
<rect x="956.0" y="526.0" width="480.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="962.0" y="540.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">权重 7B → 约 1.4×10¹⁰ 次</text>
<rect x="36.0" y="562.0" width="300.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="576.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一次矩阵乘的访存量</text>
<rect x="336.0" y="562.0" width="620.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="342.0" y="576.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">参数量的字节数（每个权重都要从显存读出来）</text>
<rect x="956.0" y="562.0" width="480.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="962.0" y="576.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">7B × 2 字节（bf16）≈ 1.4×10¹⁰ 字节</text>
<rect x="36.0" y="598.0" width="300.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="612.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">所以算术强度</text>
<rect x="336.0" y="598.0" width="620.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="342.0" y="612.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">≈ 2 FLOP / 字节（与参数量无关！）</text>
<rect x="956.0" y="598.0" width="480.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="962.0" y="612.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">几乎恒等于 2</text>
<rect x="36.0" y="634.0" width="300.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="648.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">硬件比值</text>
<rect x="336.0" y="634.0" width="620.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="342.0" y="648.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">算力峰值 ÷ 带宽峰值（常见量级：数百）</text>
<rect x="956.0" y="634.0" width="480.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="962.0" y="648.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">远大于 2</text>
<rect x="36.0" y="670.0" width="300.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="684.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">结论</text>
<rect x="336.0" y="670.0" width="620.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="342.0" y="684.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">每字节只换 2 次运算，远低于硬件能「喂饱」的比例</text>
<rect x="956.0" y="670.0" width="480.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="962.0" y="684.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">→ decode 必然是带宽瓶颈</text>
<text x="36.0" y="722.0" font-size="11" fill="#333333">第四步：这个数一算出来，三件事立刻有了理由</text>
<rect x="36.0" y="742.0" width="460.0" height="152.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="756.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="764.0" font-size="11" fill="#333333">① 为什么要 batching</text>
<text x="46.0" y="790.0" font-size="11" fill="#333333">把 N 个请求的 decode 合成一批：运算量 ×N，访存量几乎不变（权重只读一遍）→算术强度从 2 涨到 2N → 才可能用满算力。</text>
<rect x="518.0" y="742.0" width="460.0" height="152.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="524.0" y="756.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="528.0" y="764.0" font-size="11" fill="#333333">② 为什么要量化</text>
<text x="528.0" y="790.0" font-size="11" fill="#333333">把权重从 2 字节压到 1 字节：访存量直接减半 → 带宽瓶颈下速度接近翻倍；代价是精度与反量化开销。</text>
<rect x="1000.0" y="742.0" width="460.0" height="152.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="1006.0" y="756.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1010.0" y="764.0" font-size="11" fill="#333333">③ 为什么要图捕获 / PD 分离</text>
<text x="1010.0" y="790.0" font-size="11" fill="#333333">带宽已经吃满、算力还闲着 → 那就削减「等 CPU 提交」的时间（图捕获）；或者干脆把 decode 单独放一拨机器，让「带宽密集」和「算力密集」各用各的卡。</text>
<rect x="36.0" y="934.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="948.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：「batching 提高算术强度」是推理系统里最重要的一条因果。下一步（⑥）看现实中的 batching 到底难在哪（为什么需要「连续批处理」）。</text>
<rect x="36.0" y="1010.0" width="1424.0" height="76.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="1024.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">说明（避免误用）：上面的「≈2 FLOP/字节」「算力带宽比数百」是量级估算，用于判断瓶颈方向，不是性能承诺；真实数值取决于硬件型号、精度、算子实现与 batch 结构。本仓里也有「每张图固定驱动开销 ≥1 MiB」这类经验常量，同样只用于估算。</text>
<rect x="36.0" y="1120.0" width="1424.0" height="96.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1134.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="1148.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">decode 每请求 1 个 query：vllm/config/vllm.py:661-679</text>
<text x="42.0" y="1161.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">batching 的上限由调度参数决定：vllm/config/scheduler.py:49（max_num_batched_tokens）、vllm/v1/core/sched/scheduler.py:124-130（max_num_seqs / 预算）</text>
<text x="42.0" y="1175.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">量化入口（模型配置里的 quantization）：vllm/config/model.py（quantization 字段）</text>
<text x="42.0" y="1190.6999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">图捕获的动机（削减 host 下发）：见「vLLM图捕获」套页 ①</text>
<rect x="36.0" y="1248.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1262.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：decode 的算术强度 ≈ 2 FLOP/字节，远低于硬件算力带宽比，所以它被带宽卡死；而 batching 是唯一能在不增加访存的前提下增加运算的手段——这就是推理系统一切复杂度的源头。</text>

<figure id="p5">
<p class="ptitle">⑥ 连续批处理（continuous batching）：推理系统里最难的那件小事</p>
<p class="psub">一句话：把多个请求「捆成一批」能提高算术强度，但每个请求的长度、结束时间、要的 token 数都不一样 —— 于是必须每一轮重新组批，而不是「一批跑到底」。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="740"1194" viewBox="0 0 1576 1194">
<rect width="1576" height="1194" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑥ 连续批处理（continuous batching）：推理系统里最难的那件小事</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：把多个请求「捆成一批」能提高算术强度，但每个请求的长度、结束时间、要的 token 数都不一样 —— 于是必须每一轮重新组批，而不是「一批跑到底」。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：静态批处理 vs 连续批处理（同一段时间轴）</text>
<text x="36.0" y="166.0" font-size="11" fill="#333333">静态批（static batching）：一批跑到底</text>
<rect x="36.0" y="176.0" width="700.0" height="118.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="190.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">请求 A、B 一起进 → 等最慢的那个结束 → 才收下一批。</text>
<text x="42.0" y="203.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">B 早早答完了，它占的位置却一直空着（空转）；</text>
<text x="42.0" y="218.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">新请求 C 只能在外面排队等到这一批整体结束。</text>
<text x="42.0" y="233.2" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">GPU 利用率与尾延迟都被「最慢的那个」拖住。</text>
<text x="796.0" y="166.0" font-size="11" fill="#333333">连续批处理：每一轮重新组批</text>
<rect x="796.0" y="176.0" width="664.0" height="118.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="802.0" y="190.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">每一「步」（生成一轮 token）都重新决定：这一步算谁、各算几个 token。</text>
<text x="802.0" y="203.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">B 答完了 → 下一步就把它移出批，位置立刻给排队中的 C；</text>
<text x="802.0" y="218.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">新请求可以在下一步就进来，不用等整批结束。</text>
<text x="802.0" y="233.2" font-size="11" fill="#1c7c54" font-family="Microsoft YaHei">代价：必须有一个调度器，而且每步都要重算批的形状。</text>
<text x="36.0" y="318.0" font-size="11" fill="#333333">第二步：一旦「每步重组批」，三个问题立刻冒出来</text>
<rect x="36.0" y="338.0" width="460.0" height="176.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="352.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="360.0" font-size="11" fill="#333333">① 形状每步都变</text>
<text x="46.0" y="386.0" font-size="11" fill="#333333">这一步批里有 7 个请求，下一步可能 9 个；每个请求这一步要算的 token 数也能不同（一个还在 prefill 大块、另一个已是 decode 1 个）。→ 于是要有「每步的 token 预算」与「分块 prefill」；→ 也是图捕获必须按「桶」抓、且会静默掉出的根源（图捕获 ⑥）。</text>
<rect x="518.0" y="338.0" width="460.0" height="176.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="524.0" y="352.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="528.0" y="360.0" font-size="11" fill="#333333">② 显存要能「随时借还」</text>
<text x="528.0" y="386.0" font-size="11" fill="#333333">新请求进来要立刻能分到 KV 块；请求结束时块必须立刻还回池子，否则并发上不去。→ 于是要有块池 + 块表 + 引用计数（生命周期 ⑤）；→ 块不够时要么等、要么抢占（调度器 ⑫）。</text>
<rect x="1000.0" y="338.0" width="460.0" height="176.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="1006.0" y="352.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1010.0" y="360.0" font-size="11" fill="#333333">③ 公平与延迟</text>
<text x="1010.0" y="386.0" font-size="11" fill="#333333">如果一直让「跑得快的短请求」插队，长请求会被饿死；反过来先来先服务（FCFS），短请求的尾延迟又变差。→ 于是要有排队策略（FCFS / priority）、有 chunked prefill 的配额、→ 还要有准入控制（排队上限，超了直接 503）。</text>
<text x="36.0" y="534.0" font-size="11" fill="#333333">第三步：vLLM 里这三件事分别落在哪里（这就是后面几套图的目录）</text>

<p class="psub">一句话：推理的显存 = 权重 + KV cache + 激活峰值 + 图池 + 碎片；其中只有 KV 会随「并发 × 上下文」长大，所以它是主要变量。</p>

<text x="46.0" y="710.0" font-size="11" fill="#333333">为什么 KV 要「分块管理」而不是整段预留</text>
<text x="46.0" y="736.0" font-size="11" fill="#333333">整段预留：长度未知 → 只能按最大长度占，浪费巨大；分块：按需分配、前缀可共享、结束后立刻还回池子。这就是 block_size（默认 16 token 一块）与块表存在的原因。</text>

<text x="806.0" y="710.0" font-size="11" fill="#333333">为什么 KV 还要「跨机搬」</text>
<text x="806.0" y="736.0" font-size="11" fill="#333333">当「一台机器的显存」已经装不下「想要的并发 × 上下文」时，剩下的选择只有两个：降并发（掉吞吐）或把 KV 放到别的机器上（PD 分离 / KV 池）。这就是 Mooncake 那套图存在的前提。</text>

<text x="42.0" y="890.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：显存这本账解释了「为什么要有 KV 管理和 PD 分离」。还有另一条路——把一张卡变成多张卡。下一步（⑧）讲并行的四种切法。</text>

<text x="46.0" y="728.0" font-size="11" fill="#333333">① 一层都放不下？ → 只能 TP（切层内的矩阵）。② 放得下但想要更高吞吐？ → DP（复制几份，各跑各的请求）。③ 层太多、单机放不下整模型？ → PP（或者 TP+PP 组合）。MoE 模型额外问一句：专家总数是否超过单卡显存 → EP。</text>
<rect x="796.0" y="680.0" width="664.0" height="152.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="802.0" y="694.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="702.0" font-size="11" fill="#333333">为什么本仓 PD 场景是「TP 或 DP」而不是 PP</text>
<text x="806.0" y="728.0" font-size="11" fill="#333333">PD 分离把 prefill 与 decode 拆到不同实例，每个实例只需要「跑得动一层 + 有足够 KV」；而 decode 阶段最怕的是每层都要通信（TP 的 all_reduce 在带宽瓶颈下更贵），所以本仓 decode 侧更偏好 DP（多份独立引擎、互不通信）。</text>

<text x="42.0" y="886.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：到这里，推理系统的四大需求（算力、并发、显存、多卡）都讲齐了。下一步（⑨）把它们一次性映射到 vLLM 的组件上。</text>
