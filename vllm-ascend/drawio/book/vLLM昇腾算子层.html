<text x="42.0" y="826.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第三步：为什么「算子层」值得单独一套图（三个理由）</text>
<text x="42.0" y="840.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 它决定了性能上限：同一份模型，融合算子用上与否能差出一大截——因为省掉的是「中间结果落显存再读回来」。</text>
<text x="42.0" y="854.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 它决定了限制条件：很多「必须满足 X 才能跑」的要求（布局、头数、dtype、形状）不是框架规定的，而是算子本身只支持这些。</text>
<text x="42.0" y="869.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 它解释了跨平台差异：vLLM 在 GPU 上的一套写法，到昇腾上要换成专用算子，所以本仓与上游的差异大量集中在这一层。</text>
<text x="36.0" y="952.0" font-size="11" fill="#333333">第四步：这一套的阅读顺序（与前面几站的接口）</text>
<rect x="36.0" y="968.0" width="1424.0" height="108.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="982.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">站 1（Transformer 数学：每个算子算什么）× 站 4 ⑯（权重怎么参与计算）→ 本套（这些计算落到哪个 kernel） → 站 6（图捕获：怎么把一串 kernel 录成图）→ 站 8（参数：哪些开关决定用哪个 kernel）。</text>
<text x="42.0" y="995.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">所以本套适合在「已经懂模型怎么算、也懂进程结构」之后读；反之，如果一上来就读算子名，会不知道它在算哪一步。</text>
<rect x="36.0" y="1116.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="1130.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：总览有了。下一步（②）先讲清一件最容易混的事——「一个算子」和「一次 kernel 下发」不是一回事。</text>
<rect x="36.0" y="1192.0" width="1424.0" height="112.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1206.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="1220.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">昇腾算子的统一封装入口：vllm-ascend/vllm_ascend/device/device_op.py（`torch_npu.*` 与 `torch.ops._C_ascend.*` 的集中封装，见 ⑧ 页的算子总表）</text>
<text x="42.0" y="1233.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">linear 与融合算子的实现：vllm-ascend/vllm_ascend/ops/（linear / layernorm / rotary_embedding 等）</text>
<text x="42.0" y="1247.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">attention 的落点见 ③④ 页；MoE 的落点见「MoE 套」⑧ 页</text>
<text x="42.0" y="1262.6999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">权重如何参与计算（GEMM 读的那份张量从哪来）：见「进程与线程」套 ⑯ 页</text>
<rect x="36.0" y="1338.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1352.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：模型图上的每一步，在昇腾上都要落到一个具体的 kernel；融合算子省的是「落显存再读回来」；而所有「必须满足 X 才能跑」的限制，绝大多数来自「算子只支持这些」。</text>

<figure id="p1">
<p class="ptitle">② 一个算子 ≠ 一次下发：融合省的是「中间结果落显存再读回来」</p>
<p class="psub">一句话：数学上写成三步（比如「残差相加 → 归一化 → 量化」），如果不融合，设备上就是三次 kernel 下发 + 两次中间结果落显存；融合成一个算子后只剩一次下发——省的是带宽和启动开销，不是算力。</p>

<text x="36.0" y="34.0" font-size="11" fill="#333333">② 一个算子 ≠ 一次下发：融合省的是「中间结果落显存再读回来」</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：数学上写成三步（比如「残差相加 → 归一化 → 量化」），如果不融合，设备上就是三次 kernel 下发 + 两次中间结果落显存；融合成一个算子后只剩一次下发——省的是带宽和启动开销，不是算力。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：同一个语义，两种落地（对比「三次下发」与「一次下发」）</text>
<rect x="36.0" y="148.0" width="690.0" height="190.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">不融合（三个算子）</text>
<text x="42.0" y="176.85" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="191.7" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 读 x、读残差 → 算加法 → 写回显存（中间结果 A）</text>
<text x="42.0" y="205.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 读 A → 算归一化 → 写回显存（中间结果 B）</text>
<text x="42.0" y="220.04999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 读 B → 算量化 → 写入目标</text>
<text x="42.0" y="234.89999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="249.74999999999997" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">3 次下发 + 2 次「写回再读出」= 3 倍启动开销 + 2 倍额外带宽</text>
<rect x="766.0" y="148.0" width="694.0" height="190.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="772.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">融合（一个算子）</text>
<text x="772.0" y="176.85" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="772.0" y="191.7" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 读 x、读残差 → 加法 → 归一化 → 量化 → 一次写出</text>
<text x="772.0" y="205.2" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="772.0" y="220.04999999999998" font-size="11" fill="#1c7c54" font-family="Microsoft YaHei">1 次下发 + 0 次额外读写</text>
<text x="772.0" y="234.89999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">中间结果留在片上（寄存器/片上缓存），不落显存</text>
<text x="772.0" y="249.74999999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="772.0" y="264.59999999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei">代价：这种算子是专门写的，对形状/dtype/头数有要求，不满足就得回退。</text>
<text x="36.0" y="362.0" font-size="11" fill="#333333">第二步：融合到底省了什么（三条，按收益排）</text>
<rect x="36.0" y="378.0" width="460.0" height="176.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="392.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="400.0" font-size="11" fill="#333333">① 省带宽（decode 时最值钱）</text>
<text x="46.0" y="426.0" font-size="11" fill="#333333">中间结果不用写回显存再读出来。decode 本来就卡在带宽上（入门套 ⑤），所以「少读写一次」直接换成速度。</text>
<rect x="518.0" y="378.0" width="460.0" height="176.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="524.0" y="392.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="528.0" y="400.0" font-size="11" fill="#333333">② 省下发开销</text>
<text x="528.0" y="426.0" font-size="11" fill="#333333">每次 kernel 下发都有固定成本（提交、校验、排队）。算子越碎，固定成本占比越高——小 batch 时尤其明显。这也是图捕获（站 6）要解决的同一个问题。</text>
<rect x="1000.0" y="378.0" width="460.0" height="176.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="1006.0" y="392.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1010.0" y="400.0" font-size="11" fill="#333333">③ 省片上内存搬运</text>
<text x="1010.0" y="426.0" font-size="11" fill="#333333">部分融合算子还能把「读一次、多处用」的中间量留在片上（例如归一化里的方差，既要做除法又要做缩放）。这类优化纯靠手写 kernel 才能做到。</text>
<rect x="36.0" y="594.0" width="1424.0" height="124.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="608.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第三步：融合的代价（这就是为什么本仓到处是「回退」代码）</text>
<text x="42.0" y="622.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">一个融合算子要固定死很多东西：dtype 组合、形状约束、头数、布局、硬件代次。任何一条不满足，就只能走分步实现。</text>
<text x="42.0" y="636.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">所以本仓的代码里你会看到一层套一层的开关：先看自定义算子库加载成功没，再看这个硬件有没有这个能力，再看本次的形状/dtype 是否符合，最后才决定用融合还是分步。</text>
<text x="42.0" y="651.2" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">理解这一点，就能解释「为什么同一份代码在不同机器上性能差很多」——不是配置差异，是融合路径被逐级关掉了。</text>
<text x="36.0" y="742.0" font-size="11" fill="#333333">第四步：一次算子调用的决策顺序（六道闸门，任一不过就降级）</text>
<rect x="36.0" y="758.0" width="224.0" height="84.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="772.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">自定义算子库</text>
<text x="42.0" y="785.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">加载成功？</text>
<rect x="272.0" y="758.0" width="224.0" height="84.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="278.0" y="772.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">硬件支持</text>
<text x="278.0" y="785.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">这个能力？</text>
<rect x="508.0" y="758.0" width="224.0" height="84.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="514.0" y="772.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">dtype/形状</text>
<text x="514.0" y="785.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">符合？</text>
<rect x="744.0" y="758.0" width="224.0" height="84.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="750.0" y="772.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">布局符合？</text>
<rect x="980.0" y="758.0" width="224.0" height="84.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="986.0" y="772.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">融合路径</text>
<text x="986.0" y="785.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">可用？</text>
<rect x="1216.0" y="758.0" width="224.0" height="84.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="1222.0" y="772.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">用融合算子</text>
<text x="36.0" y="864.0" font-size="11" fill="#666666">任一闸门不过 → 走「分步实现」：功能一样、就是慢。所以「结果对但慢」十有八九是这条链上某一环被关掉了。</text>
<rect x="36.0" y="906.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="920.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：融合的价值说清了。下一步（③）看最大的一类算子——矩阵乘（linear / GEMM），它占了绝大部分计算量。</text>

<text x="42.0" y="1158.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：融合算子省的是下发次数与中间结果的读写，不是算力；而它挑形状/ dtype/硬件，所以本仓到处是「能融就融、不能融就分步」的六道闸门——「结果对但慢」通常是闸门被关掉了。</text>

<p class="ptitle">③ 矩阵乘一族：三种写法，一条分派链</p>
<p class="psub">一句话：模型里 90% 的浮点运算都是矩阵乘，而昇腾上它分成三类——普通线性、量化线性、以及 MoE 的分组矩阵乘；选哪一类由「权重怎么存」决定。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="892"1440" viewBox="0 0 1576 1440">
<rect width="1576" height="1440" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">③ 矩阵乘一族：三种写法，一条分派链</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：模型里 90% 的浮点运算都是矩阵乘，而昇腾上它分成三类——普通线性、量化线性、以及 MoE 的分组矩阵乘；选哪一类由「权重怎么存」决定。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：三类矩阵乘（一眼分清）</text>
<rect x="36.0" y="148.0" width="460.0" height="190.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="170.0" font-size="11" fill="#333333">① 普通线性（权重是 bf16）</text>
<text x="46.0" y="196.0" font-size="11" fill="#333333">落到最基础的矩阵乘实现，权重是「分形格式（NZ）」布局。为什么是 NZ：昇腾的矩阵算子对分形布局更友好，所以权重在加载时就被就地重排成 NZ（站 0 ⑧ 讲过重排的代价）。</text>
<rect x="518.0" y="148.0" width="460.0" height="190.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="524.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="528.0" y="170.0" font-size="11" fill="#333333">② 量化线性（权重是 int8/fp8/…）</text>
<text x="528.0" y="196.0" font-size="11" fill="#333333">先对激活做量化（逐 token 动态量化），再调量化矩阵乘算子，反量化在算子内部完成。不同量化方案对应不同算子入口（见下表）。</text>
<rect x="1000.0" y="148.0" width="460.0" height="190.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="1006.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1010.0" y="170.0" font-size="11" fill="#333333">③ 分组矩阵乘（MoE）</text>
<text x="1010.0" y="196.0" font-size="11" fill="#333333">一次调用里为每个专家各算一段 GEMM（各段 M/N/K 不同）。还能进一步融合「激活 + 量化」进同一个算子。这是 MoE 套 ②⑧ 讲的那条主链的核心算子。</text>
<text x="36.0" y="362.0" font-size="11" fill="#333333">第二步：量化线性的分派（按「权重怎么存」选算子）</text>
<rect x="36.0" y="378.0" width="420.0" height="34.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="42.0" y="392.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">权重形态</text>
<rect x="456.0" y="378.0" width="620.0" height="34.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="462.0" y="392.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">落到哪个算子</text>
<rect x="1076.0" y="378.0" width="384.0" height="34.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="1082.0" y="392.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">备注</text>
<rect x="36.0" y="412.0" width="420.0" height="34.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="426.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">W8A8（静态 / 动态）</text>
<rect x="456.0" y="412.0" width="620.0" height="34.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="462.0" y="426.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">激活 per-token 动态量化 + 量化矩阵乘</text>
<rect x="1076.0" y="412.0" width="384.0" height="34.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1082.0" y="426.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">最常用</text>
<rect x="36.0" y="446.0" width="420.0" height="34.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="460.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">W8A8 + MXFP8</text>
<rect x="456.0" y="446.0" width="620.0" height="34.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="462.0" y="460.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">块级 FP8 尺度 + 量化矩阵乘</text>

<text x="36.0" y="632.0" font-size="11" fill="#333333">第三步：三个容易被忽略的细节</text>
<rect x="36.0" y="648.0" width="700.0" height="160.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="662.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="670.0" font-size="11" fill="#333333">① 权重布局是加载时定的，不是算时定的</text>
<text x="46.0" y="696.0" font-size="11" fill="#333333">同样的算子，权重在 NZ 布局下比在普通布局下更高效；所以「加载时那一次重排」（首次约十几秒）是值得的。推论：如果你改了权重处理方式却没让它保持 NZ，性能会莫名变差。</text>
<rect x="796.0" y="648.0" width="664.0" height="160.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="802.0" y="662.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="670.0" font-size="11" fill="#333333">② 算子内部会自动处理 bias</text>
<text x="806.0" y="696.0" font-size="11" fill="#333333">有 bias 时量化算子内部直接加；但有些量化组合踩过 bias 相关的坑（仓内注释提过 fp8 加 bias 的缺陷），所以代码里可能为了绕开而改走别的路径。</text>
<rect x="36.0" y="848.0" width="1424.0" height="108.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="862.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 没有「按形状自动切 GEMV/GEMM」这种魔法（本仓实测结论）</text>
<text x="42.0" y="876.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">很多人以为「小 batch 自动用向量乘、大 batch 自动用矩阵乘」。本仓代码里没有这种分派——分派只看「权重怎么存」（量化与否）与并行配置。</text>
<text x="42.0" y="890.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">唯一接近「按形状选路」的地方是融合通信那条链：按「本次有没有 prefill 请求、dtype、K 的范围、数据量是否小于 16 MB」决定「GEMM+通信融合」还是「分步 GEMM 再通信」。</text>
<text x="42.0" y="905.2" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">这个结论有用：排障时不要去找「形状分派表」，它不存在。</text>
<rect x="36.0" y="996.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="1010.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：矩阵乘讲完。下一步（④）看剩下的「小而碎」的算子——归一化、激活、位置编码，它们最容易被融合，也最容易回退。</text>

<text x="42.0" y="616.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">门控 + 其它（SiTU 等）</text>

<text x="502.0" y="616.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">不同模型族的门控写法</text>
<rect x="1056.0" y="602.0" width="404.0" height="32.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1062.0" y="616.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">按模型选</text>
<text x="36.0" y="648.0" font-size="11" fill="#333333">第三步：位置编码最「按模型分叉」——四个模型族四种落点</text>
<rect x="36.0" y="664.0" width="1424.0" height="150.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="678.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 普通 GQA 模型：一个通用的旋转位置编码算子（内部已处理「全旋」与「部分旋」），prefill 与 decode 同一个算子。</text>
<text x="42.0" y="691.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">② MLA 类（DeepSeek 系）：prefill 与 decode 不是一个——decode 走「归一化 + 旋转 + 写 KV 缓存」三合一的融合算子，prefill 走交错旋转。</text>
<text x="42.0" y="706.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 稀疏 MLA（带 indexer）：用「原地部分旋转」，只转一部分维度，省一次数据拷贝。</text>
<text x="42.0" y="721.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">④ 老硬件（310P）：走一个只支持「头维 64 或 128」的算子，所以老平台上换模型容易踩限制。</text>
<text x="42.0" y="736.0500000000001" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">读法：想知道某个模型的位置编码落到哪个算子，先看它是 GQA 还是 MLA、有没有稀疏/索引器，再看硬件代次。</text>
<rect x="36.0" y="854.0" width="1424.0" height="116.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="868.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第四步：一个容易忽略的隐藏前提——「cos/sin 缓存」要预处理</text>
<text x="42.0" y="882.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">框架里位置编码的表是一整块「cos 与 sin 交错」的缓存，但算子通常要两份分离的 cos、sin，且要求它们不参与梯度追踪。</text>
<text x="42.0" y="896.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">所以本仓在加载后会把这块缓存切分并重新登记（拆成交错的 cos/sin），还特意把它注册成「非持久缓冲」——原因是唤醒/重建后指针会失效。</text>
<text x="42.0" y="911.2" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">这就是为什么「换一个位置编码实现」不是改一行的事：缓存的布局、生命周期、地址稳定性都要跟着改。</text>
<rect x="36.0" y="1010.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="1024.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：小算子家族讲完。下一步（⑤）看一个反直觉的取舍——采样那一步主动不用硬件提供的融合算子。</text>

<text x="42.0" y="1114.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">归一化三档：ops/layernorm.py:92（自研「相加+归一化+bias」）、:97（基础归一化）、:118（回退到厂商「相加+归一化」）；图级融合 compilation/passes/norm_quant_fusion_pass.py:385-393</text>
<text x="42.0" y="1127.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">归一化 + 动态量化融合：attention/dsa_v1.py:1956（自研融合）；图级 norm_quant_fusion_pass.py:328</text>
<text x="42.0" y="1141.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">激活变体：ops/activation.py:37（SwiGLU）、:47（clamp 版）、:31（GELU 变体）；激活+反量化+量化 w8a8/w8a8_dynamic.py:474；分组激活+量化 shared_experts.py:607、:651</text>
<text x="42.0" y="1156.6999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">位置编码：ops/rotary_embedding.py:244（通用旋转，内部处理全旋/部分旋）、:736（旋转乘）；MLA decode 三合一 attention/mla_v1.py:1865、prefill attention/mla_v1.py:2800；原地部分旋转 attention/dsa_v1.py:1915；老硬件 _310p/ops/rotary_embedding.py:146、:223（只支持 rotary 64/128）</text>
<text x="42.0" y="1171.5499999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei">cos/sin 缓存预处理：ops/rotary_embedding.py:47-64（注释为什么要预处理）、:141-171（切分与「非持久缓冲」的原因）、:67-91（预分配固定地址缓冲）</text>
<text x="42.0" y="1186.3999999999996" font-size="11" fill="#333333" font-family="Microsoft YaHei">QKNorm + RoPE 图级融合（head_dim 必须 128）：compilation/passes/qknorm_rope_fusion_pass.py:67-96、:315</text>
<rect x="36.0" y="1280.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1294.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：归一化/激活/位置编码单次很便宜但每层跑好几遍，所以融合收益最高；而它们全都按「模型族 + 硬件代次」分叉——想知道某个模型落到哪个算子，先看模型类型（GQA/MLA/稀疏）再看硬件。</text>

<p class="ptitle">⑤ 采样：为什么「硬件有融合算子」却主动不用它</p>
<p class="psub">一句话：本仓采样路径里有两处**刻意的反向选择**——① top-k/top-p 不走硬件的融合算子，改走排序+掩码；② 不用现成的多项式采样，改用自己的「指数噪声 + 取最大」。两处都是为了避开跨设备同步与固定延迟。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="839"1354" viewBox="0 0 1576 1354">
<rect width="1576" height="1354" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑤ 采样：为什么「硬件有融合算子」却主动不用它</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：本仓采样路径里有两处**刻意的反向选择**——① top-k/top-p 不走硬件的融合算子，改走排序+掩码；② 不用现成的多项式采样，改用自己的「指数噪声 + 取最大」。两处都是为了避开跨设备同步与固定延迟。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：反直觉之一——top-k/top-p 主动放弃硬件算子</text>
<rect x="36.0" y="148.0" width="1424.0" height="124.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="162.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">硬件其实提供了「top-k/top-p」的融合算子，但本仓的代码注释把它否掉了，原文大意：</text>
<text x="42.0" y="175.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">「用基于排序的 PyTorch 实现。硬件的 top-k/top-p 在 k 较大、或批内 k 混杂时会严重劣化（5~28 ms），而排序 + 掩码稳定在 ~1 ms。」</text>
<text x="42.0" y="190.35" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">这是个非常典型的取舍：融合算子不一定更快——它的性能对「形状是否规整」极其敏感，而采样的 batch 恰恰最不规整。</text>
<text x="36.0" y="296.0" font-size="11" fill="#333333">第二步：反直觉之二——不用现成的多项式采样</text>
<rect x="36.0" y="312.0" width="1424.0" height="132.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="326.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">现成的「按概率抽一个」的算子会在内部把结果读回 CPU（或触发同步）才能继续，而采样这一步的延迟极度敏感（它在每个 decode step 的尾巴上）。</text>
<text x="42.0" y="339.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">本仓的做法是：在一张旁路流上生成一组指数分布随机数 → 与概率相除 → 取最大值。数学上等价于「按概率采样」，但全程留在设备上，不需要把结果读回来。</text>
<text x="42.0" y="354.35" font-size="11" fill="#1c7c54" font-family="Microsoft YaHei">最后再把这条旁路流与主流对齐（wait_stream），并用 record_stream 告诉分配器这块张量还在被用。</text>
<text x="36.0" y="468.0" font-size="11" fill="#333333">第三步：采样前后其实是一串加工（这串里既有融合算子也有通用算子）</text>

<text x="42.0" y="768.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第四步：由这两处取舍可以抽出一条通用规律</text>
<text x="42.0" y="782.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">「融合算子」适合形状规整、批大、计算密的场景（prefill / MLP / 矩阵乘）；</text>
<text x="42.0" y="796.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">「通用算子 + 旁路流」适合形状不规整、批小、且处在关键延迟路径上的场景（采样、小算子拼装）。</text>
<text x="42.0" y="811.2" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">所以「为什么不用那个更快的专用算子」这类问题，答案往往不是「没做」，而是「做了但在这个形状下更慢」——本仓至少有两处注释明确这么写。</text>

<p class="ptitle">⑥ 通信算子：并行之后，卡与卡之间要交换什么</p>
<p class="psub">一句话：本仓的 TP 路径不是「GEMM 后 all_reduce」，而是「先 all-gather → GEMM → reduce-scatter」；真正的 all_reduce 只剩三处。而 MoE 的 EP 路径是另一套（dispatch/combine）。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="939"1516" viewBox="0 0 1576 1516">
<rect width="1576" height="1516" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑥ 通信算子：并行之后，卡与卡之间要交换什么</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：本仓的 TP 路径不是「GEMM 后 all_reduce」，而是「先 all-gather → GEMM → reduce-scatter」；真正的 all_reduce 只剩三处。而 MoE 的 EP 路径是另一套（dispatch/combine）。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">第一步：TP 的两条路径（列并行 → 行并行），对比「教科书写法」</text>
<rect x="36.0" y="146.0" width="690.0" height="176.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">教科书：GEMM + all_reduce</text>
<text x="42.0" y="174.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">列并行 GEMM（各卡算一部分）→ 各卡得到「部分输出」</text>
<text x="42.0" y="188.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">→ all_reduce 求和 → 完整输出</text>
<text x="42.0" y="203.2" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="218.04999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">通信量 ≈ 输出张量大小 × 卡数相关系数</text>
<rect x="766.0" y="146.0" width="694.0" height="176.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="772.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">本仓：先 gather、再算、再 reduce-scatter</text>
<text x="772.0" y="174.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① all_gather 输入（让每卡拿到全部输入行）</text>
<text x="772.0" y="188.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② GEMM（每卡只算自己那段输出，不再需要跨卡求和）</text>
<text x="772.0" y="203.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ reduce_scatter 输出（把结果按行切片分给各卡）</text>
<text x="772.0" y="218.04999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="772.0" y="232.89999999999998" font-size="11" fill="#1c7c54" font-family="Microsoft YaHei">好处：与「序列并行」天然兼容，且把一次大通信拆成两段可重叠的通信</text>
<text x="36.0" y="346.0" font-size="11" fill="#333333">第二步：那「真正的 all_reduce」还剩在哪（就三处）</text>
<rect x="36.0" y="362.0" width="380.0" height="38.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="42.0" y="376.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">位置</text>
<rect x="416.0" y="362.0" width="720.0" height="38.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="422.0" y="376.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么需要</text>
<rect x="1136.0" y="362.0" width="324.0" height="38.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="1142.0" y="376.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">备注</text>
<rect x="36.0" y="400.0" width="380.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="414.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 输出头（lm_head）</text>
<rect x="416.0" y="400.0" width="720.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="422.0" y="414.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">词表维并行 → 各卡算一部分词表 → 需要求和得到完整 logits</text>
<rect x="1136.0" y="400.0" width="324.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1142.0" y="414.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">整条链里最贵的一次</text>
<rect x="36.0" y="438.0" width="380.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="452.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 共享专家输出</text>
<rect x="416.0" y="438.0" width="720.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="422.0" y="452.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">MoE 里共享专家按 TP 切分，算完要归约</text>
<rect x="1136.0" y="438.0" width="324.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1142.0" y="452.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">每层一次</text>
<rect x="36.0" y="476.0" width="380.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="490.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 归一化的统计量</text>
<rect x="416.0" y="476.0" width="720.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="422.0" y="490.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">在某个融合 kernel 内部顺手做一次小 all_reduce</text>
<rect x="1136.0" y="476.0" width="324.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1142.0" y="490.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">省一次独立通信</text>
<rect x="36.0" y="544.0" width="700.0" height="168.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="558.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="566.0" font-size="11" fill="#333333">all_to_all：output 投影的写法</text>
<text x="46.0" y="592.0" font-size="11" fill="#333333">某些配置下 o_proj 用「按头分给各卡」再「按 token 分回」的写法，于是出现 all_to_all：每卡把自己该算的头送出去、把别人算好的收回来。这与 MoE 的 dispatch 用的是同一个 primitive，但意图不同（一个是切头、一个是切专家）。</text>
<rect x="796.0" y="544.0" width="664.0" height="168.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="802.0" y="558.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="566.0" font-size="11" fill="#333333">MoE / EP：dispatch 与 combine</text>
<text x="806.0" y="592.0" font-size="11" fill="#333333">EP 下「token 去找专家」= dispatch，「结果送回」= combine，前后各一次。实现有三档（all-gather+reduce-scatter / MC2 融合 / 真 all-to-all）——见 MoE 套 ⑥。所以「MoE 的通信」与「TP 的通信」是两套独立的东西，排障时要分清是哪一套。</text>
<rect x="36.0" y="752.0" width="1424.0" height="132.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="766.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第三步：通信与计算融合（MC2）有个明确的规模门槛</text>
<text x="42.0" y="780.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">本仓把「GEMM + reduce-scatter」做成了一个融合算子（通信与计算在算子内部重叠），但代码里有一道门：只在 TP 规模 ≤ 8 时启用，注释写的是「等底层的 mm_reduce_scatter 支持 tp ≥ 16 再去掉这个限制」。</text>
<text x="42.0" y="794.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">MoE 侧更激进：把「dispatch + 专家计算 + combine」融成单个算子（那样的路径就不需要多流重叠了）。</text>
<text x="42.0" y="809.2" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">这也解释了一条互斥规则：「融合 MC2」与「多流重叠共享专家」不能同时开——前者已经把重叠做进算子里了。</text>
<rect x="36.0" y="924.0" width="1424.0" height="100.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="938.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第四步：一句话把「谁和谁通信」记住</text>
<text x="42.0" y="952.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">TP：每层「gather 输入 → 算 → scatter 输出」；块与块之间还会额外做一次 o_proj 的 all_to_all。</text>
<text x="42.0" y="966.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">EP（MoE）：每层「dispatch → 算 → combine」，且只有 MoE 才有。</text>
<text x="42.0" y="981.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">DP：推理时几乎不通信（但 MoE 的 DP 例外——它要 wave 同步，见 MoE 套 ⑩）。</text>
<rect x="36.0" y="1064.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="1078.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：通信讲完，算子层的三大块（矩阵乘、小算子、通信）都齐了。下一步（⑦）看「回退」是怎么一层层设计的——这决定了你在某台机器上能拿到多少性能。</text>
<rect x="36.0" y="1140.0" width="1424.0" height="152.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1154.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="1168.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">TP 的 gather→GEMM→reduce-scatter：vllm-ascend/vllm_ascend/ops/linear_op.py:278（all_gather）、:299（reduce_scatter）、:374（o_proj 的 reduce_scatter）、:365（o_proj 的 all_to_all）</text>
<text x="42.0" y="1181.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">真正的 all_reduce 三处：ops/vocab_parallel_embedding.py:426（logits）、:456；ops/fused_moe/fused_moe.py:330（共享专家）、:454-538（多流编排）</text>

<text x="42.0" y="1210.6999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">MC2 融合（GEMM+reduce-scatter）：ops/linear_op.py:211（npu_quant_mm_reduce_scatter）；门槛注释 ascend_forward_context.py:182-185（tp_size ≤ 8）；能力检查 :164-181</text>
<text x="42.0" y="1225.5499999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei">MC2 base 接口：device/device_op.py:287-313、:1243-1265</text>
<text x="42.0" y="1240.3999999999996" font-size="11" fill="#333333" font-family="Microsoft YaHei">MoE 的 dispatch/combine（MC2）：ops/fused_moe/token_dispatcher.py:109、:232、:331；单算子融合 moe_comm_method.py:591；与多流互斥 ascend_config.py:850-855</text>
<text x="42.0" y="1255.2499999999995" font-size="11" fill="#333333" font-family="Microsoft YaHei">异步 all_to_all + 独立通信流：ops/fused_moe/moe_utils.py:63-99</text>
<rect x="36.0" y="1326.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1340.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：本仓 TP 是「gather → GEMM → reduce-scatter」而不是「GEMM → all_reduce」，真正的 all_reduce 只剩输出头/共享专家/融合归一化三处；MoE 的 dispatch/combine 是另一套，别和 TP 的通信混在一起排障。</text>
<text x="36.0" y="1432.0" font-size="11" fill="#333333">图例</text>
<rect x="148.0" y="1415.0" width="120.0" height="26.0" rx="4" fill="#eceff1" stroke="#607d8b"/>
<text x="154.0" y="1429.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">客户端</text>

<p class="ptitle">⑦ 六层闸门：融合算子是怎么被一层层关掉的</p>
<p class="psub">一句话：本仓的算子路径不是「写成什么样就跑成什么样」，而是六道闸门逐级判断——每一道不过，就降一档实现。所以「同一份代码在不同机器上性能差很多」通常是闸门关的位置不同。</p>

<rect width="1576" height="1340" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑦ 六层闸门：融合算子是怎么被一层层关掉的</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：本仓的算子路径不是「写成什么样就跑成什么样」，而是六道闸门逐级判断——每一道不过，就降一档实现。所以「同一份代码在不同机器上性能差很多」通常是闸门关的位置不同。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">第一步：六道闸门（从上到下判，任一不过就降档）</text>
<rect x="36.0" y="146.0" width="224.0" height="96.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 自定义算子库</text>
<text x="42.0" y="174.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">能不能加载（版本/编译不匹配就整体禁用）</text>
<rect x="272.0" y="146.0" width="224.0" height="96.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="278.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 硬件能力</text>
<text x="278.0" y="174.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">这台机器的芯片代次支持这个能力吗</text>
<rect x="508.0" y="146.0" width="224.0" height="96.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="514.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 运行时开关</text>
<text x="514.0" y="174.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">用户/环境变量允许吗（有些默认关）</text>
<rect x="744.0" y="146.0" width="224.0" height="96.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="750.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">④ 形状与 dtype</text>
<text x="750.0" y="174.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">头数、维度、dtype 组合符合吗</text>
<rect x="980.0" y="146.0" width="224.0" height="96.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="986.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑤ 布局与并行</text>
<text x="986.0" y="174.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">NZ 布局、TP 规模、CP 开关符合吗</text>
<rect x="1216.0" y="146.0" width="224.0" height="96.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="1222.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑥ 走融合路径</text>
<text x="1222.0" y="174.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">全部通过 → 用融合算子</text>
<text x="36.0" y="264.0" font-size="11" fill="#666666">任一道不过 → 降一档：融合版 → 厂商版 → 基础版；功能不变，只是慢。</text>
<text x="36.0" y="276.0" font-size="11" fill="#333333">第二步：同一件事的三档实现（以「相加 + 归一化」为例）</text>
<rect x="36.0" y="292.0" width="1424.0" height="66.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="306.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="48.0" y="312.0" font-size="11" fill="#333333">A 档：图级再融合</text>
<text x="276.0" y="312.0" font-size="11" fill="#333333">编译期把「相加 + 归一化 + 量化」合成一个算子</text>
<text x="996.0" y="312.0" font-size="11" fill="#333333">需要：特定 dtype + 特定形状 + 融合 pass 开启</text>
<rect x="36.0" y="374.0" width="1424.0" height="66.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="388.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="48.0" y="394.0" font-size="11" fill="#333333">B 档：厂商融合算子</text>
<text x="276.0" y="394.0" font-size="11" fill="#333333">「相加 + 归一化 + bias」一次完成</text>
<text x="996.0" y="394.0" font-size="11" fill="#333333">需要：芯片支持 + 自定义算子库加载成功</text>
<rect x="36.0" y="456.0" width="1424.0" height="66.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="470.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="48.0" y="476.0" font-size="11" fill="#333333">C 档：分步基础算子</text>
<text x="276.0" y="476.0" font-size="11" fill="#333333">相加一个算子、归一化一个算子</text>
<text x="996.0" y="476.0" font-size="11" fill="#333333">总能跑（这是保底档）</text>
<text x="36.0" y="536.0" font-size="11" fill="#333333">第三步：怎么发现「我到底在哪一档」（排障关键）</text>
<rect x="36.0" y="552.0" width="1424.0" height="132.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="566.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 看启动日志：自定义算子库加载失败会有一条明确的 warning（大意是「自定义算子注册失败，全部禁用」）——这是最硬的一条。</text>
<text x="42.0" y="579.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 看融合 pass 的日志：图级融合被关掉时通常有 INFO/debug 说明原因（例如「head_dim 不是 128，QKNorm+RoPE 融合不启用」）。</text>
<text x="42.0" y="594.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 看代码里的前置条件函数：融合路径前的检查函数会把「为什么不行」逐条列出来（TP 规模、dtype、bias、K 范围等）。</text>
<text x="42.0" y="609.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">④ 对比相同配置的两台机器：如果一台快一台慢，先比「芯片代次 + 算子库版本」，再比形状（seq len、头数、batch）。</text>
<rect x="36.0" y="724.0" width="1424.0" height="116.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="738.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第四步：一个容易被忽略的「为兼容而故意不融合」</text>
<text x="42.0" y="752.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">某些平台上有一种反向保护：当矩阵退化成「1×1」这种极小形状时，代码会故意保持普通布局，因为分形布局的矩阵算子在这种形状上会被直接拒绝。</text>
<text x="42.0" y="766.35" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">所以「为什么这里没转成最优布局」的答案可能是：转了反而跑不起来。这类保护在代码里通常有注释，读一眼能省很多时间。</text>

<text x="42.0" y="894.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：回退机制清楚了。下一步（⑧）把本仓用到的算子列成一张表——这张表是这套图最实用的部分。</text>

<p class="ptitle">⑨ attention 落点：结构上分两个算子，本仓实测却常落在同一个上</p>
<p class="psub">一句话：理论上 prefill 用「变长拼接」的融合 attention、decode 用「按块表寻址」的 paged attention；但paged 是可选加速项——本仓部署都没开它，所以decode 实际也走同一个融合算子。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="908"1466" viewBox="0 0 1576 1466">
<rect width="1576" height="1466" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑨ attention 落点：结构上分两个算子，本仓实测却常落在同一个上</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：理论上 prefill 用「变长拼接」的融合 attention、decode 用「按块表寻址」的 paged attention；但paged 是可选加速项——本仓部署都没开它，所以decode 实际也走同一个融合算子。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">第一步：两个算子、两种「长度怎么表示」</text>
<rect x="36.0" y="146.0" width="690.0" height="180.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">prefill：变长拼接布局</text>
<text x="42.0" y="174.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">把所有请求的 query 首尾拼成一条长序列，用「前缀和」告诉算子「每个请求从哪到哪」。</text>
<text x="42.0" y="188.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">所以它能一次算完「很多请求 × 很多 token」。</text>
<text x="42.0" y="203.2" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">限制：每请求的 query 长度不能超过一个上限（本仓是 16）——这就是投机解码 K+1 撞墙的那道限制。</text>
<rect x="766.0" y="146.0" width="694.0" height="180.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="772.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">decode：按块表寻址的 paged attention</text>
<text x="772.0" y="174.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">每请求只有 1 个 query token，历史 K/V 在分块缓存里，靠「块表 + 每请求上下文长度」直接寻址。</text>
<text x="772.0" y="188.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">它只能表达「单 token 的 decode」，无法表达变长 causal prefill。</text>
<text x="772.0" y="203.2" font-size="11" fill="#1c7c54" font-family="Microsoft YaHei">所以两者不是「新旧关系」，而是「形状能力」不同。</text>
<rect x="36.0" y="366.0" width="1424.0" height="132.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="380.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第二步：一个重要纠正——paged attention 是「可选加速项」，不是默认路径</text>
<text x="42.0" y="394.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">本仓文档原文大意：「融合 attention 是默认算子；在中等并发等场景下它可能表现不佳，这时可以手动通过 pa_shape_list 启用 paged attention。」</text>
<text x="42.0" y="408.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">也就是说：paged attention 只在「形状命中名单」时才启用，而这份名单默认为空——本仓十套部署包的启动参数里从未出现它。</text>
<text x="42.0" y="423.20000000000005" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">实测结论：本仓 decode 也走融合 attention（不是 paged）。所以「decode 一定用 paged attention」是个常见误解。</text>

<text x="36.0" y="770.0" font-size="11" fill="#333333">第四步：两个必须知道的数字（都决定了「能不能跑」）</text>
<rect x="36.0" y="786.0" width="700.0" height="148.0" rx="4" fill="#f8cecc" stroke="#b85450"/>

<text x="46.0" y="834.0" font-size="11" fill="#333333">这是融合 attention 的变长布局限制。直接后果：投机解码的 K+1 不能超过 16（MoE/MTP 套里都撞过这个墙）。本仓部署取 K=1~3，离上限很远；但换模型/改配置时容易忘。</text>

<text x="36.0" y="412.0" font-size="11" fill="#333333">第二步：三处最典型的「重叠」（以及它们各自为什么要事件对齐）</text>
<rect x="36.0" y="426.0" width="460.0" height="190.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="440.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="448.0" font-size="11" fill="#333333">① 共享专家 × 路由专家</text>
<text x="46.0" y="474.0" font-size="11" fill="#333333">两者互不依赖 → 放两条流并发。但「共享专家的激活」必须等「路由的第一段 GEMM」开始后才能插进去，所以代码里用了一串里程碑事件（准备/路由完成/dispatch 开始/激活可插/combine 开始/收尾）来精确控制「谁能先跑」。</text>
<rect x="518.0" y="426.0" width="460.0" height="190.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="524.0" y="440.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="528.0" y="448.0" font-size="11" fill="#333333">② 通信 × 计算（MC2）</text>
<text x="528.0" y="474.0" font-size="11" fill="#333333">最彻底的做法：把「GEMM + reduce-scatter」做成一个算子，重叠发生在算子内部，Python 侧只看到一次调用。所以这条路径不需要多流——这正是「融合 MC2 与多流共享专家互斥」的原因。</text>
<rect x="1000.0" y="426.0" width="460.0" height="190.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="1006.0" y="440.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1010.0" y="448.0" font-size="11" fill="#333333">③ 主机面/KV 搬运 × 计算</text>
<text x="1010.0" y="474.0" font-size="11" fill="#333333">边云的 H2D/D2H、KV 换入换出都放旁路流，与 forward 重叠。关键技巧：用流级同步而不是设备级同步——代码注释明确说「设备级同步会把引擎线程挡在所有无关流后面，且没有正确性收益」。</text>

<text x="42.0" y="856.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第四步：workspace ——「算子要的临时空间」怎么进入显存账</text>
<text x="42.0" y="870.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">有些算子需要一块临时空间（例如 chunked prefill 读历史 K/V、MoE 的分组计算中间结果）。本仓统一由一个全局 workspace 管理器分配：</text>
<text x="42.0" y="884.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 一次分配、切成多份给不同用途（256 字节对齐）；容量不够时惰性扩容；</text>
<text x="42.0" y="899.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 图捕获之后会「上锁」，之后不许再扩（否则图里的地址失效）；</text>
<text x="42.0" y="914.0500000000001" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 它的占用被算进「激活峰值」，所以它变大 = 可用 KV 变小（入门套 ⑦）。</text>
<text x="42.0" y="928.9000000000001" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">有一个平台的极端做法：直接把可用显存对半砍，日志里写「留给算子 workspace 与其它缓存」——这是显存档里最容易被忽略的一项。</text>

<div class="concl"><b>一句话结论　</b>算子不是「一条直线依次执行」，而是被分到主流与十几条旁路流上并发；重叠能省时间，但每处重叠都要用事件对齐依赖，而少数地方还必须真同步——那些同步点就是延迟热点。</div>
