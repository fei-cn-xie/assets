<figure id="p0">
<p class="ptitle">① 总览：一句话是怎么变成下一个字的（21 页的路线图）</p>
<p class="psub">你只要会线性代数就能看懂：整个 Transformer 就是「查表 → 矩阵乘 → 加权求和 → 再矩阵乘」反复 32 次，最后在词表上打一个分。本页先把全程画成一条线，后面逐段展开。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="1176"1898" height="533"860" viewBox="0 0 1898 860">
<rect width="1898" height="860" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">① 总览：一句话是怎么变成下一个字的（21 页的路线图）</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">你只要会线性代数就能看懂：整个 Transformer 就是「查表 → 矩阵乘 → 加权求和 → 再矩阵乘」反复 32 次，最后在词表上打一个分。本页先把全程画成一条线，后面逐段展开。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">前半程：文本 → 数字矩阵</text>
<rect x="36.0" y="150.0" width="250.0" height="78.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">文本</text>
<text x="42.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">「我爱吃苹果」</text>
<text x="42.0" y="193.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">人看的东西</text>
<rect x="316.0" y="150.0" width="270.0" height="78.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="322.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 分词 tokenizer</text>
<text x="322.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">切成 5 个 token，每个换成整数 id</text>
<text x="322.0" y="193.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">词表里第几号</text>
<rect x="616.0" y="150.0" width="300.0" height="78.0" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="622.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 词嵌入 + ④ 位置编码</text>
<text x="622.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">每个 id 变成一行浮点数，再加位置信息</text>
<text x="622.0" y="193.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">得到 5×4 的矩阵（真实 5×4096）</text>
<rect x="946.0" y="150.0" width="300.0" height="78.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="952.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑤~⑫ 一层 Transformer</text>
<text x="952.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">注意力（⑥~⑩）+ 残差/RMSNorm（⑪）+ FFN（⑫）</text>
<text x="952.0" y="193.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">形状不变：进去 5×4，出来还是 5×4</text>
<rect x="1276.0" y="150.0" width="388.0" height="78.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="1282.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑬ 堆 32 层 → LM Head</text>
<text x="1282.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">最后一层输出 × 词表矩阵 → 每个 token 一个 32000 维分数</text>
<text x="1282.0" y="193.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">取最后一个 token 的分数做 softmax → 采样</text>
<text x="36.0" y="260.0" font-size="11" fill="#333333">贯穿全程的一条铁律：Transformer 层不改变张量形状</text>
<text x="36.0" y="264.0" font-size="11" fill="#333333">形状（token 数 × 特征维）</text>
<rect x="36.0" y="276.0" width="48.0" height="30.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="290.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">5×4</text>
<rect x="86.0" y="276.0" width="48.0" height="30.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="92.0" y="290.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">5×4</text>
<rect x="136.0" y="276.0" width="48.0" height="30.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="142.0" y="290.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">5×4</text>
<rect x="186.0" y="276.0" width="48.0" height="30.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="192.0" y="290.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">5×4</text>
<rect x="236.0" y="276.0" width="48.0" height="30.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="242.0" y="290.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">5×4</text>
<text x="298.0" y="290.0" font-size="11" fill="#666666">→ 于是可以一层层往上堆：第 2 层的输入，就是第 1 层的输出。这就是「深度」的来源。</text>
<rect x="298.0" y="320.0" width="1560.0" height="62.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="304.0" y="334.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么必须保持形状：只有输入输出形状一致，才能做「残差连接」——把输入直接加到输出上（x + f(x)）。这一点是 Transformer 能堆深的根本原因（⑪ 详讲）。</text>
<text x="36.0" y="400.0" font-size="11" fill="#333333">后半程：分数 → 下一个字</text>
<rect x="36.0" y="420.0" width="300.0" height="96.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="434.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">logits：每个候选字的分数</text>
<text x="42.0" y="448.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">形状 5×32000（行=位置，列=词表）</text>
<text x="42.0" y="463.70000000000005" font-size="9" fill="#666666" font-family="Microsoft YaHei">只取最后一行：1×32000</text>
<rect x="366.0" y="420.0" width="300.0" height="96.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="372.0" y="434.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">softmax → 概率</text>
<text x="372.0" y="448.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">把分数变成「加起来等于 1」的概率</text>
<text x="372.0" y="463.70000000000005" font-size="9" fill="#666666" font-family="Microsoft YaHei">温度 T 控制锐利程度（⑬）</text>
<rect x="696.0" y="420.0" width="300.0" height="96.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="702.0" y="434.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">采样：掷一次骰子</text>
<text x="702.0" y="448.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">按概率抽一个 token（top-p 先砍掉长尾）</text>
<text x="702.0" y="463.70000000000005" font-size="9" fill="#666666" font-family="Microsoft YaHei">贪心 = 永远选最大</text>
<rect x="1026.0" y="420.0" width="300.0" height="96.0" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="1032.0" y="434.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">把新 token 接回输入</text>
<text x="1032.0" y="448.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">序列变成 6 个 token，再跑一遍</text>
<text x="1032.0" y="463.70000000000005" font-size="9" fill="#666666" font-family="Microsoft YaHei">这就是「自回归」：一个字一个字生成</text>
<rect x="1356.0" y="420.0" width="308.0" height="96.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1362.0" y="434.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么叫「自」回归</text>
<text x="1362.0" y="448.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">模型的输出，变成它下一步的输入；整段对话就是这一个循环转几百次。</text>
<text x="36.0" y="560.0" font-size="11" fill="#333333">全套图的路线（每页只展开一个方框）</text>
<rect x="36.0" y="580.0" width="1628.0" height="74.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="594.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">A · Transformer 怎么算（⑵~⑬）</text>
<text x="42.0" y="608.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 总览 → ② 分词 → ③ 词嵌入 → ④ 位置编码 → ⑤ 矩阵乘 → ⑥ QKV → ⑦ 打分 → ⑧ softmax → ⑨ 加权求和 → ⑩ 多头 → ⑪ 残差+归一化 → ⑫ FFN → ⑬ 输出与采样</text>

<figure id="p1">
<p class="ptitle">② 分词（tokenizer）：文本 → 整数 id</p>
<p class="psub">神经网络只会算数，不会读字。所以第一步是把文本切成「token」并查表换成整数。这一页只回答三件事：切成什么、查到什么、特殊 token 是什么。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="1056"1704" height="629"1016" viewBox="0 0 1704 1016">
<rect width="1704" height="1016" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">② 分词（tokenizer）：文本 → 整数 id</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">神经网络只会算数，不会读字。所以第一步是把文本切成「token」并查表换成整数。这一页只回答三件事：切成什么、查到什么、特殊 token 是什么。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">第一步：把文本切成 token（不一定是「字」也不一定是「词」）</text>
<rect x="36.0" y="150.0" width="340.0" height="96.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">原始文本</text>
<text x="42.0" y="178.85" font-size="13" fill="#333333" font-family="Microsoft YaHei">「我爱吃苹果」</text>
<text x="42.0" y="196.4" font-size="9" fill="#666666" font-family="Microsoft YaHei">5 个汉字</text>
<rect x="406.0" y="150.0" width="400.0" height="96.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="412.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">切成 token</text>
<text x="412.0" y="178.85" font-size="13" fill="#333333" font-family="Microsoft YaHei">我 | 爱 | 吃 | 苹果</text>
<text x="412.0" y="196.4" font-size="9" fill="#666666" font-family="Microsoft YaHei">4 个 token：常见词「苹果」占一个 token</text>
<rect x="836.0" y="150.0" width="420.0" height="96.0" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="842.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">查词表换成 id</text>
<text x="842.0" y="178.85" font-size="13" fill="#333333" font-family="Microsoft YaHei">12841 | 3027 | 882 | 6132</text>
<text x="842.0" y="196.4" font-size="9" fill="#666666" font-family="Microsoft YaHei">每个 id 是「词表里的第几行」</text>
<rect x="1286.0" y="150.0" width="378.0" height="96.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1292.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">切开方式由算法定</text>
<text x="1292.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">BPE（byte-pair encoding）：从单字节开始，反复把最常一起出现的两段合并</text>
<text x="1292.0" y="193.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">所以 token 粒度是「统计出来的」</text>
<text x="36.0" y="280.0" font-size="11" fill="#333333">第二步：这串 id 就是模型的输入（注意：它是整数，不是浮点）</text>

<text x="42.0" y="378.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">严格说它是一个长度 5 的整数数组；在框架里常写成 5×1 或 1×5 只是为了凑成矩阵。</text>
<text x="42.0" y="393.70000000000005" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>

<text x="722.0" y="364.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">真实规模：Llama-2 词表 32000；Qwen2.5 词表 152064（含大量中文字与多字节）。一句中文通常切成 1~2 字/token，英文常见词约 1 词/token，代码里的空格和符号各占 token。</text>
<text x="722.0" y="378.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">词表大小 = ⑮ config.json 的 vocab_size；词表本身 = ⑲ tokenizer 三件套里的 vocab 文件</text>

<text x="356.0" y="590.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">模型生成到它就停，这是它学会「说完」的方式</text>

<p class="ptitle">③ 词嵌入（Embedding）：查表，不是乘法</p>
<p class="psub">很多人以为「把词变成向量」要做矩阵乘。其实 nn.Embedding 就是一张表：id 是行号，直接把这行取出来。这一页把表摊开给你看。</p>

<text x="42.0" y="342.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">这张表是「训练出来的参数」</text>
<text x="42.0" y="356.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">一开始全是随机小数；训练就是不断微调它们，直到「语义相近的词，向量也相近」。</text>
<text x="42.0" y="371.70000000000005" font-size="9" fill="#666666" font-family="Microsoft YaHei">表里的数字是小数（真实是高精度浮点），不像 ② 的 id 是整数</text>
<text x="720.0" y="130.0" font-size="11" fill="#333333">第二步：id 12841 就是「取第 12841 行」</text>
<rect x="720.0" y="150.0" width="944.0" height="104.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="726.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">nn.Embedding(32000, 4096) 的 forward 只有一句话：</text>
<text x="726.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">output = weight[input_ids]　　# 按行号取行，没有任何乘法</text>
<text x="726.0" y="192.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">所以它没有矩阵乘的计算量，却占 32000×4096×2 字节 ≈ 250 MB 显存（fp16）。</text>
<rect x="720.0" y="266.0" width="944.0" height="120.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="726.0" y="280.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么用「查表」而不是「乘矩阵」</text>
<text x="726.0" y="294.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">如果一定要写成乘法：one_hot(id) · E —— 也就是「一个只有一个 1 的向量」去乘 E。而 one_hot(12841) 乘 E 的结果，正是 E 的第 12841 行。</text>
<text x="726.0" y="307.0" font-size="9" fill="#666666" font-family="Microsoft YaHei">查表 = 这个乘法的特例；工程上直接按行索引，省掉 32000 次无用乘法。</text>
<rect x="720.0" y="406.0" width="944.0" height="96.0" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="726.0" y="420.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">5 个 token 的结果：把取出来的 5 行摞起来，得到 5×4 的矩阵——这就是整个 Transformer 的输入张量（真实 5×4096）。</text>
<text x="726.0" y="434.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">行 = token 位置，列 = 特征维（d_model）</text>
<text x="36.0" y="530.0" font-size="11" fill="#333333">一个省显存的小技巧：嵌入矩阵和输出头共用同一张表</text>
<rect x="36.0" y="550.0" width="780.0" height="120.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="564.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">输入侧：Embedding</text>
<text x="42.0" y="578.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">32000×4096 → 取一行得到 4096 维</text>
<text x="42.0" y="593.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">id → 向量</text>
<rect x="876.0" y="550.0" width="788.0" height="120.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="882.0" y="564.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">输出侧：LM Head</text>
<text x="882.0" y="578.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">4096×32000 → 得到每个词的分数</text>
<text x="882.0" y="593.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">向量 → 32000 个分数</text>
<rect x="36.0" y="702.0" width="1628.0" height="96.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="716.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">它们互为转置，可以共享同一份权重（tied embeddings）</text>
<text x="42.0" y="730.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">省下 250 MB 显存；很多模型（Llama 系）就是这么干的。是否共享写在 config.json 的 tie_word_embeddings 里（⑮）。</text>
<rect x="36.0" y="834.0" width="1628.0" height="96.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="848.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点</text>

<p class="ptitle">④ 位置编码（RoPE）：给每个 token 打上「我在第几位」</p>
<p class="psub">注意力天生「看不见顺序」——把 5 个 token 打乱，算出来的分数集合不变。RoPE 用「按位置旋转向量」的办法把顺序编码进去。动手算一遍就懂。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="1056"1704" height="648"1046" viewBox="0 0 1704 1046">
<rect width="1704" height="1046" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">④ 位置编码（RoPE）：给每个 token 打上「我在第几位」</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">注意力天生「看不见顺序」——把 5 个 token 打乱，算出来的分数集合不变。RoPE 用「按位置旋转向量」的办法把顺序编码进去。动手算一遍就懂。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">第一步：先看清问题——注意力是「无序」的</text>
<rect x="36.0" y="150.0" width="800.0" height="104.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">注意力只算「token 之间的相似度」</text>
<text x="42.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">把「我 爱 吃 苹果」里的「我」和「苹果」对调，两两相似度的集合完全一样——模型分不出谁先谁后。</text>
<text x="42.0" y="193.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">所以必须额外把位置信息「掺」进向量里，而不是指望注意力自己发现</text>
<rect x="866.0" y="150.0" width="798.0" height="104.0" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="872.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">掺法有历史演进</text>
<text x="872.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 绝对位置：第 0 位加向量 p0、第 1 位加 p1…（简单，但长文本外推差）</text>
<text x="872.0" y="193.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">② RoPE（现在主流）：不加法，而是按位置旋转 Q/K 向量</text>
<text x="872.0" y="208.54999999999998" font-size="9" fill="#666666" font-family="Microsoft YaHei">Llama / Qwen / 绝大多数开源模型都用 ②</text>
<text x="36.0" y="290.0" font-size="11" fill="#333333">第二步：RoPE 的核心动作——把向量两两配对，各旋转一个角度</text>
<rect x="36.0" y="310.0" width="420.0" height="120.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="324.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一个 6 维向量分成 3 对</text>
<text x="42.0" y="338.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">(x₀,x₁) &amp;nbsp;(x₂,x₃) &amp;nbsp;(x₄,x₅)</text>
<text x="42.0" y="352.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">每一对用同一个角度 θ 旋转；不同对用不同频率（第 i 对的角度是 θᵢ × 位置）。</text>
<text x="42.0" y="367.20000000000005" font-size="9" fill="#666666" font-family="Microsoft YaHei">所以「改位置」=「换一个旋转角度」，非常连续、非常好外推</text>
<rect x="486.0" y="310.0" width="520.0" height="120.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="492.0" y="324.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一对坐标的旋转（这就是全部数学）</text>
<text x="492.0" y="338.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">x' = x·cosθ − y·sinθ</text>
<text x="492.0" y="352.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">y' = x·sinθ + y·cosθ</text>
<text x="492.0" y="367.20000000000005" font-size="9" fill="#666666" font-family="Microsoft YaHei">写成矩阵就是那个 2×2 旋转块——它只作用在一对坐标上，不是用来教矩阵乘的</text>

<text x="36.0" y="510.0" font-size="11" fill="#333333">第三步：为什么只旋转 Q 和 K，不旋转 V</text>
<rect x="36.0" y="530.0" width="520.0" height="132.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="544.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">因为位置只影响「谁该注意谁」</text>
<text x="42.0" y="558.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">注意力分数 = Q·Kᵀ。把 Q、K 各自旋转 θᵢ、θⱼ 后，它们的内积只取决于角度差 (θᵢ−θⱼ)——也就是相对距离。</text>
<text x="42.0" y="573.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">这就是 RoPE 的精髓：绝对位置进入，相对距离出来</text>
<rect x="586.0" y="530.0" width="520.0" height="132.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="592.0" y="544.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">V 只负责「搬内容」</text>
<text x="592.0" y="558.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">V 是被加权求和的内容，它不需要知道自己的位置；旋转 V 只会白白改变输出向量的方向。</text>
<text x="592.0" y="573.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">所以实现里只对 q、k 调用 rotary_emb（见锚点）</text>

<text x="1142.0" y="544.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">长文本外推：改的是「频率表」</text>
<text x="1142.0" y="558.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">θᵢ = 1 / (10000^(2i/d))（Llama 的 rope_theta=10000）。想支持更长上下文，就把这个底数调大（如 500000）或对角度做缩放。</text>

<p class="ptitle">⑤ 线性层（nn.Linear）：整个 Transformer 里唯一的基本运算</p>
<p class="psub">Transformer 有 99% 的浮点运算都是这一件事：y = x·W + b。学会看这一次乘法，后面的 QKV、注意力、FFN 全都是它的变形。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="1056"1704" height="658"1062" viewBox="0 0 1704 1062">
<rect width="1704" height="1062" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑤ 线性层（nn.Linear）：整个 Transformer 里唯一的基本运算</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">Transformer 有 99% 的浮点运算都是这一件事：y = x·W + b。学会看这一次乘法，后面的 QKV、注意力、FFN 全都是它的变形。</text>
<text x="36.0" y="106.0" font-size="11" fill="#333333">第一步：先看形状怎么变（这一步比数字重要）</text>
<rect x="36.0" y="152.0" width="1628.0" height="59.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">形状规则：左矩阵的列数 = 右矩阵的行数，结果的形状取「左行 × 右列」</text>
<text x="42.0" y="180.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">X（6×4）· W（4×5）= R（6×5）　　→ 中间那个 4 和 4 必须相等（否则乘不了）；结果的 6 来自左矩阵的行、5 来自右矩阵的列。</text>
<text x="42.0" y="194.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">本页故意让 6 ≠ 5、也故意不用方阵——这样你能一眼看出「结果的每一维是从哪儿继承的」。真实模型里同样是长方形：X 是 (token 数 × 4096)，W 是 (4096 × 12288)，R 是 (token 数 × 12288)。</text>

<text x="36.0" y="514.0" font-size="11" fill="#333333">第三步：手算 R 的左上角那一个格子（顺便看清「行乘列」）</text>
<rect x="36.0" y="560.0" width="900.0" height="73.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="574.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">R[0][0] 是「X 的第 0 行」乘「W 的第 0 列」</text>
<text x="42.0" y="588.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">X 第 0 行 = [1, 2, 0, 1]　　W 第 0 列 = [1, 0, 2, 1]</text>
<text x="42.0" y="602.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">1×1 + 2×0 + 0×2 + 1×1 = 2</text>
<text x="42.0" y="617.2" font-size="9" fill="#666666" font-family="Microsoft YaHei">注意到没有：算一个格子需要 4 次乘 + 3 次加（4 = X 的列数 = W 的行数）。整张 R 有 6×5=30 个格子，所以一共 30×4=120 次乘法。</text>
<rect x="966.0" y="560.0" width="698.0" height="73.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="972.0" y="574.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么这决定了模型的计算量</text>
<text x="972.0" y="588.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">参数量 = W 的元素个数 = 4×5 = 20（真实：4096×12288 ≈ 5000 万）。</text>
<text x="972.0" y="602.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">计算量 ∝ token 数 × 参数量——所以 「上下文越长、越慢」是乘出来的，不是玄学。</text>
<text x="972.0" y="617.2" font-size="9" fill="#666666" font-family="Microsoft YaHei">FFN 为什么占大头：它的 W 是 4096×12288 级别，比注意力的投影宽 3 倍（⑫）</text>
<rect x="36.0" y="710.0" width="1628.0" height="59.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="724.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">别忘了偏置项 b：y = x·W + b</text>
<text x="42.0" y="738.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">b 是一个长度 5 的向量（每个输出维一个偏置），它会被广播加到 R 的每一行上——所以 6 个 token 共用同一份 b。</text>
<text x="42.0" y="752.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">Llama 系为了省参数把 b 去掉了（bias=False），但 Qwen/很多模型仍然保留。这一点直接反映在权重文件里：有 bias 就会有 q_proj.bias 这个张量（⑱）。</text>

<text x="42.0" y="873.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">最朴素的一份实现：同文件 :324（class ReplicatedLinear）——就是 y = xW + b</text>

<text x="42.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">「我这个 token 想找什么信息？」</text>

<text x="42.0" y="740.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">所以权重文件里 q_proj.weight 的形状是 (输出维, 输入维) 还是反过来？→ 二者是转置关系，⑱ 专门讲这个坑。</text>

<text x="582.0" y="726.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页为了好算都取 3（d_head = 3）。真实模型里 d_head = d_model / n_heads（如 4096/32 = 128），而 Q/K 的维度决定打分，V 的维度决定输出。</text>

<text x="1122.0" y="740.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">这条是后面所有形状推理的锚：看到行数变了，说明有人在搬 token，而不是在算特征。</text>

<p class="ptitle">⑦ 打注意力分数：S = Q · Kᵀ（5×3 乘 3×5 得 5×5）</p>
<p class="psub">这一步回答「每个 token 该看谁」。数学上就是一次矩阵乘：Q 乘 K 的转置。注意结果的 5×5 —— 全篇唯一必须用方阵的地方，本页会说清为什么。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="1056"1704" height="699"1128" viewBox="0 0 1704 1128">
<rect width="1704" height="1128" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑦ 打注意力分数：S = Q · Kᵀ（5×3 乘 3×5 得 5×5）</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">这一步回答「每个 token 该看谁」。数学上就是一次矩阵乘：Q 乘 K 的转置。注意结果的 5×5 —— 全篇唯一必须用方阵的地方，本页会说清为什么。</text>
<rect x="36.0" y="150.0" width="810.0" height="86.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么这一步的矩阵一定是方阵（其它页都在躲方阵，这里躲不掉）</text>
<text x="42.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">Q 有 5 行（5 个 token，每个 3 维）、K 也有 5 行。把 K 转置成 3×5 后相乘：</text>
<text x="42.0" y="192.35" font-size="10" fill="#333333" font-family="Microsoft YaHei">S = Q(5×3) · Kᵀ(3×5) → 5×5</text>
<text x="42.0" y="205.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">结果的行 = 发问的 token，列 = 被看的 token。既然是「每个 token 对每个 token」，行数必然等于列数。</text>
<text x="42.0" y="220.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">所以 5×5 不是偷懒，而是语义决定的：它是一张「谁注意谁」的表。</text>
<rect x="866.0" y="150.0" width="798.0" height="59.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="872.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">转置是什么意思</text>
<text x="872.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">K 本来是「每行一个 token」的 5×3；Kᵀ 是它的镜像：第 i 行变第 i 列，形状反过来变成 3×5。</text>
<text x="872.0" y="192.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">代码里通常不真的转置，而是让矩阵乘的底层去处理（省一次内存搬运）。</text>

<text x="36.0" y="504.0" font-size="11" fill="#333333">第二步：手算 S[0][0]（第 0 个 token 看第 0 个 token 的分数）</text>
<rect x="36.0" y="550.0" width="900.0" height="73.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="564.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">「第 0 行的 Q」点乘「第 0 行的 K」</text>
<text x="42.0" y="578.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">Q 第 0 行 = [3, 3, 2]　　K 第 0 行（= Kᵀ 第 0 列）= [1, 4, 2]</text>
<text x="42.0" y="592.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">3×1 + 3×4 + 2×2 = 19</text>
<text x="42.0" y="607.2" font-size="9" fill="#666666" font-family="Microsoft YaHei">点积越大 → 两个向量方向越一致 → 「越相关」。这就是把「语义相关度」变成「一个数」的全部秘密。</text>
<rect x="966.0" y="550.0" width="698.0" height="59.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="972.0" y="564.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一个 token 看自己（对角线）通常分数很大</text>
<text x="972.0" y="578.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">S 的对角线是 [19, 5, 22, 14, 21]，往往比同行其它位置大——因为「自己和自己最像」。</text>
<text x="972.0" y="592.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">所以模型很容易只关注自己；训练时靠数据把「该看别人」的情况也学出来。</text>
<text x="36.0" y="664.0" font-size="11" fill="#333333">第三步：除以 √d（缩放）——为什么要这一步</text>
<rect x="36.0" y="710.0" width="810.0" height="73.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="724.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">问题：维度越高，点积的数值越大</text>
<text x="42.0" y="738.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页 d_head = 3，√3 = 1.73。S 里的数是 5~24 的量级，除以 1.73 后变成 2.9~13.9。</text>
<text x="42.0" y="752.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">真实模型 d_head = 128，√128 ≈ 11.3；如果不除，softmax 会被「特别大的分数」直接推到 0/1 的极端，梯度几乎消失。</text>
<text x="42.0" y="767.2" font-size="9" fill="#666666" font-family="Microsoft YaHei">所以这一步不是玄学，是为了把分数压回 softmax 舒服的区间。</text>

<p class="ptitle">⑧ Softmax：把分数变成概率（一行一行算给你看）</p>
<p class="psub">上一步得到 5 个分数，这一步把它们变成 5 个概率：都为正、加起来等于 1。整页只做四则运算和 exp，你会乘除就能跟下来。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="1056"1704" height="662"1068" viewBox="0 0 1704 1068">
<rect width="1704" height="1068" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑧ Softmax：把分数变成概率（一行一行算给你看）</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">上一步得到 5 个分数，这一步把它们变成 5 个概率：都为正、加起来等于 1。整页只做四则运算和 exp，你会乘除就能跟下来。</text>
<rect x="36.0" y="150.0" width="810.0" height="73.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么不能直接拿分数当权重</text>
<text x="42.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">分数可能是负数、也可能都很大（比如 19、13、23…），既不能当「比例」用，加起来也不等于 1。</text>
<text x="42.0" y="192.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">Softmax 干三件事：① 全部取 exp（变成正数）；② 求和；③ 每个除以总和。</text>
<text x="42.0" y="207.2" font-size="9" fill="#666666" font-family="Microsoft YaHei">结果一定 &gt; 0 且 Σ = 1，正好可以当「把注意力分给谁多少」的权重。</text>
<rect x="866.0" y="150.0" width="798.0" height="59.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="872.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么先减最大值（工程细节）</text>
<text x="872.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">exp(13.9) 约等于 1.1e6，exp(100) 直接溢出成 inf。所以实现里先减去这一行的最大值（本行 13.9），最大项变成 exp(0)=1，其余都是小数——数学上完全等价。</text>
<text x="872.0" y="192.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">这个技巧叫「数值稳定」，几乎每个 softmax 实现都有。</text>

<text x="374.0" y="652.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 每行和为 1：每行的含义是「这个 token 把注意力怎么分配」。</text>
<text x="374.0" y="666.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 行 = 发问者，列 = 被关注者：所以 P 是方阵（⑦ 解释过）。</text>
<text x="374.0" y="681.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 全部 ≥ 0：注意力的权重不能为负，这让后面的加权求和变成「凸组合」（结果落在各 V 之间，不会跑到离谱的地方）。</text>

<text x="42.0" y="868.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">softmax 本体（含数值稳定做法）：vllm/model_executor/layers/... 里各 attention backend 的 softmax 实现；通用实现在 torch.nn.functional.softmax</text>
<text x="42.0" y="881.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么你在 vllm 里看不到完整的 P 矩阵：实际用 flash-attention 这类 fused kernel，一边算分块一边归一化，永远不把 5×5（真实是几百×几百）整块写回显存——数学等价，显存省一个数量级</text>

<p class="ptitle">⑨ 加权求和：O = P · V（每个 token 把别人的内容按比例搬过来）</p>
<p class="psub">这是注意力块的最后一步，也是一次普通矩阵乘：概率矩阵 P（5×5）乘内容矩阵 V（5×3）。结果 O 就是「这一层注意力加工后的新表示」。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="1056"1704" height="742"1198" viewBox="0 0 1704 1198">
<rect width="1704" height="1198" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑨ 加权求和：O = P · V（每个 token 把别人的内容按比例搬过来）</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">这是注意力块的最后一步，也是一次普通矩阵乘：概率矩阵 P（5×5）乘内容矩阵 V（5×3）。结果 O 就是「这一层注意力加工后的新表示」。</text>
<rect x="36.0" y="150.0" width="1628.0" height="59.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话：P 是「配料比例」，V 是「食材」，O 是「拌好的菜」</text>
<text x="42.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">P 的第 i 行说「第 i 个 token 该按什么比例参考别人」，V 的第 j 行是「第 j 个 token 的内容」。两者相乘 = 按比例把内容混起来。</text>
<text x="42.0" y="192.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">文字描述就是这样发生的：模型想让「它」指代前面的「猫」时，只要把「猫」那一列的权重调大，内容就自动被搬进来了。</text>

<text x="36.0" y="442.0" font-size="11" fill="#333333">第二步：手算 O[0][0]（第 0 个 token 的新特征第 0 维）</text>

<text x="42.0" y="508.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">把「第 0 行 P」和「第 0 列 V」逐项乘再相加</text>
<text x="42.0" y="522.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">P 第 0 行 = [0.03, 0.0, 0.34, 0.01, 0.62]</text>
<text x="42.0" y="536.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">V 第 0 列 = [4, 1, 3, 3, 3]</text>
<text x="42.0" y="551.2" font-size="10" fill="#333333" font-family="Microsoft YaHei">0.03×4 + 0.0×1 + 0.34×3 + 0.01×3 + 0.62×3 = 3.0</text>
<text x="42.0" y="564.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">权重 0.62 的项贡献最大——注意力学到的东西，最后就落在这些系数上。</text>

<text x="972.0" y="508.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么这一步之后可以「忘掉」P</text>
<text x="972.0" y="522.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">O 已经把「注意谁」的信息压进了数值里，下游不需要再知道 P 长什么样。</text>
<text x="972.0" y="536.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">这也是为什么推理框架只缓存 K/V、不缓存 P：P 每来一个新 token 都要重算，K/V 不用（这就是 KV cache 的由来）。</text>

<div class="concl"><b>一句话结论　</b>P 是「配料比例」，V 是「食材」，O 是「拌好的菜」 P 的第 i 行说「第 i 个 token 该按什么比例参考别人」，V 的第 j 行是「第 j 个 token 的内容」。两者相乘 = 按比例把内容混起来。 文字描述就是这样发生的：模型想让「它」指代前面的「猫」时，只要把「猫」那一列的权重调大，内容就自动被搬进来了。</div>

<text x="1106.0" y="502.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">拼接只是「把两份结果首尾接上」，没有让两个头的信息真正混合。乘 W_O（6×4）之后，每个输出维都是两个头所有维的加权和——头与头之间才发生交互。</text>
<text x="1106.0" y="516.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">这也是 o_proj 存在的唯一理由；省掉它，多头就等于「各自为政」。</text>
<rect x="36.0" y="776.0" width="810.0" height="100.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="790.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么多头有用（一个具体的例子）</text>
<text x="42.0" y="804.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">一句话里「小明把书给了小红，因为她明天要走」：</text>
<text x="42.0" y="818.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 一个头可以学「代词 → 最近的女性名字」（指代消解）</text>
<text x="42.0" y="833.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 另一个头可以学「动词 → 它的宾语」（语法结构）</text>
<text x="42.0" y="848.0500000000001" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 再一个头可以学「相邻词」</text>
<text x="42.0" y="862.9000000000001" font-size="9" fill="#666666" font-family="Microsoft YaHei">如果只有一个头，这些关系必须挤在同一张 5×5 表里互相干扰。</text>
<rect x="866.0" y="776.0" width="798.0" height="73.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="872.0" y="790.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">GQA：现代模型为什么 K/V 的头数更少</text>
<text x="872.0" y="804.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">Llama-2 用 32 个头算 Q，但 K/V 也只有 32 份；Llama-3 / Qwen2.5 改成 Q 有 32 个头，K/V 只有 8 个（4 个 Q 头共用一份 K/V）。</text>
<text x="872.0" y="818.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">原因很实在：K/V 要存进 KV cache，头数直接决定显存。减到 1/4，缓存就小到 1/4，而效果几乎不掉。</text>
<text x="872.0" y="833.2" font-size="9" fill="#666666" font-family="Microsoft YaHei">config.json 里 num_attention_heads 与 num_key_value_heads 不相等就是 GQA（⑮）。</text>
<rect x="36.0" y="946.0" width="1628.0" height="100.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="960.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点</text>
<text x="42.0" y="974.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">多头在实现里不是一个循环，而是一个更大的矩阵乘：vllm/model_executor/layers/linear.py:995（QKVParallelLinear，一次算出所有头的 q/k/v，并按 TP 把头分到各卡）</text>
<text x="42.0" y="987.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">头的切分与拼接在 attention backend 内部完成（reshape + transpose），数学上等价于本页的「拆 → 各算 → 拼」</text>
<text x="42.0" y="1001.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">头数与头维：vllm/model_executor/models/llama.py:165 附近读取 config 的 num_heads / num_kv_heads；输出投影 :175（o_proj）</text>

<figure id="p10">
<p class="ptitle">⑪ 残差连接 + RMSNorm：让 32 层能叠起来的两块「胶水」</p>
<p class="psub">每一层 Transformer 都是「归一化 → 注意力 → 加回去 → 归一化 → FFN → 加回去」。这一页讲清两件事：为什么要「加回去」（残差），以及归一化到底在算什么。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="1056"1704" height="868"1401" viewBox="0 0 1704 1401">
<rect width="1704" height="1401" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑪ 残差连接 + RMSNorm：让 32 层能叠起来的两块「胶水」</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">每一层 Transformer 都是「归一化 → 注意力 → 加回去 → 归一化 → FFN → 加回去」。这一页讲清两件事：为什么要「加回去」（残差），以及归一化到底在算什么。</text>
<text x="36.0" y="104.0" font-size="11" fill="#333333">第一步：先看一层里四个部件的顺序（记住这张图，⑫ 还要接上）</text>
<rect x="36.0" y="150.0" width="260.0" height="74.0" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">输入 x</text>
<text x="42.0" y="178.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">5×6</text>
<rect x="336.0" y="150.0" width="260.0" height="74.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="342.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">RMSNorm</text>
<text x="342.0" y="178.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">只改数值，不改形状</text>
<rect x="636.0" y="150.0" width="260.0" height="74.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="642.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">注意力</text>
<text x="642.0" y="178.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">⑥~⑩ 那一整套</text>
<rect x="936.0" y="150.0" width="260.0" height="74.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="942.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">+ 残差</text>
<text x="942.0" y="178.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">x + 注意力输出</text>
<text x="300.0" y="98.0" font-size="11" fill="#666666">残差旁路：把输入原封不动抄一份，加到输出上</text>
<rect x="36.0" y="280.0" width="810.0" height="73.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="294.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么要「加回去」（这是 Transformer 能堆深的关键）</text>
<text x="42.0" y="308.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 梯度能抄近路：反向传播时，x 这条直连路径让梯度不用穿过 32 层的矩阵乘，直接从山顶传到山脚。没有它，深层网络的梯度会衰减到几乎为 0。</text>
<text x="42.0" y="322.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 形状必须一致：所以前面每一步都得保持 (n×d) —— 这就是 ⑨ 里「n×d → n×n → n×d」那个往返的真正意义。</text>
<text x="42.0" y="337.20000000000005" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 语义上是「学增量」：每层只需学「在已有表示上加什么修正」，而不是从零重画。</text>
<rect x="866.0" y="280.0" width="798.0" height="59.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="872.0" y="294.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">注意：残差不是「加法层」</text>
<text x="872.0" y="308.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">它就是一次逐元素加法（element-wise add），没有参数、没有矩阵乘。</text>
<text x="872.0" y="322.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">所以如果你在权重文件里找「residual 的权重」，是找不到的——它不占任何参数。这一点经常被误解。</text>
<text x="36.0" y="424.0" font-size="11" fill="#333333">第二步：RMSNorm 手算一遍（4 维向量，数字刚好整除）</text>

<text x="682.0" y="566.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">这就是「均方」</text>
<rect x="36.0" y="590.0" width="260.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="604.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 开根号</text>

<rect x="296.0" y="666.0" width="380.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>

<rect x="36.0" y="748.0" width="810.0" height="73.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="762.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">和 LayerNorm 的区别（只需记一句）</text>
<text x="42.0" y="776.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">LayerNorm 会减去均值再除标准差；RMSNorm 不减均值，只除均方根。</text>
<text x="42.0" y="790.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">省掉减均值这一步，计算少一次、效果几乎不变——所以 Llama 系全用 RMSNorm。</text>
<text x="42.0" y="805.2" font-size="9" fill="#666666" font-family="Microsoft YaHei">权重文件里对应 input_layernorm.weight，形状就是 [d_model]（⑱）。</text>
<rect x="866.0" y="748.0" width="798.0" height="59.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="872.0" y="762.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么归一化是必需的</text>
<text x="872.0" y="776.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">32 层反复做矩阵乘，数值会一层层放大（或缩小）。归一化把每层输入重新拉回稳定量级，训练才不会发散。</text>
<text x="872.0" y="790.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">对比一下：如果不做归一化，第 32 层的输入可能比第 1 层大 100 倍，fp16 直接溢出成 inf。</text>

<text x="36.0" y="464.0" font-size="11" fill="#333333">第二步：现代模型不是「一上一下」，而是「两上一下」（SwiGLU）</text>
<rect x="36.0" y="516.0" width="300.0" height="74.0" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="42.0" y="530.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">X（5×4）</text>
<text x="42.0" y="544.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">每个 token 一个向量</text>
<rect x="376.0" y="516.0" width="380.0" height="74.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="382.0" y="530.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">gate 分支：W_gate（4×8）</text>
<text x="382.0" y="544.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">拉宽后过 SiLU（一种平滑的开关）</text>
<rect x="376.0" y="610.0" width="380.0" height="74.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="382.0" y="624.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">up 分支：W_up（4×8）</text>
<text x="382.0" y="638.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">只是拉宽，不过激活</text>
<rect x="796.0" y="562.0" width="340.0" height="74.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="802.0" y="576.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">逐元素相乘</text>
<text x="802.0" y="590.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">gate ⊙ up → 5×8</text>
<rect x="1176.0" y="562.0" width="300.0" height="74.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="1182.0" y="576.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">down：W_down（8×4）</text>
<text x="1182.0" y="590.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">压回 5×4</text>
<rect x="36.0" y="700.0" width="810.0" height="73.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="714.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么要 gate（这个「开关」在干嘛）</text>
<text x="42.0" y="728.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">SiLU(v) = v · sigmoid(v)：正数基本原样通过，负数被压到接近 0——相当于「按内容决定放行多少」。</text>
<text x="42.0" y="742.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">然后与 up 分支逐元素相乘，等于「用 gate 当阀门，去调节 up 的信号」。</text>
<text x="42.0" y="757.2" font-size="9" fill="#666666" font-family="Microsoft YaHei">实践上比单路的 ReLU 效果更好，代价是多一个矩阵。</text>
<rect x="866.0" y="700.0" width="798.0" height="73.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="872.0" y="714.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">参数量对比（为什么 FFN 是大头）</text>
<text x="872.0" y="728.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">单路（老式）：W₁(4×8) + W₂(8×4) = 64 个参数。SwiGLU（现代）：W_gate + W_up + W_down = 32+32+32 = 96 个。</text>
<text x="872.0" y="742.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">真实 Llama-7B：FFN 大约 4096×11008×3 ≈ 1.35 亿参数/层，而注意力只有 4096×4096×4 ≈ 6700 万——FFN 是注意力的两倍。</text>
<text x="872.0" y="757.2" font-size="9" fill="#666666" font-family="Microsoft YaHei">所以权重文件里 mlp.* 的张量加起来，比 self_attn.* 大得多（⑱ 会看到形状）。</text>

<text x="42.0" y="871.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">gate 与 up 被合并成一个矩阵乘：同文件 :95（self.gate_up_proj = MergedColumnParallelLinear(...)）——两个 4×8 拼成 4×16，一次算完再切开</text>

<p class="psub">前半页讲「层怎么堆」和「怎么变成词表分数」，后半页用 5 个候选词把「温度 / top-p / 贪心」的计算过程算给你看。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="1056"1704" height="799"1290" viewBox="0 0 1704 1290">
<rect width="1704" height="1290" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑬ 堆 32 层 + 输出头 + 采样：最后一个字是怎么被选出来的</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">前半页讲「层怎么堆」和「怎么变成词表分数」，后半页用 5 个候选词把「温度 / top-p / 贪心」的计算过程算给你看。</text>
<text x="36.0" y="104.0" font-size="11" fill="#333333">第一步：32 层是怎么堆的（每层权重都不一样）</text>
<rect x="36.0" y="156.0" width="180.0" height="66.0" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>

<text x="42.0" y="184.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">结构相同</text>
<rect x="246.0" y="156.0" width="180.0" height="66.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="252.0" y="170.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第 2 层</text>
<text x="252.0" y="184.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">结构相同</text>
<rect x="456.0" y="156.0" width="180.0" height="66.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="462.0" y="170.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">…</text>
<text x="462.0" y="184.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">结构相同</text>
<rect x="666.0" y="156.0" width="180.0" height="66.0" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="672.0" y="170.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第 32 层</text>
<text x="672.0" y="184.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">结构相同</text>
<rect x="900.0" y="156.0" width="300.0" height="66.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="906.0" y="170.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">最后一层输出</text>
<text x="906.0" y="184.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">仍是 5×4（形状不变）</text>
<rect x="1240.0" y="156.0" width="424.0" height="66.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1246.0" y="170.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">关键：32 层结构完全相同，但每层有自己的权重——所以参数量 = 单层 × 32。</text>
<text x="36.0" y="214.0" font-size="11" fill="#333333">第二步：最后做一次矩阵乘，把 4 维变成「词表大小」维的分数</text>
<rect x="36.0" y="266.0" width="810.0" height="73.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="280.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">5×4 · 4×32000 = 5×32000（形状最能说明问题）</text>
<text x="42.0" y="294.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">行还是 5 个 token，列变成 32000 个候选词的分数（logits）。</text>
<text x="42.0" y="308.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">只有最后一行的分数有用：因为我们要预测「第 5 个 token 之后是什么」，前面的行预测的是「第 1~4 个位置的下一个词」，训练时用得上，推理时不需要。</text>
<text x="42.0" y="323.20000000000005" font-size="9" fill="#666666" font-family="Microsoft YaHei">所以 LM Head 的权重是 (4096×32000)≈1.3 亿参数，和 FFN 一层差不多——它常常和词嵌入共用同一份权重（③ 讲过）。</text>
<rect x="866.0" y="266.0" width="798.0" height="59.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="872.0" y="280.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么要「取最后一个」</text>
<text x="872.0" y="294.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">自回归生成：前 4 个位置的下一个词是已知的（就是输入里的第 2~5 个 token），不需要预测。真正要预测的只有「第 5 个之后」。</text>
<text x="872.0" y="308.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">工程实现里这个「取最后一个」是一次索引切片，不额外算矩阵乘——但为了批处理，通常会取出每个请求各自的最后一个位置。</text>
<text x="36.0" y="414.0" font-size="11" fill="#333333">第三步：把 5 个候选词的分数变成概率（同一组分数，三种温度）</text>

<text x="766.0" y="592.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">温度到底在做什么</text>
<text x="766.0" y="606.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">softmax 前先把每个分数除以 T：T 小 → 分数差距被放大 → 概率更集中；T 大 → 差距被抹平 → 概率更平均。</text>
<text x="766.0" y="620.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">所以 T=0.5 时「苹果」几乎必被选中（0.865），T=2.0 时连「的天空」都有 0.16 的机会。</text>
<text x="766.0" y="635.2" font-size="9" fill="#666666" font-family="Microsoft YaHei">注意概率永远是小数：这一页出现的 0.865/0.166 在真实模型里是 float16/float32。</text>
<text x="36.0" y="714.0" font-size="11" fill="#333333">第四步：三种「选词策略」——同一张概率表，不同的抽法</text>
<rect x="36.0" y="766.0" width="520.0" height="59.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="780.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">贪心（greedy）</text>
<text x="42.0" y="794.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">直接取概率最大的那个（T=1.0 时选「苹果」）。</text>
<text x="42.0" y="808.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">优点：稳定、可复现；缺点：容易重复、念经。</text>
<rect x="576.0" y="766.0" width="520.0" height="73.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="582.0" y="780.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">top-p（核采样）</text>
<text x="582.0" y="794.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">把概率从大到小累加，累加到 p（如 0.9）就截断，只在剩下的几个词里抽。本页 T=1.0 时：0.844 + 0.114 = 0.958 &gt; 0.9，所以只在「苹果/香蕉」里抽——长尾（天空/因为/的）直接被砍掉。</text>
<text x="582.0" y="808.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">top-k 是它的兄弟：直接保留前 k 个。</text>
<rect x="1116.0" y="766.0" width="548.0" height="73.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="1122.0" y="780.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么需要随机性</text>

<text x="42.0" y="708.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">决定「网络长什么样」：层数、宽度、头数、词表大小。</text>
<text x="42.0" y="722.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">它很小，但没有它就无法解释权重——同一个 safetensors 文件，按不同 config 解释会得到完全不同的模型。</text>

<text x="582.0" y="708.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">决定「参数是多少」：几十亿个 fp16 浮点，按名字分组存放。</text>
<text x="582.0" y="722.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">它占了 99.9% 的体积，也是量化、分片、并发加载的战场（⑯⑰⑱）。</text>

<text x="1122.0" y="694.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 文本处理（tokenizer 等）</text>
<text x="1122.0" y="708.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">决定「文本怎么变成 id、id 怎么变回文本」，以及「对话怎么拼接」。</text>

<text x="42.0" y="672.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">Llama-2-7B：4096/32 = 128。</text>
<text x="42.0" y="686.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">注意有些模型（如 Qwen2 某些尺寸）会显式写 head_dim，此时它不一定等于 hidden/heads——这时要以字段为准。</text>

<text x="582.0" y="658.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">② n_kv_groups = num_heads / num_kv_heads</text>
<text x="582.0" y="672.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">Llama-2：32/32 = 1（普通 MHA）。Qwen2.5-7B：28/4 = 7（每 7 个 Q 头共用 1 份 K/V，GQA）。</text>
<text x="582.0" y="686.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">KV cache 的显存 ∝ num_kv_heads，所以这个比值直接决定能放多少并发。</text>
<rect x="1116.0" y="644.0" width="548.0" height="59.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1122.0" y="658.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ ffn 倍数 = intermediate_size / hidden_size</text>
<text x="1122.0" y="672.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">Llama-2：11008/4096 ≈ 2.69（不是整 4 倍！）。Qwen2.5：18944/3584 ≈ 5.29。</text>
<text x="1122.0" y="686.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">老教程常说「FFN 是 4 倍」，那是原始 Transformer 的设置；现代模型为了对齐总参数量会取非整数倍。</text>

<text x="258.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">每个张量的名字、dtype、形状、数据在文件里的起止偏移</text>
<text x="258.0" y="193.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">纯文本 JSON，按 8 字节对齐补空格</text>

<text x="972.0" y="284.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">怎么从这一段算出「读多少字节」</text>
<text x="972.0" y="298.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">4096×4096 个 fp16 = 16,777,216 × 2 字节 = 33,554,432 字节，正好是 offsets 的差值（33554432−0）。</text>
<text x="972.0" y="312.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">所以加载器只需要：读 JSON → 拿到 (offset, shape, dtype) → seek 到 8+N+offset，读 length 个字节，直接 memcpy 到显存。</text>
<text x="972.0" y="327.20000000000005" font-size="9" fill="#666666" font-family="Microsoft YaHei">这就是为什么 safetensors 加载快：没有解析、没有反序列化，纯内存拷贝。</text>
<rect x="966.0" y="440.0" width="698.0" height="59.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="972.0" y="454.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么它不是「一整块连续」</text>
<text x="972.0" y="468.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">张量的顺序由保存时的遍历顺序决定，加载器不应该假设任何顺序——一切以 JSON 里的 offsets 为准。</text>
<text x="972.0" y="482.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">这也解释了为什么「把两个 safetensors 直接拼起来」不叫合并：你必须重算所有 offsets（⑰ 的分片就是这么产生的）。</text>

<text x="36.0" y="62.0" font-size="11" fill="#666666">单个 safetensors 文件太大会撑爆内存、也无法并行下载，所以按张量切成几片，再用一份 index.json 记录「谁在哪」。这一页讲清它和「张量并行切分」的区别。</text>

<text x="42.0" y="270.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">切分规则：按张量累加，到阈值就换新文件</text>
<text x="42.0" y="284.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">保存时按顺序累加每个张量的字节数，超过 max_shard_size（HF 默认 5 GB）就开新文件。不会把一个张量拆到两个文件里。</text>
<text x="42.0" y="298.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">所以 4 片的大小不一定完全相等（3.4/3.4/3.4/3.3 之类）。</text>
<rect x="866.0" y="256.0" width="798.0" height="52.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="872.0" y="270.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么不用一个 14 GB 的文件</text>
<text x="872.0" y="284.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 下载/校验可以并行、断点续传；② 加载时可以只读需要的张量；③ 单个文件过大在某些文件系统/传输协议上有上限；④ 便宜：多进程能同时读不同分片。</text>

<text x="932.0" y="464.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">加载器怎么用它</text>
<text x="932.0" y="478.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 读 index.json 拿到 weight_map；② 按「当前层需要哪些张量」把请求分组到文件；③ 对每个文件只 seek 需要的偏移（⑯）。</text>
<text x="932.0" y="492.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">所以加载速度取决于「同时打开几个文件」和「是否顺序读」，而不是文件个数本身。</text>
<rect x="926.0" y="566.0" width="738.0" height="59.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="932.0" y="580.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">常见误解：分片 ≠ 张量并行切分</text>
<text x="932.0" y="594.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">分片（shard）只是物理存储的切法，模型还是一份；张量并行（TP）是把同一个矩阵按维度切开分发到多张卡，每张卡只持有一部分。</text>
<text x="932.0" y="608.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">所以「4 个分片」和「4 张卡」毫无关系——一个 4 分片的模型可以在 1 张卡上跑，也可以在 8 张卡上用 TP=8 跑（这时每张卡只加载自己那份切片）。</text>

<p class="ptitle">⑲ tokenizer 与模板：文本侧的三个文件 + 一个模板</p>
<p class="psub">权重决定「模型懂什么」，这几个文件决定「文本怎么进去、怎么出来」。它们加起来不到 10 MB，却是最常见的踩坑来源。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="1056"1704" height="895"1444" viewBox="0 0 1704 1444">
<rect width="1704" height="1444" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑲ tokenizer 与模板：文本侧的三个文件 + 一个模板</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">权重决定「模型懂什么」，这几个文件决定「文本怎么进去、怎么出来」。它们加起来不到 10 MB，却是最常见的踩坑来源。</text>
<text x="36.0" y="104.0" font-size="11" fill="#333333">第一步：三个文件各管一件事（缺一个就跑不起来）</text>
<rect x="36.0" y="150.0" width="520.0" height="73.0" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">① tokenizer.json（或 vocab.json + merges.txt）</text>
<text x="42.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">规则本体：词表（每行一个 token 片段）+ BPE 合并优先级表。</text>
<text x="42.0" y="192.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">新版 HF 把它打包成一个 tokenizer.json；老模型（GPT-2 系）还是两个文本文件。</text>
<text x="42.0" y="207.2" font-size="9" fill="#666666" font-family="Microsoft YaHei">它就是 ② 里「切成 token 再查 id」的那张表。</text>
<rect x="576.0" y="150.0" width="520.0" height="73.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="582.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">② tokenizer_config.json</text>
<text x="582.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">行为配置：用什么分词器类、大小写、特殊 token 的名字、要不要加 BOS、以及 chat_template（可内嵌也可单独 .jinja）。</text>
<text x="582.0" y="192.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">这一份最容易出事：字段名改了，tokenizer 就会把文本切错。</text>
<rect x="1116.0" y="150.0" width="548.0" height="59.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1122.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ special_tokens_map.json</text>
<text x="1122.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">名字 ↔ 特殊 token 字符串：bos_token / eos_token / pad_token / unk_token 各是哪个字符串。</text>
<text x="1122.0" y="192.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">它们的 id 不在这个文件里，而在 tokenizer 本体里（查表得到）。</text>
<text x="36.0" y="264.0" font-size="11" fill="#333333">第二步：一句话从字符串到 id 的完整过程（含特殊 token）</text>

<text x="42.0" y="324.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">原始文本</text>
<rect x="378.0" y="310.0" width="1286.0" height="56.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="384.0" y="324.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">「你好，帮我写首诗」</text>
<rect x="36.0" y="374.0" width="330.0" height="56.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="388.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">套模板（chat_template）</text>
<rect x="378.0" y="374.0" width="1286.0" height="56.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="384.0" y="388.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">user⏎你好，帮我写首诗⏎assistant⏎</text>
<rect x="36.0" y="438.0" width="330.0" height="56.0" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="42.0" y="452.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">切 token（BPE）</text>
<rect x="378.0" y="438.0" width="1286.0" height="56.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="384.0" y="452.0" font-size="10" fill="#333333" font-family="Microsoft YaHei"> ｜ user ｜ 你好 ｜ ， ｜ 帮我 ｜ 写 ｜ 首诗 ｜ …</text>
<rect x="36.0" y="502.0" width="330.0" height="56.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="516.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">查词表换 id</text>
<rect x="378.0" y="502.0" width="1286.0" height="56.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>

<text x="42.0" y="580.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">加 BOS/EOS（视配置）</text>
<rect x="378.0" y="566.0" width="1286.0" height="56.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="384.0" y="580.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">开头加 bos_token_id，结尾留给模型生成</text>
<rect x="36.0" y="660.0" width="810.0" height="73.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="674.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">chat_template 为什么能改变「模型性格」</text>
<text x="42.0" y="688.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">同一个模型权重，用不同模板拼出来的字符串不一样 → token 序列不一样 → 输出风格明显不同。</text>
<text x="42.0" y="702.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">比如少写 assistant，模型就不知道「该轮到我说话了」，可能继续扮演用户。</text>
<text x="42.0" y="717.2" font-size="9" fill="#333333" font-family="Microsoft YaHei">这就是「同一个模型在 A 框架好用、在 B 框架胡说」的最常见原因。</text>
<rect x="866.0" y="660.0" width="798.0" height="59.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="872.0" y="674.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">generation_config.json 在这里的角色</text>
<text x="872.0" y="688.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">它不参与分词，而是给「生成」提供默认参数：temperature、top_p、top_k、max_new_tokens、eos_token_id、repetition_penalty。</text>
<text x="872.0" y="702.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">⑬ 里那些默认值就来自它；命令行/接口传参会覆盖它。</text>

<text x="42.0" y="1112.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">词表比 vocab_size 大 → 分词后出现越界 id（运行时崩）；比 vocab_size 小 → 有一批 id 永远用不到（浪费显存，但不崩）。</text>
<text x="42.0" y="1126.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">换 tokenizer（比如给模型加新词）时，必须同时改权重里的 embed_tokens / lm_head，这就是「词表扩充」要做的事。</text>

<p class="ptitle">⑳ GGUF 与量化：把 fp16 压成 4 bit，省下 3/4 的空间</p>
<p class="psub">前七页讲的都是 fp16 的 HF 权重。但你在本地跑模型时常见的是 4 GB 的 .gguf 文件——这一页讲清量化在做什么、GGUF 是什么、代价是什么。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="1056"1704" height="803"1296" viewBox="0 0 1704 1296">
<rect width="1704" height="1296" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑳ GGUF 与量化：把 fp16 压成 4 bit，省下 3/4 的空间</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">前七页讲的都是 fp16 的 HF 权重。但你在本地跑模型时常见的是 4 GB 的 .gguf 文件——这一页讲清量化在做什么、GGUF 是什么、代价是什么。</text>
<text x="36.0" y="104.0" font-size="11" fill="#333333">第一步：量化 = 用更少的比特表示同一批数（不是删参数）</text>
<rect x="36.0" y="150.0" width="520.0" height="59.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">fp16：每个数 16 bit</text>
<text x="42.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">表示范围大、精度高，但占地方。7B 参数 × 2 字节 ≈ 14 GB。</text>
<text x="42.0" y="192.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">这是 HuggingFace 上的默认格式（⑯ 的 safetensors）。</text>
<rect x="576.0" y="150.0" width="520.0" height="52.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="582.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">int8：每个数 8 bit</text>
<text x="582.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">把连续的浮点值「装进 256 个桶」，再记一个缩放系数。7B ≈ 7 GB，精度损失很小。</text>
<rect x="1116.0" y="150.0" width="548.0" height="52.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="1122.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">4 bit：每个数 4 bit</text>
<text x="1122.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">只有 16 个桶——单个数根本不够用，于是一组数共享一个缩放系数（这叫 block-wise 量化）。7B ≈ 4 GB。</text>
<text x="36.0" y="274.0" font-size="11" fill="#333333">第二步：一个 8 个数的分块，怎么变成 8 个 4bit 整数 + 1 个缩放系数</text>

<text x="42.0" y="446.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">缩放系数</text>
<rect x="170.0" y="432.0" width="764.0" height="42.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="176.0" y="446.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">scale = 0.07（这一组里绝对值最大的 0.87 ÷ 12 ≈ 0.07）</text>
<rect x="950.0" y="432.0" width="714.0" height="42.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="956.0" y="446.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">还原：真实值 ≈ 整数 × scale</text>
<text x="36.0" y="502.0" font-size="11" fill="#666666">8 个数 × 4 bit = 32 bit + 1 个 scale（16 bit）= 48 bit；而 fp16 需要 128 bit。压缩比约 2.7 倍（分块越大越省，但精度越差——这就是 Q4_K_S / Q4_K_M 之类名字的区别）。</text>
<text x="36.0" y="504.0" font-size="11" fill="#333333">第三步：GGUF 是「一个文件装下所有东西」的格式</text>
<rect x="36.0" y="550.0" width="200.0" height="40.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>

<rect x="936.0" y="550.0" width="700.0" height="40.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>

<rect x="36.0" y="590.0" width="200.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="604.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">文件个数</text>
<rect x="236.0" y="590.0" width="700.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>

<rect x="936.0" y="590.0" width="700.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="942.0" y="604.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">通常 一个 .gguf</text>
<rect x="36.0" y="630.0" width="200.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="644.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">元数据</text>
<rect x="236.0" y="630.0" width="700.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="242.0" y="644.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">散在 config.json / tokenizer_config.json 等</text>
<rect x="936.0" y="630.0" width="700.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="942.0" y="644.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">全部塞进文件头的 KV 段（层数、头数、词表、模板…）</text>
<rect x="36.0" y="670.0" width="200.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="684.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">量化</text>
<rect x="236.0" y="670.0" width="700.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="242.0" y="684.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">单独做（如 GPTQ/AWQ 的 4bit 权重 + scales 张量）</text>
<rect x="936.0" y="670.0" width="700.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="942.0" y="684.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">格式原生支持几十种量化类型，文件名就写清（Q4_K_M）</text>
<rect x="36.0" y="710.0" width="200.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="724.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">谁在用</text>
<rect x="236.0" y="710.0" width="700.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="242.0" y="724.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">HuggingFace / vLLM / transformers 生态</text>
<rect x="936.0" y="710.0" width="700.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="942.0" y="724.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">llama.cpp / Ollama 生态；vLLM 也能读（部分支持）</text>
<rect x="36.0" y="750.0" width="200.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="764.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">优点</text>
<rect x="236.0" y="750.0" width="700.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="242.0" y="764.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">生态标准、加载快、可 mmap 切片</text>
<rect x="936.0" y="750.0" width="700.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="942.0" y="764.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">单文件好分发；CPU/混合推理友好；体积小</text>
<rect x="36.0" y="790.0" width="200.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="804.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代价</text>
<rect x="236.0" y="790.0" width="700.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="242.0" y="804.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">体积大（fp16）</text>
<rect x="936.0" y="790.0" width="700.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="942.0" y="804.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">精度有损；量化内核与硬件绑定，GPU 上未必更快</text>
<rect x="36.0" y="866.0" width="810.0" height="73.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="880.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">量化到底损失了什么</text>
<text x="42.0" y="894.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 数值精度：0.87 变成 12×0.07=0.84，误差 3%；一组里的小数值误差可能到 10%。</text>
<text x="42.0" y="908.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 长尾词：罕见词、代码符号、数字推理最容易先崩——因为它们的权重本来就在分布的边角。</text>
<text x="42.0" y="923.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 不是线性的：4bit 通常只掉 1~3 分（常识问答几乎无损），但 2bit 会断崖式下降。</text>
<rect x="866.0" y="866.0" width="798.0" height="73.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="872.0" y="880.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么 GPU 上 4bit 不一定更快</text>
<text x="872.0" y="894.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">量化的收益是显存（能放更大模型/更长上下文）与带宽（搬的字节少），不是算力。</text>
<text x="872.0" y="908.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">解码前要先反量化回 fp16 才能做矩阵乘，这步有额外开销；所以小 batch 时收益明显，大 batch 时要专门的量化 kernel 才划算。</text>
<text x="872.0" y="923.2" font-size="9" fill="#666666" font-family="Microsoft YaHei">vLLM 里有专门的量化层实现（layers/quantization/ 目录下按方案分子目录）。</text>
<rect x="36.0" y="1066.0" width="1628.0" height="100.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1080.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点</text>
<text x="42.0" y="1094.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">GGUF 的解析（把单文件里的元数据/tensor 信息读出来）：vllm/transformers_utils/gguf_utils.py</text>
<text x="42.0" y="1107.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">量化方案的实现（不同 scheme 各自的 Linear 与反量化 kernel）：vllm/model_executor/layers/quantization/ 目录（按方案名分子目录）</text>
<text x="42.0" y="1121.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">加载时怎么选：vllm/model_executor/model_loader/default_loader.py 会根据 config/权重的量化信息选择对应的 QuantizeMethodBase</text>

<text x="42.0" y="550.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">1. 参数规模对得上吗？</text>
<rect x="508.0" y="536.0" width="1156.0" height="52.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="514.0" y="550.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">hidden² × 4 + hidden × ffn × 3 再乘层数 ≈ 模型名的 B 数（⑮）</text>
<rect x="36.0" y="596.0" width="460.0" height="52.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="610.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">2. 文件总大小对得上吗？</text>
<rect x="508.0" y="596.0" width="1156.0" height="52.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="514.0" y="610.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">参数量 × 每参数字节（fp16=2、q4≈0.5）（⑯⑳）</text>
<rect x="36.0" y="656.0" width="460.0" height="52.0" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="42.0" y="670.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">3. 词表对得上吗？</text>
<rect x="508.0" y="656.0" width="1156.0" height="52.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="514.0" y="670.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">vocab_size = 词表条目数 = embed_tokens 第 0 维（⑲）</text>
<rect x="36.0" y="716.0" width="460.0" height="52.0" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="42.0" y="730.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">4. 头数对得上吗？</text>
<rect x="508.0" y="716.0" width="1156.0" height="52.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="514.0" y="730.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">num_heads × head_dim = hidden_size；GQA 时 kv 头更少（⑩⑮）</text>
<rect x="36.0" y="776.0" width="460.0" height="52.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="790.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">5. 模板对得上吗？</text>

<text x="36.0" y="820.0" font-size="11" fill="#333333">第四步：21 页索引（想复习哪一块就翻回去）</text>
<rect x="36.0" y="866.0" width="1628.0" height="66.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="880.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">A · Transformer 怎么算</text>
<text x="42.0" y="894.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 总览　② 分词　③ 词嵌入　④ 位置编码 RoPE　⑤ 矩阵乘（线性层）　⑥ QKV 投影　⑦ 打分 Q·Kᵀ　⑧ softmax　⑨ 加权求和 P·V　⑩ 多头　⑪ 残差+RMSNorm　⑫ FFN/SwiGLU　⑬ 堆叠+输出头+采样</text>
<rect x="36.0" y="942.0" width="1628.0" height="66.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="956.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">B · 模型文件结构</text>
<text x="42.0" y="970.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">⑭ 目录全景　⑮ config.json　⑯ safetensors 字节布局　⑰ 分片与 index　⑱ 权重名→形状　⑲ tokenizer 与模板　⑳ GGUF 与量化　㉑ 本页</text>
<rect x="36.0" y="1018.0" width="1628.0" height="66.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1032.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">三个「一以贯之」的数字</text>
<text x="42.0" y="1046.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">本套全程用 5 个 token × 4 维（⑩ 换成 6 维）演示；换成真实模型只需把 4 换成 4096、5 换成你的 token 数——形状规则完全不变</text>
<rect x="36.0" y="1094.0" width="1628.0" height="66.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1108.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">数字类型的规律</text>
<text x="42.0" y="1122.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">整数：token id、层号、形状、块号｜ 小数：权重、激活、分数、概率</text>
<rect x="36.0" y="1176.0" width="1628.0" height="74.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1190.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">最后一句：Transformer 没有魔法——它只是「查表、乘矩阵、按权重求和、再乘矩阵」重复几十次；模型文件也没有魔法——它只是「一份 JSON 说明书 + 一大堆按名字排好的浮点数」。把这两句话落实到形状和字节上，你就已经超过大多数「会用但说不清」的人了。</text>
