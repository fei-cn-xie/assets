<figure id="p0">
<p class="ptitle">① 什么是 MoE：把一层 FFN 换成「很多个 FFN + 一个门卫」</p>
<p class="psub">一句话：dense 模型每层只有一个 FFN，所有 token 都走它；MoE 把这一层换成 N 个 FFN（专家）+ 一个路由器（门卫），每个 token 只被送进其中 top-k 个。于是总参数变多，但每个 token 的计算量几乎不变。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="793"1280" viewBox="0 0 1576 1280">
<rect width="1576" height="1280" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">① 什么是 MoE：把一层 FFN 换成「很多个 FFN + 一个门卫」</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：dense 模型每层只有一个 FFN，所有 token 都走它；MoE 把这一层换成 N 个 FFN（专家）+ 一个路由器（门卫），每个 token 只被送进其中 top-k 个。于是总参数变多，但每个 token 的计算量几乎不变。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：一张对照图（左边 dense，右边 MoE）</text>
<rect x="36.0" y="150.0" width="690.0" height="168.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">dense 层</text>
<text x="42.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="193.7" font-size="10" fill="#333333" font-family="Microsoft YaHei">　　输入 x（每个 token 一个向量）</text>
<text x="42.0" y="207.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">　　　　↓</text>
<text x="42.0" y="222.04999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">　　升维 → 非线性 → 降维（一个大 FFN）</text>
<text x="42.0" y="236.89999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">　　　　↓</text>
<text x="42.0" y="251.74999999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei">　　输出 y</text>
<text x="42.0" y="266.59999999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="281.45" font-size="11" fill="#333333" font-family="Microsoft YaHei">所有 token 都走同一条路；参数量 = 这一个 FFN 的大小。</text>
<rect x="766.0" y="150.0" width="694.0" height="168.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="772.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">MoE 层</text>
<text x="772.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="772.0" y="193.7" font-size="10" fill="#333333" font-family="Microsoft YaHei">　　输入 x</text>
<text x="772.0" y="207.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">　　　　↓</text>
<text x="772.0" y="222.04999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">　　门卫：算出「该去哪些专家」+「权重多少」</text>
<text x="772.0" y="236.89999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">　　　　↓</text>
<text x="772.0" y="251.74999999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei">　　只把 x 送进 top-k 个专家（其余专家这一步不参与）</text>
<text x="772.0" y="266.59999999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei">　　　　↓</text>
<text x="772.0" y="281.45" font-size="11" fill="#333333" font-family="Microsoft YaHei">　　把 k 个结果按门卫给的权重加权相加 → y</text>
<text x="772.0" y="296.3" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="772.0" y="311.15000000000003" font-size="11" fill="#333333" font-family="Microsoft YaHei">不同 token 走不同专家；参数量 = 全部专家之和。</text>
<text x="36.0" y="340.0" font-size="11" fill="#333333">第二步：三个必须分清的量（MoE 全部反直觉都来自这里）</text>
<rect x="36.0" y="358.0" width="460.0" height="116.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="372.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="382.0" font-size="11" fill="#333333">总参数量</text>
<text x="46.0" y="408.0" font-size="11" fill="#333333">N 个专家之和（模型“看起来很大”）</text>
<rect x="508.0" y="358.0" width="460.0" height="116.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="514.0" y="372.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="518.0" y="382.0" font-size="11" fill="#333333">激活参数量</text>
<text x="518.0" y="408.0" font-size="11" fill="#333333">每 token 只走 k 个（计算量“其实不大”）</text>
<rect x="980.0" y="358.0" width="460.0" height="116.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="986.0" y="372.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="990.0" y="382.0" font-size="11" fill="#333333">显存占用</text>
<text x="990.0" y="408.0" font-size="11" fill="#333333">全部专家都要驻留（推理端最痛的一条）</text>
<rect x="36.0" y="514.0" width="1424.0" height="132.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="528.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第三步：一个算例（用相对量级，不做绝对参数承诺）</text>
<text x="42.0" y="542.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">设 dense 模型某层 FFN 的参数为 1 份。换成 64 个专家、每 token 走 2 个：</text>
<text x="42.0" y="556.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 总参数 ≈ 64 份 → 模型“看起来”大了 64 倍；</text>
<text x="42.0" y="571.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 每 token 的计算量 ≈ 2 份 → 只比原来多 1 倍（而不是 64 倍）；</text>
<text x="42.0" y="586.0500000000001" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 显存 仍要放下 64 份 → 所以 MoE 是「用显存换参数量」的一条路。</text>
<text x="42.0" y="600.9000000000001" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">这就是为什么 MoE 模型的「参数量」与「能跑多快」几乎无关，而和「显存够不够」强相关。</text>
<rect x="36.0" y="686.0" width="700.0" height="152.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="700.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="708.0" font-size="11" fill="#333333">它解决了什么</text>
<text x="46.0" y="734.0" font-size="11" fill="#333333">在参数总量不变的前提下，想让模型「知道得更多」→ 加专家；在计算量不变的前提下，想让推理「不变慢」→ 每 token 只走 k 个。所以 MoE 是「容量/算力比」最高的一种结构（这也是它在大模型上流行的原因）。</text>
<rect x="796.0" y="686.0" width="664.0" height="152.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="802.0" y="700.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="708.0" font-size="11" fill="#333333">它带来了什么新问题</text>
<text x="806.0" y="734.0" font-size="11" fill="#333333">① 显存：全部专家都要驻留 → 单卡放不下 → 要切（专家并行）；② 通信：token 要去别的卡上的专家 → 要搬 token（all-to-all）；③ 负载：热门专家忙死、冷门专家闲着 → 要均衡（训练期辅助损失、推理期换位）。后面 9 页就是把这三个问题逐个讲清。</text>
<rect x="36.0" y="878.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="892.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：MoE 的结构说清了。下一步（②）跟着一个 token 走一遍——它在一层 MoE 里到底被怎么处理。</text>
<rect x="36.0" y="954.0" width="1424.0" height="104.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="968.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="982.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">MoE 层的实现入口：vllm/model_executor/layers/fused_moe/layer.py（FusedMoE 类）</text>
<text x="42.0" y="995.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">配置字段（专家数 / top-k / 中间维度）：见 ② 页与 moe-math 页汇总；本仓模型的 config.json 里对应 n_routed_experts / num_experts_per_tok / moe_intermediate_size</text>
<text x="42.0" y="1009.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">「dense FFN vs MoE」在模型代码里的分叉：各模型文件按 config 决定用 MLP 还是 FusedMoE（例如 deepseek 系模型文件）</text>
<rect x="36.0" y="1090.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1104.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：MoE = 很多专家 + 一个门卫 + 每 token 只走 top-k；总参数按「专家数」涨，计算量按「top-k」涨，显存也按「专家数」涨——后两条就是推理侧所有麻烦的来源。</text>
<text x="36.0" y="1196.0" font-size="11" fill="#333333">图例</text>
<rect x="148.0" y="1179.0" width="120.0" height="26.0" rx="4" fill="#eceff1" stroke="#607d8b"/>

<div class="concl"><b>一句话结论　</b>dense 模型每层只有一个 FFN，所有 token 都走它；MoE 把这一层换成 N 个 FFN（专家）+ 一个路由器（门卫），每个 token 只被送进其中 top-k 个。于是总参数变多，但每个 token 的计算量几乎不变。</div>

<figure id="p1">
<p class="ptitle">② 一个 token 走完一层 MoE：六步</p>
<p class="psub">一句话：门卫打分 → 取 top-k → 按专家把 token 重排到一起 → 每个专家各算一段 → 散射回原位 → 按门卫权重加权求和；再和「共享专家」的输出相加。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="804"1298" viewBox="0 0 1576 1298">
<rect width="1576" height="1298" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">② 一个 token 走完一层 MoE：六步</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：门卫打分 → 取 top-k → 按专家把 token 重排到一起 → 每个专家各算一段 → 散射回原位 → 按门卫权重加权求和；再和「共享专家」的输出相加。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">第一步：六步（前三步决定「去哪」，后三步是真正的计算）</text>
<rect x="36.0" y="146.0" width="224.0" height="92.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 门卫打分</text>
<text x="42.0" y="174.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">hidden → N 个分数</text>
<rect x="272.0" y="146.0" width="224.0" height="92.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="278.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 取 top-k</text>
<text x="278.0" y="174.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">只留分数最高的 k 个</text>
<rect x="508.0" y="146.0" width="224.0" height="92.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="514.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 重排</text>
<text x="514.0" y="174.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">按专家把 token 聚到一起</text>
<rect x="744.0" y="146.0" width="224.0" height="92.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="750.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">④ 分组矩阵乘</text>
<text x="750.0" y="174.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">每个专家各算自己那段</text>
<rect x="980.0" y="146.0" width="224.0" height="92.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="986.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑤ 散射回原位</text>
<text x="986.0" y="174.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">把结果还原到 token 顺序</text>
<rect x="1216.0" y="146.0" width="224.0" height="92.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="1222.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑥ 加权求和</text>
<text x="1222.0" y="174.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">k 个结果按门卫权重相加</text>
<text x="36.0" y="262.0" font-size="11" fill="#333333">第二步：为什么非要「重排」（这一步是 MoE 实现里最关键的设计）</text>
<rect x="36.0" y="278.0" width="700.0" height="188.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="292.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">不重排会怎样</text>
<text x="42.0" y="306.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">假设有 5 个 token、8 个专家，每个 token 要去 2 个。于是有 10 个「(token, 专家)」对，但它们散落在不同位置。</text>
<text x="42.0" y="320.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">如果按 token 顺序一个个调专家函数：</text>
<text x="42.0" y="335.20000000000005" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 每次只有 1 行输入 → 矩阵乘退化成向量乘，算力极度浪费；</text>
<text x="42.0" y="350.05000000000007" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 相邻两个 token 可能用同一个专家，却要再调一次。</text>
<text x="42.0" y="364.9000000000001" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">结果：同一个专家被调用很多次，每次只算很少的行。</text>
<rect x="766.0" y="278.0" width="694.0" height="188.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="772.0" y="292.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">重排之后</text>
<text x="772.0" y="306.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">把所有「要去专家 i」的行搬到一起、连续存放，形成一张 token 数 × k 行的密集表。</text>
<text x="772.0" y="320.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">然后每个专家只调一次，输入是「连续的一段行」。</text>
<text x="772.0" y="335.20000000000005" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 每段的行数 = 这个专家分到多少 token（各段不同）；</text>
<text x="772.0" y="350.05000000000007" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 这就是「分组矩阵乘」：一次提交里，每个专家各有一段自己的 M/N/K。</text>
<text x="772.0" y="364.9000000000001" font-size="11" fill="#1c7c54" font-family="Microsoft YaHei">算完再散射回原来的位置，保证输出顺序与输入一致。</text>
<text x="36.0" y="490.0" font-size="11" fill="#333333">第三步：两个容易混的细节</text>
<rect x="36.0" y="506.0" width="700.0" height="168.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="520.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="528.0" font-size="11" fill="#333333">① 「行数」是 token 数 × k，不是 token 数</text>
<text x="46.0" y="554.0" font-size="11" fill="#333333">重排后的总行数 = token 数 × k（每个 token 在 k 个专家各占一行）。推理侧这里不按「容量因子」截断（不做 token drop）——所以行数就是 token×k，不会有 token 被丢弃。（容量因子/token drop 是训练期的概念，见 ⑦ 页的说明。）</text>
<rect x="796.0" y="506.0" width="664.0" height="168.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="802.0" y="520.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="528.0" font-size="11" fill="#333333">② 加权求和用的权重来自门卫</text>
<text x="806.0" y="554.0" font-size="11" fill="#333333">门卫给出的 k 个分数，通常会归一化后再作为权重。所以「同一个 token 在不同专家里的结果」是加权相加，不是简单平均。这也是「为什么叫混合专家」的字面含义。</text>
<rect x="36.0" y="714.0" width="1424.0" height="116.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="728.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第四步：和 dense FFN 的差别只在「多了门卫与重排」，但代价全在这两处</text>
<text x="42.0" y="742.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">dense：一次 MLP，输入是「全部 token」的连续矩阵。</text>
<text x="42.0" y="756.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">MoE：先算一次小的线性层（门卫，hidden→N），再做两次数据搬运（重排/散射），最后才是 k 段 GEMM。</text>
<text x="42.0" y="771.2" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">所以 MoE 在大 batch（prefill）时很划算——GEMM 喂满了；而小 batch（decode）时，搬运与固定开销占比被放大，这正是 ③ 页要算的账。</text>
<rect x="36.0" y="870.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="884.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：结构清楚了。下一步（③）算三个账——显存、通信、负载，看看 MoE 到底「贵」在哪。</text>
<rect x="36.0" y="946.0" width="1424.0" height="128.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="960.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="974.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">门卫（router）：一个 hidden→N 的线性层，输出 router_logits（token, N）：vllm/model_executor/models/hy_v3.py:155-162、:211</text>
<text x="42.0" y="987.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">MoE 层装配（专家数 / top-k / 中间维）：同文件 :183-201</text>
<text x="42.0" y="1001.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">重排与散射的昇腾实现：vllm-ascend/vllm_ascend/ops/fused_moe/token_dispatcher.py:592（permute）、:430-433 与 :715-719（unpermute）、:217-227（两者分工的注释）</text>
<text x="42.0" y="1016.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">重排行数 = token×top_k：同文件 :406（active_num=num_tokens*top_k）、:616-620（num_out_tokens = topk_ids.numel()，无容量截断）</text>
<text x="42.0" y="1031.55" font-size="11" fill="#333333" font-family="Microsoft YaHei">分组矩阵乘的 shape 语义：vllm/_custom_ops.py:1094（problem_sizes 每专家一组 M,N,K）</text>
<text x="42.0" y="1046.3999999999999" font-size="11" fill="#333333" font-family="Microsoft YaHei">每专家权重形状：vllm/model_executor/layers/fused_moe/experts/nvfp4_emulation_moe.py:438-439</text>
<rect x="36.0" y="1108.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1122.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：MoE 一层的计算其实只有「一次小线性 + k 段 GEMM」，但中间夹了两次数据搬运（重排 / 散射）——批大时搬运摊薄、批小时搬运变主成本，这是 MoE 推理好坏的枢纽。</text>

<p class="ptitle">③ MoE 推理的三本账：显存、通信、负载——以及 decode 为什么更吃亏</p>
<p class="psub">一句话：MoE 把 compute 省下来了，代价转移到了三处：全部专家都要驻留显存、token 要跨卡搬（all-to-all）、热门专家会把某个卡拖成瓶颈。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="865"1396" viewBox="0 0 1576 1396">
<rect width="1576" height="1396" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">③ MoE 推理的三本账：显存、通信、负载——以及 decode 为什么更吃亏</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：MoE 把 compute 省下来了，代价转移到了三处：全部专家都要驻留显存、token 要跨卡搬（all-to-all）、热门专家会把某个卡拖成瓶颈。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">第一步：三本账（每本都有本仓可查的数字或注释）</text>
<rect x="36.0" y="146.0" width="460.0" height="210.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="168.0" font-size="11" fill="#333333">账一：显存</text>
<text x="46.0" y="194.0" font-size="11" fill="#333333">全部专家都要驻留——切到多卡只是「摊开」，总量不降。本仓有一个很硬的说法：专家约占权重字节的 85~90%。所以 MoE 模型的显存几乎全花在专家上；而 KV cache 只能吃剩下的零头（与入门套 ⑦ 的显存账一致）。</text>
<rect x="518.0" y="146.0" width="460.0" height="210.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="524.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="528.0" y="168.0" font-size="11" fill="#333333">账二：通信</text>
<text x="528.0" y="194.0" font-size="11" fill="#333333">专家切到多卡后，token 要去别的卡上的专家 → 专家计算前后各一次 all-to-all。搬的内容 = 「token 数 × k」行 hidden。关键：接收缓冲按最坏情况分配（每卡最大批 × EP 规模），所以小 batch 也要付满额开销。</text>
<rect x="1000.0" y="146.0" width="460.0" height="210.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="1006.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1010.0" y="168.0" font-size="11" fill="#333333">账三：负载</text>
<text x="1010.0" y="194.0" font-size="11" fill="#333333">热门专家忙死、冷门专家闲着——本仓文档原文说实际分布可能高度偏斜。后果：某个 EP rank 成了瓶颈，其他 rank 在等它。性能模型里甚至留了个注释：FIXME: Assume perfect load balancing for now——即「目前只能假设负载均衡」。</text>
<text x="36.0" y="380.0" font-size="11" fill="#333333">第二步：decode 为什么比 prefill 更吃亏（四条，逐条给依据）</text>
<rect x="36.0" y="396.0" width="1424.0" height="140.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="410.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 要读的专家权重数量随批大小变化：本仓性能模型里，dense 每步读「整份 FFN 权重」（与 token 数无关）；MoE 每步读的是 min(token 数 × k, 专家总数) 份。批大时摊薄，批小时反而读得零碎。</text>
<text x="42.0" y="423.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 访存不连续：专家权重是分散的多块，单次能读到的有效行少，带宽利用率低。</text>
<text x="42.0" y="438.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 两次 all-to-all 的固定开销：小 batch 时通信延迟盖过计算时间。</text>
<text x="42.0" y="453.20000000000005" font-size="11" fill="#333333" font-family="Microsoft YaHei">④ 共享专家不受稀疏保护：它是 dense 的，每个 token 必走、每步必读（见 ④ 页）。</text>
<rect x="36.0" y="576.0" width="1424.0" height="128.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="590.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第三步：纠正一个常见推论（这条很重要）</text>
<text x="42.0" y="604.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">常见说法：「MoE 每 token 只走 k 个专家，所以 decode 一定比 dense 省」。</text>
<text x="42.0" y="618.35" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">这个推论不成立。因为 专家总参数量远大于 dense FFN（本仓默认配置里专家中间维与 dense 宽度差近 9 倍，总专家数上百），而 decode 的批很小 —— min(批 × k, 专家数) 往往仍远大于 1，加上 attention 与共享专家照样要读，实际读权重总量通常仍显著高于同 hidden 的 dense 层。</text>
<text x="42.0" y="633.2" font-size="11" fill="#666666" font-family="Microsoft YaHei">（前半句的依据是本仓性能模型公式；「通常仍高于 dense」是通用结论，图上标为推导。）</text>
<text x="36.0" y="728.0" font-size="11" fill="#333333">第四步：三本账各自对应的解法（后面几页逐个展开）</text>

<text x="42.0" y="830.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">通信贵</text>
<rect x="256.0" y="816.0" width="820.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="262.0" y="830.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">按阶段选通信实现（prefill 走高吞吐、decode 走低延迟）</text>
<rect x="1076.0" y="816.0" width="384.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1082.0" y="830.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑥ 页</text>
<rect x="36.0" y="852.0" width="220.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="866.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">负载偏斜</text>
<rect x="256.0" y="852.0" width="820.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="262.0" y="866.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">训练期加辅助损失 / 路由偏置；推理期换位 + 冗余专家（EPLB）</text>
<rect x="1076.0" y="852.0" width="384.0" height="36.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>

<p class="ptitle">④ 共享专家：让 MoE 里有一条「谁都要走」的 dense 旁路</p>
<p class="psub">一句话：DeepSeek 风格 MoE 除了 N 个路由专家，还有一个所有 token 都必走的共享专家（权重固定 1）。它承担「通用能力」，让路由专家可以真正特化——代价是它不受稀疏保护，每步都要读。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="912"1472" viewBox="0 0 1576 1472">
<rect width="1576" height="1472" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">④ 共享专家：让 MoE 里有一条「谁都要走」的 dense 旁路</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：DeepSeek 风格 MoE 除了 N 个路由专家，还有一个所有 token 都必走的共享专家（权重固定 1）。它承担「通用能力」，让路由专家可以真正特化——代价是它不受稀疏保护，每步都要读。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：一层 MoE 的完整结构（路由专家 + 共享专家）</text>
<rect x="36.0" y="148.0" width="1424.0" height="140.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="162.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">　　　　　　　　　　x（token）</text>
<text x="42.0" y="175.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">　　　　　　┌──────────┴──────────┐</text>
<text x="42.0" y="190.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">　　　　门卫（打分 + top-k）　　　共享专家（必走，权重 = 1.0）</text>
<text x="42.0" y="205.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">　　　　　　↓　　　　　　　　　　　　↓</text>
<text x="42.0" y="220.04999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">　　　k 个路由专家的加权结果　　＋　　固定一路结果</text>
<text x="42.0" y="234.89999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">　　　　　　└──────────┬──────────┘</text>
<text x="42.0" y="249.74999999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei">　　　　　　　　　　　 ↓　输出 y</text>
<text x="36.0" y="312.0" font-size="11" fill="#333333">第二步：它解决什么问题（三个理由，按重要性排）</text>
<rect x="36.0" y="328.0" width="460.0" height="190.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="342.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="350.0" font-size="11" fill="#333333">① 给通用能力一条「固定容量」的路</text>
<text x="46.0" y="376.0" font-size="11" fill="#333333">路由专家每 token 只碰 k 个，容量有限且被热门专家挤占；语法、常见搭配这类「所有 token 都需要」的知识，如果也靠路由专家学，会被反复争抢、学不稳。共享专家给它们一条永远可用的通道。</text>
<rect x="518.0" y="328.0" width="460.0" height="190.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="524.0" y="342.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="528.0" y="350.0" font-size="11" fill="#333333">② 让路由专家可以真正特化</text>
<text x="528.0" y="376.0" font-size="11" fill="#333333">有了兜底的通用通路，N 个路由专家就能分工更细、各自更窄。这也解释了为什么 MoE 模型的「每专家中间维」通常比 dense 的 FFN 宽度小很多。</text>
<rect x="1000.0" y="328.0" width="460.0" height="190.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1006.0" y="342.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1010.0" y="350.0" font-size="11" fill="#333333">③ 训练更稳</text>
<text x="1010.0" y="376.0" font-size="11" fill="#333333">路由是离散选择（top-k），梯度稀疏、容易震荡；共享专家的梯度对每个 token 都存在，相当于给优化过程一个稳定的锚。</text>
<text x="36.0" y="542.0" font-size="11" fill="#333333">第三步：实现上的三个细节（都能在仓里查到）</text>
<rect x="36.0" y="558.0" width="1424.0" height="132.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="572.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 不是一个「独立的专家」，而是一条更宽的 dense MLP：多个共享专家被合并成 一个 宽度 = 每专家宽 × 共享数 的 FFN。</text>
<text x="42.0" y="585.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 计算量按「token 数」算，不按「token × k」：本仓性能模型里，路由专家的 FLOPs 用 token×k，共享专家用 token —— 这就是「它不受稀疏保护」的定量表达。</text>
<text x="42.0" y="600.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 它不参与负载均衡：EPLB 计算专家放置时会先把共享专家从总数里减掉，最后单独追加——因为它天然在所有卡上都存在一份（或按 dense 切分）。</text>
<rect x="36.0" y="730.0" width="1424.0" height="116.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="744.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第四步：代价——它让 MoE「更像 dense」</text>
<text x="42.0" y="758.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">共享专家是 dense 的：每个 token 都走、每一步都要读它的权重。所以共享专家越宽，MoE 的 decode 就越接近 dense（稀疏性带来的节省被吃回去）。</text>
<text x="42.0" y="772.35" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">推论：共享专家宽度是一个「用 decode 速度换模型质量」的旋钮——本仓配置里它通常是 1 个共享专家，而路由专家有上百个。</text>
<text x="36.0" y="870.0" font-size="11" fill="#333333">第五步：本仓两类 MoE 模型的默认结构（来自仓内自带的 config 定义）</text>
<rect x="36.0" y="886.0" width="700.0" height="96.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="900.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="48.0" y="908.0" font-size="11" fill="#333333">DeepSeek-V3 风格（仓内默认）</text>
<text x="48.0" y="934.0" font-size="11" fill="#333333">专家 192 个　·　top-k 8　·　共享专家 1 个每专家宽 1536　·　dense FFN 宽 13312</text>
<rect x="760.0" y="886.0" width="700.0" height="96.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="766.0" y="900.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="772.0" y="908.0" font-size="11" fill="#333333">GLM-5-Next 风格</text>
<text x="772.0" y="934.0" font-size="11" fill="#333333">专家 288 个　·　top-k 7　·　共享专家 1 个每专家宽 2048</text>
<text x="36.0" y="1004.0" font-size="11" fill="#666666">读法：专家数很多但每专家很窄（1536 vs dense 的 13312）；top-k 只有 8 → 每 token 激活约 8/192 ≈ 4.2% 的专家参数。</text>
<rect x="36.0" y="1036.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="1050.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：结构齐了。下一步（⑤）讲「专家怎么切到多张卡」——这就是专家并行（EP）。</text>

<text x="42.0" y="1126.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="1140.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">共享专家的构造（宽度 = 每专家宽 × 共享数）：vllm/model_executor/models/hy_v3.py:164-175</text>

<p class="ptitle">⑤ 专家并行（EP）：把「很多专家」切到多张卡，但总量一点没少</p>
<p class="psub">一句话：EP 就是把 N 个专家按卡切分，每卡只放 N/ep 个；省的是「单卡必须放下全部专家」，不省总显存——代价是 token 得跨卡去找自己的专家。</p>

<text x="36.0" y="34.0" font-size="11" fill="#333333">⑤ 专家并行（EP）：把「很多专家」切到多张卡，但总量一点没少</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：EP 就是把 N 个专家按卡切分，每卡只放 N/ep 个；省的是「单卡必须放下全部专家」，不省总显存——代价是 token 得跨卡去找自己的专家。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：8 个专家切到 2 张卡（每卡 4 个）</text>
<rect x="36.0" y="148.0" width="690.0" height="172.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">不切（每卡都放全部专家）</text>
<text x="42.0" y="176.85" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="191.7" font-size="10" fill="#333333" font-family="Microsoft YaHei">卡 0：专家 0 1 2 3 4 5 6 7</text>
<text x="42.0" y="205.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">卡 1：专家 0 1 2 3 4 5 6 7</text>
<text x="42.0" y="220.04999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="234.89999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">每张卡都要放下全部专家 → 单卡显存压力最大；</text>
<text x="42.0" y="249.74999999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei">但每卡都能本地算，不需要搬 token。</text>
<rect x="766.0" y="148.0" width="694.0" height="172.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="772.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">切分（每卡一半专家）</text>
<text x="772.0" y="176.85" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="772.0" y="191.7" font-size="10" fill="#333333" font-family="Microsoft YaHei">卡 0：专家 0 1 2 3</text>
<text x="772.0" y="205.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">卡 1：专家 4 5 6 7</text>
<text x="772.0" y="220.04999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="772.0" y="234.89999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">单卡显存压力减半；</text>
<text x="772.0" y="249.74999999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei">但 token 若被分到「别人家的专家」，就必须跨卡送过去（见 ⑥）。</text>
<rect x="36.0" y="360.0" width="1424.0" height="120.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="374.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第二步：必须澄清的一点——EP 不减少总显存</text>
<text x="42.0" y="388.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">切分只是把「一批专家」摊到多张卡上：全部专家仍然要在整个集群里驻留一份。所以 EP 解决的是「单卡放不下」，不是「总共太多」。</text>
<text x="42.0" y="402.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">本仓代码里能直接看到这一点：每张卡维护一张「全局专家 → 本卡槽位」的映射，非本卡的专家映射为 −1（表示「这个专家不在我这」）。</text>
<text x="42.0" y="417.20000000000005" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">推论：EP 之后「可用 KV 显存」并不会因为切分而变多——它和「专家数 × 每专家大小」一起，仍然是显存账里的第一大户（占权重 85~90%）。</text>

<text x="242.0" y="648.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">复制整模型，各跑各的请求</text>
<rect x="576.0" y="634.0" width="460.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>

<text x="42.0" y="702.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本仓文档给的换算是 EP 规模 = TP 规模 × DP 规模——也就是说：单机 8 卡 TP=8 时开 EP，等于把这 8 张卡都当成「专家池」；而 DP=2 时，两个副本的卡也会计入 EP 池。</text>
<text x="42.0" y="715.5" font-size="9" fill="#c0392b" font-family="Microsoft YaHei">所以开关只有一句 --enable-expert-parallel，但实际拓扑由 TP/DP 一起决定。</text>
<text x="36.0" y="808.0" font-size="11" fill="#333333">第四步：切分后为什么需要「逻辑专家 → 物理专家」两层映射</text>
<rect x="36.0" y="824.0" width="700.0" height="168.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="838.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="846.0" font-size="11" fill="#333333">原因：专家的位置可能被「搬动」</text>
<text x="46.0" y="872.0" font-size="11" fill="#333333">模型里定义的专家编号（逻辑）与「它此刻在哪张卡、哪个槽位」（物理）是两回事。因为 ⑦ 页要讲的负载均衡会把热门专家复制几份、挪到别的卡上。所以路由算完之后，还要过一次「逻辑 → 物理」映射表。</text>

<text x="802.0" y="838.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="846.0" font-size="11" fill="#333333">本仓的实现</text>
<text x="806.0" y="872.0" font-size="11" fill="#333333">有一张映射表把逻辑专家号映射到物理专家号；未启用负载均衡时，它基本是恒等映射（第 i 个专家就在第 i 个槽位）。启用之后，同一个逻辑专家可能对应多个物理副本。</text>
<rect x="36.0" y="1032.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="1046.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：切了专家就要搬 token。下一步（⑥）看搬的三种实现——注意本仓默认不是 all-to-all。</text>

<text x="42.0" y="1136.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">每卡只放 global_num_experts // ep_size 个、非本卡映射为 −1：vllm/model_executor/layers/fused_moe/expert_map_manager.py:22-69</text>

<rect x="668.0" y="146.0" width="300.0" height="76.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="674.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 开了 EP</text>
<text x="674.0" y="174.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">再按下面判</text>
<rect x="984.0" y="146.0" width="476.0" height="76.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="990.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">④ 开了 EP 且用了 LoRA</text>
<text x="990.0" y="174.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">→ all-to-all（融合算子插不进 LoRA）</text>
<rect x="36.0" y="252.0" width="1424.0" height="108.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="266.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第二步（开了 EP、没用 LoRA）继续分岔：看硬件策略与专家密度</text>
<text x="42.0" y="280.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">· 某些硬件：当「每卡专家数 ≤ 24 且 EP 规模 ≥ 16」才启用 MC2（融合算子），否则回落到 all-gather；</text>
<text x="42.0" y="294.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 另一些硬件：当「EP 规模 ≤ top-k」时也回落 all-gather（因为每卡能拿到的专家很少，融合不划算）；</text>
<text x="42.0" y="309.20000000000005" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 结论：「开了 EP 就走 all-to-all」是错的——本仓最常见的路径其实是 all-gather。</text>
<text x="36.0" y="384.0" font-size="11" fill="#333333">第四步：三条实现各自在干什么（这是本页的核心）</text>
<rect x="36.0" y="400.0" width="460.0" height="210.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="414.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="422.0" font-size="11" fill="#333333">all-gather（默认）</text>
<text x="46.0" y="448.0" font-size="11" fill="#333333">把所有卡上的 token都收集到每张卡上（每卡都拿到全量 token），然后每卡只用「本地专家」筛出属于自己的那部分行来算。优点：实现简单、不需要复杂的收发配对。缺点：搬的是「全量 token」而不是「该去别卡的那些」——EP 规模越大越浪费。</text>
<rect x="518.0" y="400.0" width="460.0" height="210.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="524.0" y="414.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="528.0" y="422.0" font-size="11" fill="#333333">all-to-all（按需送）</text>
<text x="528.0" y="448.0" font-size="11" fill="#333333">只把「要去别卡专家」的 token 送过去，接收方也只收自己需要的。优点：搬的量与「真正跨卡的 token 数」成正比，EP 大时更省。缺点：要按份数切分/拼装（收发元数据复杂），且小 batch 时延迟盖过收益；另有实现限制（例如不支持 bias）。</text>
<rect x="1000.0" y="400.0" width="460.0" height="210.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="1006.0" y="414.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1010.0" y="422.0" font-size="11" fill="#333333">MC2（融合）</text>
<text x="1010.0" y="448.0" font-size="11" fill="#333333">把「重排 + 通信 + 分组矩阵乘」压进一个融合算子，通信与计算重叠。优点：省掉中间搬运、减少一次落盘到显存。缺点：只支持特定量化组合与特定硬件；专家太少时不划算；且在未开 EP 时会直接报错（它本身就是为 EP 场景写的）。</text>
<rect x="36.0" y="650.0" width="1424.0" height="116.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="664.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第四步：为什么小 batch（decode）时这三条都不便宜</text>
<text x="42.0" y="678.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">通信缓冲要按最坏情况分配：每卡最大批 × EP 规模 × min(top-k, 每卡专家数)——这个式子与「本次实际有多少 token」无关。</text>
<text x="42.0" y="692.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">所以 decode 这种「每步只有几十个 token」的场景，仍要付「为最大批准备的开销」（元数据、屏障、缓冲清零等固定成本）。</text>
<text x="42.0" y="707.2" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">这就是本文档反复强调「MoE 在 decode 阶段更吃亏」的机制之一（另一条是要读的专家权重零碎）。</text>
<text x="36.0" y="790.0" font-size="11" fill="#333333">第五步：一张速查（怎么判断当前用的是哪条）</text>
<rect x="36.0" y="806.0" width="200.0" height="34.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="42.0" y="820.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">看哪</text>
<rect x="236.0" y="806.0" width="720.0" height="34.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>

<figure id="p6">
<p class="ptitle">⑦ 负载均衡：为什么总有「热门专家」，以及两种治它的办法</p>
<p class="psub">一句话：路由是「谁分高谁上」，于是热门专家会越来越热、冷门专家越来越闲；训练期用辅助损失或路由偏置压制，推理期用「把专家搬/复制到空闲卡」（EPLB）削峰。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="1055"1702" viewBox="0 0 1576 1702">
<rect width="1576" height="1702" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑦ 负载均衡：为什么总有「热门专家」，以及两种治它的办法</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：路由是「谁分高谁上」，于是热门专家会越来越热、冷门专家越来越闲；训练期用辅助损失或路由偏置压制，推理期用「把专家搬/复制到空闲卡」（EPLB）削峰。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">第一步：现象（本仓文档原文：实际分布可能高度偏斜）</text>
<rect x="36.0" y="146.0" width="1424.0" height="116.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="160.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">MoE 训练时通常会让各专家分到的 token 数接近，但 线上真实流量的分布可能与训练分布不一致：某些专家接到远超平均的 token，另一些几乎闲着。</text>
<text x="42.0" y="173.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">后果：专家被切到不同卡之后，「热门专家所在的那张卡」成了瓶颈——它算不完，其他卡在等它（因为每层结束都要同步）。</text>
<text x="42.0" y="188.35" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">注意：这不是 bug，是「稀疏路由 + 按卡切分 + 每层同步」这套结构的必然副作用。</text>
<text x="36.0" y="286.0" font-size="11" fill="#333333">第二步：怎么量化「有多不均衡」（本仓有两个现成口径）</text>
<rect x="36.0" y="302.0" width="700.0" height="130.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="316.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="324.0" font-size="11" fill="#333333">口径一：均衡度 balancedness</text>
<text x="46.0" y="350.0" font-size="11" fill="#333333">= 每专家平均 token 数 ÷ 每专家最大 token 数。取值 0~1，越接近 1 越均衡；0.5 意味着最忙的专家比平均忙一倍。</text>
<rect x="796.0" y="302.0" width="664.0" height="130.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="802.0" y="316.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="324.0" font-size="11" fill="#333333">口径二：rank 负载比（EPLB 日志）</text>
<text x="806.0" y="350.0" font-size="11" fill="#333333">看「各卡负载的最大值 ÷ 平均值」，同时报均值与 p95。日志里的说法是「越低越好」——它衡量的是卡的不均衡，而不是专家的。</text>
<text x="36.0" y="456.0" font-size="11" fill="#333333">第三步：训练期的两种手段（本仓配置里都能看到字段）</text>
<rect x="36.0" y="472.0" width="700.0" height="176.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="486.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="494.0" font-size="11" fill="#333333">手段一：辅助负载均衡损失（aux loss）</text>
<text x="46.0" y="520.0" font-size="11" fill="#333333">在总损失里加一项，惩罚「专家分到的 token 不均」。本仓配置里对应的开关是把「每层路由 logits 输出出来」——注释原文写明：这是为了训练期计算辅助负载均衡损失用的，推理期默认关闭以省显存。</text>
<rect x="796.0" y="472.0" width="664.0" height="176.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="802.0" y="486.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="494.0" font-size="11" fill="#333333">手段二：路由偏置（不用改损失）</text>
<text x="806.0" y="520.0" font-size="11" fill="#333333">给每个专家一个可学习的偏置，加到路由分数上，把冷门专家「抬」一点、热门专家「压」一点。好处：不动主损失，实现简单；本仓配置里默认是开启的。（这是 DeepSeek 系的做法：用偏置代替辅助损失。）</text>
<text x="36.0" y="672.0" font-size="11" fill="#333333">第四步：推理期的 EPLB（把「换座位」做成一个子系统）</text>
<rect x="36.0" y="688.0" width="1424.0" height="132.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="702.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">三段式：① 控制面——按窗口统计各专家实际负载；② 决策面——重算「哪个专家该放哪张卡」，必要时给热门专家复制副本（冗余专家）；③ 搬运面——把专家权重真的搬过去。</text>
<text x="42.0" y="715.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么能削峰：热门专家不再只有一份，而是分散在多张卡上，于是那几张卡可以并行消化它的流量。</text>
<text x="42.0" y="730.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">代价：冗余副本要占额外显存（本仓文档给了 DeepSeek-V3 的量级：每卡多一个冗余专家约 2.4 GB），并且会挤占 KV cache。</text>
<text x="36.0" y="844.0" font-size="11" fill="#333333">第五步：昇腾侧的三条硬限制（都会直接拒绝或强制改写）</text>

<text x="42.0" y="1126.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 辅助损失：训练期改梯度，从源头让分布均匀；② 路由偏置：训练期改分数，同样从源头；③ EPLB：推理期搬位置/加副本，不改模型、只改放置；④ 容量因子 / token drop：训练期概念，本仓推理路径不做截断（重排行数就是 token×k，不会有 token 被丢）。</text>

<p class="ptitle">⑧ 昇腾侧：一条被「融合算子」串起来的主链</p>
<p class="psub">一句话：昇腾把「路由 → 重排 → 分组矩阵乘 → 散射」几乎全压成了 NPU 专用算子，还额外提供「重排时顺便量化」和「共享专家与专家计算并行」两个优化。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="824"1330" viewBox="0 0 1576 1330">
<rect width="1576" height="1330" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑧ 昇腾侧：一条被「融合算子」串起来的主链</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：昇腾把「路由 → 重排 → 分组矩阵乘 → 散射」几乎全压成了 NPU 专用算子，还额外提供「重排时顺便量化」和「共享专家与专家计算并行」两个优化。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">第一步：主链（每一步对应一个或一组昇腾算子）</text>
<rect x="36.0" y="146.0" width="224.0" height="84.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 门卫</text>

<text x="46.0" y="318.0" font-size="11" fill="#333333">普通做法：重排（搬一次数据）→ 量化（再搬一次）。昇腾把量化塞进重排算子：一次搬运完成两件事。省的是「多搬一遍 token」的带宽——在小 batch 时很值钱。</text>

<text x="524.0" y="284.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="528.0" y="292.0" font-size="11" fill="#333333">② 融合 kernel：两段 GEMM + 激活</text>
<text x="528.0" y="318.0" font-size="11" fill="#333333">「gate/up 段 → 激活 → down 段」可以压成一个融合算子，中间结果不落显存（少一次写+读）。代价：融合算子对量化组合与硬件型号有要求，不满足就回退到分步。</text>

<text x="1010.0" y="292.0" font-size="11" fill="#333333">③ 共享专家与专家计算「并行」</text>
<text x="1010.0" y="318.0" font-size="11" fill="#333333">共享专家是 dense 的，和路由专家的计算互不依赖 → 可以放另一条流同时跑。实现上还用「里程碑/事件」对齐两段之间的依赖（例如激活前必须等到某一段）。本仓还有一致性校验：拆开算的结果必须等于整体算的结果，不等直接报错。</text>

<text x="42.0" y="524.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第三步：一个 EP 下的易错点（阅读代码时会遇到）</text>

<text x="42.0" y="552.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">所以判断共享专家布局时，不能看 MoE 层那个被改写过的值，而要看真正的 TP 组规模——代码里专门为此写了注释，踩了这个坑会看到「共享专家形状对不上」或「结果不一致」。</text>

<text x="36.0" y="34.0" font-size="11" fill="#333333">⑨ 回到部署：本仓只有一套包用 MoE，也只有它开了 EP</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：十套部署包里九套是 dense 模型（Qwen3.6-27B），只有 DeepSeek 那套是 MoE 并开了 EP；而 EP 与 TP 在 MoE 层里是互斥的——开 EP 就等于把 TP 关掉。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">第一步：先记住这条互斥关系（它解释了本仓为什么这么配）</text>
<rect x="36.0" y="146.0" width="1424.0" height="132.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="160.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">开 EP 后，MoE 层把「专家」按卡切分 → 每张卡拥有完整的一份专家 → 这一层不再需要 TP 切分。</text>
<text x="42.0" y="173.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码里的表现：EP 打开时，MoE 层自己的 TP 规模被写成 1、EP 规模 = DP × PCP × TP 的乘积；EP 关闭时反过来（EP=1、TP=乘积）。</text>
<text x="42.0" y="188.35" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">所以「EP + TP 混合」是不支持的：你只能选「每卡几个专家」或「每卡整层切一半」，不能又切层又切专家。</text>

<text x="42.0" y="628.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="636.0" font-size="11" fill="#333333">① MTP 层本身就是 MoE 层</text>
<text x="46.0" y="662.0" font-size="11" fill="#333333">投机解码的草稿层不是「一个小 dense 层」，它内部同样含一个完整的 MoE 层（路由专家 + 共享专家）。所以开了 MTP 之后，MoE 的层数变多了——这也是「开 MTP 会让显存变紧」的原因之一。</text>
<rect x="518.0" y="614.0" width="460.0" height="196.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="524.0" y="628.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="528.0" y="636.0" font-size="11" fill="#333333">② KV 传输与专家无关</text>
<text x="528.0" y="662.0" font-size="11" fill="#333333">KV cache 只挂在 attention 层，MoE 层不产生 KV。所以「专家怎么切」不影响 PD 分离要搬多少 KV。（那句「MTP 各层共用同一份 KV 层、只传一次」讲的是 MTP 内部复用，与 MoE 无关。）</text>
<rect x="1000.0" y="614.0" width="460.0" height="196.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="1006.0" y="628.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1010.0" y="636.0" font-size="11" fill="#333333">③ PD 与 EP 的真实耦合点是「专家 ID 表」</text>
<text x="1010.0" y="662.0" font-size="11" fill="#333333">某些 MoE 模型（带 Hash 路由的那类）需要一张「token → 专家」的查表，由边侧算好、随上行载荷送到云端。而通信方式一变（all-gather ↔ 按需分发），这张表的对齐方式也要跟着变；对不齐会直接报错。这是 PD + EP 组合时最需要验证的一处。</text>
<rect x="36.0" y="850.0" width="1424.0" height="104.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="864.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第四步：本仓为什么没有开 EPLB（如实说明）</text>
<text x="42.0" y="878.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">十套包的启动参数里从未出现 EPLB 相关字段（冗余专家数、负载均衡配置等）。可能原因：单机 TP=8 的专家池很小（每卡专家数不多），负载倾斜影响有限；且 EPLB 会额外占显存（冗余专家）——那套包本来显存就紧（还开着 MTP 与量化）。</text>
<text x="42.0" y="892.35" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">这属于「能开但权衡后没开」，不是「不能开」。</text>

<p class="ptitle">⑩ 收口：为什么「wave 协调」只有 MoE 才需要 + 术语 + 排障</p>
<p class="psub">一句话：MoE 的 DP rank 不是彼此独立的——每层都要跨 rank 搬 token，所以所有 rank 必须同时走、同时停；这个「一起走一起停」就是 wave。dense 的 DP rank 才是真正各干各的。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="1066"1720" viewBox="0 0 1576 1720">
<rect width="1576" height="1720" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑩ 收口：为什么「wave 协调」只有 MoE 才需要 + 术语 + 排障</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：MoE 的 DP rank 不是彼此独立的——每层都要跨 rank 搬 token，所以所有 rank 必须同时走、同时停；这个「一起走一起停」就是 wave。dense 的 DP rank 才是真正各干各的。</text>
<text x="36.0" y="128.0" font-size="11" fill="#333333">第一步：为什么 MoE 的 DP rank 必须「一起走、一起停」</text>
<rect x="36.0" y="144.0" width="1424.0" height="132.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="158.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">dense 的 DP：每张卡各自跑各自的请求，互不通信 → 一个 rank 忙、另一个 rank 闲，完全没问题。</text>
<text x="42.0" y="171.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">MoE 的 DP：每一层都要跨 rank 做集合通信（搬 token / 归约），而集合通信要求所有 rank 同时参与 → 只要有一个 rank 停下来了，其他 rank 就会卡在通信里。</text>
<text x="42.0" y="186.35" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">所以 MoE 的所有 rank 必须「同一时刻要么都在跑、要么都在停」——这就是 wave（波次）。代码里甚至有一条注释大意是：「空微批也要跑成 dummy 批，因为大家必须切得一样多」。</text>
<rect x="36.0" y="316.0" width="1424.0" height="108.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="330.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第二步：代码里的三个「硬证据」</text>
<text x="42.0" y="344.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 一行定死：enable_wave_coordination = is_moe——只有 MoE 模型才启用波次协调；</text>
<text x="42.0" y="358.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 一条断言：MoE 专用的引擎进程类型上写着「只应该用于 MoE 模型」；</text>
<text x="42.0" y="373.20000000000005" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 一条纪律：同步状态结构体的注释写着「每个字段在所有 rank 上必须相同，永远不要往里加「只在本 rank 有意义」的值」——否则各 rank 对「要不要通信」的判断会不一致 → 死锁。</text>

<text x="42.0" y="1202.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">五句话总结这一套</text>
<text x="42.0" y="1216.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① MoE = 很多专家 + 门卫 + 每 token 只走 top-k：总参数按专家数涨，计算按 top-k 涨，显存按专家数涨；</text>
<text x="42.0" y="1230.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 一层 MoE 的计算只有「一次小线性 + k 段 GEMM」，中间夹两次数据搬运（重排/散射）；</text>
<text x="42.0" y="1245.1999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 推理要付三笔账：显存（全部专家驻留）、通信（搬 token）、负载（热门专家拖慢某卡）；</text>
<text x="42.0" y="1260.0499999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei">④ 三笔账的解法分别是：EP 切分（摊开）、通信实现选择（默认 all-gather，可换融合/按需）、EPLB 换位；</text>
<text x="42.0" y="1274.8999999999996" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑤ 而 MoE 的 DP rank 因为要通信，必须 wave 协同——这是它和 dense 最本质的结构差别。</text>

<div class="concl"><b>一句话结论　</b>MoE 的 DP rank 不是彼此独立的——每层都要跨 rank 搬 token，所以所有 rank 必须同时走、同时停；这个「一起走一起停」就是 wave。dense 的 DP rank 才是真正各干各的。</div>
