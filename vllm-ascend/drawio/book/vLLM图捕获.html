<p class="lead">捕获与回放、三个硬约束、四种模式、桶与 dispatch、昇腾 ACL Graph</p>
<p class="lead">本页 10 张图；点击编号跳转：<a href="#p0">1</a> <a href="#p1">2</a> <a href="#p2">3</a> <a href="#p3">4</a> <a href="#p4">5</a> <a href="#p5">6</a> <a href="#p6">7</a> <a href="#p7">8</a> <a href="#p8">9</a> <a href="#p9">10</a></p>
<figure id="p0">
<p class="ptitle">① 为什么需要图捕获：CPU 在「下发」，NPU 在「等」</p>
<p class="psub">一句话：推理的每一步都要把整层的成百上千个算子逐个提交给设备。decode 时每步只算很少的 token，于是提交的时间开始和计算的时间同一个量级——图捕获就是把「逐个提交」压成「一次提交」。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="675"1090" viewBox="0 0 1576 1090">
<rect width="1576" height="1090" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">① 为什么需要图捕获：CPU 在「下发」，NPU 在「等」</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：推理的每一步都要把整层的成百上千个算子逐个提交给设备。decode 时每步只算很少的 token，于是提交的时间开始和计算的时间同一个量级——图捕获就是把「逐个提交」压成「一次提交」。</text>
<text x="36.0" y="136.0" font-size="11" fill="#333333">第一步：先看清一步推理里其实有两条时间线</text>
<text x="36.0" y="170.0" font-size="11" fill="#333333">普通执行（eager / 逐算子下发）</text>
<rect x="36.0" y="186.0" width="700.0" height="150.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="200.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">CPU：算子1 提交 → 算子2 提交 → 算子3 提交 → …（每层几十个，几十层）</text>
<text x="42.0" y="213.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">NPU：　　　　　　　执行1　　　　　执行2　　　　　执行3 …</text>
<text x="42.0" y="228.35" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="243.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">两条线在同一个流上交替：CPU 提交一个，NPU 才能算一个。当「执行」很短（decode 只算 1 个 token）时，NPU 有大量时间在等 CPU 提交下一个算子。</text>
<text x="796.0" y="170.0" font-size="11" fill="#333333">图捕获之后（回放）</text>
<rect x="796.0" y="186.0" width="664.0" height="150.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="802.0" y="200.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">CPU：replay() —— 只提交一次</text>
<text x="802.0" y="213.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">NPU：　　▷ 整段计算连着跑（中间不再等 CPU）</text>
<text x="802.0" y="228.35" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="802.0" y="243.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">整张图的算子序列、依赖、参数在启动时就录好了；回放时 CPU 只发一条命令，剩下的交给驱动/硬件按录好的顺序跑。</text>
<text x="36.0" y="376.0" font-size="11" fill="#333333">第二步：为什么 decode 阶段最吃亏（prefill 反而还好）</text>
<rect x="36.0" y="396.0" width="700.0" height="176.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="410.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="418.0" font-size="11" fill="#333333">prefill（一次算整段 prompt）</text>
<text x="46.0" y="444.0" font-size="11" fill="#333333">一次要算 N 个 token（几百到几万），矩阵很「宽」。device 上的计算时间长 → 提交开销被摊薄，CPU 追得上。所以 prefill 不做整图捕获也影响不大。</text>
<rect x="796.0" y="396.0" width="664.0" height="176.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="802.0" y="410.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="418.0" font-size="11" fill="#333333">decode（一次只算新生成的 1 个 token）</text>
<text x="806.0" y="444.0" font-size="11" fill="#333333">每请求 1 个 query token（spec decode 时是 1+N）。计算量极小 → 每步的时间几乎由「下发次数」决定。而层数 × 每层算子数 一个都不能少 → 提交开销成为主导。所以「图」几乎只为 decode 而生。</text>
<rect x="36.0" y="612.0" width="1424.0" height="118.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="626.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代价与收益（本仓文档的原话）</text>
<text x="42.0" y="640.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 收益：把 host 侧的上千次下发压成一次，换来的是「稳态 decode 性能」（vllm/docs/configuration/optimization.md:25 原文：跳过图捕获可以最快启动，代价是稳态 decode 性能）。</text>
<text x="42.0" y="654.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 代价：启动变慢（要真跑一遍来录）+ 显存变多（每张图要占一份内存池），而且形状必须固定（见 ④ 的三条硬约束）。</text>
<text x="42.0" y="669.2" font-size="9" fill="#333333" font-family="Microsoft YaHei">③ Ascend 侧的设计目标与 CUDA 一致：reduce host launch overhead for small and medium runtime shapes（vllm-ascend/docs/.../ACL_Graph.md:7）。</text>
<rect x="36.0" y="764.0" width="1424.0" height="104.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="778.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="792.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">收益/代价的定性描述：vllm/docs/configuration/optimization.md:25、vllm/docs/design/cuda_graphs.md:43-46、vllm/docs/configuration/conserving_memory.md:48-65</text>
<text x="42.0" y="805.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">decode 每请求只有 1 个 query token：vllm/config/vllm.py:661-679</text>
<text x="42.0" y="819.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">「uniform decode」判定：vllm/v1/cudagraph_dispatcher.py:37、vllm/v1/worker/gpu_model_runner.py:3888-3907</text>
<text x="42.0" y="834.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">host 侧同步被当作热路径敌人：vllm/envs.py:635-643（VLLM_GPU_SYNC_CHECK）、vllm/utils/gpu_sync_debug.py:3</text>
<text x="42.0" y="849.5500000000001" font-size="11" fill="#333333" font-family="Microsoft YaHei">Ascend 的设计目标原文：vllm-ascend/docs/source/developer_guide/Design_Documents/ACL_Graph.md:7</text>
<rect x="36.0" y="900.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="914.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：图捕获不是「让算子变快」，而是把下发的次数变少——prefill 计算量大、摊得开；decode 每步只有 1 个 token，省下的 CPU 提交时间直接变成端到端的 token 间隔（TPOT）。</text>
<text x="36.0" y="1006.0" font-size="11" fill="#333333">图例</text>

<figure id="p1">
<p class="ptitle">② 什么是图：把「跑一遍」录下来，以后一次「播」</p>
<p class="psub">一句话：捕获＝在专用 stream 上真正跑一遍 forward，同时把设备上发生的算子序列与地址关系录成图；回放＝一条命令重放整张图，CPU 不再逐个提交。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="673"1086" viewBox="0 0 1576 1086">
<rect width="1576" height="1086" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">② 什么是图：把「跑一遍」录下来，以后一次「播」</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：捕获＝在专用 stream 上真正跑一遍 forward，同时把设备上发生的算子序列与地址关系录成图；回放＝一条命令重放整张图，CPU 不再逐个提交。</text>
<text x="36.0" y="134.0" font-size="11" fill="#333333">第一步：三步看清它到底「录」了什么</text>
<rect x="36.0" y="154.0" width="466.0" height="214.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="168.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="176.0" font-size="11" fill="#333333">① 普通执行：每次都重来一遍</text>
<text x="46.0" y="202.0" font-size="11" fill="#333333">Python 每步重新执行一遍模型代码：· 读当前的输入张量· 逐个调用算子（kernel/launch）· CPU 把每个算子提交给设备没有记忆：第 100 步和第 1 步做的事情完全一样，但 CPU 还是要把这上千次提交再做一遍。</text>
<rect x="526.0" y="154.0" width="466.0" height="214.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="532.0" y="168.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="536.0" y="176.0" font-size="11" fill="#333333">② 捕获：真跑一遍，同时录下来</text>
<text x="536.0" y="202.0" font-size="11" fill="#333333">在专用 stream 上放 torch.cuda.graph(...)（昇腾是 torch.npu.graph）：· 里面真的把 forward 跑了一次· 设备上发生的算子、依赖、地址，被录成一张图· 输入张量的地址也被记下（回放时必须一样）代价：这一步要真花钱（时间 + 一份内存池）。</text>
<rect x="1016.0" y="154.0" width="444.0" height="214.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="1022.0" y="168.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1026.0" y="176.0" font-size="11" fill="#333333">③ 回放：一句 replay()</text>
<text x="1026.0" y="202.0" font-size="11" fill="#333333">以后每步只做：· 把新输入 copy_ 到捕获时那几块固定 buffer 里· 调一次 graph.replay()· 从固定输出 buffer 里读结果CPU 只提交一次；设备按录好的顺序连着跑。注意：Python 代码不会再执行。</text>
<rect x="36.0" y="428.0" width="1424.0" height="108.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="442.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">最关键的一条性质：录进去的只有「设备操作」，Python 逻辑不再执行</text>
<text x="42.0" y="456.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">本仓文档原话：这段代码在捕获期间执行，只有它发出的 GPU 操作会被记录并在回放时执行，它的 Python 本体不会再跑一遍（vllm/docs/design/model_runner_v2.md:198）。</text>
<text x="42.0" y="470.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">推论 1：图里的 if / for 只在捕获时决定一次，回放时不会重新判断——所以形状、分支、循环次数都必须固定。</text>
<text x="42.0" y="485.20000000000005" font-size="11" fill="#333333" font-family="Microsoft YaHei">推论 2：图里的 .item() / print / 分配内存 也只会发生一次，值会被「烤」进图里（后面 ④ 会讲这条坑）。</text>
<text x="36.0" y="550.0" font-size="11" fill="#333333">第二步：一个类比（记住这个就够了）</text>
<rect x="36.0" y="570.0" width="700.0" height="150.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="584.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="592.0" font-size="11" fill="#333333">像「宏」（macro）/ 像「录屏回放」</text>
<text x="46.0" y="618.0" font-size="11" fill="#333333">· 普通执行 = 每一步都手工点一遍菜单；· 捕获 = 手工点一次，把动作序列录成一个宏；· 回放 = 以后按一下宏的快捷键，它把整串动作重放。宏能成立的前提：每次点的位置必须一样（＝地址固定）、菜单结构不能变（＝形状固定）。</text>
<rect x="796.0" y="570.0" width="664.0" height="150.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="802.0" y="584.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="592.0" font-size="11" fill="#333333">它「不是」什么（三个常见误解）</text>
<text x="806.0" y="618.0" font-size="11" fill="#333333">· 不是「把模型编译成更快的算子」——那是 torch.compile 干的事；· 不是「缓存计算结果」——它不省计算，只省「提交」；· 不是「自动加速一切」——形状一变就要换一张图，没有对应图就退回普通执行。</text>

<p class="ptitle">③ 一次捕获里发生了什么（10 步，按代码顺序）</p>
<p class="psub">一句话：包一层 wrapper → 开闸门 → 切到侧流 → 从大到小逐个桶：warmup 几遍 → 同步 → 在 torch.cuda.graph 里真跑一遍 → 关闸门、锁 workspace。注意：捕获是在「profile 量完显存、KV 块池也建好」之后才做的。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="882"1424" viewBox="0 0 1576 1424">
<rect width="1576" height="1424" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">③ 一次捕获里发生了什么（10 步，按代码顺序）</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：包一层 wrapper → 开闸门 → 切到侧流 → 从大到小逐个桶：warmup 几遍 → 同步 → 在 torch.cuda.graph 里真跑一遍 → 关闸门、锁 workspace。注意：捕获是在「profile 量完显存、KV 块池也建好」之后才做的。</text>
<text x="36.0" y="140.0" font-size="11" fill="#333333">左列：准备阶段（1-5）　右列：逐桶录制（6-10）</text>
<rect x="36.0" y="158.0" width="690.0" height="118.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="172.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="180.0" font-size="11" fill="#333333">①　包 wrapper（决定「图从哪开始到哪结束」）</text>
<text x="46.0" y="204.0" font-size="11" fill="#333333">FULL：在整模型外面包一层 CUDAGraphWrapper。PIECEWISE：由编译后端给每个子图各包一层（每个 attention 之间一段）。这一步决定了图的粒度，也决定了 attention 在不在图里。</text>
<rect x="36.0" y="306.0" width="690.0" height="118.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="320.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="328.0" font-size="11" fill="#333333">②　开「捕获闸门」</text>
<text x="46.0" y="352.0" font-size="11" fill="#333333">全局标志位打开：此刻允许捕获。若在别的时候触发捕获，会直接抛 CUDA graph capturing detected at an inappropriate time。</text>
<rect x="36.0" y="454.0" width="690.0" height="132.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="468.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="476.0" font-size="11" fill="#333333">③　切到侧流 + 冻住 GC + 清缓存量基线</text>
<text x="46.0" y="500.0" font-size="11" fill="#333333">必须在非默认 stream 上捕获，这样只录到本次的算子（不然会把别人的也录进去）。然后 synchronize + empty_cache，记下此刻的空闲显存 → 用来事后算「图占了多少钱」。</text>
<rect x="36.0" y="616.0" width="690.0" height="118.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="630.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="638.0" font-size="11" fill="#333333">④　拿到「进程级」的 graph 显存池</text>
<text x="46.0" y="662.0" font-size="11" fill="#333333">整个进程只有一个 pool（不是每张图一个）。所以多张图共用一块池，占用≈各桶峰值的最大值。</text>
<rect x="36.0" y="764.0" width="690.0" height="132.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="778.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="786.0" font-size="11" fill="#333333">⑤　排好捕获顺序：从大到小</text>
<text x="46.0" y="810.0" font-size="11" fill="#333333">代码注释写得很直白：先抓大形状，小形状可以复用大形状已经分配过的池内存。反过来（先小后大）会多占显存，甚至 OOM。</text>
<rect x="778.0" y="158.0" width="682.0" height="118.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="784.0" y="172.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="788.0" y="180.0" font-size="11" fill="#333333">⑥　每个桶先 warmup 几遍</text>
<text x="788.0" y="204.0" font-size="11" fill="#333333">在无图模式下把这一步空跑 N 遍（cudagraph_num_of_warmups，V1 默认 1）。目的是让算子库/通信库把 lazy 初始化都做完。</text>
<rect x="778.0" y="306.0" width="682.0" height="118.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="784.0" y="320.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="788.0" y="328.0" font-size="11" fill="#333333">⑦　warmup 完必须同步一次</text>
<text x="788.0" y="352.0" font-size="11" fill="#333333">注释原因：warmup 可能在辅助流上跑，不等它完成就开始捕获，会录到一半。</text>
<rect x="778.0" y="454.0" width="682.0" height="146.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="784.0" y="468.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="788.0" y="476.0" font-size="11" fill="#333333">⑧　把输入「钉」到固定地址（dummy run 里做）</text>
<text x="788.0" y="500.0" font-size="11" fill="#333333">input_ids / positions / slot_mapping / attn_metadata 全部取预先分配好的持久 buffer 的切片；捕获时 slot_mapping 全填 -1（跳过真正写 KV），attn_metadata 用 for_cudagraph_capture 专用构造。这就是「地址固定」约束的落地方式。</text>
<rect x="778.0" y="630.0" width="682.0" height="146.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="784.0" y="644.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="788.0" y="652.0" font-size="11" fill="#333333">⑨　真正的录制：在 torch.cuda.graph 里跑一遍 forward</text>
<text x="788.0" y="676.0" font-size="11" fill="#333333">with torch.cuda.graph(cudagraph, pool=全局pool, stream=当前侧流): output = self.runnable(...)这一跑被录成图；output 只留弱引用（省显存，因为它是池里的同一块）。昇腾侧对应 torch.npu.graph(...)。</text>
<rect x="778.0" y="806.0" width="682.0" height="118.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="784.0" y="820.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="788.0" y="828.0" font-size="11" fill="#333333">⑩　收尾：关闸门、锁 workspace、打日志</text>
<text x="788.0" y="852.0" font-size="11" fill="#333333">关掉捕获闸门；把通信 workspace 的尺寸锁死（回放期间改尺寸会让图里的指针失效）；打印 Graph capturing finished in N secs, took X GiB。</text>
<rect x="36.0" y="958.0" width="1424.0" height="96.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="972.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">它在启动流程里的位置（很容易记错）</text>
<text x="42.0" y="986.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">正确的顺序是：加载权重 → profile（eager 空跑一遍量激活峰值）→ 按剩余显存切 KV 块池 → 然后才捕获图。</text>
<text x="42.0" y="1000.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">原因：捕获本身也要占显存，而且要用「图显存池」去估；所以必须先把权重和 KV 的账算清，才知道还能不能抓图、抓多大。</text>

<p class="ptitle">④ 三个硬约束：图为什么「挑食」</p>
<p class="psub">一句话：录下来的图里记的是具体的地址和具体的形状，所以回放时必须一模一样；图里也不能有「回头问 CPU」的操作。三条约束各自对应一类常见故障。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="779"1258" viewBox="0 0 1576 1258">
<rect width="1576" height="1258" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">④ 三个硬约束：图为什么「挑食」</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：录下来的图里记的是具体的地址和具体的形状，所以回放时必须一模一样；图里也不能有「回头问 CPU」的操作。三条约束各自对应一类常见故障。</text>
<text x="36.0" y="134.0" font-size="11" fill="#333333">约束一：形状固定 —— 所以要「按桶捕获 + padding」</text>
<rect x="36.0" y="152.0" width="700.0" height="168.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="174.0" font-size="11" fill="#333333">为什么必须固定</text>
<text x="46.0" y="200.0" font-size="11" fill="#333333">图里的循环次数、reshape、kernel 的 grid 大小都由形状决定。形状变了 = 图里那些数都对不上 → 只能换一张图。而形状在真实流量里千变万化（1 个请求 / 7 个请求 / 44 个 token…），不可能每个都抓。</text>
<rect x="796.0" y="152.0" width="664.0" height="168.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="802.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="174.0" font-size="11" fill="#333333">本仓怎么解决：有限个桶 + 向上取整</text>
<text x="806.0" y="200.0" font-size="11" fill="#333333">只抓有限的一组尺寸（cudagraph_capture_sizes，如 1,2,4,8,16,…,512）。运行时的 batch 先「对齐到最近的桶」＝ padding（多出来的位置填占位）。padding 的具体落点：block_table 填 NULL_BLOCK_ID、slot_mapping 填 -1。副作用：padding 带来的空算力，也算在图的开销里（有 num_paddings 统计）。</text>
<text x="36.0" y="342.0" font-size="11" fill="#333333">约束二：地址固定 —— 所以要用「持久 buffer + copy_」</text>
<rect x="36.0" y="360.0" width="700.0" height="176.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="374.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="382.0" font-size="11" fill="#333333">为什么必须固定</text>
<text x="46.0" y="408.0" font-size="11" fill="#333333">图里记的是张量的显存地址，不是「第几个参数」。回放时如果输入换了一块新显存，图还是往老地址读 → 读到的是垃圾。所以每次进图前必须把新数据写进捕获时那几块地址。</text>
<rect x="796.0" y="360.0" width="664.0" height="176.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="802.0" y="374.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="382.0" font-size="11" fill="#333333">本仓怎么解决：预分配 + 每步 copy_</text>
<text x="806.0" y="408.0" font-size="11" fill="#333333">input_ids / positions / query_start_loc / seq_lens 等一次性按最大长度分配好（持久 buffer）。每步只做 copy_ 覆写这些 buffer 的前 N 个位置。代码里甚至有开关：debug 模式下会比对「捕获期与回放期的输入地址是否一致」，不一致直接抛 Input addresses for cudagraphs are different during replay。</text>
<text x="36.0" y="558.0" font-size="11" fill="#333333">约束三：图里不能有「回头问 CPU」的操作</text>
<rect x="36.0" y="576.0" width="700.0" height="176.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="590.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="598.0" font-size="11" fill="#333333">为什么</text>
<text x="46.0" y="624.0" font-size="11" fill="#333333">回放时 CPU 只发一条命令，之后不再参与。所以图里任何需要「读回一个值再决定下一步」的操作都没法工作：.item() / print / 动态分配 / 条件分支里的 Python 判断。更糟的是它们不会报错——只会把捕获那一刻的值「烤」进图里，于是你拿到一个永远算出旧结果、但一点也不报错的图。</text>
<rect x="796.0" y="576.0" width="664.0" height="176.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="802.0" y="590.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="598.0" font-size="11" fill="#333333">本仓的对应处理</text>
<text x="806.0" y="624.0" font-size="11" fill="#333333">捕获闸门：在非捕获窗口触发捕获会直接抛CUDA graph capturing detected at an inappropriate time。捕获期禁止重新分配：attention 后端看 forward_context.capturing 决定「只登记任务、不申请 workspace」。一次性准备全在图外：dummy run 里把 metadata 都构造好再进图。</text>
<rect x="36.0" y="792.0" width="1424.0" height="96.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="806.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">三张「故障 → 原因」速查（对得上就是这三条之一）</text>
<text x="42.0" y="820.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 输出全是重复/错乱的旧结果 → 某处 .item() 或分支被烤进图（约束三）。</text>
<text x="42.0" y="834.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 报 Input addresses ... different during replay → 有代码在回放时换了输入张量（约束二）。</text>
<text x="42.0" y="849.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 并发一上来反而变慢、图「没了」→ 形状超了最大桶，静默回落 eager（约束一）。</text>
<rect x="36.0" y="922.0" width="1424.0" height="112.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="936.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="950.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">桶与 padding：vllm/config/compilation.py:655-658（capture_sizes）、vllm/forward_context.py:29-58（BatchDescriptor）、vllm/v1/worker/gpu_model_runner.py:2353-2355 / :4150-4152（padding 落点）</text>
<text x="42.0" y="963.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">持久 buffer 与 copy_：vllm/v1/worker/gpu/input_batch.py:19-40、vllm/v1/worker/gpu_model_runner.py:4435、:1815</text>
<text x="42.0" y="977.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">地址校验断言：vllm/compilation/cuda_graph.py:348-357；breakable_cudagraph.py:422</text>
<text x="42.0" y="992.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">闸门与捕获期禁止分配：vllm/compilation/monitor.py:87-104；vllm-ascend/vllm_ascend/ascend_forward_context.py:177（capturing 标志）</text>
<text x="42.0" y="1007.5500000000001" font-size="11" fill="#333333" font-family="Microsoft YaHei">「.item() 被烤进图」的仓内注释：vllm/model_executor/models/cohere_compass.py:1633、vllm/v1/attention/backends/rocm_aiter_fa.py:778</text>
<rect x="36.0" y="1068.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1082.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：形状固定 → 按桶捕获 + padding；地址固定 → 持久 buffer + copy_；不能问 CPU → 一切动态准备都放在图外。三条里破一条，要么报错、要么静默算错、要么悄悄退回 eager。</text>

<text x="802.0" y="512.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">形状要求宽松，能覆盖 prefill；图段数随层数增长</text>
<rect x="1216.0" y="498.0" width="260.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1222.0" y="512.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">O1 默认；prefill/mixed 批次</text>
<rect x="36.0" y="536.0" width="200.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="550.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">FULL</text>
<rect x="236.0" y="536.0" width="560.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="242.0" y="550.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">整模型一张图，含 attention</text>
<rect x="796.0" y="536.0" width="420.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="802.0" y="550.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">最快，但要求 batch 形状规整（uniform decode）且地址固定</text>
<rect x="1216.0" y="536.0" width="260.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1222.0" y="550.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">只在 decode 用</text>
<rect x="36.0" y="574.0" width="200.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="588.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">FULL_DECODE_ONLY</text>
<rect x="236.0" y="574.0" width="560.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="242.0" y="588.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">decode 用 FULL，其余一律 eager</text>
<rect x="796.0" y="574.0" width="420.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="802.0" y="588.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">P/D 分离里 decode 实例的标准配置</text>
<rect x="1216.0" y="574.0" width="260.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1222.0" y="588.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">本仓 D 侧脚本就是这么配的</text>
<rect x="36.0" y="612.0" width="200.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="626.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">FULL_AND_PIECEWISE</text>
<rect x="236.0" y="612.0" width="560.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="242.0" y="626.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">decode 用 FULL，其它用 PIECEWISE</text>
<rect x="796.0" y="612.0" width="420.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="802.0" y="626.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">默认（O2）；兼顾两类流量，显存与启动开销最大</text>
<rect x="1216.0" y="612.0" width="260.0" height="38.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1222.0" y="626.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">vLLM 默认</text>
<rect x="36.0" y="686.0" width="700.0" height="168.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="700.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="708.0" font-size="11" fill="#333333">为什么 PIECEWISE 要把 attention 挖出去</text>
<text x="46.0" y="734.0" font-size="11" fill="#333333">attention 是不透明的 custom op，且它的形状随「KV 长度」变化——而 KV 长度每个请求都不同、每步都在变，无法在捕获时固定。所以编译时在 attention 处「打个断点」：前面进图、attention eager、后面再进图。这也解释了为什么 PIECEWISE 的图段数 ≈ 层数 ×2。</text>
<rect x="796.0" y="686.0" width="664.0" height="168.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="802.0" y="700.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="708.0" font-size="11" fill="#333333">那 FULL 凭什么能把 attention 也放进去</text>
<text x="806.0" y="734.0" font-size="11" fill="#333333">因为 decode 阶段的形状是「整齐」的：每请求 1 个 query token（spec decode 时 1+N），batch 大小又被 padding 到固定的桶。此时 attention 的 dynamic 部分只剩「KV 长度数组」，而它可以像别的输入一样被 copy_ 进固定 buffer。所以 FULL 只对「uniform decode」开放——这行判断在 dispatcher 里。</text>
<rect x="36.0" y="894.0" width="1424.0" height="92.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="908.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">怎么选（实用建议）</text>
<text x="42.0" y="922.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 想最快跑通/调试 → NONE（--enforce-eager）：启动最快、报错最直白。</text>
<text x="42.0" y="936.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 单机混跑 prefill+decode → 默认 FULL_AND_PIECEWISE（O2）。</text>
<text x="42.0" y="951.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ P/D 分离 → P 侧 NONE 或 PIECEWISE、D 侧 FULL_DECODE_ONLY（本仓部署脚本正是这样：P 与 edge 加 --enforce-eager，D 配 FULL_DECODE_ONLY）。</text>
<rect x="36.0" y="1020.0" width="1424.0" height="104.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1034.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="1048.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">模式枚举与语义：vllm/config/compilation.py:53-110、:614-649</text>
<text x="42.0" y="1061.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">默认值来自 -O 级别：vllm/config/vllm.py:277（O0→NONE）、:300（O1→PIECEWISE）、:323/:346（O2/O3→FULL_AND_PIECEWISE）、:447（默认 O2）</text>
<text x="42.0" y="1075.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">PIECEWISE 的切点 = attention 类 op：vllm/config/compilation.py:772-790、:1169（set_splitting_ops_for_v1）</text>
<text x="42.0" y="1090.6999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">attention 是「捕获期要打断」的 custom op：vllm/model_executor/layers/attention/attention.py:758-794（eager_break_during_capture）</text>
<text x="42.0" y="1105.5499999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei">两种 wrapper 的嵌套：vllm/v1/worker/gpu_model_runner.py:5453-5493</text>
<rect x="36.0" y="1156.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1170.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：PIECEWISE＝把 attention 挖空的「分段图」，形状宽松、段数多；FULL＝整张图，最快但只吃「整齐的 decode」；vLLM 默认两种都抓，运行时按 batch 形状挑一种。</text>
<text x="36.0" y="1262.0" font-size="11" fill="#333333">图例</text>

<div class="concl"><b>一句话结论　</b>PIECEWISE 把 attention 挖出去（attention 之间那些层进图），FULL 连 attention 一起进图（但只给「形状整齐的 decode」用）。vLLM 默认是两者都要（FULL_AND_PIECEWISE），按 batch 形状挑。</div>

<p class="ptitle">⑥ 形状桶与 dispatch：这一步到底用哪张图</p>
<p class="psub">一句话：启动时按「桶」抓了一批图；运行时先把本步的 batch 形状向上取整到某个桶，再按 (token 数, 是否整齐 decode, LoRA 数) 去查表 —— 查不到就用 eager。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="809"1306" viewBox="0 0 1576 1306">
<rect width="1576" height="1306" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑥ 形状桶与 dispatch：这一步到底用哪张图</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：启动时按「桶」抓了一批图；运行时先把本步的 batch 形状向上取整到某个桶，再按 (token 数, 是否整齐 decode, LoRA 数) 去查表 —— 查不到就用 eager。</text>
<text x="36.0" y="134.0" font-size="11" fill="#333333">第一步：桶不是连续的，是一串阶梯（本仓默认栅格）</text>
<rect x="36.0" y="152.0" width="1424.0" height="96.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="166.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">默认栅格 = 1, 2, 4 + 8, 16, 24, …, 248（步长 8）+ 256, 272, …, 上限（步长 16），上限默认 512（Blackwell 1024），且不超过 max_num_batched_tokens。</text>
<text x="42.0" y="179.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">还会补上 max_num_batched_tokens 本身；开 spec decode 时按 uniform_decode_query_len 的倍数补桶。</text>
<text x="42.0" y="194.35" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">含义：batch 越小越「细」，越大越「粗」——因为小 batch 的延迟最敏感。</text>
<text x="36.0" y="264.0" font-size="11" fill="#333333">第二步：一个 5 个请求、共 5 个 token 的 decode step 会发生什么</text>
<rect x="36.0" y="282.0" width="700.0" height="158.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="296.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="304.0" font-size="11" fill="#333333">① 先算本步形状</text>
<text x="46.0" y="330.0" font-size="11" fill="#333333">num_tokens = 5（5 个请求各 1 个新 token）uniform_decode = True（大家都只算 1 个 token）查表：5 → 落到桶 8（向上取整）</text>
<rect x="796.0" y="282.0" width="664.0" height="158.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="802.0" y="296.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="304.0" font-size="11" fill="#333333">② 把形状 padding 到 8</text>
<text x="806.0" y="330.0" font-size="11" fill="#333333">多出来的 3 个位置填占位：· block_table 填 NULL_BLOCK_ID（不指向真实块）· slot_mapping 填 -1（跳过写 KV）· seq_lens / query_start_loc 补成合法值输出只取前 5 个位置的结果（其余丢弃）。</text>
<text x="36.0" y="462.0" font-size="11" fill="#333333">第三步：dispatch 的查表顺序（三条路，最后一条是保底）</text>
<rect x="36.0" y="480.0" width="430.0" height="92.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="494.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 先查 FULL 的精确键</text>
<text x="42.0" y="508.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">(padded num_tokens, uniform, 活跃 LoRA 数) 完全匹配</text>
<rect x="506.0" y="480.0" width="460.0" height="92.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="512.0" y="494.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 再查 PIECEWISE 的放宽键</text>
<text x="512.0" y="508.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">PIECEWISE 不关心 num_reqs / uniform，键更宽松</text>
<rect x="996.0" y="480.0" width="464.0" height="92.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="1002.0" y="494.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 都不中 → 返回 NONE（eager）</text>
<text x="1002.0" y="508.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">⚠ 这一步没有任何日志，是最隐蔽的「图没了」</text>
<rect x="36.0" y="612.0" width="1424.0" height="118.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="626.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">四个「提前退出、直接 eager」的条件（都会让图静默失效）</text>
<text x="42.0" y="640.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 模式是 NONE（本来就没图）；② 桶还没初始化（还没捕获完）；③ num_tokens 超过最大桶（并发突然变高最容易踩）；④ 只允许 NONE 的特殊场景（例如某些 attention 后端 / encoder-decoder 不支持 FULL）。</text>
<text x="42.0" y="654.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">排查手法：看 KV cache usage 与 Running 请求数是否刚好越过了最大桶；或者直接开 --cudagraph-metrics 看命中率。</text>
<text x="36.0" y="746.0" font-size="11" fill="#333333">第四步：桶的上下界怎么被卡住（三个数决定）</text>
<rect x="36.0" y="764.0" width="320.0" height="34.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="42.0" y="778.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">参数</text>
<rect x="356.0" y="764.0" width="460.0" height="34.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="362.0" y="778.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">管什么</text>
<rect x="816.0" y="764.0" width="600.0" height="34.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="822.0" y="778.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">对桶的影响</text>
<rect x="36.0" y="798.0" width="320.0" height="34.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="812.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">max_num_seqs</text>
<rect x="356.0" y="798.0" width="460.0" height="34.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="362.0" y="812.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">同时跑的请求数上限</text>
<rect x="816.0" y="798.0" width="600.0" height="34.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="822.0" y="812.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">决定「最大桶大约多大」</text>
<rect x="36.0" y="832.0" width="320.0" height="34.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="846.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">max_num_batched_tokens</text>
<rect x="356.0" y="832.0" width="460.0" height="34.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="362.0" y="846.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一步的 token 预算</text>
<rect x="816.0" y="832.0" width="600.0" height="34.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="822.0" y="846.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">再给一个上界（chunked prefill 会打到这里）</text>
<rect x="36.0" y="866.0" width="320.0" height="34.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="880.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">max_cudagraph_capture_size</text>
<rect x="356.0" y="866.0" width="460.0" height="34.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>

<p class="ptitle">⑦ 启动期的捕获流程：它排在「权重 → profile → KV」之后</p>
<p class="psub">一句话：加载权重 → profile 量激活峰值 → 切 KV 块池 → 估算图显存 → 逐桶捕获。所以启动日志里「Graph capturing finished」永远出现在「Available KV cache memory」之后。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="803"1296" viewBox="0 0 1576 1296">
<rect width="1576" height="1296" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑦ 启动期的捕获流程：它排在「权重 → profile → KV」之后</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：加载权重 → profile 量激活峰值 → 切 KV 块池 → 估算图显存 → 逐桶捕获。所以启动日志里「Graph capturing finished」永远出现在「Available KV cache memory」之后。</text>
<text x="36.0" y="138.0" font-size="11" fill="#333333">第一步：启动时间线（前四步都是「为图做准备的账」）</text>
<rect x="36.0" y="156.0" width="224.0" height="78.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="170.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 加载权重</text>
<text x="42.0" y="184.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">权重先吃掉显存</text>
<rect x="272.0" y="156.0" width="224.0" height="78.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="278.0" y="170.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">② profile 空跑</text>
<text x="278.0" y="184.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">eager 跑一遍，量激活峰值</text>
<rect x="508.0" y="156.0" width="224.0" height="78.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="514.0" y="170.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 切 KV 块池</text>
<text x="514.0" y="184.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">剩余显存才给 KV</text>
<rect x="744.0" y="156.0" width="224.0" height="78.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="750.0" y="170.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">④ 估算图显存</text>
<text x="750.0" y="184.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">可选；失败不影响正确性</text>
<rect x="980.0" y="156.0" width="224.0" height="78.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="986.0" y="170.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑤ 逐桶捕获</text>
<text x="986.0" y="184.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">从大到小真跑一遍</text>
<rect x="1216.0" y="156.0" width="224.0" height="78.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1222.0" y="170.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑥ 锁 workspace</text>
<text x="1222.0" y="184.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">回放期不许改尺寸</text>
<text x="36.0" y="256.0" font-size="11" fill="#333333">第二步：四个容易搞错的点</text>
<rect x="36.0" y="274.0" width="700.0" height="132.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="288.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="48.0" y="296.0" font-size="11" fill="#333333">①　捕获必须在 profile 与 KV 之后</text>
<text x="48.0" y="320.0" font-size="11" fill="#333333">因为图本身要占显存（进程级图池），且要用这个池去估算。先抓图再算 KV，会把 KV 预算算错、甚至启动 OOM。</text>
<rect x="796.0" y="274.0" width="664.0" height="132.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="802.0" y="288.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="808.0" y="296.0" font-size="11" fill="#333333">②　图池是「进程级」的，不是每桶一份</text>
<text x="808.0" y="320.0" font-size="11" fill="#333333">所有桶共用一块池，占用 ≈ 各桶峰值的最大值。所以必须从大到小捕获：大桶先占下够用的池，小桶复用它。</text>
<rect x="36.0" y="446.0" width="700.0" height="132.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="460.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="48.0" y="468.0" font-size="11" fill="#333333">③　每个桶都要 warmup 几遍再录</text>
<text x="48.0" y="492.0" font-size="11" fill="#333333">warmup 会触发算子库/通信库的 lazy 初始化；不 warmup 直接录，图里会混进「第一次才发生」的初始化动作，回放时行为不一致。</text>
<rect x="796.0" y="446.0" width="664.0" height="132.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="802.0" y="460.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="808.0" y="468.0" font-size="11" fill="#333333">④　启动成本是可量化的</text>
<text x="808.0" y="492.0" font-size="11" fill="#333333">日志会打「Graph capturing finished in N secs, took X GiB」，还会同时打印「估算 vs 实际」的图显存对比，方便判断要不要缩桶。</text>

<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：图只覆盖「模型 forward」这一段；进图前要备好静态输入，出图后还要算 logits、采样、回收——这些都在图外。</text>
<text x="36.0" y="138.0" font-size="11" fill="#333333">把一次 step 从头走到尾，标出「图内 / 图外」</text>
<rect x="36.0" y="156.0" width="1424.0" height="62.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>

<text x="42.0" y="184.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">SchedulerOutput：每请求算几个 token + 新块的 block_ids。（图外，EngineCore 主线程）</text>

<text x="42.0" y="242.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">②　决定这一步用哪个桶 / 哪张图</text>
<text x="42.0" y="256.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">按 padded num_tokens + uniform + LoRA 数查表 → 得到 cudagraph_mode 与 batch_descriptor。查不到就是 NONE（eager）。</text>
<rect x="36.0" y="300.0" width="1424.0" height="62.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="314.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③　备好静态输入（图外）</text>
<text x="42.0" y="328.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">把本步的 input_ids / positions / slot_mapping / seq_lens 用 copy_ 写进持久 buffer 的前 N 个位置；slot_mapping 按 padded 长度补齐。</text>
<rect x="36.0" y="372.0" width="1424.0" height="62.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="386.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">④　进 forward context（图外）</text>
<text x="42.0" y="400.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">set_forward_context(attn_metadata, ..., num_tokens=num_tokens_padded, cudagraph_runtime_mode=, batch_descriptor=)——把「本步用哪张图」写进上下文，wrapper 在 forward 里读它。</text>
<rect x="36.0" y="444.0" width="1424.0" height="68.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="458.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑤　命中图 → replay()（图内只这一下）</text>
<text x="42.0" y="472.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">显存里已有这张图 → 一条 graph.replay()；CPU 只提交一次，设备按录好的顺序跑完整个 forward。</text>
<rect x="36.0" y="522.0" width="1424.0" height="62.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="536.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑥　取输出（图外，且输出是「池子里那块静态显存」）</text>
<text x="42.0" y="550.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">写 right 的是捕获期就定好的输出 buffer（弱引用）；再用它算 logits——注意 logits 与采样不在图里。</text>
<rect x="36.0" y="594.0" width="1424.0" height="62.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="608.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑦　采样 + 回收 + 回 CPU（图外）</text>
<text x="42.0" y="622.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">选 token、判结束、把结果搬回 CPU、写进 EngineCoreOutputs 发给前端。</text>
<rect x="36.0" y="666.0" width="1424.0" height="62.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>

<text x="42.0" y="694.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">写 KV 发生在 attention 自己的 op 里（图内），但写到哪由进图前算好的 slot_mapping 决定；padding 的位置填 -1，等于跳过。</text>
<rect x="36.0" y="744.0" width="1424.0" height="108.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="758.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么「采样 / logits」一定要留在图外（三个理由）</text>
<text x="42.0" y="772.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 形状不定：这一步要采几个 token 取决于 batch 里各请求的状态，而且 spec decode 还要按 draft 结果变；</text>
<text x="42.0" y="786.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 要问 CPU：判结束、算 stop 条件、生成输出事件都是 CPU 逻辑，进了图就再也问不了；</text>
<text x="42.0" y="801.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 要回主机：把 sampled token 搬回 CPU 是同步操作，图里禁止。</text>

<text x="46.0" y="454.0" font-size="11" fill="#333333">问题：attention 的这几个量每步都在变</text>

<text x="806.0" y="454.0" font-size="11" fill="#333333">解法：register_task + graph_task_update</text>
