<p class="lead">几个进程/线程、ZMQ 三通道、调度器、dp2tp4 流转、权重参与计算</p>

<figure id="p0">
<p class="ptitle">① 全景：一个 `vllm serve` 里，进程和线程是怎么分层的</p>
<p class="psub">一句话：进程边界由「谁能碰 NPU」决定，线程边界由「谁不能阻塞主循环」决定。看懂这两条，后面所有页都是在填细节。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="1039"1676" height="714"1152" viewBox="0 0 1676 1152">
<rect width="1676" height="1152" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">① 全景：一个 `vllm serve` 里，进程和线程是怎么分层的</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：进程边界由「谁能碰 NPU」决定，线程边界由「谁不能阻塞主循环」决定。看懂这两条，后面所有页都是在填细节。</text>
<text x="36.0" y="152.0" font-size="11" fill="#333333">进程层：父子关系（谁 spawn 了谁）</text>
<rect x="36.0" y="170.0" width="760.0" height="96.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="184.0" font-size="9" fill="#666666" font-family="Microsoft YaHei">主进程 = API server / frontend　vllm serve 敲下去后第一个活下来的进程</text>
<text x="42.0" y="196.15" font-size="11" fill="#333333" font-family="Microsoft YaHei">它对外提供 HTTP（OpenAI 兼容接口）和 SSE 流式输出；分词/反分词都在这个进程里，不在引擎里。</text>
<text x="42.0" y="211.0" font-size="9" fill="#666666" font-family="Microsoft YaHei">过程：uvicorn 起服 → 构造 AsyncLLM → 构造时就把 EngineCore 拉起来</text>
<rect x="96.0" y="296.0" width="700.0" height="104.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="102.0" y="310.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">EngineCore 进程 ×（每个 DP 分片一个）</text>
<text x="102.0" y="324.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">它才是「引擎」：跑调度器 + 主忙循环，是唯一允许碰 NPU 的 EngineCore 侧进程。</text>
<text x="102.0" y="339.70000000000005" font-size="9" fill="#666666" font-family="Microsoft YaHei">进程名 EngineCore / EngineCore_DP0…　·　与前端之间是 ZMQ 通道</text>
<rect x="156.0" y="430.0" width="640.0" height="104.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="162.0" y="444.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">worker 进程 ×（TP×PP 个）……或者根本没有</text>
<text x="162.0" y="458.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">真正跑模型前向的进程。TP×PP×DP==1 时不起新进程（uni 后端，worker 与 EngineCore 同进程）。</text>
<text x="162.0" y="473.70000000000005" font-size="9" fill="#666666" font-family="Microsoft YaHei">进程名 VllmWorker-N　·　与 EngineCore 之间是消息队列 RPC</text>
<rect x="156.0" y="564.0" width="640.0" height="76.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="162.0" y="578.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">（可选）外部进程：DP 协调进程 / LWD 的 ucx_daemon / PD proxy</text>
<text x="162.0" y="592.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">它们不参与前向，但会影响「进程总数」和「端口表」——见 ② 和 ⑨</text>
<text x="856.0" y="152.0" font-size="11" fill="#333333">线程层：每个进程内部都在忙什么</text>
<rect x="856.0" y="170.0" width="764.0" height="100.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="862.0" y="184.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">frontend：1 条 asyncio 事件循环承所有 HTTP</text>
<text x="862.0" y="198.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">主线程跑 uvicorn + FastAPI：每个请求都是这条 loop 上的一个协程</text>
<text x="862.0" y="211.0" font-size="9" fill="#333333" font-family="Microsoft YaHei">output_handler（一个 Task）：唯一「输出泵」，取引擎输出 → 反分词 → 推给请求</text>
<text x="862.0" y="223.15" font-size="9" fill="#333333" font-family="Microsoft YaHei">EngineCoreOutputQueueTask（一个 Task）：从 PULL socket 收引擎输出</text>
<text x="862.0" y="235.3" font-size="9" fill="#333333" font-family="Microsoft YaHei">MPClientEngineMonitor（真线程）：阻塞等 EngineCore 进程句柄，死了立刻知道</text>
<text x="862.0" y="247.45000000000002" font-size="9" fill="#333333" font-family="Microsoft YaHei">renderer 线程池（真线程）：把阻塞的分词/模板渲染甩出去，别卡 loop</text>
<rect x="856.0" y="330.0" width="764.0" height="100.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="862.0" y="344.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">EngineCore：1 个忙循环 + 2 个 IO 线程 + 1 个监控</text>
<text x="862.0" y="358.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">主线程 busy loop：取命令 → 跑一步 → 收集输出（唯一碰 NPU 的线程）</text>
<text x="862.0" y="371.0" font-size="9" fill="#333333" font-family="Microsoft YaHei">input 线程：收前端发来的 ADD/ABORT（ZMQ DEALER）</text>
<text x="862.0" y="383.15" font-size="9" fill="#333333" font-family="Microsoft YaHei">output 线程：把引擎输出推回前端（ZMQ PUSH）</text>
<text x="862.0" y="395.29999999999995" font-size="9" fill="#333333" font-family="Microsoft YaHei">MultiprocWorkerMonitor（真线程）：监听 worker 进程句柄</text>
<text x="862.0" y="407.44999999999993" font-size="9" fill="#333333" font-family="Microsoft YaHei">为什么拆 IO 线程：让「ZMQ 收发/序列化」和「NPU 前向」重叠，互不等待</text>
<rect x="856.0" y="500.0" width="764.0" height="100.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="862.0" y="514.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">worker：一条阻塞的 RPC 循环</text>
<text x="862.0" y="528.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">主线程 worker_busy_loop：逐条执行 EngineCore 下发的 RPC（含 execute_model）</text>
<text x="862.0" y="541.0" font-size="9" fill="#333333" font-family="Microsoft YaHei">ModelRunner 自己没有线程——它就是这条主线程里被调用的对象</text>
<text x="862.0" y="553.15" font-size="9" fill="#333333" font-family="Microsoft YaHei">torch 线程池被压到 1：避免多进程抢 CPU 自旋</text>
<text x="862.0" y="565.3" font-size="9" fill="#333333" font-family="Microsoft YaHei">KV connector 的后台线程（如 Mooncake 的发送/接收线程 + 32 线程池）</text>
<text x="862.0" y="577.4499999999999" font-size="9" fill="#333333" font-family="Microsoft YaHei">通信库（HCCL/NCCL）自己的 C++ 线程：Python 侧看不到</text>
<rect x="36.0" y="700.0" width="1600.0" height="96.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="714.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">两条边界，记住就不会混</text>
<text x="42.0" y="728.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 进程边界 = 谁能碰 NPU：worker 进程才是真正调模型的；EngineCore 是调度 + 下发；frontend 只管 HTTP 和分词。所以「模型加载」发生在 worker（或 uni 时的 EngineCore），前端永远看不到权重。</text>
<text x="42.0" y="743.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 线程边界 = 谁不能阻塞：前端主线程是 asyncio loop（一个阻塞调用就能卡住全站），EngineCore 主线程是忙循环（一步都不能停），所以阻塞活儿全被赶到别的线程/别的进程。</text>
<rect x="36.0" y="826.0" width="1424.0" height="104.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="840.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="854.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">进程树：vllm/v1/engine/utils.py:238-244（Process 名 EngineCore/EngineCore_DPn）、vllm/config/parallel.py:982-1027（world_size 与 uni/mp 判定）</text>
<text x="42.0" y="867.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">前端线程：vllm/entrypoints/launchers/launcher.py:100-111（uvicorn loop）、vllm/v1/engine/async_llm.py:841-908（output_handler）、vllm/v1/engine/core_client.py:774-801（进程监控线程）</text>
<text x="42.0" y="881.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">EngineCore 线程：vllm/v1/engine/core.py:1107-1134（两个 IO 线程及注释）、:1465-1476（busy loop）</text>
<text x="42.0" y="896.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">worker：vllm/v1/executor/multiproc_executor.py:1088-1118（worker_busy_loop）</text>
<rect x="36.0" y="962.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="976.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：一个实例通常长这样——1 个前端进程（1 条 loop + 若干 Task + 1 个监控线程）→ N 个 EngineCore 进程（各 1 忙循环 + 2 IO 线程）→ M 个 worker 进程（各 1 条 RPC 循环 + 若干后台线程）；其中 M 可以为 0（uni 后端，边端就是这样）。</text>

<p class="ptitle">② 进程个数怎么算：参数 → 进程树的一步步推导</p>
<p class="psub">一句话：进程数不是玄学，是四个数的加法——API server 个数（跟 DP 走）+ EngineCore 个数（跟 DP 走）+ worker 个数（跟 TP×PP 走）+ 若干「因为并行才多出来」的进程。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="760"1226" viewBox="0 0 1576 1226">
<rect width="1576" height="1226" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">② 进程个数怎么算：参数 → 进程树的一步步推导</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：进程数不是玄学，是四个数的加法——API server 个数（跟 DP 走）+ EngineCore 个数（跟 DP 走）+ worker 个数（跟 TP×PP 走）+ 若干「因为并行才多出来」的进程。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">第一步：四个加法项（每一项都由一个具体参数决定）</text>
<rect x="36.0" y="148.0" width="340.0" height="196.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="170.0" font-size="11" fill="#333333">①　API server 进程</text>
<text x="46.0" y="196.0" font-size="11" fill="#333333">由 --api-server-count 决定；不显式给时，内部负载均衡模式下默认 = data_parallel_size。&gt;1 时走多 API server：主进程只当「工头」，另外 fork 出 N 个子进程，用 SO_REUSEPORT 抢同一个端口。</text>
<rect x="398.0" y="148.0" width="340.0" height="196.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="404.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="408.0" y="170.0" font-size="11" fill="#333333">②　EngineCore 进程</text>
<text x="408.0" y="196.0" font-size="11" fill="#333333">由 --data-parallel-size 决定：本机每个 DP 分片一个 EngineCore，进程名形如 EngineCore_DP0。它才是「引擎」：跑调度 + 忙循环，前端通过 ZMQ 和它说话。</text>
<rect x="760.0" y="148.0" width="340.0" height="196.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="766.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="770.0" y="170.0" font-size="11" fill="#333333">③　worker 进程</text>
<text x="770.0" y="196.0" font-size="11" fill="#333333">由 TP × PP（以及是否 DP&gt;1）决定：· TP×PP×DP == 1 → uni 后端，worker 不另起进程（与 EngineCore 同进程）· 否则 → mp 后端，每 rank 一个 VllmWorker-N</text>

<text x="36.0" y="578.0" font-size="11" fill="#666666">读法：edge 那行走的是 uni 后端——世界大小 TP×PP×DP=1，所以 worker 就在 EngineCore 进程里跑，ps 看不到 Worker 进程，这是本仓边端「看起来只有 3 个进程」的原因。dp2_tp1 那行 API 是 3 个：主进程 + 2 个子进程（SO_REUSEPORT 共听 8600）。</text>

<text x="42.0" y="652.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">① DP 决定「几个引擎」：DP=2 就有 2 个 EngineCore 进程，各自独立调度。</text>
<text x="42.0" y="667.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">② TP/PP 决定「一个引擎里几个 worker 进程」；只有 1 个 rank 时不另起进程。</text>
<text x="42.0" y="682.5500000000001" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ API server 个数默认跟着 DP 走：DP=2 就 2 个 API 子进程抢同一个端口。</text>
<rect x="36.0" y="750.0" width="1424.0" height="116.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="764.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">三个容易搞错的边界条件（都有代码依据）</text>
<text x="42.0" y="778.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">① PCP 也要乘进去：一个 EngineCore 内的 worker 数 = TP × PP × PCP（PCP 是 prefill context parallel，一般都等于 1，所以平时忽略它）。</text>
<text x="42.0" y="793.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">② --enable-expert-parallel 不改变进程数：EP 只是把专家分组从 TP 扩到 TP×PCP×DP，进程数不受影响——所以「开了 EP 进程没变多」不是 bug。</text>
<text x="42.0" y="808.5500000000001" font-size="9" fill="#333333" font-family="Microsoft YaHei">③ 还能把 EngineCore 也塞回前端进程：VLLM_ENABLE_V1_MULTIPROCESSING=0 时用进程内客户端（但 AsyncLLM / 在线服务不允许这么干）。</text>

<text x="42.0" y="914.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：进程数 = API(跟 DP) + EngineCore(跟 DP) + Worker(跟 TP×PP，=1 时同进程) + 协调/daemon/proxy；所以「我明明只写了 tp=2，怎么有 4 个进程」通常是把 coordinator 和 API 子进程忘了。</text>

<figure id="p3">
<p class="ptitle">④ EngineCore 进程内部：一个忙循环，两个 IO 线程</p>
<p class="psub">这是整条链路里最关键的一个进程：调度、决策、下发都在这里。看明白它内部的 4 个线程，就明白「为什么 vLLM 能一边算一边收请求」。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="778"1256" viewBox="0 0 1576 1256">
<rect width="1576" height="1256" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">④ EngineCore 进程内部：一个忙循环，两个 IO 线程</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">这是整条链路里最关键的一个进程：调度、决策、下发都在这里。看明白它内部的 4 个线程，就明白「为什么 vLLM 能一边算一边收请求」。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">主线程：busy loop（唯一碰 NPU 的线程）</text>
<rect x="36.0" y="148.0" width="700.0" height="150.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">run_busy_loop：一直转，直到该退出</text>
<text x="42.0" y="176.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① _process_input_queue()：把排队中的命令取出来执行（ADD / ABORT / WAKEUP / UTILITY）</text>
<text x="42.0" y="190.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② _maybe_publish_request_counts()：把队列长度等统计发出去</text>
<text x="42.0" y="205.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ _process_engine_step()：跑一步（调度 → 执行模型 → 收集输出）</text>
<text x="42.0" y="220.04999999999998" font-size="9" fill="#666666" font-family="Microsoft YaHei">退出条件：处理到 shutdown 命令 → 返回 False → 抛 SystemExit</text>
<rect x="796.0" y="148.0" width="664.0" height="150.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="802.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么是「忙循环」而不是「事件驱动」</text>
<text x="802.0" y="176.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">推理是连续不停地算：只要有请求在跑，每一步都不能等。</text>
<text x="802.0" y="190.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">所以主线程不做任何可能阻塞的事——收包、发包、等待都被赶到了两个 IO 线程里。</text>
<text x="802.0" y="205.2" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="802.0" y="220.04999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">代价：主线程空转时会吃满一个核（这是设计取舍，不是 bug）。</text>
<text x="36.0" y="320.0" font-size="11" fill="#333333">两个 IO 线程：存在的唯一理由就是「别让主线程等」</text>
<rect x="36.0" y="338.0" width="700.0" height="160.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="352.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">input 线程（daemon）</text>
<text x="42.0" y="366.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">从 DEALER socket 收 multipart 帧 → 首帧是命令类型字节（ADD / ABORT / UTILITY…）→ msgpack 解码 → 塞进 input_queue 就完事。</text>
<text x="42.0" y="380.35" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="395.20000000000005" font-size="9" fill="#666666" font-family="Microsoft YaHei">主线程随后从 input_queue 里取。这样「网络收包」和「前向计算」并行。</text>
<text x="42.0" y="407.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">启动期如果这个线程先死，主线程会直接报 Input socket thread died during startup。</text>
<rect x="796.0" y="338.0" width="664.0" height="160.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="802.0" y="352.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">output 线程（daemon）</text>
<text x="802.0" y="366.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">从 output_queue 取 EngineCoreOutputs → msgpack 编码 → PUSH 给前端（或多 API server 时给对应客户端）。</text>
<text x="802.0" y="380.35" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="802.0" y="395.20000000000005" font-size="9" fill="#666666" font-family="Microsoft YaHei">编码后会复用 bytearray，用 ZeroMQ 的 MessageTracker 回收，避免反复申请内存。</text>
<text x="802.0" y="407.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">收到 ENGINE_CORE_DEAD 标记时：发完最后一帧就退出。</text>
<text x="36.0" y="520.0" font-size="11" fill="#333333">第 4 个线程：worker 进程监控（真线程，不是 Task）</text>
<rect x="36.0" y="538.0" width="1424.0" height="104.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="552.0" font-size="9" fill="#666666" font-family="Microsoft YaHei">MultiprocWorkerMonitor　（mp 后端才有：uni 时没有子进程可监控）</text>
<text x="42.0" y="564.15" font-size="10" fill="#333333" font-family="Microsoft YaHei">它阻塞在「等 worker 进程句柄」，一旦某个 worker 死了 → 调回调 → 往 input_queue 里塞一个 EXECUTOR_FAILED 命令 → 主线程下一轮取到它就 raise RuntimeError(&quot;Executor failed.&quot;) → 进程 cd 收尾并发 ENGINE_CORE_DEAD 给前端。</text>
<text x="36.0" y="664.0" font-size="11" fill="#333333">一张表收尾：EngineCore 进程里的线程清单</text>

<text x="42.0" y="696.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">线程</text>

<text x="342.0" y="696.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">干什么</text>

<text x="42.0" y="738.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 前端 bind、引擎 connect：前端先起来就能开服、挂住端口；引擎后起也能接上，还支持「引擎崩了重启再连」。</text>
<text x="42.0" y="753.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 下行用 ROUTER→DEALER：DEALER 的 identity 就是 dp_rank，于是多个 API server 子进程可以共享同一批 EngineCore，按 identity 精确路由到某个 DP 分片。</text>
<text x="42.0" y="768.5500000000001" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 上行用 PUSH→PULL：引擎只管推，前端只管收，不需要请求-响应配对；配上「每次 step 的输出打成一个包」，天然就是批量传输。</text>

<p class="ptitle">⑧ worker 进程内部：一条阻塞循环 + 三种后台线程</p>
<p class="psub">一句话：worker 主线程只做一件事——阻塞等 RPC、执行、回复；其它活儿（拷输出、盯父进程、搬 KV、通信库内部）都在后台线程。</p>

<text x="36.0" y="34.0" font-size="11" fill="#333333">⑧ worker 进程内部：一条阻塞循环 + 三种后台线程</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：worker 主线程只做一件事——阻塞等 RPC、执行、回复；其它活儿（拷输出、盯父进程、搬 KV、通信库内部）都在后台线程。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">主线程：worker_busy_loop（模型前向就发生在这里）</text>
<rect x="36.0" y="148.0" width="700.0" height="138.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">worker_busy_loop</text>
<text x="42.0" y="176.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">阻塞在「从广播队列取 RPC」→ 取到就同步执行 `worker.(...)` → 把结果放回响应队列 → 继续等。</text>
<text x="42.0" y="190.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">`execute_model` 也只是其中一种 RPC。</text>
<text x="42.0" y="205.2" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="220.04999999999998" font-size="9" fill="#333333" font-family="Microsoft YaHei">常见误解：以为 ModelRunner 有自己的线程池——它没有，它就是这条主线程里被调用的对象。</text>
<rect x="796.0" y="148.0" width="664.0" height="138.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="802.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么这里可以「阻塞等」</text>
<text x="802.0" y="176.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">因为 worker 不需要同时做别的事：一次只有一个「执行计划」要跑，跑完回结果，等下一个。</text>
<text x="802.0" y="190.35" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="802.0" y="205.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">对比前端：那里一条 loop 要伺候成千上万个连接，所以绝不能阻塞——同一个「不能阻塞」的道理，在两处的解法完全相反。</text>
<text x="36.0" y="308.0" font-size="11" fill="#333333">后台线程：分三类（哪类出现取决于启动参数与连接器）</text>

<text x="42.0" y="340.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 框架自带</text>
<text x="42.0" y="354.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">· WorkerAsyncOutputCopy（仅 --async-scheduling）：把「拷贝 worker 输出」拆出去，不和主循环抢</text>
<text x="42.0" y="368.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">· DeathPipeMonitor：盯着父进程的死亡管道，父死就通知收尾</text>
<text x="42.0" y="383.20000000000005" font-size="11" fill="#333333" font-family="Microsoft YaHei">· torch 线程池压到 1：避免多进程互相抢 CPU（这是主动做的，不是限制）</text>

<text x="524.0" y="383.20000000000005" font-size="11" fill="#333333" font-family="Microsoft YaHei">· KVCacheRecvingThread（D 侧搬运工）</text>
<text x="524.0" y="398.05000000000007" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 它内部的 32 线程池（按对端分桶）</text>

<text x="36.0" y="34.0" font-size="11" fill="#333333">⑩ 排障地图：进程、线程、端口、日志各自该看什么</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">这一页是工具页：线上/本机出问题时，按「先看有几层进程 → 再看线程 → 再看端口 → 最后看日志」的顺序，能快速把问题定位到某一层。</text>
<text x="36.0" y="128.0" font-size="11" fill="#333333">第一步：用四条命令把「进程树 / 线程 / 端口」看清</text>

<text x="42.0" y="172.15" font-size="11" fill="#333333" font-family="Microsoft YaHei">ps -ef | grep -E &quot;vllm|EngineCore|WorkerProc&quot; | grep -v grep</text>

<text x="42.0" y="201.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">pstree -p 　或　ps -o pid,ppid,cmd -e | grep vllm</text>
<text x="42.0" y="216.7" font-size="11" fill="#333333" font-family="Microsoft YaHei"># 3. 这个进程里有几个线程</text>
<text x="42.0" y="231.54999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">top -H -p 　或　cat /proc//status | grep Threads　或　py-spy dump --pid （看每个线程卡在哪个 Python 栈）</text>
<text x="42.0" y="246.39999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei"># 4. 端口谁在听、谁在连</text>
<text x="42.0" y="261.25" font-size="11" fill="#333333" font-family="Microsoft YaHei">ss -lntp | grep -E &quot;8510|8600|8601|8102|14570|14580&quot;　（端口表见 ⑨ 页）</text>

<text x="42.0" y="676.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">通常是：EngineCore 进程死了　→　先做：先 ps 看 EngineCore 还在不在；再翻它退出前的日志（OOM / assert）</text>

<text x="42.0" y="736.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">卡在启动，永远不 ready</text>
<text x="42.0" y="750.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">通常是：worker 里有进程没起来或握手没完成　→　先做：看 worker 日志最后一行；ss 看端口有没有 listen；等的是哪个 ready</text>

<text x="42.0" y="824.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">通常是：线程池/后台线程卡住或 ZMQ 队列堵了　→　先做：py-spy dump 看 frontend 与 EngineCore 主线程栈；看输出通道是否积压</text>

<text x="42.0" y="898.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">通常是：KV 块没释放（钉住没解）或进程泄漏　→　先做：看 KV cache usage 是否只涨不落；对端是否一直没回执</text>

<text x="42.0" y="1076.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">· EngineCore 进程数 = DP 外部分片的数量（internal 模式由引擎自己起多份）</text>

<figure id="p10">
<p class="ptitle">⑪ Scheduler 是什么：一个「每一步挑一批请求去算」的决定器</p>
<p class="psub">一句话：调度器不碰 NPU、不搬 KV，它只做三件事——决定这一步算哪些请求、每个请求算几个 token、给它分哪些 KV 块。它跑在 EngineCore 主线程的忙循环里（第 ④ 页）。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="825"1332" viewBox="0 0 1576 1332">
<rect width="1576" height="1332" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑪ Scheduler 是什么：一个「每一步挑一批请求去算」的决定器</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：调度器不碰 NPU、不搬 KV，它只做三件事——决定这一步算哪些请求、每个请求算几个 token、给它分哪些 KV 块。它跑在 EngineCore 主线程的忙循环里（第 ④ 页）。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：它只有四个容器（读代码时先认这四个）</text>
<rect x="36.0" y="150.0" width="340.0" height="132.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">requests（字典）</text>
<text x="42.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">req_id → Request：所有没完成的请求都在这里，不管它在哪个队列。</text>
<text x="42.0" y="192.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">scheduler.py:194</text>
<rect x="398.0" y="150.0" width="340.0" height="132.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="404.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">waiting（队列）</text>
<text x="404.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">还没开始算的请求。默认 FCFS（就是个 deque），换 priority 策略就变小顶堆。</text>
<text x="404.0" y="192.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">:203 · request_queue.py:75</text>
<rect x="760.0" y="150.0" width="340.0" height="132.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="766.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">skipped_waiting（队列）</text>
<text x="766.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">这一步被跳过的等待请求：等语法、等远端 KV、等流式输入。它和 waiting 是两个队。</text>

<figure id="p11">
<p class="ptitle">⑫ 一次 schedule() 里到底发生了什么（五段流程）</p>
<p class="psub">一句话：先排老的（running）→ 要块 → 块不够就抢占 → 再收新的（waiting）→ 产出执行计划。顺序不能反：本步一旦抢占，就不再收新请求。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="1021"1648" viewBox="0 0 1576 1648">
<rect width="1576" height="1648" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑫ 一次 schedule() 里到底发生了什么（五段流程）</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：先排老的（running）→ 要块 → 块不够就抢占 → 再收新的（waiting）→ 产出执行计划。顺序不能反：本步一旦抢占，就不再收新请求。</text>
<rect x="36.0" y="156.0" width="1424.0" height="120.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="170.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="48.0" y="178.0" font-size="11" fill="#333333">①　开场：数预算、开新的一步</text>
<text x="48.0" y="204.0" font-size="11" fill="#333333">token 预算 = max_num_scheduled_tokens（没配就回落到 max_num_batched_tokens）；input 预算 = max_num_batched_tokens。给 KV 块池发「新一步开始」的通知（new_step_starts），并算出这一步是否要推迟 prefill（DP 波次节流）。⚠ 两个预算同时存在：一个管「发多少 token」，一个管「喂多少 input token」。</text>
<rect x="36.0" y="292.0" width="1424.0" height="140.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="306.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="48.0" y="314.0" font-size="11" fill="#333333">②　先排老的：running 里的请求挨个算「这一步给它几个 token」</text>
<text x="48.0" y="340.0" font-size="11" fill="#333333">每个请求：还差多少 = num_tokens（含 spec）− num_computed_tokens；再被 long_prefill_token_threshold 截断、被剩余预算压小、再按 max_model_len / LWD 窗口 / MTP lookahead 收紧。算出来是 0 就跳过这个、看下一个（continue，不是 break）。拿到数字后立刻去要 KV 槽位（下一段）。</text>
<rect x="36.0" y="448.0" width="1424.0" height="156.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="462.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="48.0" y="470.0" font-size="11" fill="#333333">③　要 KV：要不到就抢占（本版本只有「重算」一种）</text>
<text x="48.0" y="496.0" font-size="11" fill="#333333">要块：allocate_slots(请求, num_new_tokens)。块不够返回 None。抢占谁：FCFS 直接挑 running 队尾；priority 策略挑「优先级最低 / 最晚到」的那个。被抢占的代价：释放它的 KV 块、num_computed_tokens 归零、插回 waiting 队头——下次重新 prefill（没有「换出到 CPU」这种模式）。⚠ 一旦本步发生抢占，第 ④ 段直接跳过：这一步不再接新请求。</text>
<rect x="36.0" y="624.0" width="1424.0" height="178.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="638.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="48.0" y="646.0" font-size="11" fill="#333333">④　再收新的：从 waiting 里挑人，先查前缀缓存</text>
<text x="48.0" y="672.0" font-size="11" fill="#333333">准入条件：还有 token 预算、running 数没到 max_num_seqs、本步没抢占。先看 skipped_waiting（上一步被跳过的），再看 waiting。若请求 num_computed_tokens == 0：查前缀缓存（按 block_hashes 找最长命中，最多命中到 num_tokens − 1，因为最后一个 token 必须重算才能出 logits）。本地命中 + 远端命中（connector）合并成 num_computed_tokens；本步只算剩下的。PD 场景：若 connector 说「要异步拉 KV」，则只分块不算 token，状态置 WAITING_FOR_REMOTE_KVS，放回 skipped_waiting。</text>
<rect x="36.0" y="824.0" width="1424.0" height="140.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="838.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="48.0" y="846.0" font-size="11" fill="#333333">⑤　收尾：产出执行计划，并推进「已算多少」</text>
<text x="48.0" y="872.0" font-size="11" fill="#333333">组装 SchedulerOutput：每请求 num_scheduled_tokens + 新块的 block_ids（注意 SchedulerOutput 里没有 slot_mapping，那是 worker 自己算的）。把本步的 token 数累加进 num_computed_tokens（异步调度下还要维护 placeholder），清掉 finished / preempted 集合。这份计划通过消息队列广播给所有 TP worker —— 同一份对象、4 个 worker 各拿一份。</text>
<text x="36.0" y="968.0" font-size="11" fill="#333333">抢占到底做了什么（顺序很重要，代码就是这么写的）</text>

<figure id="p14">
<p class="ptitle">⑮ 模型加载：从权重文件到 NPU 显存（8 步）</p>
<p class="psub">一句话：先读 config 知道模型长什么样 → 在 NPU 上搭一个空骨架 → 逐个张量从磁盘读出来、按 TP 切好、拷进对应的参数里 → 再做格式/量化后处理。加载完才轮到 profile 显存、切 KV 块池。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="899"1450" viewBox="0 0 1576 1450">
<rect width="1576" height="1450" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑮ 模型加载：从权重文件到 NPU 显存（8 步）</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：先读 config 知道模型长什么样 → 在 NPU 上搭一个空骨架 → 逐个张量从磁盘读出来、按 TP 切好、拷进对应的参数里 → 再做格式/量化后处理。加载完才轮到 profile 显存、切 KV 块池。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一排：先看清磁盘上有什么（不读权重也能知道很多）</text>
<rect x="36.0" y="150.0" width="466.0" height="132.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="172.0" font-size="11" fill="#333333">①　config.json：模型的结构与 dtype</text>
<text x="46.0" y="196.0" font-size="11" fill="#333333">层数、hidden、head 数、dtype、是否量化都在这里。读不到会直接报 Invalid repository ID or local directory。</text>
<rect x="526.0" y="150.0" width="466.0" height="132.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="532.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="536.0" y="172.0" font-size="11" fill="#333333">②　权重分片：*.safetensors</text>
<text x="536.0" y="196.0" font-size="11" fill="#333333">大模型切成多个文件（shard）。每片里是一堆名字 → 张量。读盘用 safe_open，拿到的是 CPU 张量。</text>
<rect x="1016.0" y="150.0" width="444.0" height="132.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="1022.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1026.0" y="172.0" font-size="11" fill="#333333">③　index.json：名字 → 在哪个分片</text>
<text x="1026.0" y="196.0" font-size="11" fill="#333333">有它在才能只读该读的片；索引点名的文件缺失会报 Weight files referenced in index but missing。</text>
<text x="36.0" y="304.0" font-size="11" fill="#333333">第二排：进 NPU 的三步（关键：参数是「先分配、后填充」）</text>
<rect x="36.0" y="322.0" width="466.0" height="156.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="336.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="344.0" font-size="11" fill="#333333">④　在 NPU 上搭空骨架</text>
<text x="46.0" y="368.0" font-size="11" fill="#333333">在 device 上下文里建模型 → 每个 nn.Parameter 一开始就分配在 NPU 上（还没填数）。所以后面不是「把权重搬到 NPU」，而是「往 NPU 上已有的参数里写数」。</text>
<rect x="526.0" y="322.0" width="466.0" height="156.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="532.0" y="336.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="536.0" y="344.0" font-size="11" fill="#333333">⑤　名字映射 + 选 weight_loader</text>
<text x="536.0" y="368.0" font-size="11" fill="#333333">checkpoint 的名字（q_proj/k_proj/v_proj）→ 拼成模型的 qkv_proj；每个参数自己带一个 weight_loader，决定「怎么切、怎么拷」。</text>
<rect x="1016.0" y="322.0" width="444.0" height="156.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="1022.0" y="336.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1026.0" y="344.0" font-size="11" fill="#333333">⑥　切片 + 拷进去（每张量一次）</text>
<text x="1026.0" y="368.0" font-size="11" fill="#333333">TP&gt;1 时：从全量张量里 narrow 出本 rank 的那一段，然后 param.data.copy_(切片) —— 这一步才是真正的 CPU→NPU 拷贝。</text>
<text x="36.0" y="500.0" font-size="11" fill="#333333">第三排：加载完还要「改写格式」，然后才轮到 KV cache</text>
<rect x="36.0" y="518.0" width="700.0" height="168.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="532.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="540.0" font-size="11" fill="#333333">⑦　后处理：量化 / 布局转换</text>
<text x="46.0" y="564.0" font-size="11" fill="#333333">process_weights_after_loading：· 把 fp32 参数换成 fp16/bf16（如需要）· 昇腾上做 ND → NZ 布局重排（npu_format_cast(..., ACL_FORMAT_FRACTAL_NZ)），让矩阵乘更快· 权重绑定 / 融合⚠ 这一步是「就地换掉 weight.data」，不是再拷一次。</text>
<rect x="760.0" y="518.0" width="700.0" height="168.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="766.0" y="532.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="770.0" y="540.0" font-size="11" fill="#333333">⑧　此时才 profile 显存 → 切 KV 块池</text>
<text x="770.0" y="564.0" font-size="11" fill="#333333">顺序是硬性的：权重先吃掉显存 → 跑一次 profile 量出激活峰值 → 剩余显存才切成 KV 块。所以「权重变大 = KV 块变少 = 并发变低」，三者是一条链。</text>

<p class="ptitle">⑯ 权重怎么参与计算：一次 forward 的调用链</p>
<p class="psub">一句话：加载时写的是 layer.weight，计算时读的也是同一个 layer.weight——中间没有第二次搬运。所谓「参与计算」，就是把激活张量和这份权重做矩阵乘。</p>

<text x="36.0" y="34.0" font-size="11" fill="#333333">⑯ 权重怎么参与计算：一次 forward 的调用链</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：加载时写的是 layer.weight，计算时读的也是同一个 layer.weight——中间没有第二次搬运。所谓「参与计算」，就是把激活张量和这份权重做矩阵乘。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">一条调用链走到底（dense 模型，例如 Qwen/Llama 类）</text>

<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">model.forward(input_ids)</text>
<text x="42.0" y="178.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">入口</text>
<rect x="36.0" y="216.0" width="700.0" height="56.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>

<text x="42.0" y="296.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">× N 层：layernorm → attention → layernorm → MLP</text>

<text x="42.0" y="362.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">qkv_proj(hidden_states) → GEMM</text>
<text x="42.0" y="376.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">qkv_proj.weight（列并行，切输出维）</text>

<text x="42.0" y="428.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">attention(q,k,v) → 读写 KV cache</text>

<text x="42.0" y="574.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">MLP 权重（同样列/行并行）</text>
<rect x="36.0" y="612.0" width="700.0" height="56.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="626.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">lm_head(hidden) → logits</text>
<text x="42.0" y="640.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">lm_head.weight（按词表切）</text>
<text x="796.0" y="132.0" font-size="11" fill="#333333">右侧：三处细节（TP 时各自怎么切、谁做通信）</text>
<rect x="796.0" y="150.0" width="664.0" height="128.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="802.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 列并行 Linear（qkv_proj / gate_up_proj）</text>
<text x="802.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">权重按输出维切：每个 rank 只算自己那部分输出（比如自己那 1/4 个 head 或 1/4 的中间维）。</text>
<text x="802.0" y="192.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">特点：forward 里不需要通信——算完各 rank 手上是一段不同的特征。</text>
<rect x="796.0" y="298.0" width="664.0" height="128.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="802.0" y="312.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 行并行 Linear（o_proj / down_proj）</text>
<text x="802.0" y="326.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">权重按输入维切：每个 rank 都在自己那段输入上做乘加，得到的是部分和。</text>
<text x="802.0" y="340.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">特点：forward 末尾必须 all_reduce 把 4 个 part 加起来——这是 TP 的通信成本来源。</text>
<rect x="796.0" y="446.0" width="664.0" height="128.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="802.0" y="460.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 并行 Embedding / LMHead</text>
<text x="802.0" y="474.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">按词表维切：每个 rank 只持有词表的一段（尾部要补零对齐）。</text>
<text x="802.0" y="488.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">查表时先看这个 id 在不在自己那段，不在就返回 0，最后 all_reduce；lm_head 反过来按词表段算 logits。</text>
