<p class="lead">传输引擎三步曲、块级 pull、回执、失败兜底</p>
<p class="lead">本页 10 张图；点击编号跳转：<a href="#p0">1</a> <a href="#p1">2</a> <a href="#p2">3</a> <a href="#p3">4</a> <a href="#p4">5</a> <a href="#p5">6</a> <a href="#p6">7</a> <a href="#p7">8</a> <a href="#p8">9</a> <a href="#p9">10</a></p>
<figure id="p0">
<p class="ptitle">① 为什么要把 KV Cache 搬到另一台机器上（从 attention 说起）</p>
<p class="psub">看懂本页只需要两件事：attention 里的 K / V 是什么；矩阵乘法的量级大概怎么估。其余概念本页现场解释，不预设你懂推理框架。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="612"988" viewBox="0 0 1576 988">
<rect width="1576" height="988" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">① 为什么要把 KV Cache 搬到另一台机器上（从 attention 说起）</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">看懂本页只需要两件事：attention 里的 K / V 是什么；矩阵乘法的量级大概怎么估。其余概念本页现场解释，不预设你懂推理框架。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">第一件事：attention 里的 K / V 是什么</text>
<rect x="36.0" y="152.0" width="470.0" height="124.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">Q / K / V 都是矩阵乘法的产物</text>
<text x="42.0" y="180.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">每个 token 的隐向量 x，乘三个权重矩阵 W_Q / W_K / W_V，得到它的 query / key / value。</text>
<text x="42.0" y="195.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">Attention(Q, K, V) = softmax(QKᵀ / √d) · V</text>
<rect x="548.0" y="152.0" width="470.0" height="124.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="554.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">关键观察：K / V 只由「已经见过的 token」决定</text>
<text x="554.0" y="180.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">第 t 步算 attention 时，前 t 个 token 的 K / V 已经算过、之后不再变（它们的输入没变）。</text>
<text x="554.0" y="195.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">只有 Q 是新的：最新那个 token 要发问。</text>
<rect x="1060.0" y="152.0" width="470.0" height="124.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="1066.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">所以：把 K / V 存下来，别每次重算</text>
<text x="1066.0" y="180.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">这张「历史 token 的 K / V 记账表」就是 KV Cache。</text>
<text x="1066.0" y="195.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">代价是占显存；换来的是省掉重复的矩阵乘法。</text>
<text x="36.0" y="316.0" font-size="11" fill="#333333">第二件事：这张表在显存里有多大（会算这个就够了）</text>
<rect x="36.0" y="338.0" width="470.0" height="196.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="352.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">形状：一张 4 维的表</text>
<text x="42.0" y="366.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">层数 × token 位置 × {K, V} × (KV 头数 × 每头维度)</text>
<text x="42.0" y="381.70000000000005" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="396.55000000000007" font-size="9" fill="#666666" font-family="Microsoft YaHei">层 0 → token 0..t 的 K 、token 0..t 的 V</text>
<text x="42.0" y="408.70000000000005" font-size="11" fill="#333333" font-family="Microsoft YaHei">层 1 → …</text>
<text x="42.0" y="423.55000000000007" font-size="11" fill="#333333" font-family="Microsoft YaHei">层 31 → …</text>
<text x="42.0" y="438.4000000000001" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="453.2500000000001" font-size="11" fill="#333333" font-family="Microsoft YaHei">每个格子里是一个 fp16 数，占 2 字节。</text>
<text x="552.0" y="352.0" font-size="11" fill="#333333">算一笔账（假设 32 层、8 个 KV 头、每头 128 维）</text>
<rect x="552.0" y="372.0" width="176.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="558.0" y="386.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">项目</text>
<rect x="728.0" y="372.0" width="290.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="734.0" y="386.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">数量</text>
<rect x="552.0" y="412.0" width="176.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="558.0" y="426.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">单个 token 的 KV</text>
<rect x="728.0" y="412.0" width="290.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="734.0" y="426.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">32×2×8×128×2 B ≈ 128 KB</text>
<rect x="552.0" y="452.0" width="176.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="558.0" y="466.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一条 4K token 的请求</text>
<rect x="728.0" y="452.0" width="290.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="734.0" y="466.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">4096 × 128 KB ≈ 512 MB</text>
<rect x="552.0" y="492.0" width="176.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="558.0" y="506.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">128 条并发请求</text>
<rect x="728.0" y="492.0" width="290.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="734.0" y="506.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">128 × 512 MB ≈ 64 GB</text>
<rect x="552.0" y="532.0" width="176.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="558.0" y="546.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一张 64 GB 的卡</text>
<rect x="728.0" y="532.0" width="290.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="734.0" y="546.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">权重占 ~40 GB，只剩 20 多 GB</text>
<rect x="1060.0" y="338.0" width="470.0" height="196.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="1066.0" y="352.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">结论：显存是硬约束</text>
<text x="1066.0" y="366.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">同一张卡上，模型权重和 KV cache 抢同一块显存。并发一多、上下文一长，KV 就把它吃光。</text>
<text x="1066.0" y="381.70000000000005" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1066.0" y="396.55000000000007" font-size="11" fill="#333333" font-family="Microsoft YaHei">→ 于是把 prefill（算 KV） 和 decode（用 KV） 拆到两拨机器上。</text>
<text x="36.0" y="566.0" font-size="11" fill="#333333">第三件事：机器拆开后，KV 就躺在「别人的显存」里</text>
<rect x="36.0" y="588.0" width="470.0" height="150.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="602.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">P 机（prefill）</text>
<text x="42.0" y="616.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">拿到整段 prompt，一次算完，所以它显存里有一段对话的完整 KV。</text>
<text x="42.0" y="631.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">算完它其实就没事了：后面每生成一个字都不需要它再算什么。</text>
<rect x="548.0" y="588.0" width="470.0" height="150.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="554.0" y="602.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">于是必须「搬 KV」</text>
<text x="554.0" y="616.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">把 P 机显存里那几十/几百 MB，经网卡搬到 D 机显存里。</text>
<text x="554.0" y="631.7" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="554.0" y="646.5500000000001" font-size="11" fill="#333333" font-family="Microsoft YaHei">这件事就是本仓用 Mooncake 干的活。</text>
<rect x="1060.0" y="588.0" width="470.0" height="150.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="1066.0" y="602.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">D 机（decode）</text>
<text x="1066.0" y="616.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">一个字一个字往外蹦，每个字都要用完整历史 KV。</text>
<text x="1066.0" y="631.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">但它手里没有那段 prompt 的 KV——除非有人搬给它。</text>
<rect x="36.0" y="794.0" width="1424.0" height="62.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="808.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：K / V 算一次就不变 → 值得存（KV cache）→ 它很占显存 → 所以把 prefill / decode 拆到两拨机器 → 于是 KV 必须跨机搬 → 搬它的工具就是 Mooncake。</text>
<text x="36.0" y="904.0" font-size="11" fill="#333333">图例</text>
<rect x="148.0" y="887.0" width="120.0" height="26.0" rx="4" fill="#eceff1" stroke="#607d8b"/>
<text x="154.0" y="901.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">客户端</text>
<rect x="276.0" y="887.0" width="120.0" height="26.0" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="282.0" y="901.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">边端 edge</text>
<rect x="404.0" y="887.0" width="120.0" height="26.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="410.0" y="901.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">云 P (prefill)</text>
<rect x="532.0" y="887.0" width="120.0" height="26.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="538.0" y="901.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">云 D (decode)</text>
<rect x="660.0" y="887.0" width="120.0" height="26.0" rx="4" fill="#b0e3e6" stroke="#0e8088"/>
<text x="666.0" y="901.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">PD Proxy</text>
<rect x="788.0" y="887.0" width="120.0" height="26.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="794.0" y="901.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">中立/通用</text>
<rect x="916.0" y="887.0" width="120.0" height="26.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="922.0" y="901.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">失败/取消</text>
<rect x="1044.0" y="887.0" width="240.0" height="26.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="1050.0" y="901.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">数据面 = 搬 KV 的通道</text>
<text x="210.0" y="938.0" font-size="11" fill="#666666">控制面 ZMQ</text>
<text x="460.0" y="938.0" font-size="11" fill="#666666">数据面 UCX·Mooncake</text>

<div class="concl"><b>一句话结论　</b>这一页：K / V 算一次就不变 → 值得存（KV cache）→ 它很占显存 → 所以把 prefill / decode 拆到两拨机器 → 于是 KV 必须跨机搬 → 搬它的工具就是 Mooncake。</div>

<figure id="p1">
<p class="ptitle">② 一句话认识 Mooncake：把 KV 当成「可搬的货物」</p>
<p class="psub">Mooncake 是月之暗面（Moonshot）开源的一套「以 KV 为中心」的推理基础设施。本页只讲清它由哪两块组成、我们把哪一块用在什么地方。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="626"1010" viewBox="0 0 1576 1010">
<rect width="1576" height="1010" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">② 一句话认识 Mooncake：把 KV 当成「可搬的货物」</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">Mooncake 是月之暗面（Moonshot）开源的一套「以 KV 为中心」的推理基础设施。本页只讲清它由哪两块组成、我们把哪一块用在什么地方。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">第一步：认清这条链路上的三个角色</text>
<rect x="36.0" y="150.0" width="470.0" height="120.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">P = Producer（生产者）</text>
<text x="42.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">prefill 机器。它算出了 KV，手上有一批「货」要交给别人。</text>
<text x="42.0" y="193.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">代码里：prefill 实例 / 角色 role=cloud-P / 日志里的 P 侧</text>
<rect x="546.0" y="150.0" width="470.0" height="120.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="552.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">D = Consumer（消费者）</text>
<text x="552.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">decode 机器。它需要这批货才能继续生成下一个字。</text>
<text x="552.0" y="193.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">代码里：decode 实例 / 角色 role=cloud-D / 日志里的 D 侧</text>
<rect x="1056.0" y="150.0" width="470.0" height="120.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="1062.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">搬运通道 = Transfer Engine</text>
<text x="1062.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">连接两台机器的「卡车」：只负责把一段内存从 A 搬到 B，不关心里面装的是什么。</text>
<text x="1062.0" y="193.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">这才是本仓真正用到的那一块</text>
<text x="36.0" y="320.0" font-size="11" fill="#333333">第二步：用「寄快递」把这个过程整体类比一遍</text>
<rect x="36.0" y="340.0" width="300.0" height="36.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="42.0" y="354.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">寄快递时……</text>
<rect x="336.0" y="340.0" width="620.0" height="36.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="342.0" y="354.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">Mooncake 里对应发生什么</text>
<rect x="956.0" y="340.0" width="180.0" height="36.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="962.0" y="354.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码里的名字</text>

<text x="36.0" y="570.0" font-size="11" fill="#333333">第三步：Mooncake 其实有两个部件，别混为一谈</text>

<text x="552.0" y="633.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">类比：公共仓库。东西存在那，谁需要谁去取。</text>
<rect x="1056.0" y="590.0" width="470.0" height="170.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="1062.0" y="604.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">本仓用的是哪个？</text>
<text x="1062.0" y="618.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">只用 ① Transfer Engine：P 与 D 直接点对点搬，KV 不进公共仓库。</text>
<text x="1062.0" y="633.7" font-size="9" fill="#c0392b" font-family="Microsoft YaHei">常见的误解：以为「KV 会先写进 Mooncake 池、再读出来」——本项目不是。</text>

<p class="ptitle">③ KV Cache 在显存里长什么样：为什么按「块」管理</p>
<p class="psub">一句话：显存被切成固定大小的小格子（块），每个块放固定数量 token 的 K/V；一张块表记录「逻辑第几块 → 物理第几块」。跨机搬 KV 就是以块为单位的。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="696"1124" viewBox="0 0 1576 1124">
<rect width="1576" height="1124" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">③ KV Cache 在显存里长什么样：为什么按「块」管理</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：显存被切成固定大小的小格子（块），每个块放固定数量 token 的 K/V；一张块表记录「逻辑第几块 → 物理第几块」。跨机搬 KV 就是以块为单位的。</text>
<text x="36.0" y="128.0" font-size="11" fill="#333333">第一步：先把显存想成一排小格子</text>
<rect x="36.0" y="150.0" width="470.0" height="132.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">块（block）= 固定大小的格子</text>
<text x="42.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">一个块装 block_size 个 token 的 K/V（本项目常见 16 或 128，见启动参数）。</text>
<text x="42.0" y="193.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">不管请求多长，都按整块分配。</text>
<rect x="548.0" y="150.0" width="470.0" height="132.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="554.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么按块、不按「一整个请求」分</text>
<text x="554.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 每个请求长度不同，整段分会产生大量碎片；</text>
<text x="554.0" y="193.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 不同请求的相同前缀可以指到同一块（省显存）；</text>
<text x="554.0" y="208.54999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 按块好搬：每块地址固定、长度固定，一次搬一块很干脆。</text>
<rect x="1060.0" y="150.0" width="470.0" height="132.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="1066.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">块表（block table）= 逻辑 → 物理 的映射</text>
<text x="1066.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">请求自己的第 0、1、2… 块，分别对应显存里哪个物理块。</text>
<text x="1066.0" y="193.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">vllm/v1/worker/block_table.py:57（BlockTable）· :119（slot_mapping）</text>
<text x="36.0" y="324.0" font-size="11" fill="#333333">第二步：一个 40 token 的请求，实际占了 3 个 16-token 的块</text>
<text x="36.0" y="360.0" font-size="11" fill="#666666">请求自己的逻辑块（块表的上半部分）↓</text>
<rect x="36.0" y="372.0" width="150.0" height="56.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="386.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">逻辑块 0</text>
<text x="42.0" y="400.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">token 0..15</text>
<rect x="194.0" y="372.0" width="150.0" height="56.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="200.0" y="386.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">逻辑块 1</text>
<text x="200.0" y="400.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">token 16..31</text>
<rect x="352.0" y="372.0" width="150.0" height="56.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="358.0" y="386.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">逻辑块 2</text>
<text x="358.0" y="400.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">token 32..47</text>
<text x="36.0" y="448.0" font-size="11" fill="#666666">最后一块只用了 8/16 格：40 = 16 + 16 + 8</text>
<text x="36.0" y="488.0" font-size="11" fill="#666666">块表把它翻译成显存里的物理块 ↓</text>
<rect x="36.0" y="500.0" width="150.0" height="56.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="514.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">物理块 #7</text>
<text x="42.0" y="528.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">显存里真实位置</text>
<rect x="194.0" y="500.0" width="150.0" height="56.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="200.0" y="514.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">物理块 #12</text>
<text x="200.0" y="528.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">显存里真实位置</text>
<rect x="352.0" y="500.0" width="150.0" height="56.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="358.0" y="514.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">物理块 #31</text>
<text x="358.0" y="528.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">显存里真实位置</text>
<text x="36.0" y="622.0" font-size="11" fill="#333333">第三步：这条「块」的规则，直接决定了跨机搬 KV 的样子</text>
<rect x="36.0" y="638.0" width="700.0" height="128.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="652.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">搬的单位是「块」，不是「整段对话」</text>
<text x="42.0" y="666.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">P 机算完 prefill 后，它手上是若干个已经填满的物理块；D 机要的是「我这 3 个逻辑块的内容」。</text>
<text x="42.0" y="681.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">于是 D 机说：请把 #7/#12/#31 这三块的内容给我 —— 这就是块级 pull。</text>
<rect x="776.0" y="638.0" width="684.0" height="128.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="782.0" y="652.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">也因为按块，P 和 D 必须能对上「哪块是哪块」</text>
<text x="782.0" y="666.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">P 把自己那三块的地址与长度打包成一个「KV 交接单」交给 D；D 拿着单子逐块去取。</text>
<text x="782.0" y="681.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">这张单子在代码里叫 kv_transfer_params（下一页会看到它长什么样）</text>
<rect x="36.0" y="804.0" width="1424.0" height="96.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="818.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">这一页的代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="832.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">块的容量与规格：vllm/v1/core/kv_cache_utils.py:668-690（resolve_dcp_kv_block_size / block_size 解析）</text>
<text x="42.0" y="845.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">空闲块的分配与回收：vllm/v1/core/block_pool.py:143（BlockPool）、:683（get_new_blocks）、:789（free_blocks）</text>
<text x="42.0" y="859.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">按请求分配块：vllm/v1/core/kv_cache_manager.py:402（allocate_slots）</text>
<text x="42.0" y="874.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">逻辑块 → 物理块 + 写 KV 的槽位：vllm/v1/worker/block_table.py:57、:119（slot_mapping）</text>
<rect x="36.0" y="934.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="948.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：显存按「块」切分，块表记录「逻辑块 → 物理块」；所以跨机搬 KV 是按块搬（块级 pull），P 只要把「哪几块、在哪」告诉 D 就够了。</text>

<p class="ptitle">④ 传输引擎怎么搬字节：注册 → 认路 → 下单（三步曲）</p>
<p class="psub">一句话：传输引擎只认三件事——这块内存我登记过、对方是谁、从哪搬到哪搬多少。它不知道 KV 是什么，也不关心里面装的是什么。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="673"1086" viewBox="0 0 1576 1086">
<rect width="1576" height="1086" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">④ 传输引擎怎么搬字节：注册 → 认路 → 下单（三步曲）</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：传输引擎只认三件事——这块内存我登记过、对方是谁、从哪搬到哪搬多少。它不知道 KV 是什么，也不关心里面装的是什么。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">三步曲：任何一次搬运都长这样</text>
<rect x="36.0" y="150.0" width="470.0" height="210.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 注册内存</text>
<text x="46.0" y="200.0" font-size="11" fill="#333333">把你的显存登记给引擎：register_memory(ptr, size)登记之前，引擎不许碰这块内存（驱动要求）。注意：返回值是「成功/失败」，不是地址。地址要自己算：地址 = 层基址 + 块号 × 块步长一笔显存会被切很多段登记，本项目上限 256 段（相邻 4096 B 以内的会先合并）</text>
<rect x="548.0" y="150.0" width="470.0" height="210.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="554.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 认路（认对方是谁）</text>
<text x="558.0" y="200.0" font-size="11" fill="#333333">传输要一个 session 标识，本项目里就是：session = &quot;对端IP : 对端引擎的 rpc 端口&quot;启动时只做「握手」（换地址表），真正的链路在第一次传输时才建立。初学常见困惑：这里没有独立的 metadata server。初始化时传的字面量 metadata_server=&quot;P2PHANDSHAKE&quot; 表示「点对点自己握手」。</text>
<rect x="1060.0" y="150.0" width="470.0" height="210.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="1066.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 下单搬运</text>
<text x="1070.0" y="200.0" font-size="11" fill="#333333">一次调用给三张平行列表：batch_transfer_sync_read(session,&amp;nbsp;&amp;nbsp;src=[…], dst=[…], length=[…])读 = 把对方的字节拉到我这儿；写 = 把我这儿的字节推到对方。名字里的 sync 指「函数返回时这批已经搬完」，但它跑在后台线程里，不会卡住推理主循环。</text>
<text x="36.0" y="398.0" font-size="11" fill="#333333">同一个引擎，三种玩法——本仓三套代码都在，别混着读</text>
<rect x="36.0" y="418.0" width="240.0" height="52.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="42.0" y="432.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">玩法</text>
<rect x="276.0" y="418.0" width="600.0" height="52.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="282.0" y="432.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">数据怎么流</text>
<rect x="876.0" y="418.0" width="560.0" height="52.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="882.0" y="432.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">关键 API / 特征</text>
<rect x="36.0" y="470.0" width="240.0" height="52.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="484.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 块级 pull（本项目默认）</text>
<rect x="276.0" y="470.0" width="600.0" height="52.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="282.0" y="484.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">D 主动去 P 读整个请求的所有层</text>
<rect x="876.0" y="470.0" width="560.0" height="52.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="882.0" y="484.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一次 batch_transfer_sync_read；P 侧线程只回元数据</text>
<rect x="36.0" y="522.0" width="240.0" height="52.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="536.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 逐层 push（layerwise 版）</text>
<rect x="276.0" y="522.0" width="600.0" height="52.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="282.0" y="536.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">P 每算完一层就写给对方</text>
<rect x="876.0" y="522.0" width="560.0" height="52.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="882.0" y="536.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">batch_transfer_sync_write；TP 不对等时先用 128 B 预热建链</text>
<rect x="36.0" y="574.0" width="240.0" height="52.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="588.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ Store 池（另一种连接器）</text>
<rect x="276.0" y="574.0" width="600.0" height="52.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="282.0" y="588.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">KV 先变成「对象」存进大仓库，谁要谁去取</text>
<rect x="876.0" y="574.0" width="560.0" height="52.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="882.0" y="588.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">需要 metadata/master 服务 + 内存池；本 PD 场景不用</text>
<rect x="36.0" y="628.0" width="1424.0" height="118.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="642.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">三个最容易卡住的地方（都在代码里能看到）</text>
<text x="42.0" y="656.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">① 协议不是 rdma / tcp：昇腾版传的是 initialize(ip, &quot;P2PHANDSHAKE&quot;, &quot;ascend&quot;, device)——第三个参数是 ascend。</text>
<text x="42.0" y="669.0" font-size="9" fill="#333333" font-family="Microsoft YaHei">② 地址不是「引擎给你的」：登记只标记「这段可以搬」，搬运时用的是你自己算出来的 base + block_id × stride。</text>
<text x="42.0" y="681.15" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 完成不是回调：没有 per-transfer 的回调对象，靠计数器 + 轮询（搬完的请求进队列，主循环定期取）。</text>
<rect x="36.0" y="780.0" width="1424.0" height="84.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="794.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">这一页的代码锚点</text>
<text x="42.0" y="808.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">单例初始化：vllm-ascend/.../kv_transfer/utils/mooncake_transfer_engine.py:11-43（initialize / register_memory / global_te）</text>
<text x="42.0" y="821.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">注册 KV 显存：.../kv_p2p/mooncake_connector.py:2687-2690（先 395-452 合并区间，再逐段 register_memory）</text>
<text x="42.0" y="835.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">真正搬运：同文件 :1042（batch_transfer_sync_read）· :825（session_id 拼法）</text>
<text x="42.0" y="850.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">逐层版对照：.../kv_p2p/mooncake_layerwise_connector.py:557、:2115-2120</text>
<rect x="36.0" y="894.0" width="1424.0" height="60.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="908.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：传输引擎眼里没有 KV，只有「登记过的内存段 + 对端 session + 从哪到哪多长」；三步走完，一次搬运就结束了。</text>

<p class="ptitle">⑤ vLLM 给 connector 留的「插头」：钩子表与调用时机</p>
<p class="psub">一句话：vLLM 不认识 Mooncake，它只在一个固定的时刻表里调用几个固定名字的方法。谁想搬 KV，就去实现这些方法。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="783"1264" viewBox="0 0 1576 1264">
<rect width="1576" height="1264" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑤ vLLM 给 connector 留的「插头」：钩子表与调用时机</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：vLLM 不认识 Mooncake，它只在一个固定的时刻表里调用几个固定名字的方法。谁想搬 KV，就去实现这些方法。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">调度侧（在 scheduler 进程里）：决定「要不要搬、搬哪些块」</text>
<rect x="36.0" y="150.0" width="700.0" height="84.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">on_new_request（仅 P 侧）</text>
<text x="42.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">截：prompt 可能先丢掉最后一个 token</text>
<text x="42.0" y="192.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">让 D 自己重算最后一个 token，保证 tail 一定对得上</text>
<rect x="36.0" y="246.0" width="700.0" height="84.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="260.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">get_num_new_matched_tokens</text>
<text x="42.0" y="274.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">问：这批 KV 能省掉多少重复计算？</text>
<text x="42.0" y="288.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">返回 (数量, 是否异步)。返回 &gt;0 表示「有 KV 可以等」</text>
<rect x="36.0" y="342.0" width="700.0" height="84.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="356.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">update_state_after_alloc</text>
<text x="42.0" y="370.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">记：我这些本地块要去远端拉</text>
<text x="42.0" y="384.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">把「本地块号 / 需要多少外部 token」登记下来</text>
<rect x="36.0" y="438.0" width="700.0" height="84.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="452.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">build_connector_meta</text>
<text x="42.0" y="466.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">打包：把登记变成给 worker 的工单</text>
<text x="42.0" y="480.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">这一步之后才轮到 worker 侧真正搬</text>
<rect x="36.0" y="534.0" width="700.0" height="84.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="548.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">request_finished（两侧都调）</text>
<text x="42.0" y="562.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">交：这一单怎么收尾</text>
<text x="42.0" y="576.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">P 返回 (True, 交接清单)＝块先别还；D 返回 (False, None)＝立刻还</text>
<text x="816.0" y="130.0" font-size="11" fill="#333333">worker 侧（在跑模型的进程里）：真正动显存</text>
<rect x="816.0" y="150.0" width="644.0" height="84.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="822.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">register_kv_caches</text>
<text x="822.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">注册：把我的 KV 显存登记给传输引擎</text>
<text x="822.0" y="192.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">顺便起后台线程（回元数据 / 收完成信号）</text>

<text x="822.0" y="260.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">bind_connector_metadata</text>
<text x="822.0" y="274.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">喂料：把调度侧的工单交给 worker 侧</text>
<text x="822.0" y="288.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">每次执行模型前调一次，用完即清</text>

<text x="822.0" y="370.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">下发：把工单交给后台搬运线程</text>
<text x="822.0" y="384.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">D 侧入口：切分片、挑端口、按对端分桶</text>

<text x="822.0" y="480.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">核心拿到后才会真正释放块（解除「钉住」）</text>

<text x="822.0" y="576.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">原生路径会对这些块重算；LWD PD 路径直接失败</text>
<rect x="36.0" y="660.0" width="1424.0" height="104.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="674.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">还有三个钩子，本项目里是「躺平」的（实现就是 pass）</text>
<text x="42.0" y="688.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">wait_for_layer_load　/　save_kv_layer　/　wait_for_save</text>
<text x="42.0" y="703.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">它们的存在是为了「逐层搬运」这种玩法：每算完一层就搬一层，早搬早省显存。本项目没用这个玩法——整请求算完再一次性块级 pull。逐层版在另一个文件（mooncake_layerwise_connector.py），别看混。</text>

<text x="42.0" y="934.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 解耦：vLLM 核心不需要知道 KV 是从网络来的、还是从磁盘来的；换 connector 就像换插头。</text>
<text x="42.0" y="949.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 不阻塞调度：「异步」这个返回值的意思是——我的 KV 还在路上，调度器可以先去算别的请求，等到了再用。</text>
<text x="42.0" y="964.5500000000001" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 可回退：搬失败必须能报出来（get_block_ids_with_load_errors），让核心退化成「重新计算」，而不是用错的 KV 算出乱码。</text>

<p class="psub">一句话：vLLM 只在固定时刻调几个方法（上层），connector 里分「调度侧」和「worker 侧」，真正的搬运发生在后台线程 + 传输引擎（底层）。</p>

<text x="36.0" y="34.0" font-size="11" fill="#333333">⑥ MooncakeConnector 里都有谁（一张图看清分层）</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：vLLM 只在固定时刻调几个方法（上层），connector 里分「调度侧」和「worker 侧」，真正的搬运发生在后台线程 + 传输引擎（底层）。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">第 1 层 · vLLM 核心只认「钩子」</text>
<rect x="36.0" y="148.0" width="690.0" height="92.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">调度器 scheduler（决定谁跑、跑多少 token）</text>
<text x="42.0" y="176.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">它会在固定时刻调用 connector 的调度侧方法：问「能省多少」、登记块号、打包工单。</text>
<text x="42.0" y="191.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">对应方法名见下一页（⑤ 钩子表）</text>
<rect x="766.0" y="148.0" width="694.0" height="92.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="772.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">worker（真正跑模型的进程）</text>
<text x="772.0" y="176.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">它会在固定时刻调用 connector 的worker 侧方法：注册显存、下发工单、取「这一轮谁完成了」。</text>
<text x="772.0" y="191.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">worker 侧才有 NPU 句柄，所以搬运动作只能发生在这一侧</text>
<text x="36.0" y="270.0" font-size="11" fill="#333333">第 2 层 · MooncakeConnector（门面，按 role 分派）</text>
<rect x="36.0" y="288.0" width="1424.0" height="70.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="302.0" font-size="9" fill="#666666" font-family="Microsoft YaHei">MooncakeConnector　mooncake_connector.py:1608 · 对外注册名 MooncakeConnectorV1</text>
<text x="42.0" y="314.15" font-size="11" fill="#333333" font-family="Microsoft YaHei">它自己不干活：把调用转给 scheduler 侧或 worker 侧的两套实现。</text>
<text x="36.0" y="386.0" font-size="11" fill="#333333">第 3 层 · 两侧各管一段（这是读代码时最容易迷路的地方）</text>

<text x="42.0" y="418.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">调度侧 MooncakeConnectorScheduler</text>
<text x="42.0" y="432.85" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="447.70000000000005" font-size="11" fill="#333333" font-family="Microsoft YaHei">① get_num_new_matched_tokens：我能省掉多少重复计算？→ 返回 (数量, True)</text>

<text x="36.0" y="648.0" font-size="11" fill="#333333">第 4 层 · 后台线程与传输引擎（真正搬东西的人）</text>
<rect x="36.0" y="666.0" width="466.0" height="150.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="680.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">KVCacheSendingThread（P 侧的「挂号窗口」）</text>
<text x="42.0" y="694.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">名字叫 Sending，但它不搬 KV：</text>
<text x="42.0" y="709.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">只做两件事：① 回「仓库地址表」；② 收「我收完了」并回 ACK。</text>
<text x="42.0" y="724.5500000000001" font-size="9" fill="#c0392b" font-family="Microsoft YaHei">名字误导：这是本套实现最容易被读错的地方</text>
<rect x="536.0" y="666.0" width="460.0" height="150.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="542.0" y="680.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">KVCacheRecvingThread（D 侧的「搬运工」）</text>
<text x="542.0" y="694.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">32 线程池；按「对端 host:port」分桶；每桶每轮最多处理 5 个请求就换人（防止一个忙 P 独占）。</text>
<text x="542.0" y="709.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">所有 KV 数据都由它发起的 RDMA read 拉过来。</text>
<rect x="1030.0" y="666.0" width="430.0" height="150.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="1036.0" y="680.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">global_te（TransferEngine 单例）</text>
<text x="1036.0" y="694.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">全进程一个：</text>
<text x="1036.0" y="709.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">initialize(host, &quot;P2PHANDSHAKE&quot;, &quot;ascend&quot;, device)</text>
<text x="1036.0" y="721.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">向下直接调网卡/驱动（RDMA），向上只暴露「注册内存 / 读 / 写」三种动作。</text>
<text x="1036.0" y="736.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">锚点：utils/mooncake_transfer_engine.py:4-43</text>
<rect x="36.0" y="870.0" width="1424.0" height="104.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="884.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">读这套代码时最容易踩的三点</text>
<text x="42.0" y="898.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 箭头方向 ≠ 数据方向：P 侧线程只回元数据和 ACK，KV 数据是 D 主动读过去的（pull），P 从不 push。</text>
<text x="42.0" y="913.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">② 不是逐层的：wait_for_layer_load / save_kv_layer / wait_for_save 三个钩子实现就是 pass（:1691-1703）；逐层版在另一个文件 mooncake_layerwise_connector.py。</text>
<text x="42.0" y="925.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 没有 pin API：「钉住块」是通过 request_finished 返回 delay_free_blocks=True 让核心延迟释放，不是 connector 自己加锁。</text>

<p class="psub">一句话：发出去了不算成功——要对端回执、要计数器归零、要块表里真的写进去了，才算这一单办完。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="882"1424" viewBox="0 0 1576 1424">

<text x="36.0" y="34.0" font-size="11" fill="#333333">⑧ 什么时候算「成功」：块 / 请求 / 链路 三层判定与失败兜底</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：发出去了不算成功——要对端回执、要计数器归零、要块表里真的写进去了，才算这一单办完。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">第一层：块的状态（最底层，决定显存能不能回收）</text>
<rect x="36.0" y="150.0" width="460.0" height="96.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">空闲 / 已分配</text>
<text x="42.0" y="178.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">块在自己的池子里，可用或正在被某个请求用着。</text>
<rect x="536.0" y="150.0" width="460.0" height="96.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="542.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">被钉住（delay_free_blocks）</text>
<text x="542.0" y="178.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">请求结束了但还不能回收：P 侧用 request_finished 返回 True 把它钉住，等 D 来拿。</text>
<rect x="1036.0" y="150.0" width="460.0" height="96.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="1042.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">真正释放</text>
<text x="1042.0" y="178.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">D 回执到达、P 侧计数器归零后，get_finished 报给核芯，块才回到池子。</text>
<text x="36.0" y="298.0" font-size="11" fill="#333333">第二层：请求的状态（调度器视角，决定「现在能不能算」）</text>
<rect x="36.0" y="318.0" width="700.0" height="118.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="332.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">等 KV（WAITING）</text>
<text x="42.0" y="346.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">D 侧已经知道「有 KV 在别人机器上」，调度器把它挂在等待队列，先去跑别的请求。</text>
<text x="42.0" y="361.70000000000005" font-size="9" fill="#666666" font-family="Microsoft YaHei">这就是 get_num_new_matched_tokens 返回第二个值 True 的含义</text>
<rect x="776.0" y="318.0" width="684.0" height="118.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="782.0" y="332.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">可以算（RUNNING）</text>
<text x="782.0" y="346.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">KV 到齐后，请求进入正常解码；此后每生成一个 token 都用到刚搬来的那段 KV。</text>
<text x="782.0" y="361.70000000000005" font-size="9" fill="#333333" font-family="Microsoft YaHei">搬失败时分两种口径：原生路径把坏块记进 invalid_block_ids 让核心重算；而 LWD PD 路径被强制成 fail-closed（recompute_kv_load_failures=False）——直接终止请求，不重算、不换机器。</text>
<text x="36.0" y="488.0" font-size="11" fill="#333333">第三层：整条链路的「办完了」信号（谁说完成、谁相信）</text>
<rect x="36.0" y="508.0" width="690.0" height="150.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="522.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">D 侧：我收完了（DONE_RECVING）</text>
<text x="42.0" y="536.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">搬完之后 D 主动发一条完成消息给 P；无论成功还是失败都要发——</text>
<text x="42.0" y="551.7" font-size="9" fill="#333333" font-family="Microsoft YaHei">代码注释写明：不发会导致对端内存泄漏（P 的块永远钉着）。</text>
<rect x="766.0" y="508.0" width="694.0" height="150.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="772.0" y="522.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">P 侧：回执核销（ACK）</text>
<text x="772.0" y="536.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">P 按「端口 + 片数」累计回执，达到 D 声明的片数才算这一单完成，然后回 ACK。</text>
<text x="772.0" y="551.7" font-size="9" fill="#666666" font-family="Microsoft YaHei">注意：完成判定靠计数器 + 轮询，不是每个传输一个回调对象</text>
<text x="36.0" y="700.0" font-size="11" fill="#333333">失败之后会怎样（四类兜底，按严重程度排）</text>
<rect x="36.0" y="720.0" width="1424.0" height="58.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="734.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">KV 导入失败（LWD PD）　→　fail-closed：直接终止请求（日志 PD remote KV import failed），不重算、不换 P/D</text>
<rect x="36.0" y="790.0" width="1424.0" height="58.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="804.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">传输返回码 　→　抛 RuntimeError → 该请求标记失败 → 原生路径下这些块重算</text>
<rect x="36.0" y="860.0" width="1424.0" height="58.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="874.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">等不到 ACK　→　打 error 日志后吞掉异常（不重试、不上抛）——所以别指望它自愈</text>
<rect x="36.0" y="930.0" width="1424.0" height="58.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="944.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">对端根本不来拿　→　480 秒后强制释放并打 error：Force freed expired request</text>
<rect x="36.0" y="1000.0" width="1424.0" height="58.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="1014.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">后台线程起不来　→　启动时 5 分钟没 ready → RuntimeError 直接失败</text>
<rect x="36.0" y="1094.0" width="1424.0" height="104.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1108.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">这一页的代码锚点</text>

<text x="42.0" y="1246.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：「成功」= 数据落到对端显存 + 对端回了回执 + 计数器归零 + 块真正释放。四件事差一件，都会变成显存泄漏或算错。</text>

<text x="36.0" y="34.0" font-size="11" fill="#333333">⑨ 五个常见误解 ＋ 一本性能账</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">这一页是前八页的「体检」：每条误解都给出正确的说法和代码位置。看完能自己回答「为什么这么设计」。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">误解清单（★ = 最容易被读错的一个）</text>
<rect x="36.0" y="148.0" width="1424.0" height="92.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">★ 误解 1：P 算完会主动把 KV 推给 D</text>
<text x="42.0" y="176.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">实际：D 主动去 P 读（pull）。P 的「Sending」线程只回地址表、收完成信号，一字节 KV 都不推。</text>
<text x="42.0" y="190.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">mooncake_connector.py:333-417（只回元数据）vs :1042（D 端读）</text>
<rect x="36.0" y="250.0" width="1424.0" height="92.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="264.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">误解 2：Mooncake 是逐层搬运的</text>
<text x="42.0" y="278.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">实际：本项目整请求块级批量——一个请求的所有层、所有块，一次 batch_transfer_sync_read 搬完。三个 layerwise 钩子实现就是 pass。</text>
<text x="42.0" y="292.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">:1691-1703（三个 pass）；逐层版在 mooncake_layerwise_connector.py</text>
<rect x="36.0" y="352.0" width="1424.0" height="92.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="366.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">误解 3：KV 会先写进 Mooncake 的存储池</text>
<text x="42.0" y="380.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">实际：点对点直接搬，KV 不进任何公共池。Store 模式是另一套连接器（AscendStoreConnector），本 PD 场景不用。</text>
<text x="42.0" y="394.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">kv_transfer/__init__.py:46,57,74,80,87（五个连接器并列）</text>
<rect x="36.0" y="454.0" width="1424.0" height="92.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="468.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">误解 4：up_buffer_size / down_buffer_size 是 KV 容量</text>
<text x="42.0" y="482.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">实际：这是另一个平面的东西——host 数据面（UCX/共享内存）的帧块大小，跟 KV 传输无关。KV 走的是 kv_port。</text>
<text x="42.0" y="496.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">启动脚本 --kv-transfer-config 的 kv_port；数据面见 lwd_comm/data_comm/</text>
<rect x="36.0" y="556.0" width="1424.0" height="92.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="570.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">误解 5：显存地址随便给，反正引擎会自己找</text>
<text x="42.0" y="584.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">实际：① 必须先注册再搬，且每进程最多 256 段；② 某些路径（逐层版）要求起始地址 2 MiB 对齐，不对齐直接抛错。</text>
<text x="42.0" y="598.35" font-size="9" fill="#666666" font-family="Microsoft YaHei">kv_transfer/utils/utils.py:15,455-472（段数上限）；:2556,2610（对齐断言）</text>
<text x="36.0" y="658.0" font-size="11" fill="#333333">一本性能账：决定「搬一次值不值」的几个量</text>
<rect x="36.0" y="678.0" width="278.0" height="168.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="692.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一次搬的量</text>
<text x="42.0" y="706.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">该请求所有层 × 所有块的 KV</text>
<text x="42.0" y="720.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">（例：4K token、128 KB/token ≈ 512 MB）</text>
<rect x="322.0" y="678.0" width="278.0" height="168.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="328.0" y="692.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">搬运的并行度</text>
<text x="328.0" y="706.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">D 侧 32 线程池，按「对端 host:port」分桶；</text>
<text x="328.0" y="720.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">每个对端每轮最多 5 个请求就换人</text>
<rect x="608.0" y="678.0" width="278.0" height="168.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="614.0" y="692.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">什么时候搬更划算</text>
<text x="614.0" y="706.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">prompt 长、输出短时最赚（K 值钱、搬一次用一次）；</text>
<text x="614.0" y="720.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">prompt 极短、输出极长时搬运占比反而高</text>
<rect x="894.0" y="678.0" width="278.0" height="168.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="900.0" y="692.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">超时窗口</text>
<text x="900.0" y="706.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">对端 480 秒不来拿就强制释放；</text>
<text x="900.0" y="720.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">传输超时由 ASCEND_TRANSFER_TIMEOUT 决定</text>
<rect x="1180.0" y="678.0" width="278.0" height="168.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1186.0" y="692.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">并发窗口</text>
<text x="1186.0" y="706.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">两侧用「有多少片要回执」来对账；</text>
<text x="1186.0" y="720.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">P 的 TP 比 D 大时要分片拉、搬完再拼装</text>
<text x="36.0" y="870.0" font-size="11" fill="#666666">数量级提示：cross-machine 带宽远低于显存带宽，所以「搬一次」的代价通常比「重算一遍 prefill」小得多——这正是 P/D 分离成立的经济学前提。</text>
<rect x="36.0" y="914.0" width="1424.0" height="88.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="928.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：这套实现的核心事实只有三条——①D 拉、P 不推；②整请求块级批量，不逐层；③点对点，不进池。其余细节（分片、拼装、对齐、超时）都是为这三条服务的。</text>

<text x="36.0" y="1000.0" font-size="11" fill="#333333">自己动手：几条能直接抄的 grep（在 vllm-ascend 仓根目录跑）</text>

<text x="42.0" y="1032.0" font-size="9" fill="#333333" font-family="Microsoft YaHei"># 谁在搬运（三套玩法都在这一层）</text>
<text x="42.0" y="1044.15" font-size="11" fill="#333333" font-family="Microsoft YaHei">grep -rn &quot;batch_transfer_sync_read&quot; vllm_ascend/distributed/kv_transfer/</text>
<text x="42.0" y="1059.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">grep -rn &quot;batch_transfer_sync_write&quot; vllm_ascend/distributed/kv_transfer/</text>
<text x="42.0" y="1073.85" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="1088.6999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei"># 注册显存与引擎初始化</text>
<text x="42.0" y="1103.5499999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei">grep -rn &quot;register_memory\|global_te&quot; vllm_ascend/distributed/kv_transfer/</text>
<text x="42.0" y="1118.3999999999996" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="1133.2499999999995" font-size="11" fill="#333333" font-family="Microsoft YaHei"># 端口是怎么算出来的（同一行里有 dp/tp/pp/pcp 四个因子）</text>
<text x="42.0" y="1148.0999999999995" font-size="11" fill="#333333" font-family="Microsoft YaHei">grep -n &quot;handshake_port\|side_channel_port&quot; vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_connector.py</text>
<text x="42.0" y="1162.9499999999994" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="1177.7999999999993" font-size="11" fill="#333333" font-family="Microsoft YaHei"># LWD 层的 KV_READY 判定</text>
<text x="42.0" y="1192.6499999999992" font-size="11" fill="#333333" font-family="Microsoft YaHei">grep -n &quot;finished_recving_kv_req_ids\|tail_start&quot; vllm/v1/lwd_control/pd/cloud_scheduler.py</text>
<rect x="36.0" y="1218.0" width="1424.0" height="76.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1232.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">最后一句：Mooncake 在本项目里干的是一件非常朴素的事——把 P 机显存里的几块字节，按 D 的请求搬到 D 的显存里，然后双方各自对账。所有复杂的东西（分片、拼装、对齐、超时、回执）都是为了让这件朴素的事不出错、不漏显存、不阻塞调度。</text>
