<text x="42.0" y="380.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">关键特征：这是「拐点」，不是「斜率」。20→22 只有 3 ms 的平缓增长，25→26 却突然 +42%。算力随批量增长一定是平滑的，不连续跳变说明某处发生了二值判定——这是本次定位的突破口。</text>
<text x="36.0" y="466.0" font-size="11" fill="#333333">第二步：把阈值算出来（三步，每步都能在代码里指到）</text>

<text x="42.0" y="496.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 开 MTP 后，每个请求一步要排 1 + K = 4 个 token 位 → 每步 token 数 = 4 × 序列数。</text>
<text x="42.0" y="509.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 图的上限是 100（脚本里写死的 capture_sizes 最大值）。</text>
<text x="42.0" y="524.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 所以能命中图的并发上限 = 100 ÷ 4 = 25；第 26 个请求就让每步变成 104 个 token → 超过 100 → 判定 NONE → 退回 eager。</text>
<text x="36.0" y="610.0" font-size="11" fill="#333333">第三步：为什么从来没人发现（这段配置「曾经是死的」）</text>
<rect x="36.0" y="626.0" width="700.0" height="160.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="640.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="648.0" font-size="11" fill="#333333">三个上游缺口，全都不告警</text>
<text x="46.0" y="674.0" font-size="11" fill="#333333">① 框架会替你把上限「取整到 K+1 的倍数」，但不会把上限本身放大；② 不命中就返回 NONE，没有 warning；③ 唯一的不变量校验（上限 ≥ 序列数 ×(1+K)）被一个无关条件挡住，实际不生效。</text>
<rect x="796.0" y="626.0" width="664.0" height="160.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="802.0" y="640.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="648.0" font-size="11" fill="#333333">而且它长期是「死配置」</text>
<text x="806.0" y="674.0" font-size="11" fill="#333333">在 P 侧与 edge 开着全局 eager 的那段时间里，这串 capture_sizes 完全不生效，所以从未被验证过。它是在「同一次提交里既启用图、又开 MTP」的那一刻才变成活的——一活就直接越界。</text>
<text x="36.0" y="810.0" font-size="11" fill="#333333">第四步：修复的正确形态（不是「调大一个数」）</text>
<rect x="36.0" y="826.0" width="1424.0" height="116.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="840.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">要满足一条不变量：图的最大桶 ≥ 最大并发 × (1+K)，并让两个数互相兜底。</text>
<text x="42.0" y="853.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">本案例的修法是：把并发压到 KV 撑得住的 24，同时把桶扩到 128（24 × 4 = 96 ≤ 128）→ 稳态全程命中图。</text>
<text x="42.0" y="868.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">只扩桶不压并发：要么桶不够（继续掉出），要么 KV 撑不住（另一个坑）；只压并发不扩桶：并发上限被图卡死，与 KV 实际能力不匹配。</text>
<rect x="36.0" y="982.0" width="1424.0" height="108.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="996.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第五步：预防（这是本案例最值钱的部分）</text>
<text x="42.0" y="1010.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 启动时就打一行「图的覆盖范围」：graph covers up to N concurrent seqs (max_capture=100, query_len=4); max_num_seqs=128 → above 25 runs eager —— 有这一行，事故在拉起阶段就能发现。</text>
<text x="42.0" y="1024.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 把「静默回落」改成 warning；③ 把「模式变化」从 DEBUG 提到 INFO（只在变化时打）。</text>

<text x="42.0" y="358.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">这个拆解直接推翻第一反应：如果「TTFT 大」就去找 P 段算力，最多只能优化那 2%（1 秒）。</text>
<text x="42.0" y="371.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">真正的杠杆是提高整条流水线的服务率——而服务率被 D 段的输出速度卡住了。所以先拆时间，再决定优化谁。</text>
<text x="36.0" y="460.0" font-size="11" fill="#333333">第二步：算系统的物理上限（这一步能判断「是 bug 还是容量不够」）</text>
<rect x="36.0" y="476.0" width="1424.0" height="120.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="490.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">· D 段单请求最少要 1500 token × 18.5 ms ≈ 27.8 s；</text>
<text x="42.0" y="503.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 能同时跑的请求数约 22 → 理论上限 22 ÷ 27.8 ≈ 0.79 请求/秒；</text>
<text x="42.0" y="518.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 所以 128 个请求至少需要 128 ÷ 0.79 ≈ 162 s 才能排空——这是这套 1P(2卡)+1D(2卡) 对该负载的物理上限；</text>
<text x="42.0" y="533.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 而实测服务率只有 0.30 请求/秒，比上限低了 62%——这部分差距不是硬件问题，而是案例一那个「图掉出」白送的。</text>
<text x="36.0" y="620.0" font-size="11" fill="#333333">第三步：测量本身有三个坑（不校验会得出错 2~6 倍的数）</text>
<rect x="36.0" y="636.0" width="460.0" height="180.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="650.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="658.0" font-size="11" fill="#333333">坑一：用错了派生指标</text>
<text x="46.0" y="684.0" font-size="11" fill="#333333">日志里的「每秒步数」是含空排的平均步间隔；要算真实步时必须是 10 秒 ÷ 该窗口内的步数。两者能差 2~6 倍——直接用前者会把步时算小。</text>
<rect x="518.0" y="636.0" width="460.0" height="180.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="524.0" y="650.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="528.0" y="658.0" font-size="11" fill="#333333">坑二：跨机时间戳不可信</text>
<text x="528.0" y="684.0" font-size="11" fill="#333333">边端与云端时钟不同步（实测边端快约 110 秒）；所以跨机拼接时间戳做端到端会直接错，只能用同一台机器上的阶段边界做差。</text>
<rect x="1000.0" y="636.0" width="460.0" height="180.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="1006.0" y="650.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1010.0" y="658.0" font-size="11" fill="#333333">坑三：生存者偏差</text>
<text x="1010.0" y="684.0" font-size="11" fill="#333333">128 个请求里只有 74 个完成、106 个拿到过 token；剩下 54 个「连第一个 token 都没拿到」根本不在分位数里。→ 真实 TTFT 分布被截断，p50 是乐观值。</text>
<text x="36.0" y="840.0" font-size="11" fill="#333333">第四步：没有端到端打点时，怎么量（用四个阶段边界做差）</text>
<rect x="36.0" y="856.0" width="1424.0" height="96.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="870.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">P 侧收到请求 → D 侧接纳 → D 侧就绪 → 完成，四个时刻各有一条日志；因为本负载所有请求的输出长度恒为 1500，所以 TPOT = （完成 − 就绪）÷ 1499 就是干净的，不受 prompt 长度差异影响。</text>
<text x="42.0" y="883.5" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">前提：P/D 在同一台机器上（本案例确实如此）；跨机时必须先校准时钟，否则这个减法没有意义。</text>
<rect x="36.0" y="992.0" width="1424.0" height="108.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="1006.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第五步：根因是「双重的」，必须分开说</text>
<text x="42.0" y="1020.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① TTFT 主因 = 容量不足（物理上限 0.79，实测 0.30）→ 优化方向是提服务率，不是加 P 算力；</text>
<text x="42.0" y="1034.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② TPOT 主因 = 配置 bug（案例一那个图掉出，把服务率从 0.79 打到 0.30）→ 改一个桶列表就能回收 62%；</text>
<text x="42.0" y="1049.1999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 其余次要项：KV 导入排队、首 token 独占一个调度窗口、三个 chunk 三次跨机握手、空转抢 CPU。</text>
<text x="42.0" y="1064.0499999999997" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">报告里必须这样分开写，否则「加机器」和「改配置」会被混为一谈。</text>
<rect x="36.0" y="1140.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="1154.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：本案例的结论依赖「图确实掉出了」这个推断。下一步（④）看一个「指标明明在、但全都是零」的案例——它教会我们「零有几种含义」。</text>
<rect x="36.0" y="1216.0" width="1424.0" height="104.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1230.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="1244.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">复盘原文：pds_comm_ww_TTFT_TPOT_劣化分析.md（四段拆解 :57-73、生存者偏差 :79-83、服务率与物理上限 :87-115、测量口径校验 :49-53、时钟不同步 :4、修复表 :249-266）</text>
<text x="42.0" y="1257.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">「每步只算 1+K 个 query」的背景：见 MTP 套 ⑦；图掉出机制见本套 ②</text>
<text x="42.0" y="1271.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">服务率与并发的关系：见「进程与线程」套 ⑪⑫（调度器每步挑一批）</text>
<rect x="36.0" y="1352.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1366.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这个案例：面对「延迟大」，第一步永远是把时间拆开——排队、计算、传输各占多少；第二步是算物理上限，判断差距是「硬件不够」还是「配置白送」；第三步才是优化。</text>

<text x="36.0" y="62.0" font-size="11" fill="#666666">现象：/metrics 里 spec decode 四个计数器全是 0，但位置标签 0/1/2 都在。第一反应：「MTP 挂了」。真相：「计数器为 0」至少有四种含义，而其中一种是正常态。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：「零」的四种含义（处置完全不同）</text>

<rect x="696.0" y="148.0" width="420.0" height="40.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="702.0" y="162.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">解释</text>
<rect x="1116.0" y="148.0" width="344.0" height="40.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>

<rect x="36.0" y="188.0" width="260.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>

<text x="302.0" y="202.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">计数器注册了、永远为 0</text>
<rect x="696.0" y="188.0" width="420.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="702.0" y="202.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">正常态（P 侧只算 prefill，没有 decode 验证步）</text>
<rect x="1116.0" y="188.0" width="344.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1122.0" y="202.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">按角色排除告警</text>
<rect x="36.0" y="228.0" width="260.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="242.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 功能压根没启动</text>
<rect x="296.0" y="228.0" width="400.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="302.0" y="242.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">配置里没有投机，计数器根本不注册</text>
<rect x="696.0" y="228.0" width="420.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="702.0" y="242.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">连标签都不会出现</text>
<rect x="1116.0" y="228.0" width="344.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1122.0" y="242.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">查配置</text>
<rect x="36.0" y="268.0" width="260.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="282.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 启动了但没走 draft</text>
<rect x="296.0" y="268.0" width="400.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="302.0" y="282.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">标签在、drafts 也是 0</text>
<rect x="696.0" y="268.0" width="420.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="702.0" y="282.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">调度器从不排 draft</text>
<rect x="1116.0" y="268.0" width="344.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1122.0" y="282.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">查调度与日志三条证词</text>
<rect x="36.0" y="308.0" width="260.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="322.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">④ 走了但全被拒</text>
<rect x="296.0" y="308.0" width="400.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="302.0" y="322.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">drafts &gt; 0，accepted == 0</text>
<rect x="696.0" y="308.0" width="420.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="702.0" y="322.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">接受率真的 0%（草案太差）</text>
<rect x="1116.0" y="308.0" width="344.0" height="40.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="1122.0" y="322.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">换 draft 策略</text>
<rect x="36.0" y="364.0" width="1424.0" height="76.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="378.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本次实测的形态是第 ③ 种：标签在（说明配置里有 K=3），但 drafts 和 draft_tokens 都是 0——说明计数链的起点就从未成立，不是「全被拒」（那样 drafts 会大于 0）。</text>
<text x="36.0" y="464.0" font-size="11" fill="#333333">第二步：一条五跳判定链（逐个排除，每跳都有检查动作）</text>
<rect x="36.0" y="480.0" width="270.0" height="84.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="494.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">① 进程在吗</text>
<text x="42.0" y="508.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">其它计数器在涨吗</text>
<rect x="317.0" y="480.0" width="270.0" height="84.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="323.0" y="494.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 角色是什么</text>
<text x="323.0" y="508.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">P / D / edge</text>
<rect x="598.0" y="480.0" width="270.0" height="84.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="604.0" y="494.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 配置有 K 吗</text>
<text x="604.0" y="508.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">看标签是否存在</text>
<rect x="879.0" y="480.0" width="270.0" height="84.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="885.0" y="494.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">④ 调度排 draft 了吗</text>
<text x="885.0" y="508.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">看引擎内日志</text>
<rect x="1160.0" y="480.0" width="270.0" height="84.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="1166.0" y="494.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑤ 统计送到了吗</text>
<text x="1166.0" y="508.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">看是否有丢弃/异常</text>
<text x="36.0" y="588.0" font-size="11" fill="#333333">第三步：两个关键判据（学会就能省下大量时间）</text>
<rect x="36.0" y="604.0" width="700.0" height="176.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="618.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="626.0" font-size="11" fill="#333333">判据一：「壳在」只证明构造函数跑过</text>
<text x="46.0" y="652.0" font-size="11" fill="#333333">位置标签来自「按 K 生成 0…K-1」，`_created` 来自对象创建时刻——两者都只依赖配置，不依赖数据流。所以「标签齐全」不能证明功能在跑。（顺带：那个 1.79e9 的大数是「创建时间戳」，不是次数——别把它读成 drafts 数。）</text>
<rect x="796.0" y="604.0" width="664.0" height="176.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="802.0" y="618.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="626.0" font-size="11" fill="#333333">判据二：用不变量自检</text>
<text x="806.0" y="652.0" font-size="11" fill="#333333">健康时三个数必须同时成立：① draft_tokens ÷ drafts ≈ K；② 逐位置接受数单调递减（越往后越难中）；③ 逐位置之和 = 接受总数。任何一条不成立，就说明统计链或功能链有问题。</text>
<rect x="36.0" y="820.0" width="1424.0" height="116.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="834.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第四步：为什么 P 侧恒零是正常的（这是最容易被误报的一条）</text>
<text x="42.0" y="848.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">本仓的 P 侧与 D 侧都带同样的投机配置（K=3），所以两侧都会注册这四族指标；但 P 侧只算 prefill、没有 decode 的验证步 → 「本步要验证的草案」集合长期为空 → 计数恒为 0。</text>
<text x="42.0" y="862.35" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">所以「指标名相同 + 两侧同配置」会天然制造假阳性：监控面板必须按角色分实例抓取，否则 P 侧的恒零会污染 D 侧的接受率分母。</text>
<rect x="36.0" y="976.0" width="1424.0" height="104.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="990.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第五步：本案例的最终结论（如实标注：文档自身留了三个候选）</text>
<text x="42.0" y="1004.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">文档给出三种可能：A 侧别正常态（P 侧）、B 前端统计链在某分支上不可靠（仓内注释自认这块薄弱）、C 进程刚起或窗口内没跑 decode 流量。并明确「数据本身定不了」，需再跑三条命令才能定案。</text>
<text x="42.0" y="1018.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">这正是本案例最值得学的地方：敢于把结论写成「待定」并给出定案命令，而不是硬编一个根因。</text>
<rect x="36.0" y="1120.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="1134.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：这是「静默失效」类故障。下一步（⑤）看最严重的一类——级联故障：一个请求放不下，最后整个集群挂住。</text>
<rect x="36.0" y="1196.0" width="1424.0" height="120.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1210.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="1224.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">复盘原文：pds_comm_spec_decode指标全零分析.md（四族指标 :4、_created 定性 :13-24、标签与配置 :27、三种解释 :35-38、判定链 :65-80、多条证词命令 :116-167、正常态对照 :181-198、恒等式自检 :194-198）</text>
<text x="42.0" y="1237.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">「没有配置就不注册计数器」：vllm/v1/spec_decode/metrics.py:150-152</text>
<text x="42.0" y="1251.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">位置标签按 K 生成：同文件 :181-198</text>
<text x="42.0" y="1266.6999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">指标丢弃与冻结：vllm/v1/engine/async_llm.py:761-775（record 无条件、异常后冻结）</text>
<text x="42.0" y="1281.5499999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei">前端统计链薄弱的自认注释：lwd_cloud_mixed_scheduler.py:107-115</text>
<rect x="36.0" y="1350.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1364.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这个案例：看到「指标为零」先问三件事——这个角色该不该产生它？壳在是否等于在跑？分子为 0 还是分母为 0？答案不同，处置完全相反。</text>

<p class="ptitle">⑤ 案例四：从「一个请求放不下」到「整个集群挂住」的四级级联</p>
<p class="psub">现象：请求无限期挂起（ttl 1800 s），edge 与 prefill 都在空转、不报错。真相：decode 引擎早就死了——第一个 fatal 发生在几分钟前；后面看到的「卡死」是三个独立缺陷串成的级联。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="1116"1800" viewBox="0 0 1576 1800">
<rect width="1576" height="1800" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑤ 案例四：从「一个请求放不下」到「整个集群挂住」的四级级联</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">现象：请求无限期挂起（ttl 1800 s），edge 与 prefill 都在空转、不报错。真相：decode 引擎早就死了——第一个 fatal 发生在几分钟前；后面看到的「卡死」是三个独立缺陷串成的级联。</text>
<text x="36.0" y="130.0" font-size="11" fill="#333333">第一步：四级级联（时间顺序从下往上读，但根因在最下面）</text>
<rect x="96.0" y="146.0" width="1300.0" height="72.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="102.0" y="160.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">④ 客户端全 500　边侧 EngineCore 也终止，在飞请求全失败</text>
<rect x="96.0" y="232.0" width="1300.0" height="72.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="102.0" y="246.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">③ 边侧闸门死锁　台账永不释放 → 闸门永久 HOLD → 请求不再派发</text>
<rect x="96.0" y="318.0" width="1300.0" height="72.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="102.0" y="332.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">② prefill 水位冻结　收不完整 → 水位不推进 → prefill 停止发包</text>
<rect x="96.0" y="404.0" width="1300.0" height="72.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="102.0" y="418.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">① decode 引擎死亡　KV 分配失败 → 抢占 → 硬编码 raise → 整个引擎退出</text>
<text x="36.0" y="498.0" font-size="11" fill="#333333">第二步：第一因是「准入判据不完备」（一个判断少写了一部分）</text>
<rect x="36.0" y="514.0" width="1424.0" height="132.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="528.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">准入时问的是：「这一个请求，此刻放得下吗？」（单个请求 vs 当前空闲块）</text>
<text x="42.0" y="541.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">但真正需要保证的是：「所有已准入请求的需求总和，永远不超过总容量」</text>
<text x="42.0" y="556.35" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">前者既不包含、也不蕴含后者。于是 32 个请求各自「此刻都放得下」，合起来却超过了块池——直到某一步分配失败，走到那条硬编码的「LWD 不允许抢占」断言上。</text>
<text x="42.0" y="571.2" font-size="9" fill="#333333" font-family="Microsoft YaHei">数量级验证：32 × 每请求块数 ≈ 块池总容量，而两侧的 max-num-seqs 都写着 128——准入上限大约是实际可容纳并发的 4 倍。</text>
<text x="36.0" y="670.0" font-size="11" fill="#333333">第三步：三个「放大器」把一个可恢复的失败放大成集群级 hang</text>
<rect x="36.0" y="686.0" width="460.0" height="190.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="700.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="708.0" font-size="11" fill="#333333">① 失败粒度错了</text>
<text x="46.0" y="734.0" font-size="11" fill="#333333">「一个请求放不下」被写成了「整个引擎退出」——硬编码 raise 让调度器的单请求失败升级为进程级 fatal。正确形态：标记该请求失败 → 交给调度器正常终结 → 引擎活着。</text>
<rect x="518.0" y="686.0" width="460.0" height="190.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="524.0" y="700.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="528.0" y="708.0" font-size="11" fill="#333333">② 台账没有租约</text>
<text x="528.0" y="734.0" font-size="11" fill="#333333">边侧每条 chunk 都有一个「待释放」台账，只在两个时刻摘：收到首 token / 请求结束。下游死了 → 两件事都不会发生。→ 台账永久占着，闸门永久 HOLD。</text>
<rect x="1000.0" y="686.0" width="460.0" height="190.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="1006.0" y="700.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1010.0" y="708.0" font-size="11" fill="#333333">③ 没有任何超时与死亡检测</text>
<text x="1010.0" y="734.0" font-size="11" fill="#333333">没有对端存活检测、没有请求级超时、数据面收包只能死等。所以「等一个永远不来的东西」可以无限持续下去，表现就是「空转 680 步/秒，什么都不推进」。</text>
<text x="36.0" y="900.0" font-size="11" fill="#333333">第四步：两个「看起来像正常，其实是故障指纹」的指标</text>
<rect x="36.0" y="916.0" width="460.0" height="42.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="42.0" y="930.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">指标形态</text>

<text x="922.0" y="930.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">真相</text>
<rect x="36.0" y="958.0" width="460.0" height="42.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="972.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">running 数单调爬升、一次都没回落</text>
<rect x="496.0" y="958.0" width="420.0" height="42.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="502.0" y="972.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">以为：吞吐在健康增长</text>
<rect x="916.0" y="958.0" width="544.0" height="42.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="922.0" y="972.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">真相：背压没生效（只做了「单请求此刻够不够」的检查，没有全局账本）</text>
<rect x="36.0" y="1000.0" width="460.0" height="42.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1014.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">空转步数很高（edge 680、prefill 420 步/秒）</text>
<rect x="496.0" y="1000.0" width="420.0" height="42.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="502.0" y="1014.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">以为：负载很高 / 在忙</text>

<text x="922.0" y="1014.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">真相：在等一个不会来的东西，空转不是干活</text>
<rect x="36.0" y="1072.0" width="1424.0" height="132.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="1086.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第五步：修法是「让它结构上不可能发生」，而不是「让它变得可行」</text>
<text x="42.0" y="1100.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 把准入做成账本：admit 即预留，校验改成「本请求需求 + 已预留总和 ≤ 总容量」→ 那条抢占断言变成结构上不可达。</text>
<text x="42.0" y="1114.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 把致命抢占降级为单请求失败（不再 raise）。</text>
<text x="42.0" y="1129.1999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 给台账加租约（30 s 未释放 → 摘台账 + 请求失败）→ 任何上游单点故障都在 30 s 内变成「请求失败」而不是「集群挂住」。</text>
<text x="42.0" y="1144.0499999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei">④ 接上已有的恢复手段：仓里那个「跳过序号」的恢复函数当时根本没有调用方，要接线 + 加接收超时。</text>
<text x="42.0" y="1158.8999999999996" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑤ 把并发上限由 KV 容量反推（本场景约 24~26，而不是 128）。</text>
<rect x="36.0" y="1244.0" width="1424.0" height="96.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="1258.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第六步：回归怎么判「真的好了」（三条都能自动跑）</text>
<text x="42.0" y="1272.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 并发曲线有升有降且有上限（不再单调爬），全程「导入被拒」为 0；</text>
<text x="42.0" y="1286.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">② kill -9 掉 decode 进程，边侧应在 30 s 内把在飞请求判错，prefill 不出现无限「收不完整」；</text>
<text x="42.0" y="1298.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 边侧日志里不再有「控制面投递停滞」的 fatal，只有 error + 丢弃。</text>
<rect x="36.0" y="1380.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>

<text x="36.0" y="686.0" font-size="11" fill="#333333">第四步：两个反直觉的观察（学会能少走很多弯路）</text>

<text x="42.0" y="716.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="724.0" font-size="11" fill="#333333">① OOM 报的位置不是元凶</text>
<text x="46.0" y="750.0" font-size="11" fill="#333333">报错在视觉塔内部的 attention 算子（只差 78 MiB）、两秒后又在排序算子（68 MiB）再炸一次。那是「卡已经满了、只差最后一个大分配」的落点，不是「这个算子要得多」。</text>
<rect x="796.0" y="702.0" width="664.0" height="168.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="802.0" y="716.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="724.0" font-size="11" fill="#333333">② 它是被「修好上一个 bug」暴露出来的</text>
<text x="806.0" y="750.0" font-size="11" fill="#333333">更早的几轮里，同一个部署在 31 条请求时就先被另一个缺陷打死，来不及跑到 OOM。「上一轮的问题修好了」不等于「系统健康」——它只是让下一层缺陷有机会显形。</text>
<rect x="36.0" y="910.0" width="1424.0" height="100.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="924.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第五步：修复三件套（根因 + 双保险 + 可观测性）</text>
<text x="42.0" y="938.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 给覆写的方法补上「无梯度」上下文（本案例用「不建图」而非更激进的模式，因为方法内要对锁页内存取 numpy 视图，受后者限制）；</text>
<text x="42.0" y="952.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 写缓存前再 detach 一次（双保险：即使将来有人再绕过装饰器，也不会把图带进缓存）；</text>
<text x="42.0" y="967.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 把内存打出来：每步日志追加「已分配 / 峰值」与「缓存张量个数」——复盘里明说「这次是靠事后推算出来的，下次不该再这样」。</text>

<text x="42.0" y="1064.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：本案例是「覆写框架方法丢了隐含契约」。下一步（⑦）是同一个教训的另一种表现——覆写之后把「该归还的东西」忘了归还。</text>

<text x="36.0" y="492.0" font-size="11" fill="#333333">第三步：为什么「申请不到」——归还点被绕过了</text>

<text x="42.0" y="522.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">框架里，编码器缓存槽位只有一个归还点：一个叫「按输出更新状态」的方法。而边侧引擎接管了 step（自己组批、收割、投递），从不调用那个方法。</text>
<text x="42.0" y="535.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">于是槽位只减不增：总量 8192，单图约 750 个嵌入 → 大约 10 个在飞的多模态请求就把槽位钉死；此后每个新请求都走「退让到 4」这条路，撞上严格等值核验 → 引擎当场死亡。</text>
<text x="36.0" y="664.0" font-size="11" fill="#666666">这正是 ⑥ 页那个教训的另一面：接管框架的 step，等于接管它的全部副作用——最容易漏的就是「释放」。</text>

<text x="42.0" y="926.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 补回归还：按「实际执行完的量」记账并归还（不能用「乐观推进的计数」，异步流水下会提前释放仍在飞的张量）；</text>

<text x="36.0" y="430.0" font-size="11" fill="#333333">第二步：第一版结论错在哪（这是本案例最贵的教训）</text>

<text x="46.0" y="494.0" font-size="11" fill="#333333">证据：20 条输出没有结束标记，长度≈2046 token，正好卡在 2048 上限；放宽判据后 89 分；关掉思考模式后分数回升。而且用官方评分器重放，能精确复现 63.80。→ 看起来「证据链完整」。</text>
<rect x="796.0" y="446.0" width="664.0" height="186.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="802.0" y="460.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="468.0" font-size="11" fill="#333333">它错在：把「症状」当成了「原因」</text>
<text x="806.0" y="494.0" font-size="11" fill="#333333">复现分数只校验了评分口径，没有校验因果链。「关掉思考」只是把症状藏起来：位置偏移让模型答非所问、思维链打转，关掉思考就不再打转，分数回升——但错位本身还在。所以那个「修复」后来被撤销了。</text>
<text x="36.0" y="656.0" font-size="11" fill="#333333">第三步：真因怎么找到的——去查「两侧算出的位置」是否一致</text>
<rect x="36.0" y="672.0" width="1424.0" height="132.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="686.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">同一批请求，P 侧与 D 侧各打一条「位置偏移」日志：P 侧是 −640，D 侧是 −1；100 条请求全都同型。</text>
<text x="42.0" y="699.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">含义：生成段每个 token 的绝对位置，与 prefill 写 KV 时用的位置相差 639。</text>
<text x="42.0" y="714.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">于是模型在「位置对不上的上下文」上续写——输出流畅、不报错，但系统性答非所问；并且容易打转、退化（出现过 7000 字符的循环、1941 个连续同字符），最后撞上输出上限被截断。</text>
<text x="42.0" y="729.2" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">这同时解释了第一版看到的全部现象：截断、冗长、以及「答案里的词明明对」。</text>
<rect x="36.0" y="844.0" width="1424.0" height="130.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="858.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="866.0" font-size="11" fill="#333333">为什么会算出 −1（机理，一句话）</text>
<text x="46.0" y="892.0" font-size="11" fill="#333333">D 侧的位置表初始是「按纯文本从 0 连续排」；PD 分离下 D 侧实际只收到「尾窗」那一小段，于是按「窗口最大值」反推偏移时，那些没被覆盖的初始残值（约等于 prompt 长度）占了主导→ 偏移塌成 −1。修法是让 D 侧采用边侧下发的整段位置最大值，并按接收端 prompt 长度裁剪，避免 P 侧偏差 1。</text>
<text x="36.0" y="998.0" font-size="11" fill="#333333">第四步：精度类还有一个必须知道的数字——单轮噪声底 ±10</text>

<text x="42.0" y="1028.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">同一批样本、温度 0、连跑 8 次：总分在 46~74 之间波动；100 条里有 52 条出现过「这轮对、那轮错」。</text>
<text x="42.0" y="1041.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">所以：① 单轮数字不足以判定回归，要跑 3 轮取均值；② 想压低噪声得固定批形（小并发）或让边侧直接采用云侧 token（协议上刻意不做）；③ 反例也很有用：加大输出预算并没有提升精度——两次更大预算的运行里，截断数反而更多（25/29 条），严格精度只有 49.9/49.6。</text>

<text x="42.0" y="938.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 先对齐时钟、再读日志——跨机排障的第一步永远是校准，否则因果关系会整个反过来。</text>
<text x="42.0" y="952.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 报指标必须带上下文：报延迟要同时给并发、长度分布、完成率；报吞吐要同时给是否掉出图——同一份配置在并发 6 与 32 下能差 3 倍。</text>
<text x="42.0" y="967.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 把结论落成断言：修完要能「下次在拉起阶段就发现」，而不是靠人记住——本仓最值钱的一条建议就是那行启动自检日志。</text>
