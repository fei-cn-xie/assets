<p class="ptitle">① 四个机制一起开时，它们其实在抢同四样东西</p>
<p class="psub">一句话：PD 分离、Mooncake 搬 KV、图捕获、MTP 投机解码——这四个机制各自的收益写在不同的指标上，但它们花的是同一份显存、同一份算力、同一份启动时间和同一份「形状自由度」。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="705"1138" viewBox="0 0 1576 1138">
<rect width="1576" height="1138" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">① 四个机制一起开时，它们其实在抢同四样东西</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：PD 分离、Mooncake 搬 KV、图捕获、MTP 投机解码——这四个机制各自的收益写在不同的指标上，但它们花的是同一份显存、同一份算力、同一份启动时间和同一份「形状自由度」。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：每个机制「买」什么、「付」什么</text>
<rect x="36.0" y="152.0" width="220.0" height="46.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="42.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">机制</text>
<rect x="256.0" y="152.0" width="620.0" height="46.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="262.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">买到什么</text>
<rect x="876.0" y="152.0" width="580.0" height="46.0" rx="4" fill="#efe9dd" stroke="#9673a6"/>
<text x="882.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">付出什么</text>
<rect x="36.0" y="198.0" width="220.0" height="46.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="212.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">PD 分离</text>
<rect x="256.0" y="198.0" width="620.0" height="46.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="262.0" y="212.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">把算力密集（prefill）与带宽密集（decode）分到不同实例，各用各的卡</text>
<rect x="876.0" y="198.0" width="580.0" height="46.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="882.0" y="212.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">整机数量翻倍；KV 要跨机搬；调度的尾段要对齐</text>
<rect x="36.0" y="244.0" width="220.0" height="46.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="258.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">Mooncake 搬 KV</text>
<rect x="256.0" y="244.0" width="620.0" height="46.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="262.0" y="258.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">把 decode 侧的 KV 从 P 侧拉过来，省掉重算</text>
<rect x="876.0" y="244.0" width="580.0" height="46.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="882.0" y="258.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">带宽与延迟；额外的传输缓冲；失败要兜底（fail-closed）</text>
<rect x="36.0" y="290.0" width="220.0" height="46.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="304.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">图捕获（CUDA/ACL Graph）</text>
<rect x="256.0" y="290.0" width="620.0" height="46.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="262.0" y="304.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">削减每步的 CPU 提交开销 → TPOT 下降</text>
<rect x="876.0" y="290.0" width="580.0" height="46.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="882.0" y="304.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">显存（进程级图池）；启动时间（5~20 s）；形状必须固定</text>
<rect x="36.0" y="336.0" width="220.0" height="46.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="350.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">MTP / 投机解码</text>
<rect x="256.0" y="336.0" width="620.0" height="46.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="262.0" y="350.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一次前向多产出几个 token → 单请求更快</text>
<rect x="876.0" y="336.0" width="580.0" height="46.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="882.0" y="350.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">显存（draft 权重 + lookahead 槽）；算力（被拒的草案白算）；形状变成 1+K</text>
<text x="36.0" y="402.0" font-size="11" fill="#333333">第二步：四样稀缺资源——冲突都发生在这里</text>
<rect x="36.0" y="422.0" width="340.0" height="118.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="436.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="444.0" font-size="11" fill="#333333">显存</text>
<text x="46.0" y="466.0" font-size="11" fill="#333333">权重 / KV / 激活峰值 / 图池 / draft。这五个抽屉总和固定，谁多谁少。</text>
<rect x="388.0" y="422.0" width="340.0" height="118.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="394.0" y="436.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="398.0" y="444.0" font-size="11" fill="#333333">算力</text>
<text x="398.0" y="466.0" font-size="11" fill="#333333">decode 本来就闲着；MTP 把闲着的算力换成 token，但被拒的草案是纯浪费。</text>
<rect x="740.0" y="422.0" width="340.0" height="118.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="746.0" y="436.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="750.0" y="444.0" font-size="11" fill="#333333">带宽</text>
<text x="750.0" y="466.0" font-size="11" fill="#333333">decode 卡在显存带宽；跨机搬 KV 又吃网络带宽。两条带宽不是同一根管子，但都稀缺。</text>
<rect x="1092.0" y="422.0" width="340.0" height="118.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="1098.0" y="436.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1102.0" y="444.0" font-size="11" fill="#333333">形状自由度</text>
<text x="1102.0" y="466.0" font-size="11" fill="#333333">图捕获要求形状固定；MTP 把 1 变成 1+K；chunked prefill 让形状每步都变。三者互相拉扯。</text>
<rect x="36.0" y="580.0" width="1424.0" height="116.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="594.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="602.0" font-size="11" fill="#333333">为什么「同时开」比「一个个开」难得多</text>
<text x="46.0" y="628.0" font-size="11" fill="#333333">单独读每个机制的文档，你都会觉得它很合理；但它们的约束会互相冲突：MTP 要形状 1+K，图捕获要形状固定，chunked prefill 要形状可变，PD 又要两边形状对齐。而且冲突的表现方式几乎都不是「报错」，而是「某条优化静默失效」——你会看到性能没达到预期，却没有任何日志提示。所以这一套图的目的是：把「改一个参数会连累谁」显式画出来，而不是给出万能配方。</text>
<rect x="36.0" y="736.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="750.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：先建立「四种资源 + 四个机制」的坐标。下一步（②）把启动命令里的参数按这张坐标分类，看它们各自落在哪一格。</text>
<rect x="36.0" y="812.0" width="1424.0" height="104.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="826.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="840.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">显存五抽屉：vllm/v1/worker/gpu_worker.py:528-642（determine_available_memory）；入门套 ⑦</text>
<text x="42.0" y="853.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">图池是进程级共用：vllm/compilation/cuda_graph.py:200；图捕获套 ⑦</text>
<text x="42.0" y="867.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">MTP 的形状影响：vllm/config/vllm.py:679（uniform_decode_query_len）；MTP 套 ⑦</text>
<text x="42.0" y="882.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">PD 的两侧形状对齐：vllm/v1/lwd_control/pd/envelope.py:215-227；MTP 套 ⑨</text>
<text x="42.0" y="897.5500000000001" font-size="11" fill="#333333" font-family="Microsoft YaHei">chunked prefill 让形状可变：vllm/config/scheduler.py:116；进程/线程 ⑫</text>
<rect x="36.0" y="948.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="962.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：四个机制各自买不同的指标，却花同一份显存/算力/带宽/形状自由度；所以「都打开」不是叠加收益，而是重新分配稀缺资源。</text>

<p class="psub">一句话：投机解码把 decode 的 query 长度从 1 变成 1+K；而图捕获的桶是一份硬编码的尺寸列表——两者必须对上，对不上要么被自动取整、要么直接报错起不来。</p>

<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：投机解码把 decode 的 query 长度从 1 变成 1+K；而图捕获的桶是一份硬编码的尺寸列表——两者必须对上，对不上要么被自动取整、要么直接报错起不来。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：一条四步因果链（每一步都能在代码里指到）</text>

<text x="36.0" y="290.0" font-size="11" fill="#333333">第二步：同一组「最大 512」，开/不开 MTP 的桶不一样</text>

<text x="46.0" y="358.0" font-size="11" fill="#333333">桶可以是任意尺寸：1, 2, 4, 8, 16, 32, …, 512因为 query 长度恒为 1，padded token 数就等于请求数。所以「几个请求 → 落到哪个桶」很直观。</text>

<p class="ptitle">④ 联动二：想给 KV 多留一点，先搞清楚是谁在吃它</p>
<p class="psub">一句话：可用 KV = 上限 − 权重 − 激活峰值 − 图池 − 碎片；所以「权重变大」「开图捕获」「开 MTP」都会让并发变小——只是路径不同。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="791"1276" viewBox="0 0 1576 1276">
<rect width="1576" height="1276" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">④ 联动二：想给 KV 多留一点，先搞清楚是谁在吃它</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：可用 KV = 上限 − 权重 − 激活峰值 − 图池 − 碎片；所以「权重变大」「开图捕获」「开 MTP」都会让并发变小——只是路径不同。</text>
<rect x="36.0" y="150.0" width="1424.0" height="92.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">可用 KV = gpu_memory_utilization × 卡总显存 − 非 KV 部分</text>
<text x="42.0" y="178.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">其中「非 KV 部分」= 权重 + 激活峰值（profile 量出）+ 图池估算（可选计入）+ 碎片；剩下的全部被切成块 → 块数 ÷ 每请求块数 = 能开多少并发。</text>
<text x="36.0" y="260.0" font-size="11" fill="#333333">第一步：三条「减少 KV」的路径（本仓都能找到实例）</text>
<rect x="36.0" y="280.0" width="460.0" height="200.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="42.0" y="294.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="302.0" font-size="11" fill="#333333">链一：权重变大 → KV 变少</text>
<text x="46.0" y="328.0" font-size="11" fill="#333333">TP=1 时整模型都压在一张卡上：权重占比越高 → 剩余越少 → 块数越少 → 并发越低。本仓表现：TP=1 + MTP 的包只能报 max_num_seqs=32，甚至把 max_model_len 压到 512 才起得来。（TP=2 的包就能报 65536 / 128）</text>
<rect x="518.0" y="280.0" width="460.0" height="200.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="524.0" y="294.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="528.0" y="302.0" font-size="11" fill="#333333">链二：开图捕获 → KV 变少</text>
<text x="528.0" y="328.0" font-size="11" fill="#333333">图池是一整块进程级内存（≈各桶峰值取 max），估算时会被从可用显存里扣掉（可开关）。本仓表现：P 与 edge 用 --enforce-eager 正是为了省这块；D 侧要 decode 吞吐，所以接受这块开销。</text>
<rect x="1000.0" y="280.0" width="460.0" height="200.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="1006.0" y="294.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1010.0" y="302.0" font-size="11" fill="#333333">链三：开 MTP → KV 变少</text>
<text x="1010.0" y="328.0" font-size="11" fill="#333333">两块开销：① draft 权重与缓冲（MTP 复用 embedding/lm_head，增量小）；② 每请求多留 K 个 lookahead 槽（草案要往 target 之外写 KV）。本仓注释明说：MTP 把 KV 吃到只剩几十个块。</text>
<text x="36.0" y="500.0" font-size="11" fill="#333333">第二步：两个「覆盖」关系（设了就生效，别指望叠加）</text>
<rect x="36.0" y="520.0" width="700.0" height="148.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="534.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="542.0" font-size="11" fill="#333333">kv_cache_memory_bytes 会无视 gpu_memory_utilization</text>
<text x="46.0" y="568.0" font-size="11" fill="#333333">一旦直接给 KV 分配字节数，引擎会跳过 memory profiling，完全按你给的数切块（日志里会明说「不遵守 gpu_memory_utilization」）。→ 想精确控制就给它；想省心就用百分比。二者只信一个。</text>
<rect x="796.0" y="520.0" width="664.0" height="148.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="802.0" y="534.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="542.0" font-size="11" fill="#333333">max_model_len 放不下 KV 直接起不来</text>
<text x="806.0" y="568.0" font-size="11" fill="#333333">报错会告诉你「KV 需要多少、可用多少」，并给出二分搜索出来的「本卡最多能支持多长」。本仓有一个包正是靠这一条把 max_model_len 压到 512 才起得来。</text>
<rect x="36.0" y="708.0" width="1424.0" height="108.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="722.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">第三步：三个「同时开就互相拆台」的组合</text>
<text x="42.0" y="736.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① TP=1 + MTP + 大 max_model_len：权重 + MTP 开销已经吃满，KV 只剩零头 → 起不来。本仓解法是把 mml 压到 512 或干脆不开 MTP。</text>
<text x="42.0" y="750.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② FULL_DECODE_ONLY + 小 max_num_seqs：图池按最大桶抓，桶又由 seqs×(1+K)×2 决定 → seqs 太小会让桶太小、图收益变小。</text>
<text x="42.0" y="765.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 高 gpu_memory_utilization + 图捕获：水位拉到 0.98 时，图池与碎片没有余量 → 捕获阶段容易 OOM（而捕获段没有回退）。</text>
<rect x="36.0" y="856.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="870.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：显存的三条链讲完。下一步（⑤）转到调度参数——那里有一整条「你没设，引擎替你算」的推导链。</text>

<text x="42.0" y="946.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="960.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">可用 KV 的计算：vllm/v1/worker/gpu_worker.py:619-625；图池估算开关 :588-592</text>
<text x="42.0" y="973.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">kv_cache_memory_bytes 覆盖：vllm/config/cache.py:228-235；vllm/v1/worker/gpu_worker.py:542-564</text>

<text x="42.0" y="1017.5500000000001" font-size="11" fill="#333333" font-family="Microsoft YaHei">块数随 block_size 反比：vllm/v1/core/kv_cache_utils.py:1747-1751</text>

<rect x="36.0" y="1086.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1100.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：想让并发变大，只有三条路——减少权重占用（加 TP）、别开图池（eager）、别开 MTP；而「提高 gpu_memory_utilization」只是把水位线抬高，代价是离 OOM 更近。</text>

<text x="42.0" y="616.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">· 有一个包（mooncake_pd_195）的 decode 侧没有 enforce-eager，还手写了 capture_sizes。</text>

<text x="36.0" y="612.0" font-size="11" fill="#333333">第三步：反过来——遇到症状时该先动哪个参数（决策树）</text>
<rect x="36.0" y="630.0" width="1424.0" height="148.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="644.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">症状 A：启动就 OOM / 报 KV 不够 → ① 降 max_model_len 或 max_num_seqs；② 抬 gpu_memory_utilization（0.90→0.95→0.98）；③ 关掉一项大头（MTP 或图）。</text>
<text x="42.0" y="657.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">症状 B：单请求很慢（TPOT 高） → ① 确认 D 侧图真的在跑（看 journal 有无 replay 日志）；② 确认 MTP 接受率（&lt;1.3 就关）；③ 再看是不是桶太小。</text>
<text x="42.0" y="672.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">症状 C：吞吐上不去 → ① 看并发是否被 seqs/KV 卡住；② 看 chunked prefill 是否在切长 prefill；③ 看是否因形状不整齐掉回 eager。</text>
<text x="42.0" y="687.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">症状 D：延迟抖动 → ① 长 prefill 挤占 decode（调小 batched 或开分块阈值）；② 图桶不命中造成的偶发回退。</text>

<text x="42.0" y="832.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：决策树是基于前七页的因果。下一步（⑨）用本仓三套真实部署包，把「为什么它这么配」逐条对上。</text>

<text x="36.0" y="434.0" font-size="11" fill="#333333">第二步：四条「为什么」（这才是配方的价值）</text>
<rect x="36.0" y="452.0" width="1424.0" height="116.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="466.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 为什么 TP=2 的包敢报 65536，而 TP=1 的包只敢报 32768 甚至 512：TP=2 把权重切成两半，单卡剩余显存多 → 能装长上下文的 KV；TP=1 要在一张卡里放下整模型，剩余只够短上下文。</text>
<text x="42.0" y="479.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 为什么 TP=1 + MTP 的包把 max_num_seqs 压到 32：MTP 又多占一份 draft 开销与 lookahead 槽，KV 只剩几十个块，一个序列一块 → 32 是上限。</text>
<text x="42.0" y="494.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 为什么 gpu-memory-utilization 有 0.90 / 0.95 / 0.98 三档：LWD 边云要留主机面与图池余量 → 0.90；普通 PD → 0.95；一卡塞整模型且还想开 MTP → 只能拉到 0.98 挤出来。</text>
<text x="42.0" y="509.20000000000005" font-size="11" fill="#333333" font-family="Microsoft YaHei">④ 为什么只有 fix_1120 显式给 block-size 128 + 量化 + 专家并行：DeepSeek 那套要按组对齐块大小、要 8 卡放专家、要 int8 压 KV —— 三者是同一个目的。</text>
<text x="36.0" y="590.0" font-size="11" fill="#333333">第三步：抄配方时最容易犯的两个错</text>
<rect x="36.0" y="608.0" width="700.0" height="160.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="622.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="630.0" font-size="11" fill="#333333">错法一：只抄 K，不抄桶</text>
<text x="46.0" y="656.0" font-size="11" fill="#333333">K=3 意味着 decode 的 query 长度是 4，图桶必须是 4 的倍数。抄了 K 却把自己以前的桶列表一起抄过来（那些是 K=0 时代的数）→桶被自动取整或直接报错；更糟的是运行时静默回 eager。</text>
<rect x="796.0" y="608.0" width="664.0" height="160.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="802.0" y="622.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="630.0" font-size="11" fill="#333333">错法二：只抄 max_model_len，不抄 seqs/gpu-mem</text>
<text x="806.0" y="656.0" font-size="11" fill="#333333">这三者是一条链：mml 大 → KV 需求大 → seqs 必须小，或 gpu-mem 必须高。只把 mml 抄大而 seqs、gpu-mem 不动 → 启动时报「KV 不够」并给出可支持的估计值。</text>
<rect x="36.0" y="808.0" width="1424.0" height="96.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>

<text x="42.0" y="836.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 有两套包（sidecar 与 in_process）四个脚本逐字节相同——它们是同一个配置的两种目录布局，画图/对比时应合并成一个节点。</text>
<text x="42.0" y="850.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 有 6 个脚本是 0 字节空壳（rdma/tcp 下的三件套），目录名里的规模参数不代表任何生效配置——别从目录名推参数。</text>
