<p class="lead">draft 四种来源、拒绝采样、KV 回退、三条约束、LWD 适配</p>
<p class="lead">本页 10 张图；点击编号跳转：<a href="#p0">1</a> <a href="#p1">2</a> <a href="#p2">3</a> <a href="#p3">4</a> <a href="#p4">5</a> <a href="#p5">6</a> <a href="#p6">7</a> <a href="#p7">8</a> <a href="#p8">9</a> <a href="#p9">10</a></p>
<figure id="p0">
<p class="ptitle">① 什么是 draft（草案）/ MTP：先猜几个，再一次验证</p>
<p class="psub">一句话：用小代价先猜出接下来的 N 个 token（draft），再让大模型一次前向把这 N 个一起验证；猜对的直接白拿，猜错就从错的地方截断。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="786"1268" viewBox="0 0 1576 1268">
<rect width="1576" height="1268" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">① 什么是 draft（草案）/ MTP：先猜几个，再一次验证</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：用小代价先猜出接下来的 N 个 token（draft），再让大模型一次前向把这 N 个一起验证；猜对的直接白拿，猜错就从错的地方截断。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：没有 draft 时，每生成一个字都要跑一次完整前向</text>
<rect x="36.0" y="152.0" width="1424.0" height="108.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="166.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">生成 4 个字 = 4 次完整前向，每次前向都要把全部权重从显存读一遍（这就是「decode 是带宽瓶颈」的直接后果）。</text>
<text x="42.0" y="179.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">注意：每次前向其实只看 1 个新 token，却要付整份权重的访存成本——这就是为什么 decode 的算术强度只有 ~2 FLOP/字节（见入门套 ⑤）。</text>
<text x="42.0" y="194.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">于是问题变成：能不能让一次前向多干点活？</text>
<text x="36.0" y="280.0" font-size="11" fill="#333333">第二步：加一个「便宜的起草者」之后</text>
<rect x="36.0" y="300.0" width="690.0" height="176.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="314.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="322.0" font-size="11" fill="#333333">① 起草（draft）</text>
<text x="46.0" y="348.0" font-size="11" fill="#333333">用一个便宜的来源先猜出接下来的 N 个 token：· 同模型的额外小头（MTP 层）、· 独立小模型、· 直接查 n-gram。成本远低于「让大模型跑 N 次」——因为只跑一次小东西（或干脆不跑模型）。得到 N 个候选 token，例如 [北京, 是, 中国, 的]。</text>
<rect x="766.0" y="300.0" width="694.0" height="176.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="772.0" y="314.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="776.0" y="322.0" font-size="11" fill="#333333">② 验证（verify）</text>
<text x="776.0" y="348.0" font-size="11" fill="#333333">把 N 个候选拼在输入里，让大模型一次前向算出这 N 个位置的 logits。然后逐位置比对：这个位置上，大模型自己会选哪个 token？· 一致 → 接受（白拿一个字）；· 不一致 → 从这里截断，用它自己的结果。所以「一次前向」最多能产出 N+1 个 token（N 个接受 + 1 个 bonus）。</text>
<rect x="36.0" y="516.0" width="1424.0" height="120.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="530.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">为什么这不改变「输出分布」（这是投机解码的立身之本）</text>
<text x="42.0" y="544.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">直觉上的担心：草案是便宜模型猜的，接受它会不会让结果变差？</text>
<text x="42.0" y="558.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">答案：不会——因为接受与否由大模型自己的概率决定：只有当大模型「也认为这个 token 够合理」时才接受，否则就按大模型的分布重新采样一个补上。</text>
<text x="42.0" y="573.2" font-size="11" fill="#333333" font-family="Microsoft YaHei">严格版本叫拒绝采样（rejection sampling），保证最终输出的分布与「老老实实逐字生成」完全一致（本仓代码注释直接引用了论文 arXiv:2211.17192）。</text>
<text x="36.0" y="656.0" font-size="11" fill="#333333">第三步：「MTP」这个词在两种语境下出现，别混</text>
<rect x="36.0" y="676.0" width="690.0" height="150.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="690.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="698.0" font-size="11" fill="#333333">训练期的 MTP（多 token 预测辅助头）</text>
<text x="46.0" y="724.0" font-size="11" fill="#333333">在训练时额外挂几个「预测未来第 2、3 个 token」的头，让模型学到「往后看几步」的能力（DeepSeek-V3 风格）。好处：训练信号更密；同时给推理期留下了一个可用的草稿头。</text>
<rect x="766.0" y="676.0" width="694.0" height="150.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="772.0" y="690.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="776.0" y="698.0" font-size="11" fill="#333333">推理期的 MTP（= 用这个头来起草）</text>
<text x="776.0" y="724.0" font-size="11" fill="#333333">推理时把上面那个头当作 draft 层：吃 target 的隐状态，自回归猜 N 个。本仓代码里 method='mtp' 会被当成 eagle 一类处理（共享同一套 proposer）。所以「MTP 加速」= 「用 MTP 头起草 + 大模型验证」= 投机解码的一种特例。</text>
<rect x="36.0" y="866.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="880.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：这一页只说了「能白拿」。下一步（②）把「为什么划算」算成数：一次前向算 1+N 个位置，比算 1 个贵多少？</text>
<rect x="36.0" y="942.0" width="1424.0" height="104.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="956.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="970.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">「一次前向处理 1+N 个 query」：vllm/config/vllm.py:660-679（uniform_decode_query_len = 1 + num_speculative_tokens）</text>
<text x="42.0" y="983.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">草稿 N 的配置入口：vllm/config/speculative.py:381（num_speculative_tokens）</text>
<text x="42.0" y="997.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">验证与拒绝采样：vllm/v1/sample/rejection_sampler.py:45-65（术语表与论文引用）、:188-200（入口）</text>
<text x="42.0" y="1012.7" font-size="11" fill="#333333" font-family="Microsoft YaHei">本步要验证的草稿集合：vllm/v1/core/sched/output.py:334-337（scheduled_spec_decode_tokens）</text>
<rect x="36.0" y="1078.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1092.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：投机解码 = 先猜（draft）+ 一次前向验证；猜对的直接白拿、猜错从错处截断；因为接受规则由大模型自己的概率决定，输出分布不变——这就是它敢上线的原因。</text>

<p class="ptitle">② 为什么划算：把「1 次前向」的边际成本算清楚</p>
<p class="psub">一句话：decode 每步的大头是搬权重（与 query 数几乎无关），所以把 1+N 个位置塞进同一次前向，权重的搬运费只付一遍——这就是投机解码的经济学基础。</p>

<text x="42.0" y="366.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="374.0" font-size="11" fill="#333333">只算 1 个（普通 decode）</text>
<text x="46.0" y="400.0" font-size="11" fill="#333333">搬权重：1 份（大头）搬 KV：1 份算矩阵：1 份产出：1 个 token→ 每 token 都要付一整份权重搬运费</text>
<rect x="518.0" y="352.0" width="460.0" height="176.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="524.0" y="366.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="528.0" y="374.0" font-size="11" fill="#333333">算 1+N 个（验证阶段）</text>
<text x="528.0" y="400.0" font-size="11" fill="#333333">搬权重：仍是 1 份（同一批 GEMM）搬 KV：1+N 份（线性涨）算矩阵：1+N 份（算力本来闲着）最好情况产出：N+1 个 token（全中 + bonus）</text>
<rect x="1000.0" y="352.0" width="460.0" height="176.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="1006.0" y="366.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1010.0" y="374.0" font-size="11" fill="#333333">所以算术强度被拉起来了</text>
<text x="1010.0" y="400.0" font-size="11" fill="#333333">算术强度 = 运算量 ÷ 访存量：· 1 个位置：≈ 2 FLOP/字节（带宽死锁）· 1+N 个位置：约 (1+N)×2（权重那部分被摊薄）→ 这正是 ①「一次前向多干活」的意义，也是 batching 的同一个道理（入门套 ⑤⑥）。</text>
<text x="36.0" y="548.0" font-size="11" fill="#333333">第三步：加速比怎么估（通用公式，仓内只给各分量）</text>
<rect x="36.0" y="568.0" width="1424.0" height="108.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="582.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">设第 i 个位置的条件接受率为 αᵢ（越往后越低），draft 长度 K，则</text>
<text x="42.0" y="595.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">期望产出长度 E[L] = 1 + α₁ + α₁α₂ + … + α₁α₂…α_K（含最后那个 bonus token）</text>
<text x="42.0" y="610.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">加速比 ≈ E[L] ÷ (1 + 验证额外开销比)　—— 注意分母：draft 自己也要花时间，K 越大验证越贵。</text>
<text x="42.0" y="625.2" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">所以「K 越大越好」是错的：E[L] 增长会饱和，而开销线性涨。</text>
<rect x="36.0" y="710.0" width="700.0" height="150.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="724.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="732.0" font-size="11" fill="#333333">理想情况：草案很准（α 都接近 1）</text>
<text x="46.0" y="758.0" font-size="11" fill="#333333">一次前向产出接近 1+K 个 token，加速比接近 K+1（再扣掉 draft 开销）。什么时候准：文本有强规律（代码、格式化输出、RAG 里大量原文引用、n-gram 重复）。</text>
<rect x="796.0" y="710.0" width="664.0" height="150.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="802.0" y="724.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="732.0" font-size="11" fill="#333333">糟糕情况：草案不准（α 很快衰减）</text>
<text x="806.0" y="758.0" font-size="11" fill="#333333">第一个位置就被拒 → 白算了一遍 draft，还多读了 KV，纯亏。什么时候不准：开放式创作、长上下文后期（接受率会明显下降）。这就是为什么需要「按位置统计接受率」并用它来调 K（见 ⑧ 的指标）。</text>
<rect x="36.0" y="900.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="914.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：既然「草案准不准」决定一切，那草案从哪来就成了关键问题。下一步（③）看 draft 的四种来源，以及 vLLM 里各自的实现类。</text>
<rect x="36.0" y="976.0" width="1424.0" height="112.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="990.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="1004.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">「一次 decode 提交 1 + N 个 query」：vllm/config/vllm.py:661-679；vllm/v1/worker/gpu_model_runner.py:905</text>
<text x="42.0" y="1017.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">memory-bound 与「闲着算力」的本仓原文：vllm/docs/features/speculative_decoding/README.md:3、adaptive_verification.md:3（the extra draft tokens are close to free）</text>
<text x="42.0" y="1031.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">验证成本随 K 增长的说明：vllm/docs/features/speculative_decoding/adaptive_verification.md:3；vllm-ascend/docs/.../speculative_decoding.md:785</text>
<text x="42.0" y="1046.6999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">逐位接受率衰减：adaptive_verification.md:5；指标定义 vllm/v1/spec_decode/metrics.py:107-118</text>
<rect x="36.0" y="1122.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1136.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：投机的收益来自「权重只搬一次」，上限是 1+K 个 token；实际加速 ≈ 期望接受长度 ÷ 额外开销。K 不是越大越好，接受率决定一切。</text>

<div class="concl"><b>一句话结论　</b>decode 每步的大头是搬权重（与 query 数几乎无关），所以把 1+N 个位置塞进同一次前向，权重的搬运费只付一遍——这就是投机解码的经济学基础。</div>

<text x="42.0" y="449.5" font-size="9" fill="#333333" font-family="Microsoft YaHei">同一个地方还构造 rejection_sampler（验证器）。所以「起草」与「验证」是成对装配的。</text>

<text x="36.0" y="546.0" font-size="11" fill="#333333">第三步：怎么选（两把尺子：显存 vs 接受率）</text>
<rect x="36.0" y="566.0" width="700.0" height="168.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="580.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="588.0" font-size="11" fill="#333333">省显存优先 → MTP / EAGLE</text>
<text x="46.0" y="614.0" font-size="11" fill="#333333">复用 target 的 embedding、lm_head，甚至共享同一份 KV cache；所以额外显存开销很小，而且接受率通常最高（因为它的隐藏状态与 target 同源）。代价：只有「模型自带这个头」或「能找到配套小头」时才能用。</text>
<rect x="796.0" y="566.0" width="664.0" height="168.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="802.0" y="580.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="588.0" font-size="11" fill="#333333">零成本优先 → n-gram / suffix</text>
<text x="806.0" y="614.0" font-size="11" fill="#333333">完全不用模型，纯字符串匹配；对「代码补全 / 大段引用 / 格式化输出」特别有效。但遇到开放式生成几乎全被拒——被拒也要付验证成本，所以可能是负收益。适合做「能省则省」的兜底策略，而不是主策略。</text>
<rect x="36.0" y="774.0" width="1424.0" height="108.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="788.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="796.0" font-size="11" fill="#333333">独立小模型（draft_model）：为什么它反而少见</text>
<text x="46.0" y="822.0" font-size="11" fill="#333333">要另带一份权重 + 一份 KV（显存直接变贵），而且小模型的分布与大模型差得远、接受率偏低；但它有两个不可替代的场景：① 大模型族没有自带 MTP 头；② 需要「跨模型复用」同一个 drafter（一个 drafter 服务多种 target）。本仓部署里用的是 MTP（见 ⑨），不是这个。</text>
<rect x="36.0" y="922.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="936.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：知道草案从哪来之后，就该看「它怎么被验证」——这是整套机制的数学核心。下一步（④）走一遍完整的 10 步流程。</text>
<rect x="36.0" y="998.0" width="1424.0" height="112.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1012.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>

<text x="36.0" y="34.0" font-size="11" fill="#333333">④ 一次带 draft 的 step：十步走完（按代码顺序）</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：调度器一次排 1+N 个位置 → 一次前向算出这 N 行验证 logits + 1 行 bonus → 拒绝采样逐位判 → 回退 KV → 用本步隐状态起草下一步。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">上：调度器与 worker（1-5）　　下：验证与回写（6-10）</text>
<rect x="36.0" y="150.0" width="1424.0" height="62.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="164.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">①　调度器一次排 1+N 个位置</text>
<text x="42.0" y="178.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">num_new_tokens 一般就是 1+N（N = num_speculative_tokens），再被「剩余上下文长度」收紧。</text>

<text x="42.0" y="234.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">②　按 1+N 分配 KV，并给 drafter 多留 N 个槽</text>
<text x="42.0" y="248.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">allocate_slots(..., num_lookahead_tokens=N)：因为 drafter 会往 target 之后写 KV，必须多预留（否则越界）。</text>
<rect x="36.0" y="290.0" width="1424.0" height="62.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="304.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">③　把草案写进本步输出，并清空请求侧缓存</text>
<text x="42.0" y="318.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">scheduled_spec_decode_tokens[req] = 草案；request.spec_token_ids 清空；padding 的位置填 -1（表示「这些位置没有草案」）。</text>

<text x="42.0" y="374.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">④　worker 把草案灌进输入批（含 positions / slot_mapping）</text>
<text x="42.0" y="388.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">positions = 已算 token 数 + 位置偏移；一次前向就要覆盖这 1+N 行。</text>
<rect x="36.0" y="430.0" width="1424.0" height="68.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="444.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑤　算 logits 行索引：每请求 N 行验证 + 1 行 bonus</text>
<text x="42.0" y="458.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">logits_indices / target_logits_indices / bonus_logits_indices 三组索引，把「哪一行是哪个请求的哪个位置」映射清楚。</text>
<rect x="36.0" y="506.0" width="1424.0" height="62.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="520.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑥　一次前向：target 算出 1+N 行 logits</text>
<text x="42.0" y="534.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">这一步就是「一次前向多干活」的实体：权重读一遍，算出所有候选位置的分布。</text>
<rect x="36.0" y="576.0" width="1424.0" height="62.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="590.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑦　先采 bonus（最后一行）</text>
<text x="42.0" y="604.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">bonus 只用 target 分布采（可带 temperature/top-p），是「全中时白送」的那个 token。</text>
<rect x="36.0" y="646.0" width="1424.0" height="68.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="660.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑧　拒绝采样逐位判：贪心 or 随机</text>
<text x="42.0" y="674.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">随机：u </text>
<rect x="36.0" y="722.0" width="1424.0" height="68.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="736.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑨　被拒位置补一个 token（recovered），输出定长 [B, N+1]</text>
<text x="42.0" y="750.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">recovered 从残差分布 max(p_target − p_draft, 0) 归一化后采样；输出数组空位填 -1，同步路径再把 -1 截掉。</text>

<text x="42.0" y="812.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">⑩　回退 KV，并用本步隐状态起草下一步</text>
<text x="42.0" y="826.85" font-size="9" fill="#333333" font-family="Microsoft YaHei">num_computed_tokens -= 被拒个数；草案由 drafter.propose() 用本步 hidden states 生成，异步拷回后交给 scheduler 缓存成 spec_token_ids。</text>

<text x="42.0" y="892.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：第 ⑧ 步「拒绝采样」是整套机制的数学核心——下一步（⑤）把贪心与随机两条分支讲透，包括为什么它不改变输出分布。</text>

<p class="ptitle">⑤ 验证规则：贪心看 argmax、随机比 p/q —— 为什么这样就不改变分布</p>
<p class="psub">一句话：验证不是「草案看着像就收」，而是用 target 自己的概率做裁判：贪心模式下比 argmax 是否一致；随机模式下按 min(1, p_target/p_draft) 的概率接受。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="828"1336" viewBox="0 0 1576 1336">
<rect width="1576" height="1336" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑤ 验证规则：贪心看 argmax、随机比 p/q —— 为什么这样就不改变分布</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：验证不是「草案看着像就收」，而是用 target 自己的概率做裁判：贪心模式下比 argmax 是否一致；随机模式下按 min(1, p_target/p_draft) 的概率接受。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：两条分支（同一个 sampler 里按 temperature 是否 0 分开）</text>
<rect x="36.0" y="152.0" width="700.0" height="200.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="174.0" font-size="11" fill="#333333">贪心模式（temperature = 0）</text>
<text x="46.0" y="200.0" font-size="11" fill="#333333">对每个候选位置：target 的 argmax 是多少？· 草案 token == target 的 argmax → 接受，继续看下一位· 不相等 → 拒绝，并把 target 的 argmax 作为这一位的输出，后面全作废全中 → 额外给 1 个 bonus token（也从 target 采）本质：等价于「取草案与真实输出的最长公共前缀」。</text>
<rect x="796.0" y="152.0" width="664.0" height="200.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="802.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="174.0" font-size="11" fill="#333333">随机模式（temperature &gt; 0）</text>
<text x="806.0" y="200.0" font-size="11" fill="#333333">对每个候选位置，取一个均匀随机数 u ∈ [0,1)：· 若 u  → 接受· 否则拒绝；被拒的这位不是「丢掉」，而是从残差分布里重新采一个：　 p_residual ∝ max(p_target − p_draft, 0)本质：接受 + 补位的组合，使最终分布严格等于 target 的分布（论文 arXiv:2211.17192）。</text>
<text x="36.0" y="372.0" font-size="11" fill="#333333">第二步：为什么这套规则是「无损」的（只需三层直觉）</text>
<rect x="36.0" y="392.0" width="1424.0" height="128.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="406.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 草案只是「提议」：它不决定输出，只决定「我们多看几个位置」。</text>
<text x="42.0" y="419.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 接受有概率上限：p_target/p_draft 比值小的地方（= target 不喜欢的 token）就难被接受；比值 ≥1 的地方（target 也喜欢）必然接受。</text>
<text x="42.0" y="434.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">③ 拒绝处补位：被拒的位置用 max(p_t − p_d, 0) 归一化后重采，正好补上「草案少给的那部分概率质量」。</text>
<text x="42.0" y="449.20000000000005" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">接受 + 补位合起来，恰好等于「直接用 target 分布采样」——所以输出分布不变，只是变快了。</text>
<text x="36.0" y="540.0" font-size="11" fill="#333333">第三步：三个必须知道的边界（代码里都有专门处理）</text>
<rect x="36.0" y="560.0" width="460.0" height="176.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="574.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="582.0" font-size="11" fill="#333333">① 没有概率的草案（n-gram）</text>
<text x="46.0" y="608.0" font-size="11" fill="#333333">查表出来的草案没有 q 可算，于是代码里令 p_draft = 1，接受条件退化成 u ——「target 觉得够可能就收」。</text>
<rect x="518.0" y="560.0" width="460.0" height="176.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="524.0" y="574.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="528.0" y="582.0" font-size="11" fill="#333333">② 草案概率为 0</text>
<text x="528.0" y="608.0" font-size="11" fill="#333333">若 p_draft == 0，比值会变成 inf/NaN。代码里显式判为「拒绝」，避免除零带来的数值问题。</text>
<rect x="1000.0" y="560.0" width="460.0" height="176.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="1006.0" y="574.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1010.0" y="582.0" font-size="11" fill="#333333">③ padding 的位置</text>
<text x="1010.0" y="608.0" font-size="11" fill="#333333">为了凑形状，scheduler 会填 -1 占位；验证时这些位置一律按「拒绝」处理，不会污染结果（同时保证图捕获要求的固定形状）。</text>
<rect x="36.0" y="776.0" width="1424.0" height="100.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="790.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">bonus token：为什么全中时要多送一个</text>
<text x="42.0" y="804.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">一次前向算了 N+1 行（N 个草案位置 + 1 个「下一位置」）。如果 N 个草案全被接受，那么第 N+1 行 logits 本来就摆在手上——直接用它采一个 token 是免费的。</text>
<text x="42.0" y="818.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">所以「全中」的产出是 N+1 个 token。也正因如此，平均接受长度（mean acceptance length）的统计口径是 1 + 接受数/草案数。</text>
<rect x="36.0" y="916.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="930.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：被拒的那些位置，KV 已经写进去了——怎么处理？下一步（⑥）就是这套机制最容易被误解的一环。</text>
<rect x="36.0" y="992.0" width="1424.0" height="120.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1006.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="1020.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">两条分支与入口：vllm/v1/sample/rejection_sampler.py:188-200（入口）、:719-773（贪心 kernel，:761 比较 argmax）、:822-893（随机 kernel）</text>
<text x="42.0" y="1033.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">接受条件与除零保护：rejection_sampler.py:864-877（accepted = draft_prob &gt; 0 and target_prob/draft_prob &gt;= uniform_prob）</text>
<text x="42.0" y="1047.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">无概率草案 p_draft=1：rejection_sampler.py:864-865</text>
<text x="42.0" y="1062.6999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">残差补位：rejection_sampler.py:1043-1077（prob = max(target_prob - draft_prob, 0)）</text>
<text x="42.0" y="1077.5499999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei">bonus token：rejection_sampler.py:55-65、:887-893</text>
<text x="42.0" y="1092.3999999999996" font-size="11" fill="#333333" font-family="Microsoft YaHei">pad 位置按 -1 拒绝：rejection_sampler.py:856-859；scheduler.py:1330-1334</text>
<rect x="36.0" y="1146.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1160.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：验证的裁判是 target 自己的概率——贪心比 argmax、随机比 p/q 并按时被拒后从残差补位；因此投机解码不改变输出分布，只改变「一次前向能推进几个 token」。</text>

<div class="concl"><b>一句话结论　</b>验证不是「草案看着像就收」，而是用 target 自己的概率做裁判：贪心模式下比 argmax 是否一致；随机模式下按 min(1, p_target/p_draft) 的概率接受。</div>

<p class="ptitle">⑥ 被拒的 KV 怎么办：不回滚数据，只回退「算到哪了」</p>
<p class="psub">一句话：验证前向会把 1+N 行 KV 全部写进去（包括后来被拒的位置）；被拒时不擦数据，而是把 num_computed_tokens 退回去 —— 下一轮从同一批槽位重新覆盖。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="819"1322" viewBox="0 0 1576 1322">
<rect width="1576" height="1322" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑥ 被拒的 KV 怎么办：不回滚数据，只回退「算到哪了」</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：验证前向会把 1+N 行 KV 全部写进去（包括后来被拒的位置）；被拒时不擦数据，而是把 num_computed_tokens 退回去 —— 下一轮从同一批槽位重新覆盖。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：三个事实（顺序很重要）</text>
<rect x="36.0" y="152.0" width="460.0" height="190.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="174.0" font-size="11" fill="#333333">① 验证前向「全都写」</text>
<text x="46.0" y="200.0" font-size="11" fill="#333333">slot_mapping 是按 positions 全量算出来的，所以 1+N 行都会写进 KV cache，包括那些后来被拒的位置。→ 也就是说：被拒的 KV 确实存在过。</text>
<rect x="518.0" y="152.0" width="460.0" height="190.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="524.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="528.0" y="174.0" font-size="11" fill="#333333">② 回退的是「计数」</text>
<text x="528.0" y="200.0" font-size="11" fill="#333333">num_rejected = 草案数 − 接受数；num_computed_tokens -= num_rejected；→ 「这个请求算到第几个 token」被退回到被拒位置。（注意：这一步在调度器侧做，不在 worker）</text>
<rect x="1000.0" y="152.0" width="460.0" height="190.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="1006.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1010.0" y="174.0" font-size="11" fill="#333333">③ 不擦数据，靠「同槽覆盖」</text>
<text x="1010.0" y="200.0" font-size="11" fill="#333333">下一轮 positions 从回退后的位置重新算，compute_slot_mapping 会算出同一批槽位，于是新数据直接覆盖掉旧的（脏数据自愈）。→ 所以没有「擦除」操作，也不需要额外开销。</text>
<text x="36.0" y="362.0" font-size="11" fill="#333333">第二步：一轮的时间线（第 2、3 个草案被拒的情形）</text>
<rect x="36.0" y="382.0" width="1424.0" height="108.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="396.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">上一轮末尾：算出 4 行（1 个新 token + 3 个草案）→ 全部写入 KV 槽位 #a #b #c #d</text>
<text x="42.0" y="409.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">验证：第 1 个接受、第 2 个被拒 → 接受数 = 1</text>
<text x="42.0" y="424.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">回退：num_rejected = 3 − 1 = 2 → num_computed_tokens 退回 2 个位置</text>
<text x="42.0" y="439.20000000000005" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">下一轮：positions 从 #c 重新开始，#c #d … 被新数据覆盖（不需要任何擦除/释放操作）</text>
<text x="36.0" y="510.0" font-size="11" fill="#333333">第三步：异步调度（async scheduling）还要多一层「乐观账」</text>
<rect x="36.0" y="530.0" width="700.0" height="176.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="544.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="552.0" font-size="11" fill="#333333">问题</text>
<text x="46.0" y="578.0" font-size="11" fill="#333333">异步模式下，调度器不等 worker 回报就先把「已算 token 数」按乐观值推进（假设全接受，因为多数情况确实接受）。但实际可能少接受几个 → 必须事后校正。</text>
<rect x="796.0" y="530.0" width="664.0" height="176.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="802.0" y="544.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="552.0" font-size="11" fill="#333333">做法</text>
<text x="806.0" y="578.0" font-size="11" fill="#333333">worker 回传「本步真实接受数」（valid_sampled_token_count），调度器算 correction = 乐观值 − 实际值，再把 num_computed_tokens 扣回来；同时同步 num_output_placeholders（占位计数）。</text>
<rect x="36.0" y="746.0" width="1424.0" height="116.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="760.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">顺带解释一个容易困惑的点：为什么「给 drafter 多留 N 个 KV 槽」</text>
<text x="42.0" y="774.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">草案阶段要往 target 之外的位置写 KV（例如第 N+1 个草案位置），所以分配时除了给 1+N 个 query 的槽，还要额外预留 N 个 lookahead 槽。</text>
<text x="42.0" y="788.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">如果不预留 → 写越界 / 需要临时扩容 → 既慢又可能碎。这也是「开投机解码会让可用 KV 变少」的直接原因之一（见 ⑦ 与 ⑨ 的实测）。</text>
<rect x="36.0" y="902.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="916.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：KV 的账（回退 + lookahead）就是投机解码与「显存」这条约束的接口。下一步（⑦）把三条系统约束（形状/显存/调度）一次性摊开。</text>
<rect x="36.0" y="978.0" width="1424.0" height="120.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="992.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码锚点（想自己去翻的时候用）</text>
<text x="42.0" y="1006.85" font-size="9" fill="#666666" font-family="Microsoft YaHei">全量写 KV：slot_mapping 由 positions 算出 vllm/v1/worker/gpu_model_runner.py:2196-2209</text>
<text x="42.0" y="1019.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">回退计数：vllm/v1/core/sched/scheduler.py:2041-2059（num_rejected 与 num_computed_tokens 扣减）</text>
<text x="42.0" y="1033.85" font-size="11" fill="#333333" font-family="Microsoft YaHei">同槽覆盖：下一轮 positions/slot 重算同文件 :2196-2209</text>
<text x="42.0" y="1048.6999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">异步乐观/校正：gpu_model_runner.py:1383-1408（乐观）、:1554-1584（校正）、vllm/v1/spec_decode/utils.py:822-851</text>
<text x="42.0" y="1063.5499999999997" font-size="11" fill="#333333" font-family="Microsoft YaHei">lookahead 预留：vllm/config/vllm.py:633-658；scheduler.py:741-745</text>
<text x="42.0" y="1078.3999999999996" font-size="11" fill="#333333" font-family="Microsoft YaHei">hybrid/Mamba 只保留末位 state：gpu_model_runner.py:1588-1644</text>
<rect x="36.0" y="1132.0" width="1424.0" height="58.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="1146.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">一句话记住这一页：被拒的 KV 不擦、不释放，只把「算到哪了」的计数退回去，下一轮覆盖同一批槽位；异步调度还要再补一层乐观校正。代价是：为了给 drafter 留槽，可用 KV 会变少。</text>

<figure id="p6">
<p class="ptitle">⑦ 投机解码踩到的三条系统约束（与前面几套图接上）</p>
<p class="psub">一句话：decode 的 query 长度从 1 变成 1+K，形状变了（图捕获要补桶）、显存变了（要多留 lookahead 槽）、调度变了（要求 uniform decode）。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="881"1422" viewBox="0 0 1576 1422">
<rect width="1576" height="1422" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑦ 投机解码踩到的三条系统约束（与前面几套图接上）</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：decode 的 query 长度从 1 变成 1+K，形状变了（图捕获要补桶）、显存变了（要多留 lookahead 槽）、调度变了（要求 uniform decode）。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">约束一：形状 —— decode 的 query 长度 = 1 + K</text>
<rect x="36.0" y="152.0" width="700.0" height="176.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="174.0" font-size="11" fill="#333333">发生了什么</text>
<text x="46.0" y="200.0" font-size="11" fill="#333333">普通 decode：每个请求这一步只有 1 个 query 位置；投机 decode：每个请求有 1+K 个位置（K 个草案 + 1 个 new）。所以「一次前向的 token 数」= 请求数 × (1+K)。代码里这个名字叫 uniform_decode_query_len。</text>
<rect x="796.0" y="152.0" width="664.0" height="176.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="802.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="174.0" font-size="11" fill="#333333">连带后果：图捕获的桶必须按 (K+1) 的倍数</text>
<text x="806.0" y="200.0" font-size="11" fill="#333333">图捕获要求固定形状 → 桶列表必须能被 K+1 整除，否则运行时会报错；vLLM 会把 capture size 向上取整到 K+1 的倍数；运行时还有断言：padded num_tokens % (K+1) == 0。→ 详见「vLLM图捕获」套 ⑥（桶与 dispatch）。</text>
<text x="36.0" y="348.0" font-size="11" fill="#333333">约束二：显存 —— draft 自己占一份，KV 还要多留</text>
<rect x="36.0" y="368.0" width="700.0" height="190.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="382.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="390.0" font-size="11" fill="#333333">两块额外开销</text>
<text x="46.0" y="416.0" font-size="11" fill="#333333">① draft 权重：MTP/EAGLE 复用 target 的 embedding 与 lm_head，增量小；独立小模型则要整份新权重。② lookahead 槽：草案会往 target 之外写 KV，分配时必须多预留 K 个槽。③ 另外还有与 1+K 成正比的缓冲区（例如 topk buffer 按 (1+K) 放大）。</text>
<rect x="796.0" y="368.0" width="664.0" height="190.0" rx="4" fill="#fff2cc" stroke="#d6b656"/>
<text x="802.0" y="382.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="390.0" font-size="11" fill="#333333">本仓实测：开 MTP 后 KV 明显变少</text>
<text x="806.0" y="416.0" font-size="11" fill="#333333">在 TP=1 + MTP 的包里，KV 块只剩几十个（32~63 个 GDN/Mamba 块），于是 max_num_seqs 被压到 32；关掉 MTP 时可用的 KV 会明显回升。→ 这就是「投机解码不是免费的」的现实版：它拿并发换单请求速度。</text>
<text x="36.0" y="578.0" font-size="11" fill="#333333">约束三：调度 —— 为了保住整图，必须让批「整齐」</text>
<rect x="36.0" y="598.0" width="1424.0" height="148.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="612.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="620.0" font-size="11" fill="#333333">为什么调度器要把「长度为 1 的 decode 请求」也 pad 成 1+K</text>
<text x="46.0" y="646.0" font-size="11" fill="#333333">如果一批里有的请求是 1 个 query、有的是 1+K 个，形状就不 uniform → 整图（FULL cudagraph）用不了，只能退回分段图或 eager。所以调度器在「本步要出 token」时，会把纯 decode 请求也补齐到 1+K（缺的位置填 -1 占位），宁可多算几个空位，也要保住整图。代价：padding 是白算的算力；但如果丢了整图，损失更大。这就是「uniform decode」这个词的来源。</text>

<figure id="p7">
<p class="ptitle">⑧ 昇腾侧：MTP 层排在 backbone 之后，draft 默认跑 eager</p>
<p class="psub">一句话：昇腾的 MTP 走 eagle 外壳（AscendEagleProposer），MTP 层是 backbone 之后的额外层、有自己独立的 KV；而部署里 draft 侧一律 enforce_eager: true。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="905"1460" viewBox="0 0 1576 1460">
<rect width="1576" height="1460" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑧ 昇腾侧：MTP 层排在 backbone 之后，draft 默认跑 eager</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：昇腾的 MTP 走 eagle 外壳（AscendEagleProposer），MTP 层是 backbone 之后的额外层、有自己独立的 KV；而部署里 draft 侧一律 enforce_eager: true。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：MTP 层在哪、和 target 共享什么</text>
<rect x="36.0" y="152.0" width="690.0" height="172.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="166.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">backbone（0 … N-1 层）：target 主体，产出 hidden states</text>
<text x="42.0" y="179.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">　　　↓</text>
<text x="42.0" y="194.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">MTP 层（第 N 层起）：吃 hidden + 下一 token 的 embedding，猜第 K 步</text>
<text x="42.0" y="209.2" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="42.0" y="224.04999999999998" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">共享：embedding 与 lm_head（省显存）</text>
<text x="42.0" y="238.89999999999998" font-size="11" fill="#333333" font-family="Microsoft YaHei">不共享：KV cache —— MTP 层有自己的层号与槽位</text>
<rect x="766.0" y="152.0" width="694.0" height="172.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="772.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="776.0" y="174.0" font-size="11" fill="#333333">为什么要记「共享权重但不共享 KV」</text>
<text x="776.0" y="200.0" font-size="11" fill="#333333">共享权重 → 不用再下一份 embedding/lm_head，显存增量小；不共享 KV → 草案的 KV 要单独占位（PD 传输时也作为额外层单独编号，但 MTP 多层共用同一份层，所以只传一次）。搞混这两件事，就会误以为「MTP 不占显存」或「KV 也能共享」。</text>
<text x="36.0" y="344.0" font-size="11" fill="#333333">第二步：一次起草的内部（MTP 复用同一层 K 次）</text>
<rect x="36.0" y="364.0" width="1424.0" height="128.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="378.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">① target 前向 → 得到本步 logits 与 hidden states；同一函数体里立刻接着起草。</text>
<text x="42.0" y="391.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">② 第 0 步：用 target 的 hidden + 下一 token 的 embedding 跑一次 MTP 层 → 得到第 1 个草案。</text>
<text x="42.0" y="406.35" font-size="9" fill="#333333" font-family="Microsoft YaHei">③ 之后串行 K−1 次，复用同一个 MTP 层（层选择 spec_step_idx % num_mtp_layers）→ 得到第 2 … K 个草案。</text>
<text x="42.0" y="418.5" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">所以「MTP 只有一层权重也能猜 K 个」——靠的是反复跑同一层；这也是官方建议 K=1~3 的原因（越往后越不准）。</text>
<text x="36.0" y="512.0" font-size="11" fill="#333333">第三步：昇腾侧的三道硬上限（都会直接报错，不是警告）</text>
<rect x="36.0" y="532.0" width="460.0" height="190.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="546.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="554.0" font-size="11" fill="#333333">① TND 布局：K+1 ≤ 16</text>
<text x="46.0" y="580.0" font-size="11" fill="#333333">昇腾 fused attention 的 TND 布局对 query 长度有上限，代码里断言 decode_threshold ≤ 16（即 K ≤ 15）；部署里用 K=3（个别包 K=1），离上限很远。</text>
<rect x="518.0" y="532.0" width="460.0" height="190.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="524.0" y="546.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="528.0" y="554.0" font-size="11" fill="#333333">② padded drafter 与整图互斥</text>
<text x="528.0" y="580.0" font-size="11" fill="#333333">「整图 + 变长 draft 批」这个组合不支持：代码直接 NotImplementedError，提示去掉 disable_padded_drafter_batch。所以要么 batch 补齐、要么别用整图。</text>

<text x="1006.0" y="546.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="1010.0" y="554.0" font-size="11" fill="#333333">③ draft 与某些图/并行特性互斥</text>
<text x="1010.0" y="580.0" font-size="11" fill="#333333">draft 只有在「target 开了整图 + draft 自己没 enforce_eager」时才包 ACLGraphWrapper；此外 lmhead TP 与 draft 的几种采样方式互斥（4 条 NotImplementedError）；MLA/MTP 的整图与 CP 不兼容。</text>

<figure id="p8">
<p class="ptitle">⑨ LWD 边云 PD 下的 MTP：draft 在云侧，edge 只按接受数出 token</p>
<p class="psub">一句话：MTP 只在云端 P/D 两个实例上跑，edge 不跑；而 PD 交接用 (p_end, i_end, r_pos) 三元组定边界，D 从 r_pos 起的「尾」才是它自己的。</p>
<div class="svgwrap"><svg xmlns="http://www.w3.org/2000/svg" width="977"1576" height="879"1418" viewBox="0 0 1576 1418">
<rect width="1576" height="1418" fill="#ffffff"/>
<text x="36.0" y="34.0" font-size="11" fill="#333333">⑨ LWD 边云 PD 下的 MTP：draft 在云侧，edge 只按接受数出 token</text>
<text x="36.0" y="62.0" font-size="11" fill="#666666">一句话：MTP 只在云端 P/D 两个实例上跑，edge 不跑；而 PD 交接用 (p_end, i_end, r_pos) 三元组定边界，D 从 r_pos 起的「尾」才是它自己的。</text>
<text x="36.0" y="132.0" font-size="11" fill="#333333">第一步：三个角色里只有两个跑 MTP</text>
<rect x="36.0" y="152.0" width="460.0" height="150.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">edge（1 卡）</text>
<text x="42.0" y="180.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">没有 --speculative-config；模块归属表把 MTP 划给 cloud，edge 侧裁掉。</text>
<text x="42.0" y="194.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">它只做：算 prompt embedding（UP 前）、按接受数做 UNEMBED（DOWN 后）。</text>
<rect x="518.0" y="152.0" width="460.0" height="150.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="524.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">P（prefill）</text>
<text x="524.0" y="180.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">配置里同样带 MTP，但 P 被压成 max_tokens=1、不产出用户可见输出；draft 在这里的实际收益有限（代码里没看到按角色跳过 draft 的守卫）。</text>
<rect x="1000.0" y="152.0" width="460.0" height="150.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="1006.0" y="166.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">D（decode）</text>
<text x="1006.0" y="180.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">MTP 的主战场：每一步都起草 K 个、验证、把真实接受行数回传给 edge，由 edge 决定这次吐几个 token。</text>
<text x="36.0" y="322.0" font-size="11" fill="#333333">第二步：PD 交接的三元组（MTP 让「边界」这件事更精确）</text>
<rect x="36.0" y="342.0" width="1424.0" height="116.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
<text x="42.0" y="356.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">p_end = P 真正算到的位置（只跑到 p_end+1）　·　i_end = KV 导入边界（D 只拉到这里）　·　r_pos = D 开始「拥有自己尾巴」的位置</text>
<text x="42.0" y="369.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">代码里只允许两种合法形态（例如 truncate 与否），D 侧会强校验「P 导出的三元组」与本地算出的一致，不一致直接失败。</text>
<text x="42.0" y="384.35" font-size="11" fill="#c0392b" font-family="Microsoft YaHei">有了 MTP，D 从 r_pos 起要「一次算 1+K 个位置」，所以 tail 的长度必须对得上 1+K 的节奏——这就是三元组必须精确的原因。</text>
<text x="36.0" y="478.0" font-size="11" fill="#333333">第三步：接受数如何穿过边云链路（最容易出错的一环）</text>
<rect x="36.0" y="498.0" width="700.0" height="176.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="512.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="46.0" y="520.0" font-size="11" fill="#333333">云侧：把「物理行」改写成「真实提交行数」</text>
<text x="46.0" y="546.0" font-size="11" fill="#333333">D 的一次前向输出是 1+K 行的数组（空位 -1）。回传给 edge 之前，云侧调度器把 num_accepted_tokens 从物理行数改写为真实提交的行数。否则 edge 会按 1+K 去取 hidden，取到 padding 的垃圾。</text>
<rect x="796.0" y="498.0" width="664.0" height="176.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="802.0" y="512.0" font-size="11" fill="#333333" font-family="Microsoft YaHei"></text>
<text x="806.0" y="520.0" font-size="11" fill="#333333">edge 侧：按接受数校验后 UNEMBED</text>
<text x="806.0" y="546.0" font-size="11" fill="#333333">edge 收到 DOWN 的 hidden 与接受数，强校验 end − start == num_accepted，再用 lm_head 做 UNEMBED，产出这次要吐给用户的 token。日志里能直接看到 accepted 数（[Lwd][edge-worker] UNEMBED … accepted=…）。</text>
<text x="36.0" y="694.0" font-size="11" fill="#333333">第四步：LWD 特有的两处改动（只改 embedding 来源，不改起草逻辑）</text>
<rect x="36.0" y="714.0" width="1424.0" height="104.0" rx="4" fill="#ffe6cc" stroke="#d79b00"/>
<text x="42.0" y="728.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">① 首步 embedding 来源：正常路径靠 token id 查表；LWD 里云端已收到 edge 上传的 prompt embedding，所以 draft 首步直接复用那份张量（充填 inputs_embeds）。</text>
<text x="42.0" y="741.5" font-size="11" fill="#333333" font-family="Microsoft YaHei">② SP 下的切片：外部 embedding 在序列并行下要按 TP 重新切一遍。</text>
<text x="42.0" y="756.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">此外还有一条 guard：continued prefill 场景不允许回退成 token id 查表，缺权威 embedding 直接报错。</text>
<rect x="36.0" y="858.0" width="1424.0" height="100.0" rx="4" fill="#f8cecc" stroke="#b85450"/>
<text x="42.0" y="872.0" font-size="11" fill="#333333" font-family="Microsoft YaHei">实测代价：开 MTP 会让并发变小</text>
<text x="42.0" y="886.85" font-size="10" fill="#333333" font-family="Microsoft YaHei">本仓 TP=1 且开 MTP 的部署包里，KV 只剩几十个块（32~63 个 GDN 块），max_num_seqs 只能设到 32；关掉 MTP 后可用 KV 明显回升。</text>
<text x="42.0" y="900.35" font-size="11" fill="#333333" font-family="Microsoft YaHei">原因就是 ⑦ 讲的两块开销：draft 自己的权重/缓冲 + lookahead 槽。所以「开 MTP」不是无条件更快，要按接受率与并发一起权衡。</text>
<rect x="36.0" y="998.0" width="1424.0" height="46.0" rx="4" fill="#d5e8d4" stroke="#82b366"/>
<text x="42.0" y="1012.0" font-size="10" fill="#333333" font-family="Microsoft YaHei">本页交接：整套讲完——概念（①②）、机制（③④⑤⑥）、约束（⑦）、落地（⑧⑨）。下一步（⑩）给指标、日志与排障顺序。</text>
<rect x="36.0" y="1074.0" width="1424.0" height="120.0" rx="4" fill="#efe9dd" stroke="#a1887f"/>
